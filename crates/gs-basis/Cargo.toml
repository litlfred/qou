[package]
name = "gs-basis"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/litlfred/qou"
description = "General-purpose non-commutative Gröbner–Shirshov bases, free associative algebras, and specialized Iwahori–Hecke and Temperley–Lieb normal-form engines."

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
