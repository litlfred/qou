[package]
name = "qou-gg-cli"
version = "0.1.0"
edition = "2021"
description = "JSON CLI emitter combining qou-gg-eval and qou-clarabel for the Annex A Proper gamma-gamma Hadron & Light-Nuclei Datum Table"

[dependencies]
clap = { version = "4", features = ["derive"] }
qou-clarabel = { path = "../qou-clarabel" }
qou-gg-eval = { path = "../qou-gg-eval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
