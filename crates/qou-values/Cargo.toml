[package]
name = "qou-values"
version = "0.1.0"
edition = "2021"
description = "General fast >=80-dps MPFR proton-pinned witnessed-value evaluator, Frechet-Jacobian uncertainty propagator, and CLI for ACCURACY.md and paper :val[...] directives."
license = "MIT"
repository = "https://github.com/litlfred/qou"

[lib]
name = "qou_values"
path = "src/lib.rs"

[[bin]]
name = "qou-values"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
rug = "1.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
