[package]
name = "qou-gg-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/litlfred/qou"
description = "Lightweight, zero-FFI core algebra for ruled 4-term photons, k-photon collisions through 4-photon, linking-neutral cuts, hadron dressings, and Z=0..118 T3/Hopf atomic-chart generation."

[dependencies]
gs-basis = { path = "../gs-basis" }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
