[package]
name = "qou-clarabel"
version = "0.1.0"
edition = "2021"
description = "80-dps MpfrFloat Clarabel LP-dual & Frobenius cone certifier for proper gamma-gamma H_3(q) hadron rows"

[dependencies]
clarabel = { version = "0.11", default-features = false, features = ["mpfr", "serde"] }
num-traits = "0.2"
qou-gg-eval = { path = "../qou-gg-eval" }
rug = "1.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
