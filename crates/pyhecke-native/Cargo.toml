[package]
name = "pyhecke-native"
version = "0.9.0"
edition = "2021"
description = "PyO3 bindings for hecke-engine Gram/trace primitives"
license = "MIT"
repository = "https://github.com/litlfred/qou"

[lib]
name = "pyhecke_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
hecke-engine = { path = "../hecke-engine" }
# Direct dep so the mpfr bindings can name `rug::Float` (same 1.26 as
# hecke-engine's optional dep — cargo unifies to one version).
rug = "1.26"

[features]
# ON by default (2026-06-28) — the shipped wheel includes the Clarabel-rs
# MPFR LP backend, exposing `operator_selection_lp` (prop:operator-selection-lp)
# so the canonical LP-dual / operator-selection compute is available out of the
# box. Pulls clarabel (the litlfred fork — see [patch.crates-io] below) +
# rug/MPFR.
#
# BLAS-free: clarabel-mpfr uses the `MpfrFloat` scalar (NOT the netlib SDP
# backend), so NO system OpenBLAS/LAPACK/gfortran is required — only system
# GMP + MPFR, which `rug` already needs. (The heavier f64 SDP solver remains
# opt-in as hecke-engine's `clarabel-sdp`, the one that does require BLAS. Since
# fork rev 37f06c3 it combines with clarabel-mpfr as hecke-engine's
# `clarabel-mpfr-sdp`, for MPFR SDPs at 50+ digits; that also needs gfortran.)
#
# Wheel-CI requirement: the wheel build now needs the litlfred clarabel fork
# reachable + system GMP/MPFR on every target platform, plus an import test in
# a numpy env.
#
# Restricted-network builds: an egress policy may block the fork (e.g. some web
# sandboxes return 403 for github.com/litlfred/Clarabel.rs). Then either build
# the rug/MPFR-only kernels with `--no-default-features` (the seminormal / Gram
# / Markov-trace primitives do NOT need clarabel), or supply a local empty
# `clarabel` stub crate (declare the mpfr/sdp-netlib/serde/bigrational features,
# empty lib) and repoint [patch.crates-io] at it so clarabel is only resolved,
# never compiled. Full recipe: README.md §"Clarabel (litlfred fork)".
default = ["clarabel-lp"]
clarabel-lp = ["hecke-engine/clarabel-mpfr"]

# `[profile.release]` and `[patch.crates-io]` (Clarabel.rs rev 37f06c3) are
# inherited from the top-level workspace `Cargo.toml`.
