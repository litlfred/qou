[package]
name = "qou-gg-eval"
version = "0.1.0"
edition = "2021"
description = "80-dps proton-pinned MPFR evaluator for proper gamma-gamma hadrons, 4-photon products, H_4 flavoured nucleons, 6-strand lepton pairs, and A=1..4 T3-bonded nuclear braids"

[dependencies]
rug = "1.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
