<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Knot-Centric Periodic Table</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',sans-serif;font-size:13px;color:#1a1a2e;background:#fafbff;overflow-x:hidden}
#app{display:flex;flex-direction:column;height:100vh;padding:8px}
h2{font-size:15px;letter-spacing:.08em;color:#2a3a6a;margin:4px 0}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid #dde}
.controls label{font-size:11px;color:#556}
.controls select,.controls input[type=range]{font-size:11px}
.controls .q-val{font-weight:600;min-width:50px;display:inline-block}
#table-wrap{flex:1;overflow:auto;position:relative;margin-top:6px}
.tile-grid{display:grid;gap:2px;padding:4px}
/* Standard layout: 18 cols, 7+2 rows */
.tile-grid.standard{grid-template-columns:repeat(18,1fr)}
/* Knot-centric layout: variable */
.tile-grid.knot-centric{grid-template-columns:repeat(18,1fr)}
.tile{border:1px solid #ccd;border-radius:4px;padding:3px;cursor:pointer;text-align:center;
  min-height:48px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  transition:all .15s;position:relative;font-size:11px;background:#fff}
.tile:hover{border-color:#47a;box-shadow:0 1px 6px rgba(40,80,160,.2);z-index:2}
.tile.selected{border-color:#25a;box-shadow:0 0 0 2px rgba(40,80,200,.3)}
.tile .sym{font-size:15px;font-weight:700;line-height:1.1}
.tile .z-num{font-size:9px;color:#778}
.tile .mini-knot{height:16px;margin-top:1px}
.tile.magic-z{border-left:2px solid #c44}
.tile.magic-n{border-right:2px solid #44c}
.tile.magic-both{border-left:2px solid #c44;border-right:2px solid #44c}
.tile.intruder{background:#fff8f0}
/* Block colors */
.tile.block-s{background:linear-gradient(135deg,#f0f4ff,#fff)}
.tile.block-p{background:linear-gradient(135deg,#f0fff4,#fff)}
.tile.block-d{background:linear-gradient(135deg,#fff8f0,#fff)}
.tile.block-f{background:linear-gradient(135deg,#fff0f8,#fff)}
.tile.empty{border:none;background:none;cursor:default;min-height:0}
.spacer{grid-column:span 1}
/* Detail panel */
#detail{border-top:2px solid #dde;padding:10px;display:none;background:#f8f9ff;min-height:180px}
#detail.show{display:flex;gap:20px;flex-wrap:wrap}
#detail .info{flex:1;min-width:200px}
#detail .info h3{font-size:16px;color:#2a3a6a;margin-bottom:6px}
#detail .info table{font-size:12px;border-collapse:collapse}
#detail .info td{padding:2px 8px 2px 0}
#detail .info td:first-child{color:#778;font-weight:500}
#detail .knot-diagram{flex:2;min-width:300px;min-height:140px;display:flex;align-items:center;justify-content:center}
#detail .knot-diagram svg{max-width:100%;height:auto}
/* Legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:#556;padding:4px 0}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-item svg{flex-shrink:0}
/* Tooltip */
.tooltip{position:absolute;background:#222;color:#fff;padding:4px 8px;border-radius:4px;
  font-size:11px;pointer-events:none;white-space:nowrap;z-index:100;display:none}
</style>
</head>
<body>
<div id="app">
<h2>Knot-Centric Periodic Table of the Elements</h2>
<div class="legend" id="legend"></div>
<div class="controls">
  <label>Layout:
    <select id="layout-sel">
      <option value="standard">Standard</option>
      <option value="knot-centric" selected>Knot-centric</option>
    </select>
  </label>
  <label>Color:
    <select id="color-sel">
      <option value="block">Electron block</option>
      <option value="kalpha">Alpha sub-links</option>
      <option value="ba">Binding energy</option>
      <option value="shell">Nuclear shell</option>
    </select>
  </label>
  <label>Filter:
    <select id="filter-sel">
      <option value="all">All elements</option>
      <option value="magic">Magic numbers only</option>
      <option value="intruder">Intruder levels</option>
      <option value="stable">Stability pairs</option>
    </select>
  </label>
  <label>Columns:
    <select id="col-sel">
      <option value="fill">Fill order (by Z)</option>
      <option value="writhe">Writhe sub-mode (m)</option>
      <option value="hopf" selected>Hopf occupancy</option>
    </select>
  </label>
  <label>q = <span class="q-val" id="q-val">1.110</span>
    <input type="range" id="q-slider" min="1.000" max="1.200" step="0.001" value="1.110" style="width:120px">
  </label>
</div>
<div id="table-wrap"></div>
<div id="detail">
  <div class="info"><h3 id="d-title"></h3><table id="d-table"></table></div>
  <div class="knot-diagram" id="d-knot"></div>
</div>
</div>
<div class="tooltip" id="tooltip"></div>

// === SVG DRAWING FUNCTIONS ===
const SVG_NS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs){
  const e=document.createElementNS(SVG_NS,tag);
  for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);
  return e;
}

// Trefoil path (simplified, fits in a size x size box centered at 0,0)
function trefoilPath(s){
  const r=s*0.42;
  return `M${-r*0.5},${-r} C${-r*1.1},${-r*0.5} ${-r*1.1},${r*0.5} ${-r*0.5},${r} `+
    `C0,${r*0.5} 0,${-r*0.5} ${r*0.5},${-r} `+
    `C${r*1.1},${-r*0.5} ${r*1.1},${r*0.5} ${r*0.5},${r} `+
    `C0,${r*0.5} 0,${-r*0.5} ${-r*0.5},${-r}Z`;
}

// Draw a single trefoil (proton=solid blue, electron=outline blue, antiquark=outline)
function drawTrefoil(size,type){
  const svg=svgEl("svg",{width:size,height:size,viewBox:`${-size/2} ${-size/2} ${size} ${size}`,class:"knot"});
  const p=svgEl("path",{d:trefoilPath(size)});
  if(type==="proton"){p.setAttribute("fill","#2255aa");p.setAttribute("stroke","#112244");p.setAttribute("stroke-width","1.2")}
  else if(type==="electron"){p.setAttribute("fill","none");p.setAttribute("stroke","#2255aa");p.setAttribute("stroke-width","1.5")}
  else{p.setAttribute("fill","none");p.setAttribute("stroke","#aa5533");p.setAttribute("stroke-width","1.5")}
  svg.appendChild(p);
  return svg;
}

// Draw unknot (neutron circle)
function drawUnknot(size){
  const svg=svgEl("svg",{width:size,height:size,viewBox:`${-size/2} ${-size/2} ${size} ${size}`,class:"knot"});
  svg.appendChild(svgEl("circle",{r:size*0.35,fill:"none",stroke:"#aa5533","stroke-width":"1.5"}));
  return svg;
}

// Draw Hopf link symbol
function drawHopf(size){
  const svg=svgEl("svg",{width:size*1.4,height:size,viewBox:`${-size*0.7} ${-size/2} ${size*1.4} ${size}`,class:"knot"});
  svg.appendChild(svgEl("circle",{cx:-size*0.15,r:size*0.28,fill:"none",stroke:"#c44","stroke-width":"1.3"}));
  svg.appendChild(svgEl("circle",{cx:size*0.15,r:size*0.28,fill:"none",stroke:"#44c","stroke-width":"1.3"}));
  return svg;
}

// Draw alpha cluster (compact: "kα×α")

// --- Shell fill: compact progress bar for tiles, detailed Hopf icons for detail panel ---

// Compact bar for tiles: thin filled bar + fraction text
function shellBarSvg(filled,total,w,h){
  w=w||30;h=h||10;
  const svg=svgEl("svg",{width:w,height:h,viewBox:`0 0 ${w} ${h}`,class:"mini-knot"});
  const barH=4, barY=(h-barH)/2, barW=w-2, barX=1;
  // Background
  svg.appendChild(svgEl("rect",{x:barX,y:barY,width:barW,height:barH,rx:2,fill:"#e8e8f0",stroke:"none"}));
  // Fill
  const frac=total>0?Math.max(0,Math.min(filled/total,1)):0;
  if(frac>0){
    svg.appendChild(svgEl("rect",{x:barX,y:barY,width:barW*frac,height:barH,rx:2,fill:frac>=1?"#4a8":"#5577cc",stroke:"none"}));
  }
  return svg;
}

// Detailed Hopf-link icons for detail panel and row labels (max 8 icons, then count)
function shellFillSvg(filled,total,h){
  h=h||16;
  const maxShow=Math.min(total,8);
  const step=h*1.1;
  const w=maxShow*step+(total>maxShow?28:0)+4;
  const svg=svgEl("svg",{width:w,height:h,viewBox:`0 0 ${w} ${h}`,class:"mini-knot"});
  const cy=h/2, r=h*0.22, gap=r*0.5;

  for(let i=0;i<maxShow;i++){
    const cx=step/2+i*step;
    const filledI=i<Math.min(filled,maxShow);
    svg.appendChild(svgEl("circle",{cx:cx-gap,cy:cy,r:r,
      fill:filledI?"rgba(200,60,60,0.3)":"none",
      stroke:filledI?"#c44":"#ccc","stroke-width":"0.8"}));
    svg.appendChild(svgEl("circle",{cx:cx+gap,cy:cy,r:r,
      fill:filledI?"rgba(60,60,200,0.3)":"none",
      stroke:filledI?"#44c":"#ccc","stroke-width":"0.8"}));
  }
  if(total>maxShow){
    const t=svgEl("text",{x:maxShow*step+4,y:cy+4,"font-size":"9",fill:"#556"});
    t.textContent=`${filled}/${total}`;
    svg.appendChild(t);
  }
  return svg;
}

// Mini knot icon for tile: compact progress bar
function miniKnotSvg(Z,N,kalpha,shellRow){
  const sr=SHELL_ROWS[shellRow-1];
  if(!sr)return document.createElement("span");
  const A=Z+N;
  const filled=Math.min(A-sr.prevPair, sr.capacity);
  return shellBarSvg(Math.max(0,filled), sr.capacity, 30, 10);
}

// Alpha sub-link mini icon (alternative mode)
function miniAlphaSvg(kalpha){
  // Use same bar style but with red fill
  const svg=svgEl("svg",{width:30,height:10,viewBox:"0 0 30 10",class:"mini-knot"});
  const barH=4,barY=3,barW=28,barX=1;
  svg.appendChild(svgEl("rect",{x:barX,y:barY,width:barW,height:barH,rx:2,fill:"#e8e8f0",stroke:"none"}));
  const frac=Math.min(kalpha/46,1);
  if(frac>0){
    svg.appendChild(svgEl("rect",{x:barX,y:barY,width:barW*frac,height:barH,rx:2,fill:"#c55",stroke:"none"}));
  }
  return svg;
}

// === MASS COMPUTATION ===
function computeMass(Z,A,BA,qVal){
  const qh=Math.sqrt(qVal);
  function S(a,b){return(qVal*a+(1/qVal)*b)/(qh+1/qh)}
  const mp=S(mu_u,mu_u)+2*S(mu_u,mu_d);
  const mn=2*S(mu_u,mu_d)+S(mu_d,mu_d);
  const N=A-Z;
  return Z*mp+N*mn-(A*BA)+Z*m_e;
}

// === LAYOUT ENGINE ===

// --- Standard layout: 18 columns, electron-period rows ---
function stdPos(Z,period,group,block){
  if(Z>=57&&Z<=71)return{row:9,col:Z-57+4};
  if(Z>=89&&Z<=103)return{row:10,col:Z-89+4};
  if(Z>=72&&Z<=80)return{row:6,col:Z-72+4};
  return{row:period,col:group};
}

// --- Knot-centric layout: 7 nuclear-shell rows ---
// Elements are placed left-to-right within each shell row, grouped by
// electron block (s, d, f, p) with visual gaps between blocks.
// Each shell row gets its own grid-row. f-block goes in a sub-row below.
//
// Column assignment: within each (shellRow, block), elements are sorted by Z
// and placed in sequential columns. Blocks are ordered s(left), d(middle), p(right)
// with gaps. f-block in a sub-row.
//
// baseRow mapping: shellRow → CSS grid row (with gaps for f-block sub-rows)
const KNOT_BASE_ROW=[0,1,2,3,4,5,7,9]; // shellRow 1-7 → grid rows
// Max columns needed: shell 6 has s(2)+d(10)+p(2)+f(14)=28 elements on main row+sub
// We use 20 cols for main row: s(1-2) gap(3) d(4-13) gap(14) p(15-20)
// f-block sub-row: cols 3-16

// Block widths: theoretical Hopf-link slots per block
const BLOCK_SLOTS={0:2, 1:6, 2:10, 3:14}; // s,p,d,f

// Actual max element count per block across all shell rows
const BLOCK_MAX={0:0, 1:0, 2:0, 3:0};
(function(){
  const counts={};
  for(const el of EL){
    const key=el[11]+","+el[8];
    counts[key]=(counts[key]||0)+1;
  }
  for(const[k,v]of Object.entries(counts)){
    const blk=parseInt(k.split(",")[1]);
    BLOCK_MAX[blk]=Math.max(BLOCK_MAX[blk],v);
  }
})();
// BLOCK_MAX: s=4, p=8, d=12, f=14

// Compute column starts dynamically so no block overflows
function blockLayout(colMode){
  const w={};
  for(const b of [0,1,2,3]){
    w[b]=(colMode==="fill")?BLOCK_MAX[b]:Math.max(BLOCK_SLOTS[b],BLOCK_MAX[b]);
  }
  // Layout: col1=label | s | gap | d | gap | p
  // f in sub-row aligned with d
  const s0=2;
  const s2=s0+w[0]+1;   // d after s + gap
  const s1=s2+w[2]+1;   // p after d + gap
  const s3=s2;           // f aligned with d (sub-row)
  return{start:{0:s0,2:s2,1:s1,3:s3}, widths:w, totalCols:s1+w[1]};
}

function valenceIdx(Z,block,shellRow){
  const siblings=EL.filter(e=>e[11]===shellRow&&e[8]===block).sort((a,b)=>a[0]-b[0]);
  return siblings.findIndex(e=>e[0]===Z);
}

function knotPos(Z,block,shellRow,colMode){
  const mainRow=KNOT_BASE_ROW[shellRow];
  const idx=valenceIdx(Z,block,shellRow);
  if(idx<0)return{row:mainRow,col:2};

  const isF=block===3;
  const row=isF?mainRow+1:mainRow;
  const lay=blockLayout(colMode);
  return{row:row,col:lay.start[block]+idx};
}

let selectedEl=null;
let tileEls=new Map();

function makeTile(el,colorMode){
  const[Z,A,sym,name,BA,kalpha,period,group,block,magZ,magN,shellRow,intruder]=el;
  const N=A-Z;
  const tile=document.createElement("div");
  tile.className="tile";

  // Color mode
  if(colorMode==="block"){
    tile.classList.add("block-"+BLOCK_NAMES[block]);
  }else if(colorMode==="kalpha"){
    const intensity=Math.min(kalpha/46,1);
    tile.style.background=`rgba(200,60,60,${0.05+intensity*0.3})`;
  }else if(colorMode==="ba"){
    const norm=(BA-5)/(8.8-5);
    tile.style.background=`rgba(40,80,200,${0.05+Math.max(0,norm)*0.35})`;
  }else if(colorMode==="shell"){
    const hue=(shellRow-1)*50;
    tile.style.background=`hsla(${hue},60%,92%,0.8)`;
  }

  // Magic number borders
  if(magZ&&magN)tile.classList.add("magic-both");
  else if(magZ)tile.classList.add("magic-z");
  else if(magN)tile.classList.add("magic-n");
  if(intruder)tile.classList.add("intruder");

  // Tile content
  const zSpan=document.createElement("div");
  zSpan.className="z-num";zSpan.textContent=Z;
  const symSpan=document.createElement("div");
  symSpan.className="sym";symSpan.textContent=sym;
  tile.appendChild(zSpan);
  tile.appendChild(symSpan);
  // Mini icon: shell fill (Hopf links) or alpha count depending on color mode
  if(colorMode==="kalpha"){
    tile.appendChild(miniAlphaSvg(kalpha));
  }else{
    tile.appendChild(miniKnotSvg(Z,N,kalpha,shellRow));
  }

  return tile;
}

function addRowLabel(grid,row,col,text){
  const lbl=document.createElement("div");
  lbl.style.cssText=`grid-row:${row};grid-column:${col};font-size:9px;color:#556;padding:2px 4px;white-space:nowrap;display:flex;align-items:center;font-weight:600`;
  lbl.textContent=text;
  grid.appendChild(lbl);
}

function buildGrid(){
  const wrap=document.getElementById("table-wrap");
  wrap.innerHTML="";
  tileEls=new Map();

  const layout=document.getElementById("layout-sel").value;
  const colorMode=document.getElementById("color-sel").value;
  const filter=document.getElementById("filter-sel").value;
  const colMode=document.getElementById("col-sel").value;
  const qVal=parseFloat(document.getElementById("q-slider").value);

  const grid=document.createElement("div");
  grid.className="tile-grid";

  if(layout==="standard"){
    grid.style.gridTemplateColumns="repeat(18,minmax(42px,1fr))";
    grid.style.gridTemplateRows="repeat(10,auto)";
  }else{
    // Knot-centric: dynamic column count based on actual block widths
    const lay=blockLayout(colMode);
    grid.style.gridTemplateColumns=`auto ${"minmax(36px,1fr) ".repeat(lay.totalCols)}`;
    grid.style.gridTemplateRows="repeat(11,auto)";
  }

  for(const el of EL){
    const[Z,A,sym,name,BA,kalpha,period,group,block,magZ,magN,shellRow,intruder]=el;

    // Filter
    if(filter==="magic"&&!magZ&&!magN)continue;
    if(filter==="intruder"&&!intruder)continue;
    if(filter==="stable"&&!magZ&&!magN)continue;

    const tile=makeTile(el,colorMode);

    // Position depends on layout
    let pos;
    if(layout==="standard"){
      pos=stdPos(Z,period,group,block);
    }else{
      pos=knotPos(Z,block,shellRow,colMode);
    }
    tile.style.gridRow=pos.row;
    tile.style.gridColumn=pos.col;

    // Events
    tile.addEventListener("click",()=>selectElement(el));
    tile.addEventListener("mouseenter",(e)=>showTooltip(e,el,qVal));
    tile.addEventListener("mouseleave",hideTooltip);

    grid.appendChild(tile);
    tileEls.set(Z,tile);
  }

  // Row labels
  if(layout==="standard"){
    addRowLabel(grid,9,1,"Lanthanides");
    addRowLabel(grid,10,1,"Actinides");
  }else{
    // Knot-centric: compact text shell labels on left (col 1)
    // Elements shift right: s starts col 2, d col 4, p col 16
    for(let i=0;i<SHELL_ROWS.length;i++){
      const sr=SHELL_ROWS[i];
      const gr=KNOT_BASE_ROW[i+1];
      const lbl=document.createElement("div");
      lbl.style.cssText=`grid-row:${gr};grid-column:1;font-size:9px;color:#556;padding:2px 4px;white-space:nowrap;display:flex;align-items:center;font-weight:600`;
      lbl.textContent=sr.intruder?`◇${sr.pair}⋈↓`:`◇${sr.pair}`;
      lbl.title=`Shell capacity: ${sr.capacity} nucleon slots. Stability pair at ${sr.pair}.${sr.intruder?" Intruder crossing.":""}`;
      grid.appendChild(lbl);
    }
  }

  // Column headers for writhe/hopf modes (knot-centric only)
  if(layout!=="standard"&&colMode!=="fill"){
    const lay=blockLayout(colMode);
    const blocks=[
      {label:"s",blk:0,ell:0},
      {label:"d",blk:2,ell:2},
      {label:"p",blk:1,ell:1},
    ];
    for(const b of blocks){
      const h=document.createElement("div");
      const start=lay.start[b.blk], width=lay.widths[b.blk];
      h.style.cssText=`grid-row:1;grid-column:${start}/span ${width};font-size:8px;color:#889;text-align:center;border-bottom:1px solid #dde;padding:1px 0;font-weight:600;pointer-events:none`;
      if(colMode==="writhe"){
        h.textContent=`ℓ=${b.ell} (${b.label})`;
      }else{
        h.textContent=`${BLOCK_SLOTS[b.blk]} Hopf slots (${b.label}) [max ${width}]`;
      }
      grid.appendChild(h);
    }
    // Shift all element rows and labels down by 1 to make room for header row
    grid.querySelectorAll(".tile").forEach(t=>{
      t.style.gridRow=parseInt(t.style.gridRow)+1;
    });
    grid.querySelectorAll("div").forEach(d=>{
      if(d.classList.contains("tile"))return;
      const r=parseInt(d.style.gridRow);
      if(r>1)d.style.gridRow=r+1; // don't shift the headers themselves
    });
  }

  wrap.appendChild(grid);
}

function selectElement(el){
  const[Z,A,sym,name,BA,kalpha,period,group,block,magZ,magN,shellRow,intruder]=el;
  const N=A-Z;
  const qVal=parseFloat(document.getElementById("q-slider").value);
  const mass=computeMass(Z,A,BA,qVal);

  // Highlight tile
  tileEls.forEach(t=>t.classList.remove("selected"));
  if(tileEls.has(Z))tileEls.get(Z).classList.add("selected");
  selectedEl=el;

  // Detail panel
  const detail=document.getElementById("detail");
  detail.classList.add("show");
  document.getElementById("d-title").textContent=`${Z}. ${name} (${sym})`;

  const tbl=document.getElementById("d-table");
  tbl.innerHTML="";
  const rows=[
    ["Atomic number (Z)",Z],
    ["Mass number (A)",A],
    ["Protons / Neutrons",`${Z} / ${N}`],
    ["Knot formula",`${Z}𝔭 ⋈ ${N}𝔫 ⋈ ${Z}·T₂,₃`],
    ["Alpha sub-links (k_α)",kalpha],
    ["Electron block",BLOCK_NAMES[block]],
    ["Period / Group",`${period} / ${group}`],
    ["Braid shell",`${shellRow} of 7 (closes at ◇${SHELL_ROWS[shellRow-1].pair})`],
    ["B/A (MeV)",BA.toFixed(4)],
    ["QOU mass (MeV)",mass.toFixed(1)],
    ["N/Z ratio",(N/Z).toFixed(3)],
  ];
  // Braid registry data
  const bd=BRAID[Z];
  if(bd){
    rows.push(["Markov trace sign",bd[0]>0?"+1":"−1"]);
    rows.push(["ln|tr_M|",bd[1].toFixed(2)]);
    rows.push(["Negative generators",bd[2]+" of "+(A-1)]);
  }
  if(magZ)rows.push(["","◇ Proton stability pair"]);
  if(magN)rows.push(["","◇ Neutron stability pair"]);
  if(intruder)rows.push(["Intruder crossing","⋈↓ braid drops into previous shell"]);

  for(const[k,v]of rows){
    const tr=document.createElement("tr");
    const td1=document.createElement("td");td1.textContent=k;
    const td2=document.createElement("td");td2.textContent=v;
    tr.appendChild(td1);tr.appendChild(td2);
    tbl.appendChild(tr);
  }

  // Knot diagram
  const knotDiv=document.getElementById("d-knot");
  knotDiv.innerHTML="";
  knotDiv.appendChild(fullKnotDiagram(el));
}

function showTooltip(e,el,qVal){
  const[Z,A,sym,name,BA,kalpha]=el;
  const N=A-Z;
  const tip=document.getElementById("tooltip");
  tip.textContent=`${name} (${sym}) — Z=${Z}, N=${N}, k_α=${kalpha}, B/A=${BA.toFixed(4)}`;
  tip.style.display="block";
  tip.style.left=(e.pageX+12)+"px";
  tip.style.top=(e.pageY-20)+"px";
}
function hideTooltip(){document.getElementById("tooltip").style.display="none"}

// === LEGEND ===
function buildLegend(){
  const lg=document.getElementById("legend");
  lg.innerHTML="";
  function addItem(iconEl,text){
    const d=document.createElement("div");d.className="legend-item";
    d.appendChild(iconEl);
    const sp=document.createElement("span");sp.textContent=text;
    d.appendChild(sp);
    lg.appendChild(d);
  }
  addItem(drawTrefoil(18,"proton"),"Proton (T₂,₃)");
  addItem(drawTrefoil(18,"electron"),"Electron (σT₂,₃)");
  addItem(drawUnknot(16),"Neutron (unknot)");
  const mz=document.createElement("span");
  mz.style.cssText="border-left:2px solid #c44;padding-left:3px;font-size:10px";
  mz.textContent="◆Z";
  addItem(mz,"Proton magic #");
  const mn=document.createElement("span");
  mn.style.cssText="border-right:2px solid #44c;padding-right:3px;font-size:10px";
  mn.textContent="◆N";
  addItem(mn,"Neutron magic #");
  const intr=document.createElement("span");
  intr.style.cssText="background:#fff8f0;border:1px solid #dca;padding:1px 4px;font-size:10px";
  intr.textContent="int";
  addItem(intr,"Intruder level");
}

// === CONTROLS ===
document.getElementById("layout-sel").addEventListener("change",buildGrid);
document.getElementById("color-sel").addEventListener("change",buildGrid);
document.getElementById("filter-sel").addEventListener("change",buildGrid);
document.getElementById("col-sel").addEventListener("change",buildGrid);
document.getElementById("q-slider").addEventListener("input",function(){
  document.getElementById("q-val").textContent=parseFloat(this.value).toFixed(3);
  if(selectedEl)selectElement(selectedEl); // refresh mass
});

// === INIT ===
buildLegend();
buildGrid();
// Select iron by default (interesting middle element)
const fe=EL.find(e=>e[2]==="Fe");
if(fe)selectElement(fe);
</script>
