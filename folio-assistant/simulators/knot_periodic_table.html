<title>Knot Periodic Table — Interactive Simulator</title>

  --bg:#020710; --panel:rgba(3,10,30,0.93); --border:rgba(60,120,255,0.20);

  --gap-color:#f0f4ff;

*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Cascadia Code','Consolas','DejaVu Sans Mono',monospace;font-size:11px;overflow-x:hidden;user-select:none;}
#title{text-align:center;padding:10px 0 2px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:300;font-size:20px;letter-spacing:.25em;color:var(--accent);text-transform:uppercase;text-shadow:0 0 18px rgba(58,144,255,.5);}
#subtitle{text-align:center;font-size:9px;letter-spacing:.20em;color:var(--dim);text-transform:uppercase;margin-bottom:6px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:10px;backdrop-filter:blur(18px);margin:4px;}
.panel-title{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:300;font-size:12px;letter-spacing:.20em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--border);}
#theme-btn{position:fixed;top:8px;right:10px;z-index:20;background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:3px 7px;cursor:pointer;color:var(--accent);font-family:inherit;font-size:10px;}
#layout{display:flex;flex-direction:column;min-height:100vh;}
#top-bar{display:flex;align-items:center;gap:10px;padding:2px 10px;flex-wrap:wrap;}
#top-bar label{font-size:10px;color:var(--dim);}
#top-bar select,#top-bar input[type=range]{font-size:10px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:3px;padding:1px 4px;font-family:inherit;}
.val{color:var(--accent);font-size:10px;min-width:35px;}
#periodic-panel{padding:6px;}
#pt-grid{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;max-width:860px;margin:0 auto;}
.tile{width:100%;aspect-ratio:1;border:1px solid var(--border);border-radius:3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--tile-bg);transition:all .15s;position:relative;font-size:9px;min-width:0;overflow:hidden;}
.tile:hover{border-color:var(--accent);box-shadow:0 0 6px rgba(58,144,255,.3);z-index:2;transform:scale(1.08);}
.tile.selected{border-color:var(--accent3);box-shadow:0 0 8px rgba(51,255,170,.4);z-index:3;}
.tile .sym{font-size:13px;font-weight:700;line-height:1;}
.tile .zn{font-size:7px;color:var(--dim);line-height:1;}
.tile canvas{width:16px;height:16px;margin-top:1px;}
.tile.empty{border:none;background:none;cursor:default;pointer-events:none;}
.tile.gap-spacer{aspect-ratio:unset;height:6px;}
.tile.fblock-label{aspect-ratio:unset;}
.tile.block-s{border-left:2px solid var(--accent);}
.tile.block-p{border-left:2px solid var(--accent3);}
.tile.block-d{border-left:2px solid var(--accent4);}
.tile.block-f{border-left:2px solid var(--accent2);}
.tile.magic{box-shadow:inset 0 0 4px rgba(255,85,51,.3);}
#bottom{display:flex;gap:0;flex:1;min-height:380px;}
#knot-panel{flex:6;min-width:0;}
#decay-panel{flex:4;min-width:0;}
#knot-canvas-wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;justify-content:center;}
.knot-info{font-size:10px;margin:6px 0;line-height:1.6;}
.knot-formula{font-size:12px;color:var(--accent);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.1em;}

.legend-item{display:flex;align-items:center;gap:3px;}
.legend-line{width:16px;height:3px;border-radius:2px;}
.row{display:flex;align-items:center;gap:6px;margin:3px 0;}
.lbl{color:var(--dim);font-size:10px;min-width:45px;}

button.toggle:hover{border-color:var(--accent);}
button.toggle.active{background:var(--accent);color:#fff;}
.matrix-table{border-collapse:collapse;font-size:9px;margin:4px auto;}
.matrix-table td{padding:1px 4px;text-align:center;border:1px solid var(--border);}
.matrix-table .hdr{color:var(--accent);font-weight:600;border:none;}

// ── Knot Drawing Engine (Canvas) ────────────────────────────────────
function torusKnot3D(p, n, numPoints, R, r) {
  const pts = [];
  for (let i = 0; i <= numPoints; i++) {
    const t = (i / numPoints) * 2 * Math.PI;
    const x = (R + r * Math.cos(n * t)) * Math.cos(p * t);
    const y = (R + r * Math.cos(n * t)) * Math.sin(p * t);
    const z = r * Math.sin(n * t);
    pts.push([x, y, z]);
  }
  return pts;
}

function figureEight3D(numPoints, R, r) {
  const pts = [];
  for (let i = 0; i <= numPoints; i++) {
    const t = (i / numPoints) * 2 * Math.PI;
    const x = (R + r * Math.cos(2 * t)) * Math.cos(3 * t);
    const y = (R + r * Math.cos(2 * t)) * Math.sin(3 * t);
    const z = r * Math.sin(4 * t);
    pts.push([x, y, z]);
  }
  return pts;
}

function projectPt(x, y, z, ax) {
  const ca = Math.cos(ax), sa = Math.sin(ax);
  return [x, y * ca - z * sa];
}

function findCrossings(pts, ax) {
  const proj = pts.map(p => projectPt(p[0], p[1], p[2], ax));
  const crossings = [];
  const n = pts.length - 1;
  // Derive threshold from bounding box for robustness to scale changes
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of proj) {
    minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
    minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
  }
  const bbox = Math.max(maxX - minX, maxY - minY) || 1;
  const threshold = bbox * 0.04;
  for (let i = 0; i < n; i++) {
    for (let j = i + 3; j < n; j++) {
      if (Math.abs(i - j) < 3 || Math.abs(i - j) > n - 3) continue;
      const dx = proj[i][0] - proj[j][0];
      const dy = proj[i][1] - proj[j][1];
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < threshold) {
        const zi = pts[i][2], zj = pts[j][2];
        crossings.push({
          overIdx: zi > zj ? i : j,
          underIdx: zi > zj ? j : i,
          x: (proj[i][0] + proj[j][0]) / 2,
          y: (proj[i][1] + proj[j][1]) / 2
        });
      }
    }
  }
  // Deduplicate nearby crossings
  const deduped = [];
  const dedupDist = bbox * 0.08;
  for (const c of crossings) {
    let isDup = false;
    for (const d of deduped) {
      if (Math.abs(c.x - d.x) < dedupDist && Math.abs(c.y - d.y) < dedupDist) { isDup = true; break; }
    }
    if (!isDup) deduped.push(c);
  }
  return deduped;
}

function drawKnotOnCanvas(ctx, pts3d, color, lineWidth, size, ax) {
  const proj = pts3d.map(p => projectPt(p[0], p[1], p[2], ax));
  const crossings = findCrossings(pts3d, ax);

  // Scale to canvas
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of proj) {
    minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
    minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
  }
  const range = Math.max(maxX - minX, maxY - minY) || 1;
  const margin = size * 0.12;
  const scale = (size - 2 * margin) / range;
  const cx = size / 2, cy = size / 2;
  const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;

  function tx(p) { return cx + (p[0] - midX) * scale; }
  function ty(p) { return cy + (p[1] - midY) * scale; }

  // Build set of under-strand indices near crossings
  const gapRadius = lineWidth * 2.5;
  const underSet = new Set();
  for (const c of crossings) {
    const sx = cx + (c.x - midX) * scale;
    const sy = cy + (c.y - midY) * scale;
    for (let k = 0; k < proj.length; k++) {
      const px = tx(proj[k]), py = ty(proj[k]);
      const dist = Math.sqrt((px - sx) ** 2 + (py - sy) ** 2);
      if (dist < gapRadius) {
        // Check if this point is on the under strand
        if (Math.abs(k - c.underIdx) < 4 || Math.abs(k - c.underIdx) > proj.length - 4) {
          underSet.add(k);
        }
      }
    }
  }

  // Draw under-strand segments (with gaps)
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // First pass: draw everything except gap regions
  ctx.beginPath();
  let penDown = false;
  for (let i = 0; i < proj.length; i++) {
    if (underSet.has(i)) {
      penDown = false;
      continue;
    }
    if (!penDown) {
      ctx.moveTo(tx(proj[i]), ty(proj[i]));
      penDown = true;
    } else {
      ctx.lineTo(tx(proj[i]), ty(proj[i]));
    }
  }
  ctx.stroke();

  // Second pass: draw over-strand segments at crossing locations
  // (already drawn in first pass since over-strands are not in underSet)
}

function drawUnknot(ctx, size, color, lineWidth) {
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size * 0.35, 0, Math.PI * 2);
  ctx.stroke();
}

function drawTrefoil(ctx, size, color, lineWidth, mirror) {
  const pts = torusKnot3D(2, 3, 300, 10, 5);
  if (mirror) for (const p of pts) p[0] = -p[0];
  drawKnotOnCanvas(ctx, pts, color, lineWidth, size, 0.4);
}

function drawFigureEight(ctx, size, color, lineWidth) {
  const pts = figureEight3D(400, 10, 4);
  drawKnotOnCanvas(ctx, pts, color, lineWidth, size, 0.3);
}

function drawCinquefoil(ctx, size, color, lineWidth) {
  const pts = torusKnot3D(2, 5, 400, 10, 5);
  drawKnotOnCanvas(ctx, pts, color, lineWidth, size, 0.4);
}

function drawTorusKnot(ctx, size, color, lineWidth, p, n) {
  const pts = torusKnot3D(p, n, 500, 10, 5);
  drawKnotOnCanvas(ctx, pts, color, lineWidth, size, 0.4);
}

function drawHopfLink(ctx, size, color1, color2, lineWidth) {
  const r = size * 0.22;
  const offset = size * 0.14;
  ctx.lineWidth = lineWidth;
  // Ring 1
  ctx.strokeStyle = color1;
  ctx.beginPath();
  ctx.ellipse(size / 2 - offset, size / 2, r, r * 0.6, 0, 0, Math.PI * 2);
  ctx.stroke();
  // Gap for crossing
  const gapX = size / 2 - offset + r * 0.3;
  const gapY = size / 2;
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--gap-color').trim() || '#020710';
  ctx.lineWidth = lineWidth + 4;
  ctx.beginPath();
  ctx.arc(gapX, gapY - r * 0.15, lineWidth * 1.5, 0, Math.PI * 2);
  ctx.stroke();
  // Ring 2
  ctx.lineWidth = lineWidth;
  ctx.strokeStyle = color2;
  ctx.beginPath();
  ctx.ellipse(size / 2 + offset, size / 2, r, r * 0.6, Math.PI * 0.3, 0, Math.PI * 2);
  ctx.stroke();
}

function drawBorromean(ctx, size, color1, color2, color3, lineWidth) {
  const r = size * 0.22;
  const cx = size / 2, cy = size / 2;
  const off = size * 0.1;
  ctx.lineWidth = lineWidth;
  // Three interlocked rings
  const rings = [
    { x: cx, y: cy - off, c: color1, angle: 0 },
    { x: cx - off * 0.87, y: cy + off * 0.5, c: color2, angle: Math.PI * 2 / 3 },
    { x: cx + off * 0.87, y: cy + off * 0.5, c: color3, angle: Math.PI * 4 / 3 }
  ];
  // Draw in specific order for crossings
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < 3; i++) {
      const ring = rings[i];
      ctx.strokeStyle = ring.c;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      if (pass === 0) {
        // Draw bottom half
        ctx.ellipse(ring.x, ring.y, r, r * 0.6, ring.angle, Math.PI * 0.1, Math.PI * 0.9);
      } else {
        // Draw top half
        ctx.ellipse(ring.x, ring.y, r, r * 0.6, ring.angle, Math.PI * 0.9, Math.PI * 2.1);
      }
      ctx.stroke();
    }
  }
}

// Mini knot for tiles (tiny canvas)
function drawMiniKnot(canvas, Z) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  ctx.clearRect(0, 0, s, s);
  const accent = getComputedStyle(document.body).getPropertyValue('--accent').trim();
  if (Z <= 2) {
    // H, He: simple circles (hydrogen = 1 proton trefoil)
    drawTrefoil(ctx, s, accent, 1.2, false);
  } else if (Z <= 10) {
    drawTrefoil(ctx, s, accent, 1, false);
  } else if (Z <= 18) {
    drawTrefoil(ctx, s, accent, 0.8, false);
  } else {
    drawTrefoil(ctx, s, accent, 0.7, false);
  }
}

// ── Periodic Table Builder ──────────────────────────────────────────
// Standard periodic table layout: [row, col] for Z=1..92
// Rows 1-7, cols 1-18; lanthanides in row 8, actinides in row 9
const PT_LAYOUT = {};
(function() {
  // Map each element to grid position
  for (const el of EL) {
    const Z = el[0], period = el[6], group = el[7], block = el[8];
    let row, col;
    // Lanthanides (57-71) go in row 9, Actinides (89-92) in row 10
    // Fix period data: 83-86 are period 6, not 7 as in some datasets
    if (Z >= 57 && Z <= 71) {
      row = 9; col = Z - 57 + 3;
    } else if (Z >= 89 && Z <= 92) {
      row = 10; col = Z - 89 + 3;
    } else if (Z >= 83 && Z <= 86) {
      row = 6; col = group; // Bi-Rn are period 6
    } else {
      row = period;
      col = group;
    }
    PT_LAYOUT[Z] = [row, col];
  }
})();

function elByZ(z) { return EL.find(e => e[0] === z); }

function getTileColor(el, mode) {
  const block = el[8];
  const ba = el[4];
  const kalpha = el[5];
  const isLight = document.body.classList.contains('light');

  if (mode === 'block') {
    const colors = isLight ? BLOCK_COLORS_LIGHT : BLOCK_COLORS_DARK;
    return colors[block] || colors[0];
  } else if (mode === 'binding') {
    // Color by binding energy per nucleon (0-9 MeV range)
    const t = Math.min(1, Math.max(0, ba / 9));
    const r = Math.round(40 + t * 180);
    const g = Math.round(40 + (1 - Math.abs(t - 0.5) * 2) * 120);
    const b = Math.round(40 + (1 - t) * 180);
    return `rgb(${r},${g},${b})`;
  } else if (mode === 'alpha') {
    // Color by alpha cluster count
    const t = Math.min(1, kalpha / 46);
    const r = Math.round(20 + t * 200);
    const g = Math.round(60 + (1 - t) * 80);
    const b = Math.round(120 - t * 80);
    return `rgb(${r},${g},${b})`;
  }
  return isLight ? '#dde' : '#1a2a4a';
}

function buildTable() {
  const grid = document.getElementById('pt-grid');
  grid.innerHTML = '';
  const mode = document.getElementById('color-mode').value;

  // Build 10 rows x 18 cols grid
  for (let row = 1; row <= 10; row++) {
    for (let col = 1; col <= 18; col++) {
      // Find element at this position
      let found = null;
      for (const Z in PT_LAYOUT) {
        if (PT_LAYOUT[Z][0] === row && PT_LAYOUT[Z][1] === col) {
          found = parseInt(Z);
          break;
        }
      }

      // Row 8 is a thin gap between main table and f-block rows
      if (row === 8) {
        const spacer = document.createElement('div');
        spacer.className = 'tile empty gap-spacer';
        grid.appendChild(spacer);
        continue;
      }
      if (row === 9 && col === 1) {
        const spacer = document.createElement('div');
        spacer.className = 'tile empty fblock-label';
        spacer.style.gridColumn = '1 / 3';
        spacer.innerHTML = '<span style="font-size:8px;color:var(--dim);">La-Lu</span>';
        grid.appendChild(spacer);
        col++; // skip col 2
        continue;
      }
      if (row === 10 && col === 1) {
        const spacer = document.createElement('div');
        spacer.className = 'tile empty fblock-label';
        spacer.style.gridColumn = '1 / 3';
        spacer.innerHTML = '<span style="font-size:8px;color:var(--dim);">Ac-U</span>';
        grid.appendChild(spacer);
        col++;
        continue;
      }

      // Skip trailing empty cells in f-block rows to avoid inflating row height
      if (!found && (row === 9 || row === 10)) {
        continue;
      }

      if (!found) {
        const empty = document.createElement('div');
        empty.className = 'tile empty';
        grid.appendChild(empty);
        continue;
      }

      const el = elByZ(found);
      const tile = document.createElement('div');
      tile.className = 'tile';
      const blockClass = ['block-s','block-p','block-d','block-f'][el[8]];
      tile.classList.add(blockClass);
      if (el[9] || el[10]) tile.classList.add('magic');
      if (selectedZ === found) tile.classList.add('selected');

      tile.style.backgroundColor = getTileColor(el, mode);
      tile.innerHTML = `<span class="zn">${el[0]}</span><span class="sym">${el[2]}</span><canvas width="32" height="32"></canvas>`;
      tile.addEventListener('click', () => selectElement(found));

      grid.appendChild(tile);

      // Draw mini knot
      requestAnimationFrame(() => {
        const c = tile.querySelector('canvas');
        if (c) drawMiniKnot(c, found);
      });
    }
  }
}

// ── Element Selection ───────────────────────────────────────────────
function selectElement(Z) {
  selectedZ = Z;
  buildTable();
  updateKnotPanel();
  updateDecayPanel();
}

// ── Knot Panel ──────────────────────────────────────────────────────
function updateKnotPanel() {
  if (!selectedZ) return;
  const el = elByZ(selectedZ);
  const Z = el[0], A = el[1], N = A - Z;
  const sym = el[2], name = el[3];

  document.getElementById('knot-el-name').textContent = `${sym} (${name}) Z=${Z}, A=${A}`;
  document.getElementById('knot-formula').innerHTML =
    `${Z}\uD835\uDD2D \u22C8 ${N}\uD835\uDD2B \u22C8 ${Z}\u00B7\u03C3(T<sub>2,3</sub>)`;

  const wrap = document.getElementById('knot-canvas-wrap');
  wrap.innerHTML = '';

  const info = document.getElementById('knot-info');

  if (Z <= 4) {
    // Full knot link diagram for light elements
    drawFullKnotDiagram(wrap, Z, N);
    info.innerHTML = `<b>${name}</b>: ${Z} proton trefoil(s) T<sub>2,3</sub> + ${N} neutron unknot(s) + ${Z} electron mirror trefoil(s) \u03C3(T<sub>2,3</sub>)<br>` +
      `Nuclear sub-link: Borromean B<sub>3</sub>(\uD835\uDD2D) for Z\u22653, single T<sub>2,3</sub> for Z=1<br>` +
      `Atom = nuclear sub-link \u22C8 electron sub-link (Hopf-linked)`;
  } else {
    // Schematic for heavier elements
    drawSchematicKnot(wrap, Z, N);
    info.innerHTML = `<b>${name}</b>: ${Z} proton(s) + ${N} neutron(s) + ${Z} electron(s)<br>` +
      `Nuclear sub-link: ${Z}\u00B7T<sub>2,3</sub>(\uD835\uDD2D) \u22C8 ${N}\u00B7O<sub>1</sub>(\uD835\uDD2B)<br>` +
      `Electron sub-link: ${Z}\u00B7\u03C3(T<sub>2,3</sub>)<br>` +
      `B/A = ${el[4].toFixed(3)} MeV, \u03B1-clusters = ${el[5]}`;
  }
}

function drawFullKnotDiagram(wrap, Z, N) {
  // Nuclear sub-link
  const nucLabel = document.createElement('div');
  nucLabel.style.cssText = 'font-size:9px;color:var(--dim);text-align:center;width:100%;';
  nucLabel.textContent = 'Nuclear sub-link';
  wrap.appendChild(nucLabel);

  const nucRow = document.createElement('div');
  nucRow.style.cssText = 'display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap;';

  // Draw protons as trefoils
  for (let i = 0; i < Z; i++) {
    const c = makeKnotCanvas(60);
    const ctx = c.getContext('2d');
    drawTrefoil(ctx, 60, getComputedStyle(document.body).getPropertyValue('--proton-color').trim(), 2, false);
    const lbl = document.createElement('div');
    lbl.style.cssText = 'display:flex;flex-direction:column;align-items:center;';
    lbl.appendChild(c);
    const t = document.createElement('span');
    t.style.cssText = 'font-size:8px;color:var(--proton-color);';
    t.textContent = '\uD835\uDD2D';
    lbl.appendChild(t);
    nucRow.appendChild(lbl);

    if (i < Z - 1 || N > 0) {
      const plus = document.createElement('span');
      plus.style.cssText = 'color:var(--dim);font-size:14px;';
      plus.textContent = '\u22C8';
      nucRow.appendChild(plus);
    }
  }

  // Draw neutrons as unknots
  for (let i = 0; i < N; i++) {
    const c = makeKnotCanvas(60);
    const ctx = c.getContext('2d');
    drawUnknot(ctx, 60, getComputedStyle(document.body).getPropertyValue('--neutron-color').trim(), 2);
    const lbl = document.createElement('div');
    lbl.style.cssText = 'display:flex;flex-direction:column;align-items:center;';
    lbl.appendChild(c);
    const t = document.createElement('span');
    t.style.cssText = 'font-size:8px;color:var(--neutron-color);';
    t.textContent = '\uD835\uDD2B';
    lbl.appendChild(t);
    nucRow.appendChild(lbl);

    if (i < N - 1) {
      const plus = document.createElement('span');
      plus.style.cssText = 'color:var(--dim);font-size:14px;';
      plus.textContent = '\u22C8';
      nucRow.appendChild(plus);
    }
  }

  wrap.appendChild(nucRow);

  // Hopf link separator
  const hopfLabel = document.createElement('div');
  hopfLabel.style.cssText = 'font-size:10px;color:var(--accent);text-align:center;width:100%;margin:4px 0;';
  hopfLabel.innerHTML = '\u22C8 Hopf-linked to electron sub-link \u22C8';
  wrap.appendChild(hopfLabel);

  // Electron sub-link
  const elLabel = document.createElement('div');
  elLabel.style.cssText = 'font-size:9px;color:var(--dim);text-align:center;width:100%;';
  elLabel.textContent = 'Electron sub-link';
  wrap.appendChild(elLabel);

  const elRow = document.createElement('div');
  elRow.style.cssText = 'display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap;';

  for (let i = 0; i < Z; i++) {
    const c = makeKnotCanvas(60);
    const ctx = c.getContext('2d');
    drawTrefoil(ctx, 60, getComputedStyle(document.body).getPropertyValue('--electron-color').trim(), 2, true);
    const lbl = document.createElement('div');
    lbl.style.cssText = 'display:flex;flex-direction:column;align-items:center;';
    lbl.appendChild(c);
    const t = document.createElement('span');
    t.style.cssText = 'font-size:8px;color:var(--electron-color);';
    t.textContent = 'e\u207B';
    lbl.appendChild(t);
    elRow.appendChild(lbl);

    if (i < Z - 1) {
      const plus = document.createElement('span');
      plus.style.cssText = 'color:var(--dim);font-size:14px;';
      plus.textContent = '\u22C8';
      elRow.appendChild(plus);
    }
  }

  wrap.appendChild(elRow);

  // For Z >= 3, also show Borromean structure
  if (Z >= 3) {
    const bLabel = document.createElement('div');
    bLabel.style.cssText = 'font-size:9px;color:var(--dim);text-align:center;width:100%;margin-top:6px;';
    bLabel.textContent = 'Borromean proton structure (3 colored unknots)';
    wrap.appendChild(bLabel);
    const bc = makeKnotCanvas(100);
    const bctx = bc.getContext('2d');
    drawBorromean(bctx, 100, '#ee4444', '#44cc44', '#4444ee', 2);
    wrap.appendChild(bc);
  }
}

  const row1 = document.createElement('div');

  // Hopf symbol

  hopf.style.cssText = 'font-size:18px;color:var(--accent);align-self:center;';
  hopf.textContent = '\u22C8';
  row1.appendChild(hopf);

  // Neutron unknot (representative)
  const nBox = document.createElement('div');
  nBox.style.cssText = 'display:flex;flex-direction:column;align-items:center;border:1px solid var(--border);border-radius:4px;padding:4px;';
  const nc = makeKnotCanvas(80);
  drawUnknot(nc.getContext('2d'), 80, getComputedStyle(document.body).getPropertyValue('--neutron-color').trim(), 2.5);

  nLbl.style.cssText = 'font-size:9px;color:var(--neutron-color);text-align:center;';
  nLbl.innerHTML = `\u00D7${N} neutrons<br>O<sub>1</sub>`;
  nBox.appendChild(nLbl);
  row1.appendChild(nBox);

  // Hopf symbol
  const hopf2 = document.createElement('div');
  hopf2.style.cssText = 'font-size:18px;color:var(--accent);align-self:center;';
  hopf2.textContent = '\u22C8';
  row1.appendChild(hopf2);

  // Electron mirror trefoil
  const eBox = document.createElement('div');
  eBox.style.cssText = 'display:flex;flex-direction:column;align-items:center;border:1px solid var(--border);border-radius:4px;padding:4px;';
  const ec = makeKnotCanvas(80);
  drawTrefoil(ec.getContext('2d'), 80, getComputedStyle(document.body).getPropertyValue('--electron-color').trim(), 2.5, true);
  eBox.appendChild(ec);
  const eLbl = document.createElement('div');
  eLbl.style.cssText = 'font-size:9px;color:var(--electron-color);text-align:center;';
  eLbl.innerHTML = `\u00D7${Z} electrons<br>\u03C3(T<sub>2,3</sub>)`;

  wrap.appendChild(row1);

  // Show a few particle knot types
  const row2 = document.createElement('div');
  row2.style.cssText = 'display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px;';

  const knotTypes = [
    { label: 'Photon (empty)', draw: (ctx, s) => { ctx.fillStyle = 'var(--dim)'; ctx.beginPath(); ctx.arc(s/2, s/2, 3, 0, Math.PI*2); ctx.fill(); } },
    { label: 'Neutrino (unknot)', draw: (ctx, s) => drawUnknot(ctx, s, '#888888', 1.5) },
    { label: 'Electron (3_1)', draw: (ctx, s) => drawTrefoil(ctx, s, '#33bbff', 1.5, false) },
    { label: 'Muon (4_1)', draw: (ctx, s) => drawFigureEight(ctx, s, '#aa44cc', 1.5) },
    { label: 'Tau (5_1)', draw: (ctx, s) => drawCinquefoil(ctx, s, '#ffaa33', 1.5) },
  ];

  for (const kt of knotTypes) {
    const box = document.createElement('div');
    box.style.cssText = 'display:flex;flex-direction:column;align-items:center;';
    const c = makeKnotCanvas(50);
    kt.draw(c.getContext('2d'), 50);
    box.appendChild(c);
    const l = document.createElement('span');
    l.style.cssText = 'font-size:7px;color:var(--dim);text-align:center;';
    l.textContent = kt.label;
    box.appendChild(l);
    row2.appendChild(box);
  }

  wrap.appendChild(row2);
}

function makeKnotCanvas(size) {
  const c = document.createElement('canvas');
  c.width = size * 2; c.height = size * 2;
  c.style.width = size + 'px';
  c.style.height = size + 'px';
  c.getContext('2d').scale(2, 2);
  return c;
}

// ── Beta Decay Panel ────────────────────────────────────────────────
function setDecay(type) {
  decayType = type;
  document.getElementById('btn-bminus').classList.toggle('active', type === '-');
  document.getElementById('btn-bplus').classList.toggle('active', type === '+');
  updateDecayPanel();
}

function updateDecayPanel() {
  if (!selectedZ) {
    document.getElementById('decay-el-name').textContent = '--';
    document.getElementById('decay-eq').innerHTML = 'Select an element';
    return;
  }

  const el = elByZ(selectedZ);
  const Z = el[0], A = el[1], N = A - Z;
  const sym = el[2];

  document.getElementById('decay-el-name').textContent = `${sym} (Z=${Z}, A=${A})`;

  const q = getQ();
  const qInv = 1 / q;

  if (decayType === '-') {
    // Beta minus: n -> p + e- + nu_bar
    const daughter = elByZ(Z + 1);
    const dSym = daughter ? daughter[2] : '?';
    document.getElementById('decay-eq').innerHTML =
      `\u03B2\u207B: <sup>${A}</sup>${sym} \u2192 <sup>${A}</sup>${dSym} + e\u207B + \u0305\u03BD<sub>e</sub>`;
  } else {
    // Beta plus: p -> n + e+ + nu
    const daughter = elByZ(Z - 1);
    const dSym = daughter ? daughter[2] : '?';
    document.getElementById('decay-eq').innerHTML =
      `\u03B2\u207A: <sup>${A}</sup>${sym} \u2192 <sup>${A}</sup>${dSym} + e\u207A + \u03BD<sub>e</sub>`;
  }

  // Hecke relation
  document.getElementById('hecke-rel').innerHTML =
    `Hecke: (T \u2212 ${q.toFixed(3)})(T + ${qInv.toFixed(3)}) = 0<br>` +
    `Skein: T \u2212 T\u207B\u00B9 = ${(q - qInv).toFixed(4)}`;

  // Transfer matrix display
  updateMatrixDisplay(q);

  // Draw braid
  drawDecayBraid(q);
}

function updateMatrixDisplay(q) {
  const qInv = 1 / q;
  const s = Math.sqrt(q) - 1 / Math.sqrt(q);
  const display = document.getElementById('matrix-display');
  display.innerHTML = `<table class="matrix-table">
    <tr><td class="hdr">T<sub>++</sub></td><td>${(q - qInv).toFixed(4)}</td><td>1</td></tr>
    <tr><td class="hdr"></td><td>1</td><td>0</td></tr>
  </table>
  <div style="font-size:8px;color:var(--dim);text-align:center;">
    eigenvalues: q=${q.toFixed(3)}, -q\u207B\u00B9=${(-qInv).toFixed(3)}
  </div>`;
}

function drawDecayBraid(q) {
  const svg = document.getElementById('braid-svg');
  svg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  const isMinus = decayType === '-';

  // Resolve CSS variables for theme-aware colors
  const bodyStyles = getComputedStyle(document.body);
  const protonColor = bodyStyles.getPropertyValue('--proton-color').trim();
  const neutronColor = bodyStyles.getPropertyValue('--neutron-color').trim();
  const gapColor = bodyStyles.getPropertyValue('--gap-color').trim();
  const dimColor = bodyStyles.getPropertyValue('--dim').trim();
  const accent2Color = bodyStyles.getPropertyValue('--accent2').trim();

  // T_{3,5} braid: (sigma1 sigma2)^5 = 10 crossings
  const word = [];
  for (let i = 0; i < 5; i++) { word.push(1); word.push(2); }
  const nCross = word.length;

  const margin = 30;
  const totalW = 400 - 2 * margin;
  const spacing = totalW / (nCross + 2);
  const yPos = [45, 85, 125];
  const crossW = spacing * 0.8;

  // Strand types
  const strandTypes = isMinus ? ['u', 'd', 'd'] : ['u', 'u', 'd'];
  const strandColors = strandTypes.map(t => t === 'u' ? protonColor : neutronColor);

  // Input labels
  const labels = strandTypes.map(t => t === 'u' ? '\uD835\uDD32' : '\uD835\uDD21');
  for (let i = 0; i < 3; i++) {
    const txt = document.createElementNS(ns, 'text');
    txt.setAttribute('x', margin - 8);
    txt.setAttribute('y', yPos[i] + 4);
    txt.setAttribute('text-anchor', 'end');
    txt.setAttribute('font-size', '10');
    txt.setAttribute('fill', strandColors[i]);
    txt.textContent = labels[i];
    svg.appendChild(txt);
  }

  // Track strand positions
  let positions = [...yPos];
  let strandOrder = [0, 1, 2]; // which original strand is at each position

  // Highlight the crossing that flips (crossing index 7 = the 8th crossing for beta decay)
  const flipCrossing = 7;

  for (let ci = 0; ci < nCross; ci++) {
    const gen = word[ci];
    const si = gen - 1;
    const x = margin + spacing * (ci + 1);

    // Draw straight segments for non-crossing strand
    const prevX = ci === 0 ? margin : margin + spacing * ci;
    for (let s = 0; s < 3; s++) {
      if (s !== si && s !== si + 1) {
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', prevX + (ci === 0 ? 0 : crossW / 2));
        line.setAttribute('y1', positions[s]);
        line.setAttribute('x2', x - crossW / 2);
        line.setAttribute('y2', positions[s]);
        const origStrand = strandOrder[s];
        line.setAttribute('stroke', strandColors[origStrand]);
        line.setAttribute('stroke-width', '2.5');
        line.setAttribute('stroke-linecap', 'round');
        if (strandTypes[origStrand] === 'd') line.setAttribute('stroke-dasharray', '6,3');
        svg.appendChild(line);
      }
    }

    // Straight lead-in for crossing strands
    for (const idx of [si, si + 1]) {
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', prevX + (ci === 0 ? 0 : crossW / 2));
      line.setAttribute('y1', positions[idx]);
      line.setAttribute('x2', x - crossW / 2);
      line.setAttribute('y2', positions[idx]);
      const origStrand = strandOrder[idx];
      line.setAttribute('stroke', strandColors[origStrand]);
      line.setAttribute('stroke-width', '2.5');
      line.setAttribute('stroke-linecap', 'round');
      if (strandTypes[origStrand] === 'd') line.setAttribute('stroke-dasharray', '6,3');
      svg.appendChild(line);
    }

    // Draw crossing
    const y1 = positions[si], y2 = positions[si + 1];
    const hw = crossW / 2;
    const isFlip = ci === flipCrossing;

    // Highlight flip crossing
    if (isFlip) {
      const rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('x', x - hw - 2);
      rect.setAttribute('y', Math.min(y1, y2) - 6);
      rect.setAttribute('width', crossW + 4);
      rect.setAttribute('height', Math.abs(y2 - y1) + 12);
      rect.setAttribute('rx', '3');
      rect.setAttribute('fill', 'rgba(255,85,51,0.15)');
      rect.setAttribute('stroke', accent2Color);
      rect.setAttribute('stroke-width', '1');
      svg.appendChild(rect);
    }

    const overOrig = strandOrder[si];
    const underOrig = strandOrder[si + 1];
    const overColor = strandColors[overOrig];
    const underColor = strandColors[underOrig];

    // Under strand (drawn first)
    const underPath = document.createElementNS(ns, 'path');
    underPath.setAttribute('d', `M${x - hw},${y2} Q${x},${y1} ${x + hw},${y2}`);
    underPath.setAttribute('stroke', underColor);
    underPath.setAttribute('stroke-width', '2.5');
    underPath.setAttribute('fill', 'none');
    underPath.setAttribute('stroke-linecap', 'round');
    if (strandTypes[underOrig] === 'd') underPath.setAttribute('stroke-dasharray', '6,3');
    svg.appendChild(underPath);

    // Gap
    const gapPath = document.createElementNS(ns, 'path');
    gapPath.setAttribute('d', `M${x - hw * 0.35},${y2 + (y1 - y2) * 0.35} Q${x},${y1} ${x + hw * 0.35},${y2 + (y1 - y2) * 0.35}`);
    gapPath.setAttribute('stroke', gapColor);
    gapPath.setAttribute('stroke-width', '7');
    gapPath.setAttribute('fill', 'none');
    gapPath.setAttribute('stroke-linecap', 'round');
    svg.appendChild(gapPath);

    // Over strand
    const overPath = document.createElementNS(ns, 'path');
    overPath.setAttribute('d', `M${x - hw},${y1} Q${x},${y2} ${x + hw},${y1}`);
    overPath.setAttribute('stroke', overColor);
    overPath.setAttribute('stroke-width', '2.5');
    overPath.setAttribute('fill', 'none');
    overPath.setAttribute('stroke-linecap', 'round');
    if (strandTypes[overOrig] === 'u') {} else overPath.setAttribute('stroke-dasharray', '6,3');
    svg.appendChild(overPath);

    // Crossing label
    const lbl = document.createElementNS(ns, 'text');
    lbl.setAttribute('x', x);
    lbl.setAttribute('y', Math.min(y1, y2) - 8);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('font-size', '7');
    lbl.setAttribute('fill', isFlip ? accent2Color : dimColor);
    lbl.textContent = isFlip ? '\u03C3' + (si + 1) + '*' : '\u03C3' + (si + 1);
    svg.appendChild(lbl);

    // Swap strand order
    [strandOrder[si], strandOrder[si + 1]] = [strandOrder[si + 1], strandOrder[si]];
    [positions[si], positions[si + 1]] = [positions[si + 1], positions[si]];
    // Swap back positions for display (strands stay at their y-level)
    positions[si] = yPos[si]; // Reset to fixed levels
    positions[si + 1] = yPos[si + 1];
  }

  // Output labels
  const endX = margin + spacing * (nCross + 1);
  // Draw final straight segments
  const lastCrossX = margin + spacing * nCross;
  for (let s = 0; s < 3; s++) {
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', lastCrossX + crossW / 2);
    line.setAttribute('y1', yPos[s]);
    line.setAttribute('x2', endX);
    line.setAttribute('y2', yPos[s]);
    const origStrand = strandOrder[s];
    line.setAttribute('stroke', strandColors[origStrand]);
    line.setAttribute('stroke-width', '2.5');
    line.setAttribute('stroke-linecap', 'round');
    if (strandTypes[origStrand] === 'd') line.setAttribute('stroke-dasharray', '6,3');
    svg.appendChild(line);
  }

  // Output type labels
  const outTypes = isMinus ? ['\uD835\uDD32', '\uD835\uDD32', '\uD835\uDD21'] : ['\uD835\uDD32', '\uD835\uDD21', '\uD835\uDD21'];
  for (let i = 0; i < 3; i++) {
    const txt = document.createElementNS(ns, 'text');
    txt.setAttribute('x', endX + 8);
    txt.setAttribute('y', yPos[i] + 4);
    txt.setAttribute('text-anchor', 'start');
    txt.setAttribute('font-size', '10');
    txt.setAttribute('fill', outTypes[i] === '\uD835\uDD32' ? protonColor : neutronColor);
    txt.textContent = outTypes[i];
    svg.appendChild(txt);
  }

  // Title
  const title = document.createElementNS(ns, 'text');
  title.setAttribute('x', 200);
  title.setAttribute('y', 16);
  title.setAttribute('text-anchor', 'middle');
  title.setAttribute('font-size', '9');
  title.setAttribute('fill', dimColor);
  title.textContent = `T\u2083\u2085 braid: (\u03C3\u2081\u03C3\u2082)\u2075 = 10 crossings`;
  svg.appendChild(title);

  // Flip annotation
  const flipNote = document.createElementNS(ns, 'text');
  flipNote.setAttribute('x', margin + spacing * (flipCrossing + 1));
  flipNote.setAttribute('y', 160);
  flipNote.setAttribute('text-anchor', 'middle');
  flipNote.setAttribute('font-size', '8');
  flipNote.setAttribute('fill', accent2Color);
  flipNote.textContent = isMinus ? 'd\u2192u flip' : 'u\u2192d flip';
  svg.appendChild(flipNote);
}

// ── q slider update ─────────────────────────────────────────────────
document.getElementById('sl-q').addEventListener('input', function() {
  document.getElementById('v-q').textContent = this.value;
  updateDecayPanel();
});

// ── Initialize ──────────────────────────────────────────────────────
buildTable();
// Select Iron by default
selectElement(26);
</script>
