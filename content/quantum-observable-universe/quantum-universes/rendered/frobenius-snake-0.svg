<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>Rigidity: the zig-zag snake</title>
  <desc>
    Two snake / zig-zag composites of the rigidity data.  Left:
    the composite A → A ⊗ A^∨ ⊗ A → A built from coev_A then ev_A
    collapsing to the identity on A.  Right: the dual snake for
    A^∨ obtained by composing ev then coev.  Drawn in the
    Penrose / string-diagram convention with cups (ev) as ∪ and
    caps (coev) as ∩, identity strands as vertical lines, and
    small black dots for unit / counit insertions.
  </desc>
  <defs>
    <style>
      .bg     { fill: #ffffff; }
      .strand { fill: none; stroke: #1a1a1a; stroke-width: 2.6;
                stroke-linecap: round; }
      .dot    { fill: #1a1a1a; }
      .lbl    { font-size: 14px; font-style: italic; fill: #1a1a1a;
                text-anchor: middle; }
      .lblb   { font-size: 14px; font-weight: 700; fill: #1a1a1a;
                text-anchor: middle; }
      .ttl    { font-size: 17px; font-style: italic; fill: #1a1a1a; }
      .eq     { font-size: 26px; font-weight: 700; fill: #1a1a1a;
                text-anchor: middle; }
      .sub    { font-size: 11px; fill: #444; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="420"/>

  <text x="360" y="32" text-anchor="middle" class="ttl">Rigidity:  the zig-zag (snake) identity</text>

  <!-- ===== Left snake: A → A ⊗ A^∨ ⊗ A → A ===== -->
  <g transform="translate(180, 220)">
    <!-- Top entry strand A -->
    <line class="strand" x1="-90" y1="-110" x2="-90" y2="-30"/>
    <text x="-90" y="-125" class="lbl">A</text>
    <!-- coev: cap (∩) connecting middle two strands -->
    <path class="strand" d="M -30 -30 C -30 -80, 30 -80, 30 -30"/>
    <text x="0" y="-92" class="lbl">coev_A</text>
    <!-- middle vertical strands (A and A^∨) -->
    <line class="strand" x1="-90" y1="-30" x2="-90" y2="30"/>
    <line class="strand" x1="-30" y1="-30" x2="-30" y2="30"/>
    <line class="strand" x1="30"  y1="-30" x2="30"  y2="30"/>
    <!-- ev: cup (∪) connecting first two strands -->
    <path class="strand" d="M -90 30 C -90 80, -30 80, -30 30"/>
    <text x="-60" y="100" class="lbl">ev_A</text>
    <!-- bottom exit strand A -->
    <line class="strand" x1="30" y1="30" x2="30" y2="110"/>
    <text x="30" y="130" class="lbl">A</text>
  </g>

  <text x="180" y="370" class="lblb">snake on A   =   id_A</text>
  <text x="180" y="395" class="sub">(A ⊗ coev_A) ∘ (ev_A ⊗ A) = id_A</text>

  <!-- Equality symbol -->
  <text x="360" y="220" class="eq">=</text>

  <!-- ===== Right: identity strand (the trivial snake) ===== -->
  <g transform="translate(540, 220)">
    <line class="strand" x1="0" y1="-110" x2="0" y2="110"/>
    <text x="0" y="-125" class="lbl">A</text>
    <text x="0" y="130" class="lbl">A</text>
  </g>

  <text x="540" y="370" class="lblb">id_A</text>
  <text x="540" y="395" class="sub">a single strand</text>
</svg>
