<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 620 320"
     width="620" height="320"
     font-family="Georgia, 'Times New Roman', serif"
     font-size="13"
     fill="none"
     stroke="#222"
     stroke-width="1"
     stroke-linecap="round"
     stroke-linejoin="round">

  <title>Mostow staircase: discrete hyperbolic-volume spectrum and confinement</title>

  <!-- ── Background panel ───────────────────────────────────── -->
  <rect x="0.5" y="0.5" width="619" height="319" fill="#fff" stroke="none"/>

  <!-- ── Headline ──────────────────────────────────────────── -->
  <text x="310" y="22" text-anchor="middle" stroke="none" fill="#111"
        font-size="14" font-style="italic">
    Mostow rigidity locks the volume spectrum
  </text>

  <!-- ── Mostow-gap shading (vertical bands between treads) ─ -->
  <!-- Gap from Unknot (vol 0) to 4_1 (vol 2.0299) — wide -->
  <rect x="80"  y="200" width="264" height="40" fill="#f0f0f0" stroke="none"/>
  <!-- Gap from 4_1 to 5_2 (vol 2.0299 → 2.8281, gap ≈ 0.798) -->
  <rect x="344" y="150" width="104" height="40" fill="#f0f0f0" stroke="none"/>
  <!-- Gap from 5_2 to 6_1 (vol 2.8281 → 3.164, gap ≈ 0.336) -->
  <rect x="448" y="100" width="43"  height="40" fill="#f0f0f0" stroke="none"/>

  <!-- ── Staircase risers and treads ───────────────────────── -->
  <!-- Step 0: Unknot / Seifert-fibred (vol = 0), tread x=80→344, y=240 -->
  <line x1="80"  y1="240" x2="344" y2="240"/>
  <line x1="344" y1="240" x2="344" y2="190"/>
  <!-- Step 1: 4_1 (vol 2.0299), tread x=344→448, y=190 -->
  <line x1="344" y1="190" x2="448" y2="190"/>
  <line x1="448" y1="190" x2="448" y2="140"/>
  <!-- Step 2: 5_2 (vol 2.8281), tread x=448→491, y=140 -->
  <line x1="448" y1="140" x2="491" y2="140"/>
  <line x1="491" y1="140" x2="491" y2="90"/>
  <!-- Step 3: 6_1 (vol 3.164), tread x=491→540, y=90 -->
  <line x1="491" y1="90"  x2="540" y2="90"/>

  <!-- ── x-axis ─────────────────────────────────────────────── -->
  <line x1="60" y1="270" x2="580" y2="270" stroke="#444"/>
  <!-- arrowhead -->
  <path d="M 575 266 L 580 270 L 575 274 Z" fill="#444" stroke="none"/>

  <!-- x-axis ticks at the four volumes -->
  <g stroke="#444">
    <line x1="80"  y1="266" x2="80"  y2="274"/>
    <line x1="344" y1="266" x2="344" y2="274"/>
    <line x1="448" y1="266" x2="448" y2="274"/>
    <line x1="491" y1="266" x2="491" y2="274"/>
  </g>

  <!-- x-axis tick labels (volumes) -->
  <g stroke="none" fill="#222" text-anchor="middle" font-size="11">
    <text x="80"  y="288">0</text>
    <text x="344" y="288">2.030</text>
    <text x="448" y="288">2.828</text>
    <text x="491" y="288">3.164</text>
  </g>
  <text x="580" y="288" text-anchor="end" stroke="none" fill="#222"
        font-style="italic" font-size="12">
    Vol(U \ K)
  </text>

  <!-- ── Knot-type labels above each tread ─────────────────── -->
  <g stroke="none" fill="#111" text-anchor="middle" font-style="italic">
    <text x="212" y="232">Unknot, Seifert-fibred</text>
    <text x="396" y="182">4₁ (figure-eight)</text>
    <text x="470" y="132">5₂</text>
    <text x="516" y="82">6₁</text>
  </g>

  <!-- ── Mostow-gap labels (thin lines + values) ───────────── -->
  <g stroke="#666" stroke-dasharray="2,2">
    <!-- gap 1 (4_1 - unknot ≈ 2.0299) -->
    <line x1="80"  y1="258" x2="344" y2="258"/>
    <!-- gap 2 (5_2 - 4_1 ≈ 0.798) -->
    <line x1="344" y1="258" x2="448" y2="258"/>
    <!-- gap 3 (6_1 - 5_2 ≈ 0.336) -->
    <line x1="448" y1="258" x2="491" y2="258"/>
  </g>
  <g stroke="none" fill="#666" text-anchor="middle" font-size="10">
    <text x="212" y="255">Δ ≈ 2.030</text>
    <text x="396" y="255">Δ ≈ 0.798</text>
    <text x="469" y="255">Δ ≈ 0.336</text>
  </g>

  <!-- ── "No continuous deformation" annotation (top) ──────── -->
  <!-- "no-entry" sign: circle with a slash -->
  <g transform="translate(60 50)">
    <circle cx="0" cy="0" r="11" stroke="#a00" fill="#fff" stroke-width="1.5"/>
    <line x1="-7.5" y1="-7.5" x2="7.5" y2="7.5" stroke="#a00" stroke-width="1.5"/>
  </g>
  <text x="80" y="55" stroke="none" fill="#a00" font-style="italic">
    no continuous deformation between knot types
  </text>

  <!-- arrow from the no-entry sign curving down to a gap shading -->
  <path d="M 78 60 Q 110 110, 200 215"
        stroke="#a00" stroke-width="0.7" fill="none"
        stroke-dasharray="3,2" opacity="0.6"/>

  <!-- ── Confinement annotation (bottom) ───────────────────── -->
  <text x="310" y="312" text-anchor="middle" stroke="none" fill="#111"
        font-style="italic">
    no nearby hyperbolic structures  ⇒  particles confined
  </text>

  <!-- ── Legend (right margin) ─────────────────────────────── -->
  <g transform="translate(540 175)" stroke="none" fill="#444" font-size="10">
    <text x="0" y="0">discrete</text>
    <text x="0" y="13">spectrum</text>
    <text x="0" y="26">(Mostow)</text>
  </g>

</svg>
