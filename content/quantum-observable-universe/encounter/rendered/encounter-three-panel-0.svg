<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>Encounter sequence: approach → crossing → merge</title>
  <desc>
    Three-panel cartoon.  (a) Approach: two vortex tubes ϱ₁, ϱ₂
    on a flat strip M, separated by a gap.  (b) Crossing: strip
    pinches at brane point p; circle 𝒮_p opens above; tubes
    enter.  (c) Merge: inside the circle the tubes are two
    parallel braid strands with bracket π₁(U \ K).
  </desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .bg     { fill: #ffffff; }
      .strip  { fill: #f0f0f6; stroke: #1a1a1a; stroke-width: 1.6; }
      .vortex_r { fill: none; stroke: #c0392b; stroke-width: 3; stroke-linecap: round; }
      .vortex_b { fill: none; stroke: #2980b9; stroke-width: 3; stroke-linecap: round; }
      .fibre  { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1.6;
                stroke-dasharray: 4 3; }
      .lblb   { font-size: 14px; font-weight: 700; fill: #1a1a1a;
                text-anchor: middle; }
      .lbl    { font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
      .ttl    { font-size: 17px; font-style: italic; fill: #1a1a1a; }
      .arrlbl { font-size: 12px; fill: #1a1a1a; font-style: italic;
                text-anchor: middle; }
      .panel  { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="480"/>

  <text x="600" y="32" text-anchor="middle" class="ttl">Encounter:  approach  →  crossing  →  merge</text>

  <!-- Panel (a) Approach: x = 20..400 -->
  <text x="40" y="68" class="panel">(a)  Approach</text>
  <rect class="strip" x="40" y="180" width="340" height="60" rx="6"/>
  <text x="210" y="158" class="lbl">flat strip M (base manifold)</text>
  <path class="vortex_r" d="M 80 210 q 20 -20 40 0 q 20 20 40 0 q 20 -20 40 0"/>
  <text x="180" y="190" class="lbl" fill="#c0392b">ϱ₁</text>
  <path class="vortex_b" d="M 240 210 q 20 -20 40 0 q 20 20 40 0 q 20 -20 40 0"/>
  <text x="320" y="190" class="lbl" fill="#2980b9">ϱ₂</text>
  <text x="210" y="280" class="lbl">two vortex tubes propagate, separated by a gap</text>

  <!-- Arrow -->
  <line stroke="#1a1a1a" stroke-width="1.6" fill="none" x1="400" y1="220" x2="440" y2="220" marker-end="url(#tip)"/>
  <text x="420" y="208" class="arrlbl">Reeb flow</text>

  <!-- Panel (b) Crossing: x = 440..820 -->
  <text x="460" y="68" class="panel">(b)  Crossing onto fibre</text>
  <path class="strip" d="M 460 180 L 600 180 Q 630 180, 630 200 L 630 220 Q 630 240, 600 240 L 460 240 Z"/>
  <ellipse class="fibre" cx="700" cy="170" rx="80" ry="70"/>
  <text x="700" y="160" class="lblb">𝒮_p</text>
  <text x="700" y="178" class="lbl">fibre opens</text>
  <path class="vortex_r" d="M 480 200 Q 600 200, 660 170"/>
  <path class="vortex_b" d="M 500 220 Q 620 220, 700 200"/>
  <text x="630" y="280" class="lbl">strip pinches at brane point p; fibre 𝒮_p opens above</text>
  <circle fill="#1a1a1a" cx="610" cy="220" r="3"/>
  <text x="630" y="240" class="lbl">p</text>

  <!-- Arrow -->
  <line stroke="#1a1a1a" stroke-width="1.6" fill="none" x1="820" y1="220" x2="860" y2="220" marker-end="url(#tip)"/>
  <text x="840" y="208" class="arrlbl">amalgamation</text>

  <!-- Panel (c) Merge: x = 860..1180 -->
  <text x="880" y="68" class="panel">(c)  Merge inside fibre</text>
  <ellipse class="fibre" cx="1020" cy="200" rx="120" ry="90"/>
  <line stroke="#c0392b" stroke-width="3" x1="980" y1="130" x2="980" y2="270"/>
  <line stroke="#2980b9" stroke-width="3" x1="1060" y1="130" x2="1060" y2="270"/>
  <path stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" d="M 940 100 L 940 110 L 1100 110 L 1100 100"/>
  <text x="1020" y="92" class="lbl">π₁(U \ K)</text>
  <text x="1020" y="320" class="lbl">two parallel braid strands inside 𝒮_p</text>

  <!-- Bottom annotation -->
  <text x="600" y="430" text-anchor="middle" class="lbl" font-style="italic">
    encounter = vortices cross from base M onto fibre 𝒮_p; the merged knot complement π₁(U \ K) is the Hecke datum
  </text>
</svg>
