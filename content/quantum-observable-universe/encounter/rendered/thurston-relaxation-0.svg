<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>Thurston relaxation as a Newton flow seeded by q-Pochhammer poles</title>
  <desc>
    Top edge: row of dots labelled x = q^{-k} (q-Pochhammer poles).
    Below: dashed verticals drop into Picard–Lefschetz potential
    Re(S).  Steepest-descent arrows go from each pole to its
    saddle z_k.  Inset on right: hyperbolic triangulation
    ⊔_k Δ_{z_k}.
  </desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .pole { fill: #c0392b; }
      .pot { fill: none; stroke: #1a1a1a; stroke-width: 1.6; }
      .land { fill: #f0f0f6; stroke: #1a1a1a; stroke-width: 1; }
      .drop { stroke: #c0392b; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
      .desc { stroke: #2980b9; stroke-width: 1.6; fill: none; }
      .saddle { fill: #2980b9; }
      .lblb { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
      .lbl { font-size: 12px; fill: #1a1a1a; }
      .ttl { font-size: 17px; font-style: italic; fill: #1a1a1a; }
      .triag { fill: none; stroke: #1a1a1a; stroke-width: 1.4; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="540"/>
  <text x="450" y="32" text-anchor="middle" class="ttl">Thurston relaxation = Newton flow seeded by q-Pochhammer poles</text>

  <!-- Top edge: poles at x = q^{-k} for k = 0..5 -->
  <text x="100" y="80" class="lbl">x = q^{-k}:</text>
  <g>
    <circle class="pole" cx="180" cy="100" r="6"/>
    <text x="180" y="80" text-anchor="middle" class="lbl">k=0</text>
    <circle class="pole" cx="270" cy="100" r="6"/>
    <text x="270" y="80" text-anchor="middle" class="lbl">k=1</text>
    <circle class="pole" cx="360" cy="100" r="6"/>
    <text x="360" y="80" text-anchor="middle" class="lbl">k=2</text>
    <circle class="pole" cx="450" cy="100" r="6"/>
    <text x="450" y="80" text-anchor="middle" class="lbl">k=3</text>
    <circle class="pole" cx="540" cy="100" r="6"/>
    <text x="540" y="80" text-anchor="middle" class="lbl">k=4</text>
    <circle class="pole" cx="630" cy="100" r="6"/>
    <text x="630" y="80" text-anchor="middle" class="lbl">k=5</text>
  </g>

  <!-- Dashed verticals drop into landscape -->
  <line class="drop" x1="180" y1="100" x2="180" y2="280"/>
  <line class="drop" x1="270" y1="100" x2="270" y2="320"/>
  <line class="drop" x1="360" y1="100" x2="360" y2="295"/>
  <line class="drop" x1="450" y1="100" x2="450" y2="335"/>
  <line class="drop" x1="540" y1="100" x2="540" y2="305"/>
  <line class="drop" x1="630" y1="100" x2="630" y2="320"/>

  <!-- Re(S) landscape (curve) -->
  <path class="pot" d="M 100 220 Q 180 280, 270 320 Q 360 295, 450 335 Q 540 305, 630 320 Q 720 280, 800 220"/>
  <rect class="land" x="100" y="220" width="700" height="120" fill-opacity="0.3"/>
  <text x="120" y="200" class="lblb">Re(S)  —  Picard–Lefschetz potential</text>

  <!-- Saddles z_k at each drop -->
  <circle class="saddle" cx="180" cy="280" r="4"/>
  <text x="170" y="305" class="lbl" fill="#2980b9">z₀</text>
  <circle class="saddle" cx="270" cy="320" r="4"/>
  <text x="260" y="345" class="lbl" fill="#2980b9">z₁</text>
  <circle class="saddle" cx="360" cy="295" r="4"/>
  <text x="350" y="320" class="lbl" fill="#2980b9">z₂</text>
  <circle class="saddle" cx="450" cy="335" r="4"/>
  <text x="440" y="360" class="lbl" fill="#2980b9">z₃</text>
  <circle class="saddle" cx="540" cy="305" r="4"/>
  <text x="530" y="330" class="lbl" fill="#2980b9">z₄</text>
  <circle class="saddle" cx="630" cy="320" r="4"/>
  <text x="620" y="345" class="lbl" fill="#2980b9">z₅</text>

  <!-- Inset on right: hyperbolic triangulation -->
  <text x="180" y="430" class="lblb">resulting triangulation  ⊔_k Δ_{z_k}</text>
  <g transform="translate(450, 460)">
    <polygon class="triag" points="-100,0 -50,-30 0,0"/>
    <polygon class="triag" points="0,0 50,-30 100,0"/>
    <polygon class="triag" points="-100,0 -50,30 0,0"/>
    <polygon class="triag" points="0,0 50,30 100,0"/>
  </g>
</svg>
