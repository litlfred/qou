<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>The Archimedean wall</title>
  <desc>
    Vertical wall down the middle labelled τ_arch.  Left side
    tags: Hecke spectra, Markov traces, LP/SDP feasibility,
    Gröbner–Shirshov reductions; tinted with R = ℤ[q^±1/2,
    (q-q^-1)^-1].  Right side tags: hyperbolic volumes, thimble
    depths, mass eigenvalues, Bloch-Wigner D(z); tinted with ℝ
    via τ_arch.  One-way arrow piercing the wall.  Two no-entry
    signs marking illegal back-crossings.
  </desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .left { fill: #f0e6d2; stroke: #1a1a1a; stroke-width: 1.4; rx: 6; }
      .right { fill: #d2e6f0; stroke: #1a1a1a; stroke-width: 1.4; rx: 6; }
      .lbl { font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
      .lblb { font-size: 14px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
      .lblbig { font-size: 18px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
      .wall { fill: #1a1a1a; }
      .ttl { font-size: 17px; font-style: italic; fill: #1a1a1a; }
      .reg { font-size: 11px; fill: #444; text-anchor: middle; font-style: italic; }
      .noentry { fill: #c0392b; stroke: #c0392b; stroke-width: 2.6; }
      .tau { fill: #c0392b; font-size: 14px; font-weight: 700; font-style: italic; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="540"/>
  <text x="450" y="32" text-anchor="middle" class="ttl">The Archimedean wall</text>

  <!-- Wall -->
  <rect class="wall" x="436" y="80" width="28" height="400"/>
  <text x="450" y="60" class="lblbig" fill="#c0392b">Archimedean wall</text>

  <!-- Left side (4 stacked tags) -->
  <text x="200" y="80" class="lblb">algebraic / pre-τ</text>
  <text x="200" y="98" class="reg">R = ℤ[q^{±1/2}, (q−q⁻¹)⁻¹]</text>

  <rect class="left" x="60" y="120" width="280" height="50"/>
  <text x="200" y="148" class="lbl">Hecke spectra</text>

  <rect class="left" x="60" y="190" width="280" height="50"/>
  <text x="200" y="218" class="lbl">Markov traces</text>

  <rect class="left" x="60" y="260" width="280" height="50"/>
  <text x="200" y="288" class="lbl">LP / SDP feasibility</text>

  <rect class="left" x="60" y="330" width="280" height="50"/>
  <text x="200" y="358" class="lbl">Gröbner–Shirshov reductions</text>

  <!-- Right side -->
  <text x="700" y="80" class="lblb">geometric / post-τ</text>
  <text x="700" y="98" class="reg">ℝ via τ_arch</text>

  <rect class="right" x="560" y="120" width="280" height="50"/>
  <text x="700" y="148" class="lbl">hyperbolic volumes</text>

  <rect class="right" x="560" y="190" width="280" height="50"/>
  <text x="700" y="218" class="lbl">thimble depths</text>

  <rect class="right" x="560" y="260" width="280" height="50"/>
  <text x="700" y="288" class="lbl">mass eigenvalues</text>

  <rect class="right" x="560" y="330" width="280" height="50"/>
  <text x="700" y="358" class="lbl">Bloch–Wigner D(z)</text>

  <!-- One-way arrow piercing wall -->
  <line stroke="#c0392b" stroke-width="3" x1="350" y1="430" x2="550" y2="430" marker-end="url(#tip)"/>
  <text x="450" y="420" class="tau" text-anchor="middle">τ_arch</text>
  <text x="450" y="455" class="lbl">one-way functor</text>

  <!-- Two no-entry signs blocking back-crossings -->
  <g transform="translate(450, 200)">
    <circle class="noentry" r="14" fill="none"/>
    <line stroke="#c0392b" stroke-width="2.6" x1="-9" y1="0" x2="9" y2="0"/>
  </g>
  <g transform="translate(450, 320)">
    <circle class="noentry" r="14" fill="none"/>
    <line stroke="#c0392b" stroke-width="2.6" x1="-9" y1="0" x2="9" y2="0"/>
  </g>

  <text x="450" y="510" text-anchor="middle" class="lbl" font-style="italic">τ_arch realises algebraic objects as geometric ones; never the reverse</text>
</svg>
