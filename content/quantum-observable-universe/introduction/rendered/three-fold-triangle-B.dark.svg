<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>Three observations, one constraint (radial spiral, variant B) (dark mode)</title>
  <desc>
    Variant B: radial spiral.  Three radial spokes carrying the
    threefold structures (colours, generations, chirality) emerge
    from a central χ=−6 disk; an outward arrow points to Bring's
    surface Σ₄ at the bottom.  Different layout from variant A
    (equilateral triangle with vertex boxes).
  </desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6ea"/>
    </marker>
    <style>
      .bg { fill: #0e0e12; }
      .core { fill: #0e0e12; stroke: #e6e6ea; stroke-width: 2.4; }
      .spoke { stroke: #e6e6ea; stroke-width: 1.6; fill: none; }
      .ring { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 3 3; }
      .red { fill: #c0392b; } .grn { fill: #27ae60; } .blu { fill: #2980b9; }
      .lblb { font-size: 14px; font-weight: 700; fill: #e6e6ea; text-anchor: middle; }
      .lbl { font-size: 12px; fill: #e6e6ea; text-anchor: middle; }
      .clbl { font-size: 16px; font-weight: 700; fill: #e6e6ea; text-anchor: middle; }
      .ttl { font-size: 17px; font-style: italic; fill: #e6e6ea; }
      .out { fill: #0e0e12; stroke: #e6e6ea; stroke-width: 1.6; rx: 6; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="600" height="540"/>
  <text x="300" y="30" text-anchor="middle" class="ttl">Three observations, one constraint  (variant B)</text>

  <!-- Outer dashed reference ring -->
  <circle class="ring" cx="300" cy="240" r="160"/>

  <!-- Three spokes radiating at 90° (top), 210°, 330° -->
  <line class="spoke" x1="300" y1="240" x2="300" y2="100"/>
  <line class="spoke" x1="300" y1="240" x2="180" y2="310"/>
  <line class="spoke" x1="300" y1="240" x2="420" y2="310"/>

  <!-- Spoke endpoints with coloured tags -->
  <circle class="red" cx="300" cy="100" r="12"/>
  <text x="300" y="80" class="lblb">Three colours</text>
  <text x="300" y="64" class="lbl">R · G · B</text>

  <circle class="grn" cx="180" cy="310" r="12"/>
  <text x="160" y="335" class="lblb" text-anchor="end">Three</text>
  <text x="160" y="350" class="lbl" text-anchor="end">generations</text>

  <circle class="blu" cx="420" cy="310" r="12"/>
  <text x="440" y="335" class="lblb" text-anchor="start">Three-fold</text>
  <text x="440" y="350" class="lbl" text-anchor="start">chirality</text>

  <!-- Centre disk -->
  <circle class="core" cx="300" cy="240" r="50"/>
  <text x="300" y="245" class="clbl">χ = −6</text>

  <!-- Output arrow + Bring box -->
  <line stroke="#e6e6ea" stroke-width="1.6" fill="none" x1="300" y1="420" x2="300" y2="455" marker-end="url(#tip)"/>
  <rect class="out" x="200" y="465" width="200" height="50"/>
  <text x="300" y="490" class="lblb">Bring's surface  Σ₄</text>
  <text x="300" y="508" class="lbl">unique genus-4, χ=−6, Aut = S₅</text>
</svg>
