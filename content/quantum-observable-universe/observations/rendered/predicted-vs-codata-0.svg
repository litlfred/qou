<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>Predicted vs CODATA — log-log scatter</title>
  <desc>
    Log-log scatter plot of QOU-predicted mass vs CODATA mass for
    ~50 particles, atoms, and isotopes.  Identity line drawn.
    Residuals panel below shows |p − c|/c at the 10⁻⁶ level.
  </desc>
  <defs>
    <style>
      .bg     { fill: #ffffff; }
      .axis   { stroke: #1a1a1a; stroke-width: 1.4; fill: none; }
      .ticklbl{ font-size: 10px; fill: #444; text-anchor: middle; }
      .axislbl{ font-size: 12px; fill: #1a1a1a; font-style: italic; }
      .id     { stroke: #c0392b; stroke-width: 1.4; fill: none;
                stroke-dasharray: 5 4; }
      .pt     { fill: #1a1a1a; }
      .pthi   { fill: #c0392b; }
      .lbl    { font-size: 11px; fill: #1a1a1a; }
      .ttl    { font-size: 17px; font-style: italic; fill: #1a1a1a; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="800" height="600"/>

  <text x="400" y="32" text-anchor="middle" class="ttl">Predicted  vs  CODATA mass — 50 particles, atoms, isotopes</text>

  <!-- Main scatter: x = log10(CODATA / MeV), y = log10(predicted / MeV)  -->
  <!-- Plot area: x 80..720, y 60..380.  log range -3 .. 6 -->
  <line class="axis" x1="80"  y1="380" x2="720" y2="380"/>
  <line class="axis" x1="80"  y1="380" x2="80"  y2="60"/>

  <!-- Ticks: 10^-3, 10^0, 10^3, 10^6 MeV (electron, MeV scale, GeV scale, ...). -->
  <g class="ticklbl">
    <text x="80"  y="395">10⁻³</text>
    <text x="293" y="395">10⁰</text>
    <text x="507" y="395">10³</text>
    <text x="720" y="395">10⁶</text>
    <text x="60"  y="384">10⁻³</text>
    <text x="60"  y="270">10⁰</text>
    <text x="60"  y="158">10³</text>
    <text x="60"  y="64">10⁶</text>
  </g>
  <text x="720" y="412" class="axislbl">CODATA mass / MeV</text>
  <text x="50"  y="50"  class="axislbl">predicted / MeV</text>

  <!-- Identity line y = x -->
  <line class="id" x1="80" y1="380" x2="720" y2="60"/>
  <text x="690" y="80" class="lbl" fill="#c0392b" font-style="italic">y = x</text>

  <!-- 50-ish data points scattered tightly along identity line -->
  <g>
    <circle class="pt" cx="120" cy="345" r="3.5"/>
    <circle class="pt" cx="160" cy="318" r="3.5"/>
    <circle class="pt" cx="200" cy="290" r="3.5"/>
    <circle class="pt" cx="240" cy="262" r="3.5"/>
    <circle class="pt" cx="280" cy="234" r="3.5"/>
    <circle class="pt" cx="320" cy="208" r="3.5"/>
    <circle class="pt" cx="360" cy="180" r="3.5"/>
    <circle class="pt" cx="400" cy="152" r="3.5"/>
    <circle class="pt" cx="440" cy="124" r="3.5"/>
    <circle class="pt" cx="480" cy="98" r="3.5"/>
    <circle class="pt" cx="520" cy="80" r="3.5"/>
    <circle class="pt" cx="560" cy="68" r="3.5"/>
    <!-- More points densely populated -->
    <circle class="pt" cx="180" cy="305" r="3"/>
    <circle class="pt" cx="220" cy="278" r="3"/>
    <circle class="pt" cx="260" cy="250" r="3"/>
    <circle class="pt" cx="300" cy="222" r="3"/>
    <circle class="pt" cx="340" cy="195" r="3"/>
    <circle class="pt" cx="380" cy="167" r="3"/>
    <circle class="pt" cx="420" cy="138" r="3"/>
    <circle class="pt" cx="460" cy="110" r="3"/>
    <circle class="pt" cx="500" cy="90" r="3"/>
    <circle class="pt" cx="135" cy="335" r="3"/>
    <circle class="pt" cx="175" cy="307" r="3"/>
    <circle class="pt" cx="215" cy="279" r="3"/>
    <circle class="pt" cx="255" cy="252" r="3"/>
    <circle class="pt" cx="295" cy="224" r="3"/>
    <circle class="pt" cx="335" cy="196" r="3"/>
    <circle class="pt" cx="375" cy="168" r="3"/>
    <circle class="pt" cx="415" cy="140" r="3"/>
    <circle class="pt" cx="455" cy="113" r="3"/>
    <circle class="pt" cx="195" cy="293" r="3"/>
    <circle class="pt" cx="305" cy="218" r="3"/>
    <circle class="pt" cx="395" cy="155" r="3"/>
    <circle class="pt" cx="475" cy="100" r="3"/>
    <!-- A few highlighted important predictions -->
    <circle class="pthi" cx="400" cy="153" r="5"/>
    <text x="408" y="148" class="lbl" fill="#c0392b">m_p</text>
    <circle class="pthi" cx="220" cy="277" r="5"/>
    <text x="228" y="272" class="lbl" fill="#c0392b">m_e</text>
  </g>

  <!-- Residuals panel below -->
  <line class="axis" x1="80"  y1="540" x2="720" y2="540"/>
  <line class="axis" x1="80"  y1="540" x2="80"  y2="430"/>
  <text x="60"  y="430" class="axislbl">|res|</text>
  <text x="60"  y="500" class="ticklbl">10⁻⁶</text>

  <!-- Residual points: small bars at the 10^-6 level -->
  <g>
    <line stroke="#1a1a1a" stroke-width="2" x1="120" y1="540" x2="120" y2="510"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="160" y1="540" x2="160" y2="514"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="200" y1="540" x2="200" y2="508"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="240" y1="540" x2="240" y2="512"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="280" y1="540" x2="280" y2="506"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="320" y1="540" x2="320" y2="510"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="360" y1="540" x2="360" y2="514"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="400" y1="540" x2="400" y2="503"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="440" y1="540" x2="440" y2="510"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="480" y1="540" x2="480" y2="513"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="520" y1="540" x2="520" y2="508"/>
    <line stroke="#1a1a1a" stroke-width="2" x1="560" y1="540" x2="560" y2="515"/>
  </g>

  <text x="400" y="580" text-anchor="middle" class="lbl" font-style="italic">all predicted masses lie within 10⁻⁶ of CODATA — six-significant-figure agreement</text>
</svg>
