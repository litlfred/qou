<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>The Gröbner–Shirshov reduction tree</title>
  <desc>
    A rooted tree.  Root: an unreduced Hecke word T_w ∈ H_n(q).
    Each downward branch is one rewrite rule from the GS reduction
    engine — by Skein, by braid, or by Markov.  Leaves are normal-
    form monomials; the canonical (lex-smallest) leaf is marked.
    A side note explains that the branching captures the
    confluence of the GS algorithm.
  </desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .bg     { fill: #ffffff; }
      .node   { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.4; rx: 6; }
      .leaf   { fill: #f6f6f6; stroke: #1a1a1a; stroke-width: 1.4; rx: 6; }
      .canon  { fill: #ffffff; stroke: #c0392b; stroke-width: 2.4; rx: 6; }
      .arr    { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
      .lbl    { font-size: 12px; fill: #1a1a1a; text-anchor: middle;
                font-style: italic; }
      .lblw   { font-size: 13px; font-weight: 700; fill: #1a1a1a;
                text-anchor: middle; }
      .rule   { font-size: 11px; fill: #555; font-style: italic; }
      .ttl    { font-size: 17px; font-style: italic; fill: #1a1a1a; }
      .canlbl { font-size: 11px; fill: #c0392b; font-weight: 700; }
      .sub    { font-size: 11px; fill: #444; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="620"/>

  <text x="450" y="32" text-anchor="middle" class="ttl">The Gröbner–Shirshov reduction tree</text>

  <!-- Root: unreduced Hecke word -->
  <rect class="node" x="320" y="60" width="260" height="48"/>
  <text x="450" y="80" class="lblw">T_w  =  σ₁ σ₂ σ₁ σ₂⁻¹ σ₁ σ₂</text>
  <text x="450" y="98" class="lbl">unreduced  ∈  H₃(q)</text>

  <!-- Layer 1 (3 children): apply braid relation, Skein, Markov -->
  <line class="arr" x1="380" y1="108" x2="200" y2="170" marker-end="url(#tip)"/>
  <text x="265" y="135" class="rule">by braid</text>
  <text x="265" y="148" class="rule">σ₁σ₂σ₁ = σ₂σ₁σ₂</text>

  <line class="arr" x1="450" y1="108" x2="450" y2="170" marker-end="url(#tip)"/>
  <text x="475" y="148" class="rule">by Skein</text>

  <line class="arr" x1="520" y1="108" x2="700" y2="170" marker-end="url(#tip)"/>
  <text x="635" y="135" class="rule">by Markov</text>
  <text x="635" y="148" class="rule">σ_n^{±1}-stab</text>

  <!-- Layer 1 children -->
  <rect class="node" x="80" y="170" width="240" height="44"/>
  <text x="200" y="188" class="lblw">σ₂ σ₁ σ₂² σ₂⁻¹ σ₁ σ₂</text>
  <text x="200" y="204" class="lbl">braid-rewritten</text>

  <rect class="node" x="330" y="170" width="240" height="44"/>
  <text x="450" y="188" class="lblw">σ₁ σ₂ σ₁ + (q − q⁻¹) σ₁ σ₂</text>
  <text x="450" y="204" class="lbl">Skein-rewritten (sum)</text>

  <rect class="node" x="580" y="170" width="240" height="44"/>
  <text x="700" y="188" class="lblw">σ₁ σ₂ σ₁ σ₂⁻¹</text>
  <text x="700" y="204" class="lbl">Markov-stabilised</text>

  <!-- Layer 2: cancellations -->
  <line class="arr" x1="200" y1="214" x2="200" y2="280" marker-end="url(#tip)"/>
  <text x="225" y="252" class="rule">cancel σ₂² σ₂⁻¹ = σ₂</text>

  <line class="arr" x1="450" y1="214" x2="450" y2="280" marker-end="url(#tip)"/>
  <text x="475" y="252" class="rule">collect terms</text>

  <line class="arr" x1="700" y1="214" x2="700" y2="280" marker-end="url(#tip)"/>
  <text x="725" y="252" class="rule">apply braid</text>

  <!-- Layer 2 children -->
  <rect class="node" x="80" y="280" width="240" height="44"/>
  <text x="200" y="298" class="lblw">σ₂ σ₁ σ₂ σ₁ σ₂</text>
  <text x="200" y="314" class="lbl">simplified</text>

  <rect class="node" x="330" y="280" width="240" height="44"/>
  <text x="450" y="298" class="lblw">σ₁ σ₂ σ₁ + (q−q⁻¹) σ₁ σ₂</text>
  <text x="450" y="314" class="lbl">two-monomial polynomial</text>

  <rect class="node" x="580" y="280" width="240" height="44"/>
  <text x="700" y="298" class="lblw">σ₂ σ₁ σ₂ σ₂⁻¹  =  σ₂ σ₁</text>
  <text x="700" y="314" class="lbl">Markov reduces strand</text>

  <!-- Layer 3 (leaves) -->
  <line class="arr" x1="200" y1="324" x2="200" y2="390" marker-end="url(#tip)"/>
  <line class="arr" x1="450" y1="324" x2="450" y2="390" marker-end="url(#tip)"/>
  <line class="arr" x1="700" y1="324" x2="700" y2="390" marker-end="url(#tip)"/>

  <!-- Canonical leaf (centre, marked red) -->
  <rect class="canon" x="330" y="390" width="240" height="48"/>
  <text x="450" y="412" class="lblw">σ₁ σ₂ σ₁  +  (q−q⁻¹) σ₁ σ₂</text>
  <text x="450" y="428" class="lbl">canonical normal form</text>
  <text x="595" y="395" class="canlbl">★ chosen</text>

  <!-- Other leaves -->
  <rect class="leaf" x="80" y="390" width="240" height="48"/>
  <text x="200" y="412" class="lblw">σ₂ σ₁ σ₂ σ₁ σ₂</text>
  <text x="200" y="428" class="lbl">equivalent normal form</text>

  <rect class="leaf" x="580" y="390" width="240" height="48"/>
  <text x="700" y="412" class="lblw">σ₂ σ₁  +  ⋯</text>
  <text x="700" y="428" class="lbl">stabilisation result</text>

  <!-- Confluence note -->
  <text x="450" y="490" class="sub">all three reduction paths terminate at the same lex-smallest monomial set (Knuth–Bendix confluence)</text>
  <text x="450" y="512" class="sub">the GS engine is the algorithmic realisation of this confluence on H_n(q) for n ≤ 12</text>
  <text x="450" y="540" class="sub">canonical leaves enumerate the Wedderburn blocks and feed the LP/SDP operator selector (Ch 11 §3)</text>
  <text x="450" y="572" text-anchor="middle" font-size="13" font-style="italic" fill="#1a1a1a">root  →  rules  →  canonical normal form (boxed in red)</text>
</svg>
