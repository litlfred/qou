<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>Carbon's half-filled valence shell</title>
  <desc>
    Central carbon node with eight equally-spaced linking sites
    around it (the second-shell capacity 2·n² = 8).  Four are
    occupied by closed inner-shell trefoils (filled black);
    four are open bonding sites (empty rings).  Half-filling is
    what makes carbon uniquely versatile: maximal valence among
    period-2 elements, symmetric energy landscape, chain-forming
    capacity.
  </desc>
  <defs>
    <style>
      .bg     { fill: #ffffff; }
      .core   { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2.4; }
      .corelbl{ font-size: 32px; font-weight: 700; fill: #1a1a1a;
                text-anchor: middle; }
      .filled { fill: #1a1a1a; stroke: #1a1a1a; stroke-width: 1.4; }
      .open   { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.6;
                stroke-dasharray: 3 2; }
      .spoke  { stroke: #888; stroke-width: 1.2; }
      .lbl    { font-size: 11px; fill: #444; text-anchor: middle; }
      .lblb   { font-size: 12px; font-weight: 700;
                fill: #1a1a1a; text-anchor: middle; }
      .ttl    { font-size: 17px; font-style: italic; fill: #1a1a1a; }
      .ann    { font-size: 12px; fill: #1a1a1a; }
      .anns   { font-size: 11px; fill: #444; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="540" height="540"/>

  <text x="270" y="32" text-anchor="middle" class="ttl">Carbon's half-filled valence shell</text>

  <!-- Centre: C node -->
  <circle class="core" cx="270" cy="270" r="50"/>
  <text x="270" y="282" class="corelbl">C</text>

  <!-- 8 sites around the centre at radius 150 (45° apart) -->
  <!-- Filled: top (90°), right (0°), bottom (270°), left (180°)  → inner shell 1s² -->
  <!-- Open:   45°, 135°, 225°, 315°                              → residual bonding sites -->

  <!-- Spokes -->
  <line class="spoke" x1="270" y1="270" x2="270" y2="120"/>
  <line class="spoke" x1="270" y1="270" x2="420" y2="270"/>
  <line class="spoke" x1="270" y1="270" x2="270" y2="420"/>
  <line class="spoke" x1="270" y1="270" x2="120" y2="270"/>
  <line class="spoke" x1="270" y1="270" x2="376" y2="164"/>
  <line class="spoke" x1="270" y1="270" x2="376" y2="376"/>
  <line class="spoke" x1="270" y1="270" x2="164" y2="376"/>
  <line class="spoke" x1="270" y1="270" x2="164" y2="164"/>

  <!-- Filled sites (inner shell) -->
  <circle class="filled" cx="270" cy="120" r="14"/>
  <circle class="filled" cx="420" cy="270" r="14"/>
  <circle class="filled" cx="270" cy="420" r="14"/>
  <circle class="filled" cx="120" cy="270" r="14"/>

  <!-- Open sites (bonding) -->
  <circle class="open" cx="376" cy="164" r="14"/>
  <circle class="open" cx="376" cy="376" r="14"/>
  <circle class="open" cx="164" cy="376" r="14"/>
  <circle class="open" cx="164" cy="164" r="14"/>

  <!-- Legend / annotations -->
  <g transform="translate(40, 480)">
    <circle class="filled" cx="0" cy="0" r="9"/>
    <text x="16" y="4" class="ann">closed 1s²  (4 sites — inner shell)</text>
  </g>
  <g transform="translate(290, 480)">
    <circle class="open" cx="0" cy="0" r="9"/>
    <text x="16" y="4" class="ann">open R  (4 sites — bonding)</text>
  </g>

  <!-- Top-right note -->
  <text x="510" y="62" text-anchor="end" class="ann">|R| / 2n² = 4/8 = ½</text>
  <text x="510" y="80" text-anchor="end" class="anns">half-filled  ⇒  maximal valence</text>
  <text x="510" y="96" text-anchor="end" class="anns">symmetric energy landscape</text>
  <text x="510" y="112" text-anchor="end" class="anns">unique chain-forming capacity</text>
</svg>
