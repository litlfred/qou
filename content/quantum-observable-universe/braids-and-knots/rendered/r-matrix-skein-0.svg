<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>The Hecke skein triple</title>
  <desc>
    Three local strand diagrams: the positive crossing sigma_i, its
    inverse sigma_i^{-1}, and the identity (two parallel strands).
    The Hecke defining relation and braid relation are typeset in the
    surrounding prose, not inside this figure.
  </desc>

  <defs>
    <!-- arrow tip used to mark the time-direction of each strand -->
    <marker id="tip" viewBox="0 0 8 8" refX="6" refY="4"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .strand { fill: none; stroke: #1a1a1a; stroke-width: 3.4;
                stroke-linecap: round; }
      .frame  { fill: none; stroke: #b8b8b8; stroke-width: 1;
                stroke-dasharray: 4 3; }
      .lbl    { font-size: 28px; fill: #1a1a1a; font-style: italic; }
      .sub    { font-size: 18px; fill: #1a1a1a; font-style: italic;
                baseline-shift: -28%; }
      .sup    { font-size: 18px; fill: #1a1a1a; font-style: italic;
                baseline-shift: 45%; }
      .one    { font-size: 28px; fill: #1a1a1a; font-style: normal; }
      .ttl    { font-size: 18px; fill: #1a1a1a; font-style: italic; }
    </style>
  </defs>

  <!-- Solid white background so the figure renders readably under both
       light- and dark-mode page backgrounds (GitHub dark, viewer dark
       theme, terminal preview, etc.).  The strokes are dark; a white
       card behind them keeps the picture legible everywhere. -->
  <rect x="0" y="0" width="720" height="280" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" class="ttl">The Hecke skein triple</text>

  <!-- ===========================
       Panel 1:  σ_i  (positive crossing, L_+)
       Centre (140, 140);  half-size 55;  gap half-width 11.
       Over-strand (positive slope): from (85,195) to (195,85).
       Under-strand: from (85,85) to (195,195) with gap at (140,140).
       =========================== -->
  <rect x="80" y="80" width="120" height="120" rx="8" class="frame"/>

  <!-- under-strand (broken at the centre) -->
  <line x1="85"   y1="85"  x2="132.2" y2="132.2" class="strand"/>
  <line x1="147.8" y1="147.8" x2="195" y2="195" class="strand" marker-end="url(#tip)"/>

  <!-- over-strand (continuous), drawn second so it sits on top -->
  <line x1="85" y1="195" x2="195" y2="85" class="strand"/>

  <!-- label sigma_i -->
  <text x="140" y="232" text-anchor="middle" class="lbl">
    &#963;<tspan class="sub">i</tspan>
  </text>

  <!-- ===========================
       Panel 2:  σ_i^{-1}  (negative crossing, L_-)
       Centre (360, 140).
       =========================== -->
  <rect x="300" y="80" width="120" height="120" rx="8" class="frame"/>

  <!-- under-strand (broken at the centre) -->
  <line x1="305"   y1="195" x2="352.2" y2="147.8" class="strand"/>
  <line x1="367.8" y1="132.2" x2="415" y2="85" class="strand" marker-end="url(#tip)"/>

  <!-- over-strand (continuous) -->
  <line x1="305" y1="85" x2="415" y2="195" class="strand"/>

  <!-- label sigma_i^{-1}; spaces between glyphs are explicit so the
       sub/sup do not touch the sigma -->
  <text x="360" y="232" text-anchor="middle" class="lbl">
    &#963;<tspan class="sub">i</tspan><tspan class="sup">&#8722;1</tspan>
  </text>

  <!-- ===========================
       Panel 3:  1  (identity, two parallel strands)
       Centre (580, 140).
       =========================== -->
  <rect x="520" y="80" width="120" height="120" rx="8" class="frame"/>

  <line x1="555" y1="85" x2="555" y2="195" class="strand" marker-end="url(#tip)"/>
  <line x1="605" y1="85" x2="605" y2="195" class="strand" marker-end="url(#tip)"/>

  <text x="580" y="232" text-anchor="middle" class="one">1</text>

  <!-- ===========================
       Footer note:  arrows show the strand orientation (top-to-bottom).
       =========================== -->
  <text x="360" y="265" text-anchor="middle"
        font-size="13" font-style="italic" fill="#666">
    arrows mark the strand orientation (time flows downward)
  </text>
</svg>
