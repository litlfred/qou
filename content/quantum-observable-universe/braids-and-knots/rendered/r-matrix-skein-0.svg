<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380"
     font-family="'CMU Serif','Latin Modern Roman','Times New Roman',Georgia,serif">
  <title>The Hecke skein triple</title>
  <desc>
    Three local pictures: a positive crossing (sigma_i), a negative
    crossing (sigma_i^{-1}), and the identity (two parallel strands),
    together with the Skein relation that defines the Iwahori-Hecke
    algebra H_n(q) as a quotient of the braid-group algebra of B_n.
  </desc>

  <defs>
    <style>
      .strand { fill: none; stroke: #1a1a1a; stroke-width: 3.2; stroke-linecap: round; }
      .panel  { fill: none; stroke: #c8c8c8; stroke-width: 1; stroke-dasharray: 4 3; }
      .lbl    { font-size: 22px; fill: #1a1a1a; }
      .eqn    { font-size: 24px; fill: #1a1a1a; }
      .ttl    { font-size: 18px; fill: #1a1a1a; font-style: italic; }
      .note   { font-size: 13px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" class="ttl">The Hecke skein triple</text>

  <!-- =========================== -->
  <!-- Panel 1:  sigma_i  (L_+)    -->
  <!-- =========================== -->
  <!-- faint reference panel -->
  <rect x="80" y="100" width="120" height="120" rx="6" class="panel"/>

  <!-- over-strand: bottom-left to top-right (positive slope) -->
  <line x1="85" y1="215" x2="195" y2="105" class="strand"/>

  <!-- under-strand: top-left to bottom-right, with a gap at the centre (140,160) -->
  <line x1="85"  y1="105" x2="131.5" y2="151.5" class="strand"/>
  <line x1="148.5" y1="168.5" x2="195" y2="215" class="strand"/>

  <!-- label sigma_i -->
  <text x="140" y="252" text-anchor="middle" class="lbl">
    <tspan>&#963;</tspan><tspan font-size="14" dy="6">i</tspan>
  </text>
  <text x="140" y="276" text-anchor="middle" class="note">positive crossing  L<tspan dy="-4" font-size="11">+</tspan></text>

  <!-- =========================== -->
  <!-- Panel 2:  sigma_i^{-1}  (L_-) -->
  <!-- =========================== -->
  <rect x="300" y="100" width="120" height="120" rx="6" class="panel"/>

  <!-- over-strand: top-left to bottom-right (negative slope) -->
  <line x1="305" y1="105" x2="415" y2="215" class="strand"/>

  <!-- under-strand: bottom-left to top-right, with gap at (360,160) -->
  <line x1="305" y1="215" x2="351.5" y2="168.5" class="strand"/>
  <line x1="368.5" y1="151.5" x2="415" y2="105" class="strand"/>

  <!-- label sigma_i^{-1} -->
  <text x="360" y="252" text-anchor="middle" class="lbl">
    <tspan>&#963;</tspan><tspan font-size="14" dy="6">i</tspan><tspan font-size="14" dy="-12">&#8722;1</tspan>
  </text>
  <text x="360" y="276" text-anchor="middle" class="note">negative crossing  L<tspan dy="-4" font-size="11">&#8722;</tspan></text>

  <!-- =========================== -->
  <!-- Panel 3:  1  (identity / smoothing) -->
  <!-- =========================== -->
  <rect x="520" y="100" width="120" height="120" rx="6" class="panel"/>

  <line x1="555" y1="105" x2="555" y2="215" class="strand"/>
  <line x1="605" y1="105" x2="605" y2="215" class="strand"/>

  <!-- label 1 -->
  <text x="580" y="252" text-anchor="middle" class="lbl">1</text>
  <text x="580" y="276" text-anchor="middle" class="note">identity (no crossing)  L<tspan dy="-4" font-size="11">0</tspan></text>

  <!-- =========================== -->
  <!-- Skein relation row          -->
  <!-- =========================== -->
  <text x="360" y="320" text-anchor="middle" class="eqn">
    <tspan>&#963;</tspan><tspan font-size="15" dy="6">i</tspan><tspan font-size="15" dy="-6"></tspan>
    <tspan dx="6">&#8722;</tspan>
    <tspan dx="6">&#963;</tspan><tspan font-size="15" dy="6">i</tspan><tspan font-size="15" dy="-12">&#8722;1</tspan><tspan font-size="15" dy="6"></tspan>
    <tspan dx="6">=</tspan>
    <tspan dx="6">(</tspan>q<tspan dx="2">&#8722;</tspan><tspan dx="2">q</tspan><tspan font-size="15" dy="-6">&#8722;1</tspan><tspan font-size="15" dy="6"></tspan><tspan>)</tspan>
    <tspan dx="6">&#183;</tspan>
    <tspan dx="6">1</tspan>
  </text>

  <!-- braid-relation footnote -->
  <text x="360" y="358" text-anchor="middle" class="note">
    with the braid relation  &#963;<tspan font-size="11" dy="3">i</tspan><tspan dy="-3"> </tspan>&#963;<tspan font-size="11" dy="3">i+1</tspan><tspan dy="-3"> </tspan>&#963;<tspan font-size="11" dy="3">i</tspan><tspan dy="-3"> = </tspan>&#963;<tspan font-size="11" dy="3">i+1</tspan><tspan dy="-3"> </tspan>&#963;<tspan font-size="11" dy="3">i</tspan><tspan dy="-3"> </tspan>&#963;<tspan font-size="11" dy="3">i+1</tspan><tspan dy="-3"> </tspan> (Yang&#8211;Baxter / 3rd Reidemeister move).
  </text>
</svg>
