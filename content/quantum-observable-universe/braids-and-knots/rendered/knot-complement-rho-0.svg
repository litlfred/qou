<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>Knot-complement representation ρ → PSL(2, ℂ)</title>
  <desc>
    Trefoil knot drawn lightly with a meridian disk highlighted;
    arrow labelled ρ points to a Möbius transformation glyph
    (small Riemann sphere with a fixed-point arc).  Caption:
    "each meridian generator ↦ Möbius transformation".
  </desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .bg     { fill: #ffffff; }
      .knot   { fill: none; stroke: #1a1a1a; stroke-width: 2.4; }
      .merid  { fill: none; stroke: #c0392b; stroke-width: 2; stroke-dasharray: 4 3; }
      .meridlbl { fill: #c0392b; font-size: 13px; font-style: italic; }
      .sphere { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1.6; }
      .arc    { fill: none; stroke: #2980b9; stroke-width: 1.8; }
      .arclbl { fill: #2980b9; font-size: 12px; font-style: italic; }
      .lbl    { font-size: 13px; fill: #1a1a1a; }
      .lbls   { font-size: 11px; fill: #444; }
      .ttl    { font-size: 17px; font-style: italic; fill: #1a1a1a; }
      .arrlbl { font-size: 16px; font-weight: 700; fill: #1a1a1a; font-style: italic; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="800" height="440"/>

  <text x="400" y="32" text-anchor="middle" class="ttl">π₁(ℙ¹(ℂ) \ K)  →  PSL(2, ℂ)   via  ρ</text>

  <!-- Left: trefoil with meridian disk -->
  <g transform="translate(180, 220)">
    <circle class="knot" cx="0"   cy="-32" r="60"/>
    <circle class="knot" cx="28"  cy="16"  r="60"/>
    <circle class="knot" cx="-28" cy="16"  r="60"/>
    <!-- meridian disk: dashed circle around one strand -->
    <circle class="merid" cx="60" cy="0" r="22"/>
    <text x="92" y="0" class="meridlbl">meridian</text>
    <text x="92" y="16" class="meridlbl">disk</text>
  </g>
  <text x="180" y="350" text-anchor="middle" class="lbl">trefoil knot K  ⊂  ℙ¹(ℂ)</text>
  <text x="180" y="368" text-anchor="middle" class="lbls">π₁ of complement generated by meridians</text>

  <!-- Arrow ρ -->
  <line stroke="#1a1a1a" stroke-width="1.6" fill="none" x1="320" y1="220" x2="500" y2="220" marker-end="url(#tip)"/>
  <text x="410" y="208" text-anchor="middle" class="arrlbl">ρ</text>
  <text x="410" y="245" text-anchor="middle" class="lbls">representation</text>

  <!-- Right: Riemann sphere with fixed-point arc -->
  <g transform="translate(620, 220)">
    <ellipse class="sphere" cx="0" cy="0" rx="90" ry="80"/>
    <ellipse class="sphere" cx="0" cy="0" rx="90" ry="20" fill="none"/>
    <!-- fixed-point arc: oriented loop on the sphere -->
    <path class="arc" d="M -50 -40 C -20 -60, 20 -60, 50 -40 C 60 -20, 60 20, 50 40 C 20 60, -20 60, -50 40 C -60 20, -60 -20, -50 -40 Z"/>
    <text x="0" y="-100" text-anchor="middle" class="arclbl">Möbius transformation</text>
    <text x="0" y="100"  text-anchor="middle" class="arclbl">on  ℙ¹(ℂ)</text>
  </g>

  <text x="400" y="395" text-anchor="middle" class="lbls" font-style="italic">each meridian generator ↦ Möbius transformation;  ρ image  determines  geometric structure of K's complement</text>
</svg>
