<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>The particle ↔ knot dictionary</title>
  <desc>
    A 2-row grid relating knot types to particle identities in the
    QOU framework.  Top row: charged leptons mapped to torus knots
    T(2, 2k+1) — unknot 0_1 → ν_e, trefoil 3_1 → e⁻, cinquefoil
    5_1 = T(2,5) → μ⁻, septafoil 7_1 = T(2,7) → τ⁻, with a closure
    "…" cell.  Bottom row: hadrons — three Borromean rings
    (u/d/s) on the exceptional divisor as the quark generator
    family, plus the closed 3-strand braid representations of the
    proton 𝔭 and neutron 𝔫.
  </desc>
  <defs>
    <style>
      .bg     { fill: #ffffff; }
      .card   { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.4; rx: 8; }
      .strand { fill: none; stroke: #1a1a1a; stroke-width: 2.4;
                stroke-linecap: round; }
      .red    { fill: none; stroke: #c0392b; stroke-width: 2.4; }
      .grn    { fill: none; stroke: #27ae60; stroke-width: 2.4; }
      .blu    { fill: none; stroke: #2980b9; stroke-width: 2.4; }
      .lblb   { font-size: 17px; font-weight: 700; fill: #1a1a1a;
                text-anchor: middle; }
      .lbl    { font-size: 13px; fill: #1a1a1a; text-anchor: middle; }
      .lbls   { font-size: 11px; fill: #444; text-anchor: middle; }
      .ttl    { font-size: 18px; font-style: italic; fill: #1a1a1a; }
      .row    { font-size: 13px; font-style: italic; fill: #666; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="760"/>

  <text x="600" y="30" text-anchor="middle" class="ttl">The particle ↔ knot dictionary</text>

  <!-- ===================== ROW 1: LEPTONS ===================== -->
  <text x="40" y="60" class="row">Charged leptons  ⇄  torus knots T(2, 2k+1)</text>

  <!-- Card layout: 5 cards at x = 40, 270, 500, 730, 960 (width 220, height 230) -->
  <!-- Card 1: neutrino — unknot 0_1 (a circle) -->
  <rect class="card" x="40" y="80" width="220" height="230"/>
  <circle class="strand" cx="150" cy="170" r="55"/>
  <text x="150" y="245" class="lblb">ν_e</text>
  <text x="150" y="265" class="lbl">unknot  0₁</text>
  <text x="150" y="290" class="lbls">trivial braiding · massless</text>

  <!-- Card 2: electron — trefoil 3_1 (three overlapping circles, symmetric) -->
  <rect class="card" x="270" y="80" width="220" height="230"/>
  <g transform="translate(380, 175)">
    <!-- Stylised trefoil: three overlapping circles meeting at angles 0°, 120°, 240° -->
    <circle class="strand" cx="0"   cy="-22" r="40"/>
    <circle class="strand" cx="19"  cy="11"  r="40"/>
    <circle class="strand" cx="-19" cy="11"  r="40"/>
  </g>
  <text x="380" y="245" class="lblb">e⁻</text>
  <text x="380" y="265" class="lbl">trefoil  3₁  =  T(2,3)</text>
  <text x="380" y="290" class="lbls">simplest non-trivial knot</text>

  <!-- Card 3: muon — cinquefoil 5_1 (five-petal star) -->
  <rect class="card" x="500" y="80" width="220" height="230"/>
  <g transform="translate(610, 175)">
    <!-- Five-petal rose, drawn as a {5/2} pentagram outline -->
    <polygon class="strand" points="0,-58 14,-18 55,-18 22,7 35,46 0,22 -35,46 -22,7 -55,-18 -14,-18" />
  </g>
  <text x="610" y="245" class="lblb">μ⁻</text>
  <text x="610" y="265" class="lbl">cinquefoil  5₁  =  T(2,5)</text>
  <text x="610" y="290" class="lbls">brane-tower level 2</text>

  <!-- Card 4: tau — T(2,7) seven-pointed star -->
  <rect class="card" x="730" y="80" width="220" height="230"/>
  <g transform="translate(840, 175)">
    <!-- Seven-pointed star — coordinates approximate -->
    <polygon class="strand" points="0,-58 13,-22 51,-26 28,3 51,33 13,22 0,58 -13,22 -51,33 -28,3 -51,-26 -13,-22" />
  </g>
  <text x="840" y="245" class="lblb">τ⁻</text>
  <text x="840" y="265" class="lbl">T(2,7)  =  7₁</text>
  <text x="840" y="290" class="lbls">brane-tower level 3</text>

  <!-- Card 5: ellipsis — closure -->
  <rect class="card" x="960" y="80" width="220" height="230"/>
  <text x="1070" y="180" text-anchor="middle" font-size="42" fill="#888">⋯</text>
  <text x="1070" y="220" class="lbl">T(2, 2k+1)</text>
  <text x="1070" y="245" class="lblb">heavier leptons</text>
  <text x="1070" y="265" class="lbl">extending the tower</text>
  <text x="1070" y="290" class="lbls">if any exist beyond τ</text>

  <!-- ===================== ROW 2: QUARKS / HADRONS ===================== -->
  <text x="40" y="370" class="row">Quarks / hadrons  ⇄  Borromean braids on the exceptional divisor</text>

  <!-- Card A: Borromean quarks (3 interlocked circles, RGB colours) -->
  <rect class="card" x="40" y="390" width="380" height="320"/>
  <g transform="translate(230, 540)">
    <!-- Three Borromean rings centred at (0,-26), (-29,18), (29,18) -->
    <circle class="red" cx="0"   cy="-30" r="58"/>
    <circle class="grn" cx="-32" cy="20"  r="58"/>
    <circle class="blu" cx="32"  cy="20"  r="58"/>
  </g>
  <text x="230" y="650" class="lblb">u  ·  d  ·  (s)</text>
  <text x="230" y="672" class="lbl">Borromean triple — colour-confined</text>
  <text x="230" y="694" class="lbls">remove any one and the other two fall apart</text>

  <!-- Card B: proton 𝔭 — closed 3-braid σ₁ σ₂⁻¹ σ₁ -->
  <rect class="card" x="440" y="390" width="320" height="320"/>
  <g transform="translate(600, 540)">
    <!-- 3 vertical strands with crossings; arc closures top and bottom -->
    <path class="strand" d="M -50 -110 V -65"/>
    <path class="strand" d="M 0   -110 V -65"/>
    <path class="strand" d="M 50  -110 V -65"/>
    <!-- Crossing 1: σ₁ (between strands 1 and 2) -->
    <path class="strand" d="M -50 -65 L 0 -25"/>
    <path class="strand" d="M 0 -65 L -38 -42"/>
    <path class="strand" d="M -12 -48 L -50 -25"/>
    <path class="strand" d="M 50 -65 V -25"/>
    <!-- Crossing 2: σ₂⁻¹ (strands 2,3) -->
    <path class="strand" d="M -50 -25 V 15"/>
    <path class="strand" d="M 0 -25 L 50 15"/>
    <path class="strand" d="M 50 -25 L 12 -2"/>
    <path class="strand" d="M -12 8 L 0 15"/>
    <!-- Crossing 3: σ₁ -->
    <path class="strand" d="M -50 15 L 0 55"/>
    <path class="strand" d="M 0 15 L -38 38"/>
    <path class="strand" d="M -12 32 L -50 55"/>
    <path class="strand" d="M 50 15 V 55"/>
    <!-- Closures top + bottom (semicircles) -->
    <path class="strand" d="M -50 -110 A 25 25 0 0 1 0 -110"/>
    <path class="strand" d="M 0 -110 A 25 25 0 0 1 50 -110"/>
    <path class="strand" d="M -50 55 V 90 A 25 25 0 0 0 0 90 V 55"/>
    <path class="strand" d="M 0 90 A 25 25 0 0 0 50 90 V 55"/>
  </g>
  <text x="600" y="650" class="lblb">𝔭   (proton)</text>
  <text x="600" y="672" class="lbl">closed 3-braid  σ₁ σ₂⁻¹ σ₁</text>
  <text x="600" y="694" class="lbls">valence 3 baryon · uud quark content</text>

  <!-- Card C: neutron 𝔫 — closed 3-braid σ₁⁻¹ σ₂ σ₁⁻¹ (visually similar; here a smaller schematic) -->
  <rect class="card" x="780" y="390" width="380" height="320"/>
  <g transform="translate(960, 540)">
    <!-- Schematic: a labelled box (we don't redraw the full braid; reference the sigma word) -->
    <text x="0" y="-70" text-anchor="middle" font-size="38" fill="#1a1a1a" font-style="italic">𝔫</text>
    <text x="0" y="-10" text-anchor="middle" font-size="16" fill="#1a1a1a">closed 3-braid</text>
    <text x="0" y="20" text-anchor="middle" font-size="16" fill="#1a1a1a" font-style="italic">σ₁⁻¹ σ₂ σ₁⁻¹</text>
    <text x="0" y="60" text-anchor="middle" font-size="12" fill="#444">(mirror image of σ₁ σ₂⁻¹ σ₁)</text>
  </g>
  <text x="960" y="650" class="lblb">𝔫   (neutron)</text>
  <text x="960" y="672" class="lbl">closed 3-braid  σ₁⁻¹ σ₂ σ₁⁻¹</text>
  <text x="960" y="694" class="lbls">valence 3 baryon · udd quark content</text>

  <!-- Footer -->
  <text x="600" y="745" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
    icons are schematic; in QOU the full datum is the Hecke word in H_n(q) up to Markov equivalence
  </text>
</svg>
