<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>Nuclear shell closure as Hecke eigenvalue gap</title>
  <desc>
    Bar chart with Z values 1..130 on horizontal axis, Hecke
    eigenvalue gap on vertical.  Magic-number columns (Z = 2, 8,
    20, 28, 50, 82, 126) shaded red — the prediction is that
    gaps spike at exactly these values.
  </desc>
  <defs>
    <style>
      .bg     { fill: #ffffff; }
      .axis   { stroke: #1a1a1a; stroke-width: 1.4; fill: none; }
      .bar    { fill: #888; stroke: none; }
      .magic  { fill: #c0392b; stroke: #1a1a1a; stroke-width: 0.8; }
      .ticklbl{ font-size: 10px; fill: #444; text-anchor: middle; }
      .axislbl{ font-size: 13px; fill: #1a1a1a; font-style: italic; }
      .magiclbl{ fill: #c0392b; font-size: 11px; font-weight: 700;
                 text-anchor: middle; }
      .ttl    { font-size: 17px; font-style: italic; fill: #1a1a1a; }
      .lbl    { font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="460"/>

  <text x="500" y="32" text-anchor="middle" class="ttl">Nuclear shell closure  =  Hecke eigenvalue gap at magic numbers</text>

  <line class="axis" x1="60" y1="380" x2="940" y2="380"/>
  <line class="axis" x1="60" y1="380" x2="60"  y2="80"/>
  <text x="940" y="395" class="axislbl">Z  (proton number)</text>
  <text x="50"  y="80"  class="axislbl">Δ (Hecke gap)</text>

  <!-- Plot bars at every Z=1..130; magic numbers Z = 2, 8, 20, 28, 50, 82, 126
       Map Z=1..130 to x = 60..940 → x = 60 + Z * (880/130) ≈ 60 + Z * 6.77 -->
  <!-- Generate ~130 bars; for brevity, render every bar small except magic ones -->
  <!-- We use a script-style emission via repeated patterns -->
  <g>
    <!-- Z=1..130: small bars -->
    <!-- Heights: small ~6, magic ~80-160 -->
    <!-- We list specific magics and a few non-magics -->

    <!-- Non-magic small bars: render every Z as a 4-px-wide bar of small height -->
    <!-- Just sample some to avoid 130 nodes -->
    <rect class="bar" x="64"  y="370" width="3" height="10"/>
    <rect class="bar" x="78"  y="368" width="3" height="12"/>
    <rect class="bar" x="91"  y="367" width="3" height="13"/>
    <rect class="bar" x="105" y="368" width="3" height="12"/>
    <rect class="bar" x="118" y="370" width="3" height="10"/>
    <rect class="bar" x="132" y="372" width="3" height="8"/>
    <rect class="bar" x="159" y="370" width="3" height="10"/>
    <rect class="bar" x="172" y="368" width="3" height="12"/>
    <rect class="bar" x="186" y="365" width="3" height="15"/>
    <rect class="bar" x="200" y="365" width="3" height="15"/>
    <rect class="bar" x="213" y="367" width="3" height="13"/>
    <rect class="bar" x="227" y="370" width="3" height="10"/>
    <rect class="bar" x="240" y="372" width="3" height="8"/>
    <rect class="bar" x="254" y="372" width="3" height="8"/>
    <rect class="bar" x="267" y="372" width="3" height="8"/>
    <rect class="bar" x="294" y="368" width="3" height="12"/>
    <rect class="bar" x="308" y="370" width="3" height="10"/>
    <rect class="bar" x="321" y="368" width="3" height="12"/>
    <rect class="bar" x="335" y="365" width="3" height="15"/>
    <rect class="bar" x="348" y="368" width="3" height="12"/>
    <rect class="bar" x="362" y="370" width="3" height="10"/>
    <rect class="bar" x="376" y="370" width="3" height="10"/>
    <rect class="bar" x="402" y="370" width="3" height="10"/>
    <rect class="bar" x="416" y="368" width="3" height="12"/>
    <rect class="bar" x="430" y="365" width="3" height="15"/>
    <rect class="bar" x="443" y="368" width="3" height="12"/>
    <rect class="bar" x="470" y="370" width="3" height="10"/>
    <rect class="bar" x="484" y="372" width="3" height="8"/>
    <rect class="bar" x="497" y="370" width="3" height="10"/>
    <rect class="bar" x="511" y="368" width="3" height="12"/>
    <rect class="bar" x="524" y="370" width="3" height="10"/>
    <rect class="bar" x="538" y="372" width="3" height="8"/>
    <rect class="bar" x="551" y="372" width="3" height="8"/>
    <rect class="bar" x="565" y="370" width="3" height="10"/>
    <rect class="bar" x="592" y="370" width="3" height="10"/>
    <rect class="bar" x="606" y="368" width="3" height="12"/>
    <rect class="bar" x="619" y="367" width="3" height="13"/>
    <rect class="bar" x="633" y="368" width="3" height="12"/>
    <rect class="bar" x="646" y="370" width="3" height="10"/>
    <rect class="bar" x="660" y="372" width="3" height="8"/>
    <rect class="bar" x="674" y="372" width="3" height="8"/>
    <rect class="bar" x="687" y="370" width="3" height="10"/>
    <rect class="bar" x="701" y="368" width="3" height="12"/>
    <rect class="bar" x="714" y="367" width="3" height="13"/>
    <rect class="bar" x="728" y="368" width="3" height="12"/>
    <rect class="bar" x="741" y="370" width="3" height="10"/>
    <rect class="bar" x="755" y="372" width="3" height="8"/>
    <rect class="bar" x="769" y="370" width="3" height="10"/>
    <rect class="bar" x="782" y="368" width="3" height="12"/>
    <rect class="bar" x="809" y="370" width="3" height="10"/>
    <rect class="bar" x="823" y="368" width="3" height="12"/>
    <rect class="bar" x="836" y="367" width="3" height="13"/>
    <rect class="bar" x="850" y="368" width="3" height="12"/>
    <rect class="bar" x="863" y="370" width="3" height="10"/>
    <rect class="bar" x="877" y="372" width="3" height="8"/>
    <rect class="bar" x="891" y="370" width="3" height="10"/>
    <rect class="bar" x="904" y="368" width="3" height="12"/>
    <rect class="bar" x="918" y="367" width="3" height="13"/>
    <rect class="bar" x="932" y="370" width="3" height="10"/>

    <!-- Magic-number bars (taller, red).  Z = 2, 8, 20, 28, 50, 82, 126 -->
    <!-- Heights chosen to match shell-closure scale -->
    <!-- Z=2 → x = 60 + 2*6.77 ≈ 73 -->
    <rect class="magic" x="71"  y="280" width="6" height="100"/>
    <text x="74"  y="270" class="magiclbl">2</text>

    <!-- Z=8 → x = 60 + 8*6.77 ≈ 114 -->
    <rect class="magic" x="112" y="240" width="6" height="140"/>
    <text x="115" y="230" class="magiclbl">8</text>

    <!-- Z=20 → x = 60 + 20*6.77 ≈ 195 -->
    <rect class="magic" x="193" y="200" width="6" height="180"/>
    <text x="196" y="190" class="magiclbl">20</text>

    <!-- Z=28 → x = 60 + 28*6.77 ≈ 250 -->
    <rect class="magic" x="248" y="220" width="6" height="160"/>
    <text x="251" y="210" class="magiclbl">28</text>

    <!-- Z=50 → x = 60 + 50*6.77 ≈ 399 -->
    <rect class="magic" x="397" y="180" width="6" height="200"/>
    <text x="400" y="170" class="magiclbl">50</text>

    <!-- Z=82 → x = 60 + 82*6.77 ≈ 615 -->
    <rect class="magic" x="613" y="140" width="6" height="240"/>
    <text x="616" y="130" class="magiclbl">82</text>

    <!-- Z=126 → x = 60 + 126*6.77 ≈ 913 -->
    <rect class="magic" x="911" y="160" width="6" height="220"/>
    <text x="914" y="150" class="magiclbl">126</text>
  </g>

  <!-- X tick marks -->
  <g class="ticklbl">
    <text x="60"  y="395">0</text>
    <text x="195" y="395">20</text>
    <text x="330" y="395">40</text>
    <text x="466" y="395">60</text>
    <text x="601" y="395">80</text>
    <text x="736" y="395">100</text>
    <text x="871" y="395">120</text>
  </g>

  <text x="500" y="430" text-anchor="middle" class="lbl" font-style="italic">red bars: predicted Hecke-spectrum gap at Z = 2, 8, 20, 28, 50, 82, 126 — the seven nuclear magic numbers</text>
</svg>
