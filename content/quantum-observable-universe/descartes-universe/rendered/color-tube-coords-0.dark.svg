<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>Colour-tube coordinates on Bring's surface (dark mode)</title>
  <desc>
    Bring's coral with arrows labelling the shifted Lagrange
    resolvents.  The three colour-tube coordinates c_r = w₂ − z,
    c_g = w₃ − z, c_b = w₄ − z point outward from the centres of
    the red, green, blue tubes respectively.  The time-like
    coordinate σ = w₁ − z points outward from the black tube.  A
    small box at the corner identifies the spacetime ratio
    z = x₀/x₁ ∈ ℙ¹(ℂ).
  </desc>
  <defs>
    <marker id="tip-r" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="tip-g" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
    <marker id="tip-b" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/>
    </marker>
    <marker id="tip-k" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6ea"/>
    </marker>
    <style>
      .bg     { fill: #0e0e12; }
      .body   { fill: #16161c; stroke: #e6e6ea; stroke-width: 2; }
      .tube_r { fill: none; stroke: #c0392b; stroke-width: 5; stroke-linecap: round; }
      .tube_g { fill: none; stroke: #27ae60; stroke-width: 5; stroke-linecap: round; }
      .tube_b { fill: none; stroke: #2980b9; stroke-width: 5; stroke-linecap: round; }
      .tube_k { fill: none; stroke: #e6e6ea; stroke-width: 5; stroke-linecap: round; }
      .hole   { fill: #0e0e12; stroke: #e6e6ea; stroke-width: 1.4; }
      .arr_r  { stroke: #c0392b; stroke-width: 1.6; fill: none; }
      .arr_g  { stroke: #27ae60; stroke-width: 1.6; fill: none; }
      .arr_b  { stroke: #2980b9; stroke-width: 1.6; fill: none; }
      .arr_k  { stroke: #e6e6ea; stroke-width: 1.6; fill: none; }
      .lblr   { fill: #c0392b; font-size: 13px; font-weight: 700; }
      .lblg   { fill: #27ae60; font-size: 13px; font-weight: 700; }
      .lblb   { fill: #2980b9; font-size: 13px; font-weight: 700; }
      .lblk   { fill: #e6e6ea; font-size: 13px; font-weight: 700; }
      .ttl    { font-size: 17px; font-style: italic; fill: #e6e6ea; }
      .zbox   { fill: #0e0e12; stroke: #e6e6ea; stroke-width: 1.2; rx: 4; }
      .zlbl   { font-size: 12px; fill: #e6e6ea; text-anchor: middle; }
      .sub    { font-size: 11px; fill: #aaa; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="520"/>

  <text x="380" y="32" text-anchor="middle" class="ttl">Colour-tube coordinates  c_r, c_g, c_b  on Σ₄</text>

  <!-- Coral body -->
  <ellipse class="body" cx="380" cy="340" rx="320" ry="55"/>

  <!-- Handles + holes (same as F5.1 but tighter) -->
  <path class="tube_r" d="M 100 340 C 100 200, 200 200, 200 340"/>
  <ellipse class="hole" cx="150" cy="335" rx="42" ry="9"/>
  <path class="tube_g" d="M 240 340 C 240 180, 340 180, 340 340"/>
  <ellipse class="hole" cx="290" cy="335" rx="42" ry="9"/>
  <path class="tube_b" d="M 380 340 C 380 180, 480 180, 480 340"/>
  <ellipse class="hole" cx="430" cy="335" rx="42" ry="9"/>
  <path class="tube_k" d="M 520 340 C 520 200, 620 200, 620 340"/>
  <ellipse class="hole" cx="570" cy="335" rx="42" ry="9"/>

  <!-- Coordinate arrows pointing outward + above each handle -->
  <line class="arr_r" x1="150" y1="200" x2="150" y2="125" marker-end="url(#tip-r)"/>
  <text x="155" y="118" class="lblr">c_r = w₂ − z</text>

  <line class="arr_g" x1="290" y1="180" x2="290" y2="105" marker-end="url(#tip-g)"/>
  <text x="295" y="98"  class="lblg">c_g = w₃ − z</text>

  <line class="arr_b" x1="430" y1="180" x2="430" y2="105" marker-end="url(#tip-b)"/>
  <text x="435" y="98"  class="lblb">c_b = w₄ − z</text>

  <line class="arr_k" x1="570" y1="200" x2="570" y2="125" marker-end="url(#tip-k)"/>
  <text x="575" y="118" class="lblk">σ  = w₁ − z   (time)</text>

  <!-- z box at upper-left corner -->
  <rect class="zbox" x="20" y="55" width="170" height="50"/>
  <text x="105" y="78" class="zlbl">spacetime ratio</text>
  <text x="105" y="96" class="zlbl" font-style="italic">z = x₀ / x₁  ∈  ℙ¹(ℂ)</text>

  <!-- Color vector cell at upper-right -->
  <rect class="zbox" x="570" y="55" width="170" height="50"/>
  <text x="655" y="78" class="zlbl">colour vector</text>
  <text x="655" y="96" class="zlbl" font-style="italic">c = (c_r, c_g, c_b)</text>

  <!-- Subnote -->
  <text x="380" y="445" class="sub">w_k are the Lagrange resolvents of Bring's surface (Rmk lagrange-resolvents)</text>
  <text x="380" y="465" class="sub">colour-tube coords measure outgoing distance from the brane along each tube</text>
  <text x="380" y="495" class="sub">c_r + c_g + c_b + σ = (w₁ + w₂ + w₃ + w₄) − 4z = − 4z   (Newton power-sum relation)</text>
</svg>
