<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>Beta-decay channel as a Markov-move tower</title>
  <desc>
    A vertical chain.  Top: parent nucleus knot.  Middle: emit
    W⁻ box-braid (a Markov stabilisation).  Bottom: daughter
    knot + electron trefoil + neutrino unknot.  Each arrow
    labelled with σ_n^{±1}.
  </desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .bg     { fill: #ffffff; }
      .strand { fill: none; stroke: #1a1a1a; stroke-width: 2.4; }
      .box    { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.6; rx: 8; }
      .lblb   { font-size: 16px; font-weight: 700; fill: #1a1a1a;
                text-anchor: middle; }
      .lbl    { font-size: 13px; fill: #1a1a1a; text-anchor: middle; }
      .ttl    { font-size: 17px; font-style: italic; fill: #1a1a1a; }
      .arrlbl { font-size: 13px; fill: #c0392b; font-style: italic; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="800" height="580"/>

  <text x="400" y="32" text-anchor="middle" class="ttl">β-decay  =  Markov-stabilisation chain</text>

  <!-- Parent nucleus (top, large knot) -->
  <rect class="box" x="280" y="60" width="240" height="100"/>
  <text x="400" y="92" class="lblb">parent nucleus</text>
  <g transform="translate(400, 130)">
    <circle class="strand" cx="-25" cy="-12" r="20"/>
    <circle class="strand" cx="25"  cy="-12" r="20"/>
    <circle class="strand" cx="0"   cy="14"  r="20"/>
  </g>

  <!-- Arrow down to W- emission -->
  <line stroke="#1a1a1a" stroke-width="1.6" fill="none" x1="400" y1="160" x2="400" y2="220" marker-end="url(#tip)"/>
  <text x="430" y="195" class="arrlbl">σ_n  (Markov stab)</text>

  <!-- W- emission (middle) -->
  <rect class="box" x="280" y="220" width="240" height="100"/>
  <text x="400" y="252" class="lblb">emit  W⁻  box-braid</text>
  <g transform="translate(400, 290)">
    <rect fill="none" stroke="#c0392b" stroke-width="2" x="-30" y="-15" width="60" height="30" rx="4"/>
    <text x="0" y="6" class="lbl" fill="#c0392b" font-weight="700">W⁻</text>
  </g>

  <!-- Arrow down to daughter -->
  <line stroke="#1a1a1a" stroke-width="1.6" fill="none" x1="400" y1="320" x2="400" y2="380" marker-end="url(#tip)"/>
  <text x="430" y="355" class="arrlbl">σ_n⁻¹  (de-stab)</text>

  <!-- Daughter row: 3 boxes (daughter, e-, ν) -->
  <rect class="box" x="80" y="380" width="180" height="160"/>
  <text x="170" y="412" class="lblb">daughter nucleus</text>
  <g transform="translate(170, 460)">
    <circle class="strand" cx="-22" cy="-10" r="18"/>
    <circle class="strand" cx="22"  cy="-10" r="18"/>
    <circle class="strand" cx="0"   cy="14"  r="18"/>
  </g>
  <text x="170" y="525" class="lbl">isobar Z+1</text>

  <rect class="box" x="310" y="380" width="180" height="160"/>
  <text x="400" y="412" class="lblb">electron  e⁻</text>
  <g transform="translate(400, 460)">
    <circle class="strand" cx="0"   cy="-15" r="20"/>
    <circle class="strand" cx="14"  cy="6"   r="20"/>
    <circle class="strand" cx="-14" cy="6"   r="20"/>
  </g>
  <text x="400" y="525" class="lbl">trefoil 3₁</text>

  <rect class="box" x="540" y="380" width="180" height="160"/>
  <text x="630" y="412" class="lblb">neutrino  ν̄_e</text>
  <g transform="translate(630, 460)">
    <circle class="strand" cx="0" cy="0" r="22"/>
  </g>
  <text x="630" y="525" class="lbl">unknot 0₁</text>

  <text x="400" y="570" text-anchor="middle" class="lbl" font-style="italic">
    Q_β = mass(parent) − mass(daughter) − mass(e⁻) — predicted by the unified mass formula
  </text>
</svg>
