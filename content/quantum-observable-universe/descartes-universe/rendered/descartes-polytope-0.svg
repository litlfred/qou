<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540"
     font-family="Georgia, 'Times New Roman', Times, serif">
  <title>The Descartes condition as a polytope vertex</title>
  <desc>
    A 2D moduli polytope with axes g (genus) and |Aut|.  Bring's
    (g=4, |Aut|=120) is marked as a distinguished corner.  The
    Hurwitz bound 84(g−1) is drawn as a diagonal ceiling line.
    The QOU constraint χ = −6 (i.e. g = 4) is a horizontal line.
    Their intersection — Bring's surface — is highlighted.
  </desc>
  <defs>
    <style>
      .bg     { fill: #ffffff; }
      .axis   { stroke: #1a1a1a; stroke-width: 1.6; fill: none; }
      .ticklbl{ font-size: 11px; fill: #444; text-anchor: middle; }
      .axislbl{ font-size: 13px; fill: #1a1a1a; font-style: italic; }
      .hurw   { stroke: #2980b9; stroke-width: 2; fill: none;
                stroke-dasharray: 6 4; }
      .qou    { stroke: #c0392b; stroke-width: 2; fill: none;
                stroke-dasharray: 4 3; }
      .point  { fill: #c0392b; stroke: #1a1a1a; stroke-width: 1.4; }
      .pointlbl { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .ttl    { font-size: 17px; font-style: italic; fill: #1a1a1a; }
      .leg    { font-size: 12px; fill: #1a1a1a; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="700" height="540"/>

  <text x="350" y="32" text-anchor="middle" class="ttl">Bring's surface as a moduli-polytope corner</text>

  <!-- Axes: x = g (1..6), y = |Aut| log scale 0..300 -->
  <!-- x: 80→640.  y: 460→80 (note SVG y inverted) -->
  <line class="axis" x1="80" y1="460" x2="640" y2="460"/>
  <line class="axis" x1="80" y1="460" x2="80"  y2="80"/>

  <!-- x ticks: g = 1..6 at x = 80, 192, 304, 416, 528, 640 (each 112 wide) -->
  <g>
    <text x="80"  y="475" class="ticklbl">1</text>
    <text x="192" y="475" class="ticklbl">2</text>
    <text x="304" y="475" class="ticklbl">3</text>
    <text x="416" y="475" class="ticklbl">4</text>
    <text x="528" y="475" class="ticklbl">5</text>
    <text x="640" y="475" class="ticklbl">6</text>
  </g>
  <text x="640" y="495" class="axislbl">genus  g</text>

  <!-- y ticks: |Aut| at 0, 50, 100, 150, 200, 252 -->
  <!-- 460 → 0; 80 → 300.  Scale: 380 px / 300.  At 50: y = 460 - 50*(380/300) = 460-63 = 397 -->
  <g>
    <text x="65" y="465" class="ticklbl">0</text>
    <text x="65" y="402" class="ticklbl">50</text>
    <text x="65" y="338" class="ticklbl">100</text>
    <text x="65" y="275" class="ticklbl">150</text>
    <text x="65" y="212" class="ticklbl">200</text>
    <text x="65" y="142" class="ticklbl">252</text>
  </g>
  <text x="60"  y="70"  class="axislbl">|Aut|</text>

  <!-- Hurwitz bound: |Aut| = 84(g-1).  At g=2: 84, g=3: 168, g=4: 252.
       Coordinates: (192, 460-84*(380/300))=(192, 354), (304, 460-168*1.267)=(304, 247), (416, 460-252*1.267)=(416, 141), (528, ...) -->
  <line class="hurw" x1="80" y1="460" x2="528" y2="32"/>
  <text x="540" y="42" class="leg" fill="#2980b9" font-style="italic">Hurwitz bound 84(g−1)</text>

  <!-- QOU constraint: g = 4 (horizontal at x=416).  Drawn as vertical line  in this layout. -->
  <line class="qou" x1="416" y1="460" x2="416" y2="80"/>
  <text x="425" y="100" class="leg" fill="#c0392b" font-style="italic">QOU: χ = −6 ⇒ g = 4</text>

  <!-- Bring point: (g=4, |Aut|=120) — coords (416, 460-120*1.267) ≈ (416, 308) -->
  <circle class="point" cx="416" cy="308" r="9"/>
  <text x="430" y="304" class="pointlbl">Σ₄  (Bring)</text>
  <text x="430" y="322" class="leg">|Aut| = |S₅| = 120</text>

  <!-- Other genus-4 known points (Bring is largest) -->
  <circle fill="#888" cx="416" cy="380" r="4"/>
  <circle fill="#888" cx="416" cy="420" r="4"/>
  <circle fill="#888" cx="416" cy="440" r="4"/>
  <text x="430" y="445" class="leg" fill="#888">other genus-4 curves</text>

  <text x="350" y="510" text-anchor="middle" class="leg" font-style="italic">
    among genus-4 curves, Bring's Σ₄ has the maximal automorphism group — terminal in the Descartes category
  </text>
</svg>
