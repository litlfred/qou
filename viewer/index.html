<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QOU Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <style>
    :root { --ease: cubic-bezier(0.4,0,0.2,1); }

    [data-theme="dark"] {
      --bg:#0e0e12; --bg-s:#16161c; --bg-r:#1e1e26; --bg-c:#12121a;
      --fg:#c8c8d0; --fg-d:#70707c; --fg-b:#eeeef4;
      --ac:#7ca8e6; --ac-d:#4a6a9a;
      --grn:#7ce6a4; --yel:#e6c87c; --red:#e67c7c; --ora:#e6a47c;
      --brd:#2a2a34;
      --svg-f:invert(0.85) hue-rotate(180deg);
    }
    [data-theme="light"] {
      --bg:#fafafa; --bg-s:#ffffff; --bg-r:#f0f0f4; --bg-c:#f5f5fa;
      --fg:#2c2c34; --fg-d:#888894; --fg-b:#111118;
      --ac:#2a6bc4; --ac-d:#6a9ad4;
      --grn:#1a8a44; --yel:#9a7a20; --red:#c44a4a; --ora:#b07030;
      --brd:#d8d8e0;
      --svg-f:none;
    }
    [data-font="paper"] {
      --f-body:'Crimson Pro','Georgia',serif;
      --f-head:'Inter','Helvetica Neue',sans-serif;
      --f-mono:'JetBrains Mono','Consolas',monospace;
      --f-sz:19px; --f-lh:1.75;
    }
    [data-font="web"] {
      --f-body:'Literata','Georgia',serif;
      --f-head:'Inter','Helvetica Neue',sans-serif;
      --f-mono:'JetBrains Mono','Consolas',monospace;
      --f-sz:17px; --f-lh:1.65;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--f-sz);line-height:var(--f-lh);min-height:100vh;transition:background .3s var(--ease),color .2s var(--ease)}

    /* Controls */
    .ctrl{position:fixed;top:0;left:0;right:0;height:34px;background:var(--bg-s);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 1rem;font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);z-index:100;gap:.6rem}
    .ctrl button{background:var(--bg-r);border:1px solid var(--brd);color:var(--fg-d);font-family:var(--f-mono);font-size:.6rem;padding:.15rem .5rem;border-radius:3px;cursor:pointer;transition:all .15s}
    .ctrl button:hover{color:var(--fg-b);border-color:var(--ac-d)}
    .ctrl button.on{color:var(--ac);border-color:var(--ac)}
    .ctrl .sp{flex:1}
    .ctrl .hash{font-size:.55rem;opacity:.4}

    /* Layout */
    #app{max-width:780px;margin:0 auto;padding:48px 1.5rem 4rem}
    body.has-sidebar #app{margin-left:220px}

    /* Sidebar */
    #sidebar{display:none}
    body.has-sidebar #sidebar{display:block;position:fixed;top:34px;left:0;width:210px;bottom:0;background:var(--bg-s);border-right:1px solid var(--brd);overflow-y:auto;padding:.6rem 0;z-index:90;font-family:var(--f-head);font-size:.72rem}
    .sb-ch{padding:.2rem .6rem;color:var(--fg-d);cursor:pointer;font-weight:600;font-size:.7rem}
    .sb-ch:hover{color:var(--fg-b)}
    .sb-ch.active{color:var(--ac)}
    .sb-sec{padding:.15rem .6rem .15rem 1.2rem;color:var(--fg-d);cursor:pointer;font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sb-sec:hover{color:var(--fg)}
    .sb-sec.active{color:var(--ac)}
    @media(max-width:900px){body.has-sidebar #app{margin-left:0}#sidebar{display:none!important}}

    /* Header */
    .hdr{text-align:center;padding:2.5rem 0 2rem;border-bottom:1px solid var(--brd);margin-bottom:2rem}
    .hdr h1{font-family:var(--f-head);font-size:1.9rem;font-weight:600;color:var(--fg-b);margin-bottom:.4rem}
    .hdr .au{font-family:var(--f-head);font-size:.9rem;color:var(--fg-d)}
    .hdr .dt{font-family:var(--f-mono);font-size:.75rem;color:var(--fg-d);margin-top:.2rem}

    /* Structure */
    .ch{margin-bottom:3rem}
    .ch-t{font-family:var(--f-head);font-size:1.5rem;font-weight:600;color:var(--fg-b);margin-bottom:1.5rem;padding-bottom:.4rem;border-bottom:1px solid var(--brd)}
    .ch-t .n{color:var(--ac);font-weight:400}
    .sec-t{font-family:var(--f-head);font-size:1.2rem;font-weight:500;color:var(--fg-b);margin:2rem 0 1rem}

    /* Blocks */
    .blk{margin:1.5rem 0;position:relative}
    .env{background:var(--bg-s);border:1px solid var(--brd);border-left:3px solid var(--ac-d);border-radius:4px;padding:1rem 1.25rem;margin:1.5rem 0;position:relative}
    .env.definition{border-left-color:var(--ac)}
    .env.theorem,.env.proposition{border-left-color:var(--yel)}
    .env.lemma,.env.corollary{border-left-color:var(--ora)}
    .env.conjecture{border-left-color:var(--red)}
    .env.example{border-left-color:var(--grn)}
    .env.remark{border-left-color:var(--fg-d)}

    /* Collapsed remark/example stub */
    .blk-stub{margin:.4rem 0;display:flex;align-items:center;gap:.4rem;cursor:pointer;padding:.25rem .6rem;border-radius:3px;border:1px dashed var(--brd);font-family:var(--f-head);font-size:.7rem;color:var(--fg-d);transition:all .15s}
    .blk-stub:hover{border-color:var(--ac-d);color:var(--fg)}
    .blk-stub .stub-kind{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:.6rem}
    .blk-stub.remark .stub-kind{color:var(--fg-d)}
    .blk-stub.example .stub-kind{color:var(--grn)}

    .bh{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.6rem;font-family:var(--f-head)}
    .bk{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ac)}
    .env.theorem .bk,.env.proposition .bk{color:var(--yel)}
    .env.lemma .bk,.env.corollary .bk{color:var(--ora)}
    .env.conjecture .bk{color:var(--red)}
    .env.example .bk{color:var(--grn)}
    .env.remark .bk{color:var(--fg-d)}
    .bt{font-size:.95rem;font-weight:500;color:var(--fg-b)}
    .bl{font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);margin-left:auto}

    /* Tags */
    .tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem}
    .tag{font-family:var(--f-mono);font-size:.55rem;padding:.1rem .4rem;border-radius:2px;background:var(--bg-r);border:1px solid var(--brd);color:var(--fg-d)}

    /* Source toggle */
    .st{position:absolute;top:.4rem;right:.4rem;width:20px;height:16px;background:none;border:none;color:var(--fg-d);cursor:pointer;opacity:0;transition:opacity .2s;font-size:.6rem;font-family:var(--f-mono);display:flex;align-items:center;justify-content:center}
    .blk:hover .st,.env:hover .st{opacity:.4}
    .st:hover{opacity:1!important;color:var(--ac)}
    .st.on{opacity:.7;color:var(--ac)}
    .bsrc{display:none;background:var(--bg-c);border:1px solid var(--brd);border-radius:3px;padding:.6rem .8rem;margin-top:.6rem;font-family:var(--f-mono);font-size:.7rem;line-height:1.5;white-space:pre-wrap;overflow-x:auto;color:var(--fg-d)}
    .bsrc.vis{display:block}

    /* Lean badge + icons */
    .lb{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--f-mono);font-size:.6rem;padding:.15rem .5rem;border-radius:3px;background:var(--bg-r);border:1px solid var(--brd);color:var(--fg-d);margin-top:.5rem}
    .lb.proved{color:var(--grn);border-color:var(--grn)}
    .lb.has_sorry{color:var(--yel);border-color:var(--yel)}
    .lb.stated{color:var(--ac);border-color:var(--ac)}
    .lb.validated{color:var(--grn);border-color:var(--grn)}
    .lb.stub{color:var(--red);border-color:var(--red)}
    .lb.external{color:var(--ora);border-color:var(--ora)}
    .lb.trivial{color:var(--fg-d)}

    /* Lean validation icon */
    .vi{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.2rem}
    .vi.validated{background:var(--grn)}
    .vi.stub{background:var(--red)}
    .vi.external{background:var(--ora)}
    .vi.trivial{background:var(--fg-d)}
    .vi.not_checked{background:var(--brd)}
    .vi.error{background:var(--red);box-shadow:0 0 4px var(--red)}

    /* Examples panel (hidden by default) */
    .ex-panel{display:none;margin-top:.6rem;border:1px solid var(--brd);border-radius:4px;overflow:hidden}
    .ex-panel.open{display:block}
    .ex-toggle{font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);cursor:pointer;margin-top:.4rem;display:inline-flex;align-items:center;gap:.3rem}
    .ex-toggle:hover{color:var(--ac)}
    .ex-toggle .arrow{transition:transform .2s}
    .ex-toggle.open .arrow{transform:rotate(90deg)}

    /* Uses */
    .uses{font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);margin-top:.5rem}
    .uref{color:var(--ac-d);cursor:pointer;border-bottom:1px dotted var(--ac-d);text-decoration:none}
    .uref:hover{color:var(--ac);border-bottom-color:var(--ac)}

    /* Uses expand panel */
    .upnl{display:none;background:var(--bg-c);border:1px solid var(--brd);border-radius:4px;margin-top:.4rem;overflow:hidden}
    .upnl.open{display:block}
    .uph{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;background:var(--bg-r);border-bottom:1px solid var(--brd);font-family:var(--f-head);font-size:.7rem;color:var(--fg-d)}
    .upt{display:flex;border-bottom:1px solid var(--brd)}
    .uptb{padding:.25rem .6rem;font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent}
    .uptb:hover{color:var(--fg)}
    .uptb.on{color:var(--ac);border-bottom-color:var(--ac)}
    .upc{padding:.6rem;font-family:var(--f-mono);font-size:.7rem;line-height:1.5;white-space:pre-wrap;overflow-x:auto;max-height:280px;overflow-y:auto}

    /* Content */
    .bb p{margin:.5em 0}
    .bb ul,.bb ol{margin:.4em 0;padding-left:1.5em}
    .bb li{margin:.15em 0}
    .bb strong{color:var(--fg-b)}
    .bb a{color:var(--ac);text-decoration:none;border-bottom:1px solid var(--ac-d)}
    .bb a:hover{color:var(--fg-b)}
    .katex-display{overflow-x:auto;overflow-y:hidden;padding:.4rem 0}
    .katex{color:var(--fg)}

    /* TeX blocks */
    .txb{background:var(--bg-r);border:1px solid var(--brd);border-radius:4px;padding:.8rem;margin:.8rem 0;text-align:center;overflow-x:auto}
    .txb img,.txb svg{max-width:100%;height:auto;filter:var(--svg-f)}
    .txb.ph{font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);white-space:pre-wrap;text-align:left}

    /* Folio */
    .folio-list{display:flex;flex-direction:column;gap:1rem}
    .folio-card{background:var(--bg-s);border:1px solid var(--brd);border-radius:6px;padding:1.2rem 1.5rem;transition:border-color .15s,box-shadow .15s}
    .folio-card:hover{border-color:var(--ac-d);box-shadow:0 2px 12px rgba(0,0,0,.15)}
    .fc-title{font-family:var(--f-head);font-size:1.2rem;font-weight:600;color:var(--fg-b);margin-bottom:.3rem}
    .fc-desc{font-size:.9rem;color:var(--fg);margin-bottom:.4rem}
    .fc-meta{font-family:var(--f-mono);font-size:.7rem;color:var(--fg-d)}

    .loading{text-align:center;padding:4rem 0;font-family:var(--f-mono);color:var(--fg-d)}
    .err{background:rgba(230,124,124,.08);border:1px solid var(--red);border-radius:4px;padding:1rem;color:var(--red);font-family:var(--f-mono);font-size:.8rem}
  </style>
</head>
<body data-font="paper">
  <div class="ctrl">
    <a href="#/" style="font-weight:500;color:var(--fg);text-decoration:none;cursor:pointer">QOU</a>
    <span class="sp"></span>
    <button id="c-ex" title="Show/hide examples">examples</button>
    <button id="c-rm" title="Show/hide remarks">remarks</button>
    <button id="c-th" title="Toggle dark/light">light</button>
    <button id="c-fn" title="Toggle paper/web font">web font</button>
    <span class="hash" id="c-hash"></span>
  </div>

  <div id="sidebar"></div>
  <div id="app"><div class="loading">loading...</div></div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script type="module">
    // ── State ────────────────────────────────────────────
    let paper = null;
    const bix = new Map(); // label → block
    let showExamples = false;
    let showRemarks = true; // remarks visible by default

    // ── Controls ─────────────────────────────────────────
    const html = document.documentElement;
    const btnEx = document.getElementById('c-ex');
    const btnRm = document.getElementById('c-rm');
    const btnTh = document.getElementById('c-th');
    const btnFn = document.getElementById('c-fn');

    btnTh.addEventListener('click', () => {
      const n = html.dataset.theme === 'dark' ? 'light' : 'dark';
      html.dataset.theme = n;
      btnTh.textContent = n === 'dark' ? 'light' : 'dark';
    });

    btnFn.addEventListener('click', () => {
      const n = document.body.dataset.font === 'paper' ? 'web' : 'paper';
      document.body.dataset.font = n;
      btnFn.textContent = n === 'paper' ? 'web font' : 'paper font';
    });

    btnEx.addEventListener('click', () => {
      showExamples = !showExamples;
      btnEx.classList.toggle('on', showExamples);
      document.querySelectorAll('.blk-example').forEach(el => {
        const stub = el.previousElementSibling;
        if (showExamples) {
          el.style.display = '';
          if (stub?.classList.contains('blk-stub')) stub.style.display = 'none';
        } else {
          el.style.display = 'none';
          if (stub?.classList.contains('blk-stub')) stub.style.display = '';
        }
      });
    });

    btnRm.addEventListener('click', () => {
      showRemarks = !showRemarks;
      btnRm.classList.toggle('on', showRemarks);
      document.querySelectorAll('.blk-remark').forEach(el => {
        const stub = el.previousElementSibling;
        if (showRemarks) {
          el.style.display = '';
          if (stub?.classList.contains('blk-stub')) stub.style.display = 'none';
        } else {
          el.style.display = 'none';
          if (stub?.classList.contains('blk-stub')) stub.style.display = '';
        }
      });
    });
    btnRm.classList.add('on'); // remarks on by default

    // ── Markdown ─────────────────────────────────────────
    function parseMd(md) {
      const tx = [];
      const lines = md.split('\n');
      const o = [];
      let i = 0;
      while (i < lines.length) {
        const l = lines[i];
        if (l.trimStart().startsWith('```tex')) {
          i++;
          const t = [];
          while (i < lines.length && !lines[i].trimStart().startsWith('```')) { t.push(lines[i]); i++; }
          i++;
          o.push(`<div class="txb" data-ti="${tx.length}"></div>`);
          tx.push(t.join('\n'));
          continue;
        }
        if (l.trimStart().startsWith('```')) {
          i++;
          const c = [];
          while (i < lines.length && !lines[i].trimStart().startsWith('```')) { c.push(lines[i]); i++; }
          i++;
          o.push(`<pre><code>${esc(c.join('\n'))}</code></pre>`);
          continue;
        }
        if (l.trimStart().startsWith('$$')) {
          const m = [l.trimStart().slice(2)]; i++;
          while (i < lines.length && !lines[i].includes('$$')) { m.push(lines[i]); i++; }
          if (i < lines.length) { m.push(lines[i].replace('$$','')); i++; }
          o.push(`<div data-md>${esc(m.join('\n').trim())}</div>`);
          continue;
        }
        if (/^\s*[-*]\s/.test(l)) {
          o.push('<ul>');
          while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) { o.push(`<li>${inl(lines[i].replace(/^\s*[-*]\s/,''))}</li>`); i++; }
          o.push('</ul>');
          continue;
        }
        if (/^\s*\d+\.\s/.test(l)) {
          o.push('<ol>');
          while (i < lines.length && /^\s*\d+\.\s/.test(lines[i])) { o.push(`<li>${inl(lines[i].replace(/^\s*\d+\.\s/,''))}</li>`); i++; }
          o.push('</ol>');
          continue;
        }
        if (l.trim() === '') { o.push('</p><p>'); i++; continue; }
        o.push(inl(l)); i++;
      }
      let h = '<p>' + o.join('\n') + '</p>';
      h = h.replace(/<p>\s*<\/p>/g,'');
      h = h.replace(/<p>\s*<(div|ul|ol|pre)/g,'<$1');
      h = h.replace(/<\/(div|ul|ol|pre)>\s*<\/p>/g,'</$1>');
      return { html: h, texBlocks: tx };
    }

    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function inl(t) {
      t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
      t = t.replace(/\[([^\]]+)\]\(#([^)]+)\)/g, '<a href="#$2" data-ref="$2">$1</a>');
      t = t.replace(/(?<!\$)\$(?!\$)(.+?)(?<!\$)\$(?!\$)/g, '<span data-mi>$1</span>');
      return t;
    }

    // ── KaTeX ────────────────────────────────────────────
    function renderMath(el) {
      for (const m of el.querySelectorAll('[data-mi]'))
        try { katex.render(m.textContent, m, {throwOnError:false}); } catch {}
      for (const m of el.querySelectorAll('[data-md]'))
        try { katex.render(m.textContent, m, {throwOnError:false,displayMode:true}); m.classList.add('katex-display'); } catch {}
    }

    // ── Lean validation icon ─────────────────────────────
    function leanIcon(validation) {
      const v = validation || 'not_checked';
      const labels = {
        validated: 'validated', stub: 'stub', external: 'external',
        trivial: 'trivial', not_checked: 'not checked', error: 'error'
      };
      return `<span class="vi ${v}" title="${labels[v] || v}"></span>`;
    }

    // ── Uses panel ───────────────────────────────────────
    function mkUsesPanel(label) {
      const ref = bix.get(label);
      if (!ref) return null;
      const p = mk('div','upnl');
      const {html: bh, texBlocks: tx} = parseMd(ref.md || '');

      // Head
      p.innerHTML = `<div class="uph"><span class="bk">${ref.kind}</span> ${ref.title ? inl(ref.title) : label}</div>`;

      // Tabs
      const tabs = mk('div','upt');
      const content = mk('div','upc');
      const views = [
        {label:'rendered', show:() => { content.innerHTML = bh; fillTex(content, tx, ref.rendered); renderMath(content); }},
        {label:'source', show:() => { content.innerHTML = `<pre style="margin:0">${esc(ref.md||'')}</pre>`; }},
      ];
      if (ref.lean?.source) views.push({label:'lean', show:() => { content.innerHTML = `<pre style="margin:0">${esc(ref.lean.source)}</pre>`; }});

      views.forEach((v, i) => {
        const b = mk('button','uptb' + (i===0?' on':''));
        b.textContent = v.label;
        b.onclick = () => { tabs.querySelectorAll('.uptb').forEach(t=>t.classList.remove('on')); b.classList.add('on'); v.show(); };
        tabs.appendChild(b);
      });
      p.appendChild(tabs);
      p.appendChild(content);
      views[0].show();
      return p;
    }

    // ── Uses inline helper ─────────────────────────────────
    function mkUsesInline(block) {
      const u = mk('div','uses');
      u.innerHTML = 'uses: ';
      block.uses.forEach((label, i) => {
        if (i > 0) u.append(', ');
        const r = document.createElement('span');
        r.className = 'uref';
        r.textContent = label;
        r.onclick = () => {
          let p = u.querySelector(`.upnl[data-for="${label}"]`);
          if (p) { p.classList.toggle('open'); }
          else { p = mkUsesPanel(label); if (p) { p.dataset.for = label; p.classList.add('open'); u.appendChild(p); } }
        };
        u.appendChild(r);
      });
      return u;
    }

    // ── Block renderer ───────────────────────────────────
    function renderBlock(block) {
      // Defer markdown parsing to lazy init for most blocks
      function hydrateContent(container) {
        const {html: bh, texBlocks: tx} = parseMd(block.md || '');
        return {bh, tx};
      }

      // Example — with collapsible stub
      if (block.kind === 'example') {
        const frag = document.createDocumentFragment();

        const stub = mk('div', 'blk-stub example');
        stub.innerHTML = `<span class="stub-kind">example</span> ${block.title ? esc(block.title) : (block.label || '')}`;
        stub.style.display = showExamples ? 'none' : '';
        stub.onclick = () => { wrap.style.display = ''; stub.style.display = 'none'; };
        frag.appendChild(stub);

        const wrap = mk('div', 'blk blk-example');
        wrap.style.display = showExamples ? '' : 'none';

        const d = mk('div', 'env example');
        if (block.label) d.id = block.label;
        let hd = `<span class="bk">example</span>`;
        if (block.title) hd += `<span class="bt">${inl(block.title)}</span>`;
        if (block.label) hd += `<span class="bl">${block.label}</span>`;
        d.innerHTML = `<div class="bh">${hd}</div>`;
        const bb = mk('div','bb');
        bb.innerHTML = '<span style="color:var(--fg-d);font-size:.8rem">...</span>';
        d.appendChild(bb);
        addSrc(d, block.md);
        if (block.tags?.length) d.appendChild(mkTags(block.tags));
        wrap.appendChild(d);
        frag.appendChild(wrap);

        lazyInit(wrap, () => {
          const {bh, tx} = hydrateContent();
          bb.innerHTML = bh;
          fillTex(bb, tx, block.rendered);
          renderMath(bb);
        });
        return frag;
      }

      // Remark — with collapsible stub
      if (block.kind === 'remark') {
        const frag = document.createDocumentFragment();

        // Stub (shown when remarks globally hidden)
        const stub = mk('div', 'blk-stub remark');
        stub.innerHTML = `<span class="stub-kind">remark</span> ${block.title ? esc(block.title) : (block.label || '')}`;
        stub.style.display = showRemarks ? 'none' : '';
        stub.onclick = () => { wrap.style.display = ''; stub.style.display = 'none'; };
        frag.appendChild(stub);

        const wrap = mk('div', 'blk blk-remark');
        wrap.style.display = showRemarks ? '' : 'none';

        const d = mk('div', 'env remark');
        if (block.label) d.id = block.label;
        let hd = `<span class="bk">remark</span>`;
        if (block.title) hd += `<span class="bt">${inl(block.title)}</span>`;
        if (block.label) hd += `<span class="bl">${block.label}</span>`;
        d.innerHTML = `<div class="bh">${hd}</div>`;
        const bb = mk('div','bb');
        bb.innerHTML = '<span style="color:var(--fg-d);font-size:.8rem">...</span>';
        d.appendChild(bb);
        addSrc(d, block.md);
        if (block.tags?.length) d.appendChild(mkTags(block.tags));
        if (block.uses?.length) d.appendChild(mkUsesInline(block));
        wrap.appendChild(d);
        frag.appendChild(wrap);

        lazyInit(wrap, () => {
          const {bh, tx} = hydrateContent();
          bb.innerHTML = bh;
          fillTex(bb, tx, block.rendered);
          renderMath(bb);
        });
        return frag;
      }

      // Prose
      if (block.kind === 'prose') {
        const d = mk('div','blk');
        if (block.label) d.id = block.label;
        d.innerHTML = '<div class="bb"></div>';
        addSrc(d, block.md);

        lazyInit(d, () => {
          const {bh, tx} = hydrateContent();
          d.querySelector('.bb').innerHTML = bh;
          fillTex(d, tx, block.rendered);
          renderMath(d);
        });
        return d;
      }

      // Equation
      if (block.kind === 'equation') {
        const d = mk('div','blk');
        if (block.label) d.id = block.label;
        d.innerHTML = `<div data-md>${esc(block.tex||'')}</div>`;
        lazyInit(d, () => renderMath(d));
        return d;
      }

      // Diagram
      if (block.kind === 'diagram') {
        const d = mk('div','blk');
        if (block.label) d.id = block.label;
        if (block.rendered?.length) d.innerHTML = renderAsset(block.rendered[0]);
        else d.innerHTML = `<div class="txb ph">${esc(block.tex||block.md||'')}</div>`;
        return d;
      }

      // Environment block (definition, theorem, proposition, lemma, corollary, conjecture)
      const d = mk('div',`blk env ${block.kind}`);
      if (block.label) d.id = block.label;

      let hd = `<span class="bk">${block.kind}</span>`;
      if (block.title) hd += `<span class="bt">${inl(block.title)}</span>`;
      if (block.label) hd += `<span class="bl">${block.label}</span>`;
      d.innerHTML = `<div class="bh">${hd}</div>`;

      const bb = mk('div','bb');
      bb.innerHTML = '<span style="color:var(--fg-d);font-size:.8rem">...</span>';
      d.appendChild(bb);
      addSrc(d, block.md);

      // Lean badge with validation icon
      if (block.lean) {
        const s = block.status || 'not_started';
        const v = block.lean.validation || 'not_checked';
        const badge = mk('div',`lb ${s}`);
        badge.innerHTML = `${leanIcon(v)}${esc(block.lean.decl)} · ${s.replace(/_/g,' ')}`;
        d.appendChild(badge);
      }

      // Tags
      if (block.tags?.length) d.appendChild(mkTags(block.tags));

      // Uses
      if (block.uses?.length) d.appendChild(mkUsesInline(block));

      // Examples toggle (if block has associated examples)
      if (block.examples?.length) {
        const toggle = mk('div','ex-toggle');
        toggle.innerHTML = `<span class="arrow">▸</span> ${block.examples.length} example(s)`;
        const panel = mk('div','ex-panel');
        let exLoaded = false;

        toggle.onclick = () => {
          toggle.classList.toggle('open');
          panel.classList.toggle('open');
          // Lazy load example content on first open
          if (!exLoaded) {
            exLoaded = true;
            block.examples.forEach(exLabel => {
              const exBlock = bix.get(exLabel);
              if (exBlock) {
                const {html: exHtml, texBlocks: exTx} = parseMd(exBlock.md || '');
                const exDiv = mk('div','env example');
                exDiv.style.borderLeft = 'none';
                exDiv.style.margin = '0';
                let exHd = `<span class="bk">example</span>`;
                if (exBlock.title) exHd += `<span class="bt">${inl(exBlock.title)}</span>`;
                exDiv.innerHTML = `<div class="bh">${exHd}</div><div class="bb">${exHtml}</div>`;
                fillTex(exDiv, exTx, exBlock.rendered);
                renderMath(exDiv);
                panel.appendChild(exDiv);
              }
            });
          }
        };
        d.appendChild(toggle);
        d.appendChild(panel);
      }

      // Lazy hydrate the main content
      lazyInit(d, () => {
        const {bh, tx} = hydrateContent();
        bb.innerHTML = bh;
        fillTex(bb, tx, block.rendered);
        renderMath(bb);
      });

      return d;
    }

    // ── Helpers ───────────────────────────────────────────
    function mk(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

    function addSrc(el, md) {
      if (!md) return;
      const b = mk('button','st'); b.textContent = '<>';  b.title = 'View source';
      const s = mk('div','bsrc'); s.textContent = md;
      b.onclick = () => { s.classList.toggle('vis'); b.classList.toggle('on'); };
      el.appendChild(b); el.appendChild(s);
    }

    function mkTags(tags) {
      const d = mk('div','tags');
      tags.forEach(t => { const s = mk('span','tag'); s.textContent = t; d.appendChild(s); });
      return d;
    }

    function fillTex(el, tx, rendered) {
      for (const t of el.querySelectorAll('.txb[data-ti]')) {
        const i = +t.dataset.ti;
        const a = rendered?.find(r => r.blockIndex === i);
        if (a) { t.innerHTML = renderAsset(a); t.classList.remove('ph'); }
        else { t.textContent = tx[i] || ''; t.classList.add('ph'); }
      }
    }

    function renderAsset(a) {
      if (a.mime === 'image/svg+xml') return `<img src="${a.url}" alt="diagram" loading="lazy">`;
      if (a.mime?.startsWith('image/')) return `<img src="${a.url}" alt="" loading="lazy">`;
      return `<a href="${a.url}" target="_blank">[${a.mime}]</a>`;
    }

    // ── Lazy loading via IntersectionObserver ──────────────
    const lazyQueue = []; // {el, init}
    const lazyObs = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          const el = entry.target;
          const task = lazyQueue.find(t => t.el === el);
          if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); }
          lazyObs.unobserve(el);
        }
      }
    }, { rootMargin: '200px 0px' }); // start loading 200px before visible

    function lazyInit(el, init) {
      lazyQueue.push({el, init});
      lazyObs.observe(el);
    }

    // ── Paper ────────────────────────────────────────────
    function renderPaper(p) {
      paper = p;
      bix.clear();
      for (const ch of p.chapters) for (const s of ch.sections) for (const b of s.blocks)
        if (b.label) bix.set(b.label, b);

      const app = document.getElementById('app');
      app.innerHTML = '';

      // Build sidebar
      const sb = document.getElementById('sidebar');
      sb.innerHTML = '';
      document.body.classList.add('has-sidebar');
      for (const ch of p.chapters) {
        const chEl = mk('div','sb-ch');
        chEl.textContent = `${ch.number}. ${ch.title}`;
        chEl.onclick = () => { const t = document.getElementById(ch.label); if (t) t.scrollIntoView({behavior:'smooth'}); };
        sb.appendChild(chEl);
        for (const sec of ch.sections) {
          const sEl = mk('div','sb-sec');
          sEl.textContent = sec.title;
          sEl.title = sec.title;
          sEl.onclick = () => { const t = document.getElementById(sec.label); if (t) t.scrollIntoView({behavior:'smooth'}); };
          sb.appendChild(sEl);
        }
      }

      // Header
      const hdr = mk('div','hdr');
      hdr.innerHTML = `<h1>${esc(p.title)}</h1><div class="au">${p.authors.map(esc).join(', ')}</div>${p.date?`<div class="dt">${p.date}</div>`:''}`;
      app.appendChild(hdr);

      for (const ch of p.chapters) {
        const cd = mk('div','ch');
        if (ch.label) cd.id = ch.label;
        cd.innerHTML = `<h2 class="ch-t"><span class="n">Chapter ${ch.number}.</span> ${esc(ch.title)}</h2>`;
        for (const sec of ch.sections) {
          const sd = mk('div','section');
          if (sec.label) sd.id = sec.label;
          sd.innerHTML = `<h3 class="sec-t">${esc(sec.title)}</h3>`;
          for (const b of sec.blocks) sd.appendChild(renderBlock(b));
          cd.appendChild(sd);
        }
        app.appendChild(cd);
      }

      document.getElementById('c-hash').textContent = p._hash || '';
      document.title = `${p.title} — QOU`;
    }

    // ── Folio (paper listing) ────────────────────────────
    function renderFolio(data) {
      document.body.classList.remove('has-sidebar');
      document.getElementById('sidebar').innerHTML = '';
      const app = document.getElementById('app');
      app.innerHTML = '';

      const hdr = mk('div','hdr');
      hdr.innerHTML = `<h1>${esc(data.title || 'Papers')}</h1>`;
      app.appendChild(hdr);

      const list = mk('div','folio-list');
      for (const p of (data.papers || [])) {
        const card = mk('div','folio-card');
        card.innerHTML = `
          <h2 class="fc-title">${esc(p.title)}</h2>
          ${p.description ? `<p class="fc-desc">${esc(p.description)}</p>` : ''}
          <div class="fc-meta">${p.stats?.chapters ?? '?'} chapters · ${p.stats?.blocks ?? '?'} blocks</div>
        `;
        card.style.cursor = 'pointer';
        card.onclick = () => {
          location.hash = `#/paper/${p.id}`;
        };
        list.appendChild(card);
      }
      app.appendChild(list);
      document.title = data.title || 'QOU';
    }

    // ── Router ────────────────────────────────────────────
    async function route() {
      const hash = location.hash || '#/';
      const parts = hash.slice(2).split('/').filter(Boolean);

      if (parts[0] === 'paper' && parts[1]) {
        await loadPaper(parts[1]);
      } else {
        await loadFolio();
      }
    }

    async function loadFolio() {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loading">loading folio...</div>';
      try {
        const r = await fetch('/api/folio');
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        renderFolio(await r.json());
      } catch (e) {
        app.innerHTML = `<div class="err">Could not load folio: ${esc(e.message)}<br><br>Ensure the MCP server is running (port 3200).</div>`;
      }
    }

    async function loadPaper(id) {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loading">loading paper...</div>';
      try {
        const r = await fetch(`/api/paper?id=${encodeURIComponent(id)}`);
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        renderPaper(await r.json());
      } catch (e) {
        app.innerHTML = `<div class="err">Could not load paper: ${esc(e.message)}</div>`;
      }
    }

    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
