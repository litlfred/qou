      const impStatus = document.getElementById('imp-status');
      const scanArea = document.getElementById('imp-scan-area');

      // arXiv fetch
      document.getElementById('imp-arxiv-go').onclick = async () => {
        const idInput = document.getElementById('imp-arxiv-id');
        const arxivId = idInput.value.trim();
        if (!arxivId) return;
        impStatus.textContent = 'Fetching from arXiv...';
        try {
          const r = await fetch('/api/import/arxiv', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ arxivId })
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error);
          impStatus.textContent = `Fetched: ${d.meta.title} (${d.meta.format})`;
          if (d.meta.format === 'latex') {
            await scanImport(d.paperId, d.meta);
          } else {
            impStatus.textContent += ' — no LaTeX source available, PDF only';
          }
          loadImportHistory();
        } catch(e) { impStatus.textContent = 'Error: ' + e.message; }
      };

      // File upload
      document.getElementById('imp-upload-go').onclick = async () => {
        const fileInput = document.getElementById('imp-file');
        const file = fileInput.files?.[0];
        if (!file) return;
        impStatus.textContent = 'Uploading...';
        const fd = new FormData();
        fd.append('file', file);
        const paperId = document.getElementById('imp-paper-id').value.trim();
        if (paperId) fd.append('paperId', paperId);
        try {
          const r = await fetch('/api/import/upload', { method: 'POST', body: fd });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error);
          impStatus.textContent = `Uploaded: ${d.meta.title}`;
          if (d.meta.format === 'latex') {
            await scanImport(d.paperId, d.meta);
          } else {
            impStatus.textContent += ' — PDF uploaded. Scan requires LaTeX source.';
          }
          loadImportHistory();
        } catch(e) { impStatus.textContent = 'Error: ' + e.message; }
      };

      // Scan for environments
      async function scanImport(paperId, meta) {
        impStatus.textContent = 'Scanning for theorems, definitions...';
        try {
          const r = await fetch('/api/import/scan', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ paperId })
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error);

          const blocks = d.blocks;
          const summary = d.summary;
          impStatus.textContent = `Found ${blocks.length} blocks: ${Object.entries(summary).map(([k,v]) => `${v} ${k}s`).join(', ')}`;
          renderScanResults(paperId, meta, blocks);
        } catch(e) { impStatus.textContent = 'Scan error: ' + e.message; }
      }

      function renderScanResults(paperId, meta, blocks) {
        scanArea.innerHTML = '';
        if (!blocks.length) {
          scanArea.innerHTML = '<div class="scan-summary">No formal environments found.</div>';
          return;
        }

        const heading = mk('div','scan-summary');
        heading.textContent = `Review extracted blocks. Check the ones you want to import:`;
        scanArea.appendChild(heading);

        // Select all / none
        const selRow = mk('div','');
        selRow.style.cssText = 'display:flex;gap:.4rem;margin-bottom:.4rem';
        const selAll = mk('button','imp-submit'); selAll.textContent = 'select all'; selAll.style.fontSize = '.6rem';
        const selNone = mk('button','imp-submit'); selNone.textContent = 'select none'; selNone.style.cssText = 'font-size:.6rem;background:var(--fg-d)';
        selRow.appendChild(selAll); selRow.appendChild(selNone);
        scanArea.appendChild(selRow);

        const checkboxes = [];
        for (let i = 0; i < blocks.length; i++) {
          const b = blocks[i];
          const row = mk('div','scan-block');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = ['theorem','definition','proposition','lemma','corollary'].includes(b.kind);
          checkboxes.push({ cb, block: b });
          row.appendChild(cb);

          const kind = mk('span','sb-kind'); kind.textContent = b.kind;
          row.appendChild(kind);

          const title = mk('span','sb-title');
          title.textContent = b.title || `(${b.kind} at line ${b.line})`;
          row.appendChild(title);

          if (b.label) {
            const lbl = mk('span','sb-label'); lbl.textContent = b.label;
            row.appendChild(lbl);
          }

          // Click to expand/collapse body preview
          const preview = mk('div','sb-body-preview');
          preview.textContent = b.body?.slice(0, 300) || '';
          row.onclick = (e) => {
            if (e.target === cb) return;
            row.classList.toggle('expanded');
          };
          row.appendChild(preview);
          scanArea.appendChild(row);
        }

        selAll.onclick = () => checkboxes.forEach(c => c.cb.checked = true);
        selNone.onclick = () => checkboxes.forEach(c => c.cb.checked = false);

        // Generate button
        const actions = mk('div','scan-actions');
        const genBtn = mk('button','imp-submit');
        genBtn.textContent = 'Generate content objects';
        const genLeanCb = document.createElement('input');
        genLeanCb.type = 'checkbox'; genLeanCb.id = 'imp-gen-lean';
        const genLeanLabel = document.createElement('label');
        genLeanLabel.htmlFor = 'imp-gen-lean';
        genLeanLabel.textContent = ' Also generate .lean stubs';
        genLeanLabel.style.cssText = 'font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);cursor:pointer';
        actions.appendChild(genBtn);
        actions.appendChild(genLeanCb);
        actions.appendChild(genLeanLabel);
        scanArea.appendChild(actions);

        genBtn.onclick = async () => {
          const selected = checkboxes.filter(c => c.cb.checked).map(c => {
            const b = c.block;
            // Generate rootName from label or kind+line
            const rn = (b.label || `${b.kind}-${b.line}`)
              .replace(/^(thm|def|lem|prop|cor|conj|ex|rem|prf):/, '')
              .replace(/[^a-z0-9-]/gi, '-').toLowerCase();
            return {
              kind: b.kind,
              title: b.title,
              label: b.label,
              body: b.body,
              rootName: `imported-${rn}`,
              generateLean: genLeanCb.checked,
            };
          });

          if (!selected.length) { impStatus.textContent = 'No blocks selected'; return; }

          genBtn.disabled = true;
          genBtn.textContent = 'Generating...';
          impStatus.textContent = `Generating ${selected.length} content objects...`;

          const source = meta.source === 'arxiv'
            ? { type: 'arxiv', id: meta.arxivId, url: meta.url, citationKey: meta.arxivId?.replace(/[/.]/g, '') || '' }
            : { type: 'upload', id: paperId, url: '', citationKey: paperId };

          try {
            const r = await fetch('/api/import/generate', {
              method: 'POST', headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ paperId, blocks: selected, source })
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error);
            impStatus.textContent = `Generated ${d.generated.length} objects → ${d.path}`;
            genBtn.textContent = 'Done';
            loadImportHistory();

            // Suggest todos to user
            const todoSuggestions = selected
              .filter(b => ['theorem','lemma','proposition','corollary'].includes(b.kind))
              .map(b => `Formalize proof of ${b.title || b.rootName}`);
            if (todoSuggestions.length) {
              const sugDiv = mk('div','');
              sugDiv.style.cssText = 'margin-top:.6rem;padding:.5rem;background:var(--bg-r);border-radius:4px;font-size:.7rem;font-family:var(--f-head)';
              sugDiv.innerHTML = `<strong style="font-size:.65rem;color:var(--fg-d)">Suggested todos (click to create):</strong>`;
              for (const s of todoSuggestions) {
                const item = mk('div','');
                item.style.cssText = 'padding:.2rem 0;color:var(--ac);cursor:pointer;font-size:.7rem';
                item.textContent = s;
                item.onclick = async () => {
                  try {
                    await fetch('/api/feedback', {
                      method: 'POST', headers: {'Content-Type':'application/json'},
                      body: JSON.stringify({
                        paperId, rootName: 'paper-level',
                        summary: s, comment: `Imported from ${source.type}:${source.id}. Formal proof needed.`,
                        priority: 'medium', assignee: 'proof-agent', origin: 'human'
                      })
                    });
                    item.style.color = 'var(--grn)';
                    item.textContent = '✓ ' + s;
                    item.onclick = null;
                  } catch(e) { item.style.color = 'var(--red)'; }
                };
                sugDiv.appendChild(item);
              }
              scanArea.appendChild(sugDiv);
            }
          } catch(e) {
            impStatus.textContent = 'Generate error: ' + e.message;
            genBtn.disabled = false;
            genBtn.textContent = 'Generate content objects';
          }
        };
      }

      // Load import history
      async function loadImportHistory() {
        const histEl = document.getElementById('imp-history');
        try {
          const r = await fetch('/api/import/list');
          const imports = await r.json();
          if (!imports.length) { histEl.innerHTML = ''; return; }

          histEl.innerHTML = `<div style="font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);margin-bottom:.4rem">Previous imports:</div>`;
          for (const imp of imports) {
            const card = mk('div','import-card');
            const src = mk('span','ic-source');
            src.textContent = imp.source || 'upload';
            card.appendChild(src);

            const title = mk('span','ic-title');
            title.textContent = imp.title || imp.paperId;
            card.appendChild(title);

            const status = mk('span','ic-status');
            if (imp.hasContent) { status.className = 'ic-status generated'; status.textContent = 'generated'; }
            else if (imp.hasExtracted) { status.className = 'ic-status scanned'; status.textContent = `${imp.blockCount} blocks`; }
            else { status.className = 'ic-status pending'; status.textContent = 'pending'; }
            card.appendChild(status);

            // Action button for imports that can be processed
            if (!imp.hasContent) {
              const actBtn = mk('button','imp-submit');
              actBtn.style.cssText = 'font-size:.55rem;padding:.2rem .5rem;margin-left:.3rem';
              if (imp.hasExtracted) {
                actBtn.textContent = 'review blocks';
                actBtn.onclick = (e) => { e.stopPropagation(); scanImport(imp.paperId, imp); };
              } else {
                actBtn.textContent = 'scan';
                actBtn.onclick = (e) => { e.stopPropagation(); scanImport(imp.paperId, imp); };
              }
              card.appendChild(actBtn);
              card.style.cursor = 'pointer';
              card.onclick = () => scanImport(imp.paperId, imp);
            }
            histEl.appendChild(card);
          }
        } catch(e) { histEl.innerHTML = ''; }
      }
      loadImportHistory();

      document.title = data.title || 'Folio';
    }

    // ── Router ────────────────────────────────────────────
    // Routes (@ separates slug from branch, since branch names contain /):
    //   #/                                          → folio (current branch)
    //   #/@branch/name                              → folio on specific branch
    //   #/view/paper-id                             → paper (current branch)
    //   #/view/paper-id@branch/name                 → paper on specific branch
    //   #/view/label@branch/name                    → paper scrolled to block, on branch
    //   #/edit/label                                → inline edit (current branch)
    //   #/edit/label@branch/name                    → inline edit on branch
    //   #label                                      → shorthand for #/view/label
    const LABEL_RE = /^(def|thm|lem|prop|cor|conj|ex|rem|prf|eq|fig|sec|chap):/;
    let pendingScroll = null;

    /** Split "slug@branch/name" → { slug, branch } or { slug, branch: null }. */
    function parseBranchFromSlug(raw) {
      const at = raw.indexOf('@');
      if (at === -1) return { slug: raw, branch: null };
      return { slug: raw.slice(0, at), branch: decodeURIComponent(raw.slice(at + 1)) };
    }

    /** Update selectedBranch from URL if present, and sync the picker. */
    function applyUrlBranch(branch) {
      if (branch && branch !== selectedBranch) {
        selectedBranch = branch;
        brInput.value = branch;
        paper = null;
        bix.clear();
        console.log(`[folio:git] branch from URL: ${branch}`);
      }
    }

    /** Build a hash string with the current branch embedded (if not default). */
    function hashWithBranch(path, branch) {
      const br = branch || selectedBranch;
      // Always embed branch in URL unless it's the default (main/master)
      if (!br || br === 'main' || br === 'master') return path;
      return `${path}@${encodeURIComponent(br)}`;
    }

    async function route() {
      const hash = location.hash || '#/';
      const raw = hash.slice(1); // remove #

      // Shorthand: #rem:foo or #rem:foo@branch → treat as view
      if (LABEL_RE.test(raw) || (raw.includes('@') && LABEL_RE.test(raw.split('@')[0]))) {
        const { slug, branch } = parseBranchFromSlug(raw);
        applyUrlBranch(branch);
        await routeView(slug);
        return;
      }

      const stripped = raw.replace(/^\//, '');

      // #/@branch/name → folio on branch
      if (stripped.startsWith('@')) {
        const branch = decodeURIComponent(stripped.slice(1));
        applyUrlBranch(branch);
        await loadFolio();
        return;
      }

      // Split only first two segments: action / rest (rest may contain @branch)
      const firstSlash = stripped.indexOf('/');
      const action = firstSlash === -1 ? stripped : stripped.slice(0, firstSlash);
      const rest = firstSlash === -1 ? '' : stripped.slice(firstSlash + 1);

      if (action === 'view' && rest) {
        const { slug, branch } = parseBranchFromSlug(rest);
        applyUrlBranch(branch);
        await routeView(slug);
      } else if (action === 'edit' && rest) {
        const { slug, branch } = parseBranchFromSlug(rest);
        applyUrlBranch(branch);
        await routeEdit(slug);
      } else {
        await loadFolio();
      }
    }

    async function routeView(slug) {
      // Is it a label? (has prefix like def:, rem:, etc.)
      const isLabel = LABEL_RE.test(slug);
      if (isLabel) {
        pendingScroll = slug;
        if (!paper) await loadDefaultPaper();
        else scrollToLabel(slug);
      } else {
        // It's a paper id
        await loadPaper(slug);
      }
    }

    async function routeEdit(slug) {
      // Load paper if needed, then scroll to block and open inline editor
      if (!paper) await loadDefaultPaper();
      const block = bix.get(slug);
      if (block) {
        const el = document.getElementById(slug);
        if (el) {
          // Force lazy-hydrate
          const task = lazyQueue.find(t => t.el === el || t.el.contains?.(el) || el.contains?.(t.el));
          if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); lazyObs.unobserve(task.el); }
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          // Open inline editor if it exists
          setTimeout(() => {
            if (el._inlineEditor && !el._inlineEditor.editor.classList.contains('open')) {
              el._inlineEditor.btn.click();
            }
          }, 300);
        }
      } else {
        document.getElementById('app').innerHTML =
          `<div class="err">Block not found: ${esc(slug)}</div>`;
      }
    }

    function renderEditView(block) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      document.body.classList.remove('has-sidebar');
      document.getElementById('sidebar').innerHTML = '';

      // Navigation bar
      const nav = mk('div','blk');
      nav.style.cssText = 'display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--brd);margin-bottom:.8rem';
      const backLink = document.createElement('a');
      backLink.href = `#/${block.label || ''}`;
      backLink.style.cssText = 'color:var(--ac);font-family:var(--f-mono);font-size:.75rem;text-decoration:none';
      backLink.textContent = '← back to paper';
      nav.appendChild(backLink);
      const labelSpan = mk('span','');
      labelSpan.style.cssText = 'font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);margin-left:auto';
      labelSpan.textContent = block.label || '';
      nav.appendChild(labelSpan);
      app.appendChild(nav);

      // Render using the exact same block renderer as the paper
      const rendered = renderBlock(block);
      app.appendChild(rendered);

      // Force hydrate (it was lazy-initialized)
      const idx = lazyQueue.findIndex(t => {
        const el = t.el;
        return el === rendered || rendered.contains?.(el) || el.contains?.(rendered);
      });
      if (idx >= 0) { lazyQueue[idx].init(); lazyObs.unobserve(lazyQueue[idx].el); lazyQueue.splice(idx, 1); }

      // Auto-open the inline editor
      const target = block.label ? document.getElementById(block.label) : rendered;
      if (target?._inlineEditor) {
        setTimeout(() => {
          if (!target._inlineEditor.editor.classList.contains('open')) {
            target._inlineEditor.btn.click();
          }
        }, 100);
      }

      // Referenced-by panel
      if (block.label) showReferencedBy(block.label, target || rendered);

      // Manifest (collapsed by default)
      const manifestWrap = mk('div','blk');
      const manifestToggle = mk('div','');
      manifestToggle.style.cssText = 'cursor:pointer;font-family:var(--f-mono);font-size:.7rem;color:var(--fg-d);padding:.3rem 0';
      manifestToggle.innerHTML = '<span class="arrow">▸</span> manifest (.ts)';
      const manifestBody = mk('pre','');
      manifestBody.style.cssText = 'display:none;background:var(--bg-r);border:1px solid var(--brd);border-radius:4px;padding:.8rem;font-size:.75rem;color:var(--fg-d);overflow-x:auto;margin-top:.4rem';
      manifestBody.textContent = JSON.stringify({kind:block.kind,label:block.label,title:block.title,uses:block.uses,lean:block.lean,tags:block.tags,status:block.status}, null, 2);
      manifestToggle.onclick = () => {
        const open = manifestBody.style.display !== 'none';
        manifestBody.style.display = open ? 'none' : '';
        manifestToggle.querySelector('.arrow').textContent = open ? '▸' : '▾';
      };
      manifestWrap.appendChild(manifestToggle);
      manifestWrap.appendChild(manifestBody);
      app.appendChild(manifestWrap);

      document.title = `Edit: ${block.title || block.label} — Folio`;
    }

    function scrollToLabel(label) {
      // Switch to the chapter containing this label
      if (paper?._showChapter && paper._chapterForLabel) {
        const chNum = paper._chapterForLabel(label);
        if (chNum !== null) paper._showChapter(chNum);
      }

      const el = document.getElementById(label);
      if (!el) { pendingScroll = null; return; }

      // Force lazy-hydrate so content is visible
      const task = lazyQueue.find(t => t.el === el || t.el.contains?.(el) || el.contains?.(t.el));
      if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); lazyObs.unobserve(task.el); }

      // If hidden (remark/example), show it and its wrapper
      const wrap = el.closest('.blk-remark, .blk-example');
      if (wrap && wrap.style.display === 'none') wrap.style.display = '';

      // If inside a collapsed example toggle panel, open it
      const exPanel = el.closest('.ex-panel');
      if (exPanel && !exPanel.classList.contains('open')) {
        exPanel.classList.add('open');
        const toggle = exPanel.previousElementSibling;
        if (toggle?.classList.contains('ex-toggle')) toggle.classList.add('open');
      }

      // Also hide the stub if there is one
      const stub = wrap?.previousElementSibling;
      if (stub?.classList.contains('blk-stub')) stub.style.display = 'none';

      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.style.outline = '2px solid var(--ac)';
      setTimeout(() => { el.style.outline = ''; }, 2000);

      // Show "referenced by" panel when block is the direct URL target
      showReferencedBy(label, el);

      pendingScroll = null;
    }

    function showReferencedBy(label, el) {
      // Remove any existing ref-by panel
      const existing = el.parentElement?.querySelector('.ref-by[data-for="' + label + '"]');
      if (existing) existing.remove();

      const refs = usedByIndex.get(label);
      if (!refs?.length) return;

      const panel = mk('div','ref-by');
      panel.dataset.for = label;
      const title = mk('div','ref-by-title');
      title.textContent = `Referenced by (${refs.length})`;
      panel.appendChild(title);

      const list = mk('div','ref-by-list');
      for (const ref of refs) {
        const item = mk('div','ref-by-item');
        const kind = mk('span','ref-kind');
        kind.textContent = ref.kind;
        item.appendChild(kind);

        link.href = `#${ref.label || ''}`;
        link.innerHTML = inl(ref.title || ref.rootName || ref.label);

        link.onclick = (e) => {
          e.preventDefault();
          if (ref.label) scrollToLabel(ref.label);

        item.appendChild(link);
        // Show which paper it's in
        if (paper?.id) {
          const paperTag = mk('span','ref-by-paper');
          paperTag.textContent = paper.id;
          item.appendChild(paperTag);
        }
        list.appendChild(item);
      }
      panel.appendChild(list);

      // Insert after the target block element
      el.after(panel);
    }

    // ── Diff overlay + inline diff mode ─────────────────────
    const diffBtn = document.getElementById('c-diff');
    const diffOverlay = document.getElementById('diff-overlay');
    const diffBody = document.getElementById('diff-body');
    const diffTitle = document.getElementById('diff-title');
    const diffSummaryEl = document.getElementById('diff-summary');
    let diffData = null; // cached diff response
    let diffMode = false; // inline diff highlights active
    let diffBaseBlocks = new Map(); // rootName → base md for inline diff

    // Show/hide diff button based on branch
    function updateDiffButton() {
      const show = selectedBranch && selectedBranch !== 'main' && selectedBranch !== 'master' && paper;
      diffBtn.classList.toggle('visible', !!show);
    }

    // Simple line-level diff: returns array of {type: 'add'|'del'|'ctx', text}
    function lineDiff(base, head) {
      const baseLines = (base || '').split('\n');
      const headLines = (head || '').split('\n');
      const result = [];

      // LCS-based diff (simplified Myers)
      const n = baseLines.length, m = headLines.length;
      // For large files, fall back to simple comparison
      if (n + m > 2000) {
        baseLines.forEach(l => result.push({type:'del',text:l}));
        headLines.forEach(l => result.push({type:'add',text:l}));
        return result;
      }

      // Build edit script via DP
      const dp = Array.from({length:n+1}, () => new Uint16Array(m+1));
      for (let i = 0; i <= n; i++) dp[i][0] = i;
      for (let j = 0; j <= m; j++) dp[0][j] = j;
      for (let i = 1; i <= n; i++)
        for (let j = 1; j <= m; j++)
          dp[i][j] = baseLines[i-1] === headLines[j-1]
            ? dp[i-1][j-1]
            : 1 + Math.min(dp[i-1][j], dp[i][j-1]);

      // Traceback
      let i = n, j = m;
      const ops = [];
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && baseLines[i-1] === headLines[j-1]) {
          ops.push({type:'ctx',text:baseLines[i-1]}); i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j-1] <= dp[i-1][j])) {
          ops.push({type:'add',text:headLines[j-1]}); j--;
        } else {
          ops.push({type:'del',text:baseLines[i-1]}); i--;
        }
      }
      ops.reverse();
      return ops;
    }

    function renderDiffLines(ops) {
      return ops.map(op => {
        const prefix = op.type === 'add' ? '+' : op.type === 'del' ? '-' : ' ';
        const cls = op.type === 'add' ? 'diff-line-add' : op.type === 'del' ? 'diff-line-del' : 'diff-line-ctx';
        return `<span class="${cls}">${prefix} ${esc(op.text)}</span>`;
      }).join('\n');
    }

    async function loadDiff() {
      if (!paper?.id) return null;
      const base = 'main';
      const head = selectedBranch || currentBranchName;
      if (head === 'main' || head === 'master') return null;
      console.log(`[folio:diff] loading diff: ${base}..${head} for ${paper.id}`);
      try {
        const r = await fetch(`/api/diff?id=${encodeURIComponent(paper.id)}&base=${encodeURIComponent(base)}&head=${encodeURIComponent(head)}`);
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(body.error || `HTTP ${r.status}`);
        }
        const data = await r.json();
        console.log(`[folio:diff] loaded: +${data.summary.added} -${data.summary.removed} ~${data.summary.changed}`);
        return data;
      } catch (e) {
        console.error('[folio:diff] load failed:', e.message);
        return null;
      }
    }

    function renderDiffOverlay(data) {
      diffData = data;
      diffTitle.textContent = `Changes: ${data.base} → ${data.head}`;

      diffBody.innerHTML = '';
      // Filter out unchanged blocks and whitespace-only diffs
      const changed = data.blocks.filter(b => {
        if (b.status === 'unchanged') return false;
        if (b.status === 'changed' && b.mdDiff && !b.leanDiff && !b.statusDiff) {
          const base = (b.mdDiff.base || '').replace(/\s+/g, '');
          const head = (b.mdDiff.head || '').replace(/\s+/g, '');
          if (base === head) return false;
        }
        return true;
      });
      const added = changed.filter(b => b.status === 'added').length;
      const removed = changed.filter(b => b.status === 'removed').length;
      const chg = changed.filter(b => b.status === 'changed').length;
      diffSummaryEl.innerHTML = `<span class="da">+${added}</span> <span class="dr">-${removed}</span> <span class="dc">~${chg}</span>`;
      if (!changed.length) {
        diffBody.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--fg-d)">No changes between branches</div>';
        return;
      }

      // Group by chapter (use paper's chapter order)
      const chapterOrder = [];
      const chapterBlocks = new Map();
      if (paper) {
        for (const ch of paper.chapters) {
          const chKey = ch.title;
          chapterOrder.push(chKey);
          chapterBlocks.set(chKey, []);
          const secBlocks = new Set();
          for (const sec of ch.sections)
            for (const blk of sec.blocks)
              secBlocks.add(blk.rootName);
          for (const d of changed) {
            if (secBlocks.has(d.rootName)) chapterBlocks.get(chKey).push(d);
          }
        }
      }
      // Catch any orphans (removed blocks not in current paper)
      const placed = new Set();
      for (const [, blks] of chapterBlocks) for (const b of blks) placed.add(b.rootName);
      const orphans = changed.filter(b => !placed.has(b.rootName));
      if (orphans.length) { chapterOrder.push('Other'); chapterBlocks.set('Other', orphans); }

      for (const chTitle of chapterOrder) {
        const blks = chapterBlocks.get(chTitle);
        if (!blks?.length) continue;

        const chDiv = mk('div','diff-ch');
        const chHead = mk('div','diff-ch-title');
        chHead.innerHTML = inl(chTitle);
        renderMath(chHead);
        chDiv.appendChild(chHead);

        for (const bd of blks) {
          const card = mk('div',`diff-card ${bd.status}`);
          const head = mk('div','diff-card-head');

          const statusBadge = mk('span',`diff-status ${bd.status}`);
          statusBadge.textContent = bd.status;
          head.appendChild(statusBadge);

          // Line-level +/- stats from diff
          if (bd.mdDiff || bd.leanDiff) {
            const mdOps = bd.mdDiff ? lineDiff(bd.mdDiff.base, bd.mdDiff.head) : [];
            const leanOps = bd.leanDiff ? lineDiff(bd.leanDiff.base, bd.leanDiff.head) : [];
            const allOps = [...mdOps, ...leanOps];
            const a = allOps.filter(o => o.type === 'add').length;
            const d = allOps.filter(o => o.type === 'del').length;
            if (a || d) {
              const stats = mk('span','diff-stats');
              if (a) { const s = mk('span','ds-add'); s.textContent = `+${a}`; stats.appendChild(s); }
              if (d) { const s = mk('span','ds-del'); s.textContent = `−${d}`; stats.appendChild(s); }
              head.appendChild(stats);
            }
          }

          const kind = mk('span','diff-kind');
          kind.textContent = bd.kind;
          head.appendChild(kind);

          const title = mk('span','diff-title');
          title.innerHTML = inl(bd.title || bd.rootName);
          renderMath(title);
          head.appendChild(title);

          // Link to view inline
          if (bd.label) {
            const goto = document.createElement('a');
            goto.className = 'diff-goto';
            goto.textContent = 'view inline ↗';
            goto.href = `#${bd.label}`;
            goto.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              closeDiffOverlay();
              // Enable inline diff mode
              if (!diffMode) toggleDiffMode(true);
              setTimeout(() => {
                const el = document.getElementById(bd.label);
                if (el) {
                  const task = lazyQueue.find(t => t.el === el || t.el.contains?.(el) || el.contains?.(t.el));
                  if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); lazyObs.unobserve(task.el); }
                  el.scrollIntoView({behavior:'smooth',block:'start'});
                  el.style.outline = '2px solid var(--yel)';
                  setTimeout(() => { el.style.outline = ''; }, 2500);
                }
              }, 100);
            };
            head.appendChild(goto);
          }

          // Body (collapsed by default) — tabbed: rendered | raw diff
          const body = mk('div','diff-card-body');

          if (bd.statusDiff) {
            const sc = mk('div','diff-status-change');
            sc.innerHTML = `status: <span style="background:rgba(200,70,70,.15)">${esc(bd.statusDiff.base || 'none')}</span> → <span style="background:rgba(42,170,70,.15)">${esc(bd.statusDiff.head || 'none')}</span>`;
            body.appendChild(sc);
          }

          // Tab bar
          const tabs = mk('div','diff-tabs');
          const tabRendered = mk('button','diff-tab active');
          tabRendered.textContent = 'rendered';
          const tabRaw = mk('button','diff-tab');
          tabRaw.textContent = 'raw diff';
          tabs.appendChild(tabRendered);
          tabs.appendChild(tabRaw);
          body.appendChild(tabs);

          // Panel: rendered markdown
          const panelRendered = mk('div','diff-tab-panel active');
          const headMd = bd.mdDiff?.head ?? (bd.status === 'added' ? (bix.get(bd.label)?.md || '') : null);
          if (headMd != null) {
            const rendered = mk('div','diff-rendered');
            const bb = mk('div','bb');
            const {html: bh, texBlocks: tx} = parseMd(headMd);
            bb.innerHTML = bh;
            fillTex(bb, tx, bix.get(bd.label)?.rendered);
            renderMath(bb); resolveRefs(bb);
            rendered.appendChild(bb);

            // Edit button → navigate to block with editor open
            const editBtn = mk('button','diff-edit-btn');
            editBtn.textContent = 'edit';
            editBtn.onclick = (e) => {
              e.stopPropagation();
              closeDiffOverlay();
              if (bd.label) {
                const chNum = paper?._chapterForLabel?.(bd.label);
                if (chNum != null) paper._showChapter(chNum);
                setTimeout(() => {
                  const el = document.getElementById(bd.label);
                  if (el) {
                    // Hydrate lazy block if needed
                    const task = lazyQueue.find(t => t.el === el || t.el.contains?.(el) || el.contains?.(t.el));
                    if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); lazyObs.unobserve(task.el); }
                    el.scrollIntoView({behavior:'smooth', block:'start'});
                    // Open inline editor
                    setTimeout(() => {
                      if (el._inlineEditor) el._inlineEditor.btn.click();
                    }, 200);
                  }
                }, 100);
              }
            };
            rendered.appendChild(editBtn);
            panelRendered.appendChild(rendered);
          }
          body.appendChild(panelRendered);

          // Panel: raw diff
          const panelRaw = mk('div','diff-tab-panel');
          if (bd.mdDiff) {
            const ops = lineDiff(bd.mdDiff.base, bd.mdDiff.head);
            const pre = document.createElement('pre');
            pre.innerHTML = renderDiffLines(ops);
            panelRaw.appendChild(pre);
          } else if (bd.status === 'added') {
            const blk = bix.get(bd.label);
            if (blk?.md) {
              const pre = document.createElement('pre');
              pre.innerHTML = blk.md.split('\n').map(l => `<span class="diff-line-add">+ ${esc(l)}</span>`).join('\n');
              panelRaw.appendChild(pre);
            }
          }
          if (bd.leanDiff) {
            const lh = mk('div','diff-status-change');
            lh.textContent = 'Lean source changed:';
            panelRaw.appendChild(lh);
            const ops = lineDiff(bd.leanDiff.base, bd.leanDiff.head);
            const pre = document.createElement('pre');
            pre.innerHTML = renderDiffLines(ops);
            panelRaw.appendChild(pre);
          }
          body.appendChild(panelRaw);

          // Tab switching
          tabRendered.onclick = (e) => {
            e.stopPropagation();
            tabRendered.classList.add('active'); tabRaw.classList.remove('active');
            panelRendered.classList.add('active'); panelRaw.classList.remove('active');
          };
          tabRaw.onclick = (e) => {
            e.stopPropagation();
            tabRaw.classList.add('active'); tabRendered.classList.remove('active');
            panelRaw.classList.add('active'); panelRendered.classList.remove('active');
          };

          head.onclick = () => card.classList.toggle('expanded');
          card.appendChild(head);
          card.appendChild(body);
          chDiv.appendChild(card);
        }

        diffBody.appendChild(chDiv);
      }
    }

    function openDiffOverlay() {
      diffOverlay.classList.add('open');
      diffBtn.classList.add('on');
    }
    function closeDiffOverlay() {
      diffOverlay.classList.remove('open');
    }
    document.getElementById('diff-close').onclick = closeDiffOverlay;

    // Toggle inline diff mode (red/green highlights on blocks)
    function toggleDiffMode(force) {
      diffMode = typeof force === 'boolean' ? force : !diffMode;
      diffBtn.classList.toggle('on', diffMode || diffOverlay.classList.contains('open'));
      if (diffMode && diffData) {
        applyInlineDiffs(diffData);
      } else {
        clearInlineDiffs();
      }
    }

    function applyInlineDiffs(data) {
      // Build map of base content
      diffBaseBlocks.clear();
      for (const bd of data.blocks) {
        if (bd.mdDiff) diffBaseBlocks.set(bd.rootName, bd.mdDiff.base);
        if (bd.status === 'added') diffBaseBlocks.set(bd.rootName, null); // new block
        if (bd.status === 'removed') diffBaseBlocks.set(bd.rootName, bd.rootName); // sentinel
      }

      // Walk all rendered blocks and annotate
      for (const [label, block] of bix) {
        const el = document.getElementById(label);
        if (!el) continue;
        const bd = data.blocks.find(b => b.rootName === block.rootName);
        if (!bd || bd.status === 'unchanged') {
          el.style.removeProperty('outline');
          continue;
        }

        // Skip whitespace-only changes
        if (bd.status === 'changed' && bd.mdDiff && !bd.leanDiff && !bd.statusDiff) {
          const base = (bd.mdDiff.base || '').replace(/\s+/g, '');
          const head = (bd.mdDiff.head || '').replace(/\s+/g, '');
          if (base === head) { el.style.removeProperty('outline'); continue; }
        }

        if (bd.status === 'added') {
          el.style.outline = '2px solid var(--grn)';
          el.title = 'New in this branch';
        } else if (bd.status === 'changed') {
          el.style.outline = '2px solid var(--yel)';
          // If the block body is hydrated, show inline diff
          const bb = el.querySelector('.bb');
          if (bb && bd.mdDiff) {
            const ops = lineDiff(bd.mdDiff.base, bd.mdDiff.head);
            const diffHtml = ops.map(op => {
              if (op.type === 'add') return `<div class="inline-diff-add">${inl(op.text)}</div>`;
              if (op.type === 'del') return `<div class="inline-diff-del">${inl(op.text)}</div>`;
              return `<div>${inl(op.text)}</div>`;
            }).join('');
            bb.innerHTML = diffHtml;
            renderMath(bb);
            bb.dataset.diffActive = '1';
          }
        }
      }
    }

    function clearInlineDiffs() {
      diffBaseBlocks.clear();
      for (const [label, block] of bix) {
        const el = document.getElementById(label);
        if (!el) continue;
        el.style.removeProperty('outline');
        // Restore original content if diff was applied
        const bb = el.querySelector('.bb');
        if (bb?.dataset.diffActive) {
          delete bb.dataset.diffActive;
          const {html: bh, texBlocks: tx} = parseMd(block.md || '');
          bb.innerHTML = bh;
          fillTex(bb, tx, block.rendered);
          renderMath(bb); resolveRefs(bb);
        }
      }
    }

    // Diff button: click toggles diff highlighting + overlay
    diffBtn.addEventListener('click', async () => {
      // If already on, turn everything off
      if (diffMode) {
        toggleDiffMode(false);
        closeDiffOverlay();
        return;
      }
      // Turn on: load diff data if needed, enable highlighting, open overlay
      const needsLoad = !diffData || diffData.head !== (selectedBranch || currentBranchName);
      if (needsLoad) {
        diffTitle.textContent = 'Loading diff…';
        diffSummaryEl.innerHTML = '';
        diffBody.innerHTML = '<div class="diff-loading"><div class="spinner"></div>Comparing branches…</div>';
        openDiffOverlay();
        diffData = await loadDiff();
      }
      if (diffData) {
        renderDiffOverlay(diffData);
        toggleDiffMode(true);
        if (!needsLoad) openDiffOverlay();
      } else {
        const head = selectedBranch || currentBranchName;
        diffTitle.textContent = 'Diff unavailable';
        diffSummaryEl.innerHTML = '';
        diffBody.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--fg-d)">${
          head === 'main' || head === 'master'
            ? 'You are on the main branch — switch to a feature branch to see changes.'
            : !paper?.id
              ? 'No paper is loaded. Open a paper first, then try diff.'
              : 'Could not load diff from server. Check that the API is running and the branch exists on the remote.'
        }</div>`;
        if (!needsLoad) openDiffOverlay();
      }
    });

    // ── Start routing (after all UI initialized) ──────────
    window.addEventListener('hashchange', route);
    route();

    // ── Claude Chat Assistant ─────────────────────────────
    const chatFab = document.getElementById('claude-fab');
    const chatPanel = document.getElementById('chat-panel');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const chatTyping = document.getElementById('chat-typing');
    const chatModeEl = document.getElementById('chat-mode');
    const chatActions = document.getElementById('chat-actions');

    let chatHistory = []; // {role, content}
    let chatStreaming = false;
    let chatInitialized = false;
    let chatOpen = false;

    // Determine mode: reading mode = reader, otherwise editor
    function getChatMode() {
      return readingMode ? 'read' : 'edit';
    }

    function updateChatMode() {
      const mode = getChatMode();
      chatModeEl.textContent = mode === 'read' ? 'reader' : 'editor';
    }

    // Track visible blocks for context awareness
    let visibleBlocks = []; // [{label, kind, title}] — blocks currently on screen
    let chatCtxLabel = null; // current context block label
    let chatCtxSource = null; // 'scroll' | 'hover' — how context was determined
    const chatCtxEl = document.getElementById('chat-ctx');

    function updateVisibleBlocks() {
      const vb = [];
      const viewTop = 0;
      const viewBottom = window.innerHeight;
      for (const [label, block] of bix) {
        const el = document.getElementById(label);
        if (!el) continue;
        const r = el.getBoundingClientRect();
        if (r.bottom > viewTop && r.top < viewBottom) {
          vb.push({ label, kind: block.kind, title: block.title || label });
        }
      }
      visibleBlocks = vb;
      // Update context from scroll (center block) unless hover is active
      if (chatCtxSource !== 'hover') {
        const viewY = window.innerHeight / 2;
        let found = null;
        for (const [label, block] of bix) {
          const el = document.getElementById(label);
          if (!el) continue;
          const r = el.getBoundingClientRect();
          if (r.top < viewY && r.bottom > viewY - 100) { found = label; break; }
        }
        if (found && found !== chatCtxLabel) {
          chatCtxLabel = found;
          chatCtxSource = 'scroll';
          updateChatCtxDisplay();
        }
      }
    }

    function updateChatCtxDisplay() {
      if (!chatCtxLabel) { chatCtxEl.classList.remove('active'); return; }
      const block = bix.get(chatCtxLabel);
      const kind = block?.kind || '';
      const title = block?.title || chatCtxLabel;
      chatCtxEl.innerHTML = `<span class="ctx-kind">${esc(kind)}</span><span class="ctx-label" data-label="${esc(chatCtxLabel)}">${esc(chatCtxLabel)}</span> ${esc(title)}`;
      chatCtxEl.classList.add('active');
    }

    // Click on context label → scroll to block
    chatCtxEl.addEventListener('click', (e) => {
      const lbl = e.target.closest('.ctx-label');
      if (lbl?.dataset.label) scrollToLabel(lbl.dataset.label);
    });

    // Track hover over content blocks
    let hoverResetTimer = null;
    document.addEventListener('mouseover', (e) => {
      const blkEl = e.target.closest?.('.env[id], .blk[id]');
      if (blkEl && bix.has(blkEl.id)) {
        clearTimeout(hoverResetTimer);
        chatCtxLabel = blkEl.id;
        chatCtxSource = 'hover';
        updateChatCtxDisplay();
      }
    });
    document.addEventListener('mouseout', (e) => {
      const blkEl = e.target.closest?.('.env[id], .blk[id]');
      if (blkEl && chatCtxSource === 'hover') {
        // Reset to scroll-based context after a short delay
        clearTimeout(hoverResetTimer);
        hoverResetTimer = setTimeout(() => {
          chatCtxSource = 'scroll';
          updateVisibleBlocks();
        }, 1500);
      }
    });

    // Update on scroll (debounced)
    let visibleTimer = null;
    window.addEventListener('scroll', () => {
      clearTimeout(visibleTimer);
      visibleTimer = setTimeout(updateVisibleBlocks, 200);
    }, { passive: true });

    // Get context: tracked context block, selected text, visible blocks
    function getChatContext() {
      updateVisibleBlocks();
      const ctx = { paperId: paper?.id, visibleBlocks };
      // Check for text selection
      const sel = window.getSelection();
      if (sel && sel.toString().trim().length > 5) {
        ctx.selectedText = sel.toString().trim();
        const anchor = sel.anchorNode?.parentElement?.closest?.('.env[id], .blk[id]');
        if (anchor) {
          const label = anchor.id;
          const block = bix.get(label);
          if (block) {
            ctx.blockLabel = label;
            ctx.blockMd = block.md;
            ctx.blockKind = block.kind;
          }
        }
      }
      // Use tracked context block (from scroll or hover)
      if (!ctx.blockLabel && chatCtxLabel) {
        const block = bix.get(chatCtxLabel);
        if (block) {
          ctx.blockLabel = chatCtxLabel;
          ctx.blockMd = block.md;
          ctx.blockKind = block.kind;
        }
      }
      return ctx;
    }

    function addChatMessage(role, content) {
      const div = mk('div', `chat-msg ${role}`);
      if (role === 'assistant') {
        const {html: renderedHtml, texBlocks: tx} = parseMd(content);
        div.innerHTML = renderedHtml;
        fillTex(div, tx);
        renderMath(div);
        resolveRefs(div);
      } else if (role === 'system') {
        div.innerHTML = inl(content);
        renderMath(div);
      } else {
        div.textContent = content;
      }
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }

    const chatSuggestions = document.getElementById('chat-suggestions');

    function showSuggestions(options) {
      chatSuggestions.innerHTML = '';
      if (!options || !options.length) { chatSuggestions.classList.remove('active'); return; }
      for (const opt of options) {
        const btn = mk('button', 'chat-sug');
        btn.textContent = opt;
        btn.onclick = () => {
          clearSuggestions();
          sendChatMessage(opt);
        };
        chatSuggestions.appendChild(btn);
      }
      chatSuggestions.classList.add('active');
    }

    function clearSuggestions() {
      chatSuggestions.innerHTML = '';
      chatSuggestions.classList.remove('active');
    }

    function appendChatError(container, message) {
      const err = mk('div','chat-err');
      const icon = mk('span','');
      icon.textContent = '⚠';
      icon.style.cssText = 'cursor:pointer;color:var(--red);font-size:.85rem';
      icon.title = 'Error — click for details';
      const detail = mk('div','');
      detail.style.cssText = 'display:none;margin-top:.3rem;padding:.3rem .5rem;background:var(--bg-r);border:1px solid var(--red);border-radius:4px;font-family:var(--f-mono);font-size:.6rem;color:var(--red);word-break:break-word;white-space:pre-wrap';
      detail.textContent = message;
      icon.onclick = () => { detail.style.display = detail.style.display === 'none' ? '' : 'none'; };
      err.appendChild(icon);
      err.appendChild(detail);
      container.appendChild(err);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendChatMessage(text) {
      if (chatStreaming || !text.trim()) return;
      clearSuggestions();

      chatHistory.push({ role: 'user', content: text.trim() });
      addChatMessage('user', text.trim());
      chatInput.value = '';
      chatInput.style.height = 'auto';
      chatStreaming = true;
      chatSend.disabled = true;
      chatTyping.classList.add('active');

      const mode = getChatMode();
      const context = getChatContext();

      // Create assistant message container for streaming
      const assistDiv = mk('div', 'chat-msg assistant');
      chatMessages.appendChild(assistDiv);

      let fullResponse = '';
      let firstTextReceived = false;

      try {
        const abort = new AbortController();
        const timeout = setTimeout(() => abort.abort(), 60000); // 60s timeout
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: chatHistory.slice(-10),
            context,
            mode,
          }),
          signal: abort.signal,
        });
        clearTimeout(timeout);

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: 'Unknown error' }));
          throw new Error(err.error || `HTTP ${res.status}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6);
            if (data === '[DONE]') break;
            try {
              const parsed = JSON.parse(data);
              if (parsed.status) {
                // Progress update during tool-use rounds
                if (!firstTextReceived) {
                  assistDiv.innerHTML = `<span style="color:var(--fg-d);font-size:.7rem;font-style:italic">${esc(parsed.status)}</span>`;
                  chatMessages.scrollTop = chatMessages.scrollHeight;
                }
              }
              if (parsed.text) {
                firstTextReceived = true;
                fullResponse += parsed.text;
                const {html: renderedHtml, texBlocks: tx} = parseMd(fullResponse);
                assistDiv.innerHTML = renderedHtml;
                fillTex(assistDiv, tx);
                renderMath(assistDiv);
                resolveRefs(assistDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
              }
              if (parsed.error) {
                appendChatError(assistDiv, parsed.error);
              }
            } catch (e) {
              if (e.message !== 'Unexpected end of JSON input') console.warn('Chat parse:', e);
            }
          }
        }

        // Parse and display suggestions from the response
        const sugMatch = fullResponse.match(/\[suggestions?\]:\s*(.+)$/im);
        if (sugMatch) {
          // Strip suggestions line from displayed content
          fullResponse = fullResponse.replace(/\n?\[suggestions?\]:\s*(.+)$/im, '');
          const {html: finalHtml, texBlocks: ftx} = parseMd(fullResponse);
          assistDiv.innerHTML = finalHtml;
          fillTex(assistDiv, ftx);
          renderMath(assistDiv);
          resolveRefs(assistDiv);

          // Render suggestion buttons
          const suggestions = sugMatch[1].split('|').map(s => s.trim()).filter(Boolean);
          showSuggestions(suggestions);
        }

        chatHistory.push({ role: 'assistant', content: fullResponse });

        // Check if error was reported — offer to create todo
        if (mode !== 'read' && /error|mistake|wrong|incorrect|typo|bug/i.test(chatHistory[chatHistory.length - 2]?.content || '')) {
          const todoBtn = mk('button', 'chat-action');
          todoBtn.textContent = 'Create feedback todo from this';
          todoBtn.style.margin = '.3rem 0';
          todoBtn.onclick = async () => {
            const ctx = getChatContext();
            if (!ctx.blockLabel || !paper?.id) {
              addChatMessage('system', 'Could not determine which block to attach feedback to. Navigate to a block first.');
              return;
            }
            const userMsg = chatHistory[chatHistory.length - 2]?.content || '';
            try {
              const res = await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  paperId: paper.id,
                  rootName: ctx.blockLabel.replace(/^(def|thm|lem|prop|cor|rem|ex):/, ''),
                  summary: userMsg.slice(0, 80),
                  comment: userMsg,
                  priority: 'medium',
                  assignee: 'editor-agent',
                }),
              });
              if (res.ok) {
                addChatMessage('system', 'Feedback todo created.');
                todoBtn.remove();
              }
            } catch (e) {
              addChatMessage('system', 'Failed to create todo: ' + e.message);
            }
          };
          chatMessages.appendChild(todoBtn);
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }

      } catch (e) {
        const msg = e.name === 'AbortError' ? 'Request timed out — try again or simplify your question' : (e.message || 'Request failed');
        appendChatError(assistDiv, msg);
      } finally {
        chatStreaming = false;
        chatSend.disabled = false;
        chatTyping.classList.remove('active');
      }
    }

    // Quick prompt definitions (mode-aware)
    const QUICK_PROMPTS = {
      read: [
        { label: 'explain', prompt: 'Explain this content in simple terms' },
        { label: 'key ideas', prompt: 'What are the key concepts I should understand here?' },
        { label: 'connections', prompt: 'How does this connect to other parts of the paper?' },
      ],
      edit: [
        { label: 'status', prompt: 'Give me a quick overview of what needs attention in this paper.' },
        { label: 'review block', prompt: 'Review the current block for correctness and completeness.' },
        { label: 'suggest todos', prompt: 'What todos should I create for the blocks visible on screen?' },
      ],
    };

    function renderQuickPrompts() {
      const mode = getChatMode();
      const prompts = QUICK_PROMPTS[mode] || QUICK_PROMPTS.read;
      chatActions.innerHTML = '';
      for (const p of prompts) {
        const btn = mk('button','chat-action');
        btn.dataset.prompt = p.prompt;
        btn.textContent = p.label;
        chatActions.appendChild(btn);
      }
      // Always add voice button
      const voiceBtn = mk('button','chat-action');
      voiceBtn.id = 'chat-voice';
      voiceBtn.textContent = 'mic';
      voiceBtn.title = 'Voice input (click to start/stop)';
      voiceBtn.style.cssText = 'border-color:var(--ac);color:var(--ac)';
      chatActions.appendChild(voiceBtn);
      setupVoiceInput(voiceBtn);
    }

    // Voice input for chat
    let voiceRecognition = null;
    let voiceActive = false;
    function setupVoiceInput(btn) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { btn.style.display = 'none'; return; }

      btn.onclick = () => {
        if (voiceActive) {
          voiceRecognition?.stop();
          return;
        }
        voiceRecognition = new SpeechRecognition();
        voiceRecognition.continuous = true;
        voiceRecognition.interimResults = true;
        voiceRecognition.lang = 'en-US';
        voiceActive = true;
        btn.textContent = 'stop';
        btn.style.background = 'var(--red)';
        btn.style.color = '#fff';

        let finalTranscript = chatInput.value;
        voiceRecognition.onresult = (e) => {
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) {
              finalTranscript += e.results[i][0].transcript + ' ';
            } else {
              interim += e.results[i][0].transcript;
            }
          }
          chatInput.value = finalTranscript + interim;
          chatInput.dispatchEvent(new Event('input'));
        };
        voiceRecognition.onend = () => {
          voiceActive = false;
          btn.textContent = 'mic';
          btn.style.background = '';
          btn.style.color = 'var(--ac)';
          chatInput.value = finalTranscript.trim();
          if (chatInput.value) chatInput.focus();
        };
        voiceRecognition.onerror = () => {
          voiceActive = false;
          btn.textContent = 'mic';
          btn.style.background = '';
          btn.style.color = 'var(--ac)';
        };
        voiceRecognition.start();
      };
    }

    // FAB toggle
    chatFab.onclick = () => {
      chatOpen = !chatOpen;
      chatPanel.classList.toggle('open', chatOpen);
      chatFab.classList.toggle('open', chatOpen);
      if (chatOpen) {
        updateChatMode();
        renderQuickPrompts();
        chatInput.focus();
        if (!chatInitialized) {
          chatInitialized = true;
          const mode = getChatMode();
          if (mode === 'read') {
            addChatMessage('assistant', 'What would you like to learn? Pick a quick prompt above or type your question.');
          } else {
            addChatMessage('assistant', 'Editor mode. Pick a quick action above, use voice, or type your question.');
          }
        }
      }
    };

    // Expand/collapse button
    document.getElementById('chat-expand').onclick = () => {
      const expanding = !chatPanel.classList.contains('expanded');
      chatPanel.classList.toggle('expanded');
      chatFab.style.display = expanding ? 'none' : '';
    };

    // Close button
    document.getElementById('chat-close').onclick = () => {
      chatOpen = false;
      chatPanel.classList.remove('open', 'expanded');
      chatFab.classList.remove('open');
      chatFab.style.display = '';
    };

    // Clear button
    document.getElementById('chat-clear').onclick = () => {
      chatHistory = [];
      chatMessages.innerHTML = '';
      chatInitialized = false;
      addChatMessage('system', 'Chat cleared.');
    };

    // Quick action buttons
    chatActions.addEventListener('click', (e) => {
      const btn = e.target.closest('.chat-action');
      if (!btn || !btn.dataset.prompt) return;
      const prompt = btn.dataset.prompt;
      if (prompt.endsWith(':')) {
        // Partial prompt — put in input for user to complete
        chatInput.value = prompt + ' ';
        chatInput.focus();
      } else {
        sendChatMessage(prompt);
      }
    });

    // Send on click or Enter (Shift+Enter for newline)
    chatSend.onclick = () => sendChatMessage(chatInput.value);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage(chatInput.value);
      }
    });

    // Auto-resize textarea
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 80) + 'px';
    });

    // Update chat mode when reading mode toggles
    const origBtnRdClick = btnRd.onclick;
    btnRd.addEventListener('click', () => {
      setTimeout(updateChatMode, 0);
    });
  </script>
  <!-- Error dialog (copyable text) -->
  <div id="err-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center">
    <div style="background:var(--bg,#1a1a2e);color:var(--fg,#e0e0e0);border:1px solid #444;border-radius:8px;max-width:700px;width:90%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.4)">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #333">
        <strong id="err-title" style="font-size:14px">Error</strong>
        <div style="display:flex;gap:8px">
          <button id="err-copy" style="font-size:12px;padding:4px 10px;cursor:pointer;border:1px solid #555;border-radius:4px;background:transparent;color:inherit">Copy</button>
          <button id="err-close" style="font-size:16px;padding:2px 8px;cursor:pointer;border:none;background:transparent;color:inherit">&times;</button>
        </div>
      </div>
      <pre id="err-body" style="margin:0;padding:16px;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;flex:1"></pre>
    </div>
  </div>
  <script>
    (function() {
      const overlay = document.getElementById('err-overlay');
      const title = document.getElementById('err-title');
      const body = document.getElementById('err-body');
      const copyBtn = document.getElementById('err-copy');
      const closeBtn = document.getElementById('err-close');

      window.showError = function(heading, text) {
        title.textContent = heading;
        body.textContent = text;
        overlay.style.display = 'flex';
      };
      closeBtn.onclick = () => { overlay.style.display = 'none'; };
      overlay.onclick = (e) => { if (e.target === overlay) overlay.style.display = 'none'; };
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(body.textContent).then(() => {
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
        });
      };
    })();
  </script>
</body>
