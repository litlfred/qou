<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <style>
    :root { --ease: cubic-bezier(0.4,0,0.2,1); }

    [data-theme="dark"] {
      --bg:#0e0e12; --bg-s:#16161c; --bg-r:#1e1e26; --bg-c:#12121a;
      --fg:#c8c8d0; --fg-d:#70707c; --fg-b:#eeeef4;
      --ac:#7ca8e6; --ac-d:#4a6a9a;
      --grn:#7ce6a4; --yel:#e6c87c; --red:#e67c7c; --ora:#e6a47c;
      --brd:#2a2a34;
      --svg-f:invert(1) hue-rotate(180deg);
    }
    [data-theme="light"] {
      --bg:#fafafa; --bg-s:#ffffff; --bg-r:#f0f0f4; --bg-c:#f5f5fa;
      --fg:#2c2c34; --fg-d:#888894; --fg-b:#111118;
      --ac:#2a6bc4; --ac-d:#6a9ad4;
      --grn:#1a8a44; --yel:#9a7a20; --red:#c44a4a; --ora:#b07030;
      --brd:#d8d8e0;
      --svg-f:none;
    }
    [data-font="paper"] {
      --f-body:'Crimson Pro','Georgia',serif;
      --f-head:'Inter','Helvetica Neue',sans-serif;
      --f-mono:'JetBrains Mono','Consolas',monospace;
      --f-sz:19px; --f-lh:1.75;
    }
    [data-font="web"] {
      --f-body:'Literata','Georgia',serif;
      --f-head:'Inter','Helvetica Neue',sans-serif;
      --f-mono:'JetBrains Mono','Consolas',monospace;
      --f-sz:17px; --f-lh:1.65;
    }
    html{scroll-behavior:smooth;scroll-padding-top:50px}
    .ch-t,.sec-t,.env[id],.blk[id]{scroll-margin-top:50px}

    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--f-sz);line-height:var(--f-lh);min-height:100vh;transition:background .3s var(--ease),color .2s var(--ease)}

    /* Controls */
    .ctrl{position:fixed;top:0;left:0;right:0;height:34px;background:var(--bg-s);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 1rem;font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);z-index:100;gap:.6rem}
    .ctrl button{background:var(--bg-r);border:1px solid var(--brd);color:var(--fg-d);font-family:var(--f-mono);font-size:.6rem;padding:.15rem .5rem;border-radius:3px;cursor:pointer;transition:all .15s}
    .ctrl button:hover{color:var(--fg-b);border-color:var(--ac-d)}
    .ctrl button.on{color:var(--ac);border-color:var(--ac)}
    .ctrl .sp{flex:1}
    .ctrl select{background:var(--bg-r);border:1px solid var(--brd);color:var(--fg-d);font-family:var(--f-mono);font-size:.6rem;padding:.15rem .3rem;border-radius:3px;max-width:160px}
    /* Searchable branch picker */
    .br-picker{position:relative;display:inline-block}
    .br-picker input{background:var(--bg-r);border:1px solid var(--brd);color:var(--fg);font-family:var(--f-mono);font-size:.6rem;padding:.15rem .4rem;border-radius:3px;width:150px;outline:none}
    .br-picker input:focus{border-color:var(--ac)}
    .br-picker input::placeholder{color:var(--fg-d)}
    .br-drop{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg-s);border:1px solid var(--brd);border-top:none;border-radius:0 0 4px 4px;max-height:200px;overflow-y:auto;z-index:110;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .br-drop.open{display:block}
    .br-opt{padding:.25rem .5rem;font-family:var(--f-mono);font-size:.58rem;color:var(--fg-d);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .br-opt:hover,.br-opt.active{background:var(--bg-r);color:var(--fg)}
    .br-opt.current{font-weight:600;color:var(--ac)}
    .br-opt .br-head{font-size:.45rem;color:var(--fg-d);margin-left:.3rem}
    .ctrl .hash{font-size:.55rem;opacity:.4}

    /* Layout */
    #app{max-width:960px;margin:0 auto;padding:48px 1.5rem 4rem}
    body.has-sidebar #app{margin-left:44px;transition:margin-left .2s var(--ease)}
    body.has-sidebar.sb-peek #app{margin-left:290px}

    /* Sidebar — collapsed strip by default, expands on hover */
    #sidebar{display:none}
    body.has-sidebar #sidebar{
      display:block;position:fixed;top:34px;left:0;bottom:0;
      width:36px;overflow:hidden;
      background:var(--bg-s);border-right:1px solid var(--brd);
      z-index:90;font-family:var(--f-head);font-size:.72rem;
      transition:width .2s var(--ease),box-shadow .2s var(--ease);
    }
    body.has-sidebar #sidebar:hover,
    body.has-sidebar.sb-pinned #sidebar,
    body.has-sidebar.sb-open #sidebar{
      width:280px;overflow-y:auto;padding:.6rem 0;
      box-shadow:4px 0 20px rgba(0,0,0,.08);
    }
    /* Pin indicator */
    .sb-pin{position:sticky;top:0;z-index:1;display:flex;justify-content:flex-end;padding:.2rem .4rem;background:var(--bg-s)}
    .sb-pin button{background:none;border:none;color:var(--fg-d);cursor:pointer;font-size:.65rem;font-family:var(--f-mono)}
    .sb-pin button:hover{color:var(--ac)}
    body.sb-pinned .sb-pin button{color:var(--ac)}

    /* Collapsed state: show only chapter numbers */
    body.has-sidebar:not(.sb-pinned):not(.sb-open) #sidebar:not(:hover) .sb-sec,
    body.has-sidebar:not(.sb-pinned):not(.sb-open) #sidebar:not(:hover) .sb-blk,
    body.has-sidebar:not(.sb-pinned):not(.sb-open) #sidebar:not(:hover) .sb-ch-body,
    body.has-sidebar:not(.sb-pinned):not(.sb-open) #sidebar:not(:hover) .sb-pin{display:none}
    body.has-sidebar:not(.sb-pinned):not(.sb-open) #sidebar:not(:hover) .sb-ch{
      font-size:0;line-height:0;border-bottom:none;
      padding:.6rem 0;text-align:center;margin:0;
    }
    body.has-sidebar:not(.sb-pinned):not(.sb-open) #sidebar:not(:hover) .sb-ch::before{
      content:attr(data-num);font-size:.75rem;line-height:1;font-weight:700;color:var(--fg-d);
    }
    body.has-sidebar:not(.sb-pinned):not(.sb-open) #sidebar:not(:hover) .sb-ch.active::before{color:var(--ac)}

    .sb-ch{padding:.4rem .8rem .2rem;color:var(--fg-b);cursor:pointer;font-weight:600;font-size:.7rem;border-bottom:1px solid var(--brd);margin-top:.3rem;display:flex;align-items:center;gap:.3rem}
    .sb-ch:hover{color:var(--ac)}
    .sb-ch.active{color:var(--ac)}
    .sb-ch .sb-arrow{font-size:.5rem;transition:transform .15s;flex-shrink:0}
    .sb-ch.open .sb-arrow{transform:rotate(90deg)}
    .sb-ch-body{display:none;overflow:hidden}
    .sb-ch.open+.sb-ch-body{display:block}
    .sb-ch .katex,.sb-ch .katex *{color:inherit!important}
    .sb-sec{padding:.25rem .8rem .25rem 1.2rem;color:var(--fg);cursor:pointer;font-size:.68rem;border-left:2px solid transparent;transition:border-color .15s}
    .sb-sec:hover{color:var(--ac);border-left-color:var(--ac)}
    .sb-sec.active{color:var(--ac);border-left-color:var(--ac);font-weight:500}
    .sb-sec .katex,.sb-sec .katex *{color:inherit!important}
    .sb-blk{padding:.15rem .8rem .15rem 1.8rem;color:var(--fg-d);cursor:pointer;font-size:.6rem;font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.3rem}
    .sb-blk:hover{color:var(--fg)}
    .sb-blk .katex,.sb-blk .katex *{color:inherit!important}
    .sb-blk .sb-name{flex:1;overflow:hidden;text-overflow:ellipsis}
    .sb-badge{font-size:.55rem;padding:.05rem .35rem;border-radius:3px;line-height:1.4;flex-shrink:0;cursor:default;position:relative;letter-spacing:.02em}
    .sb-badge.todo{background:var(--ac);color:var(--bg)}
    .sb-badge.lean-ok{background:#2a5;color:#fff}
    .sb-badge.lean-warn{background:#c90;color:#fff}
    .sb-badge.lean-err{background:#c33;color:#fff}
    .sb-badge.lean-miss{background:#666;color:#ccc}
    .sb-badge::after{content:attr(data-tip);position:absolute;right:0;top:100%;margin-top:4px;background:var(--fg-b);color:var(--bg);padding:.25rem .45rem;border-radius:4px;font-size:.6rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:200;font-family:var(--f-text);letter-spacing:0}
    .sb-badge:hover::after{opacity:1}
    .sb-toggle{display:none;position:fixed;top:34px;left:0;z-index:95;background:var(--bg-s);border:1px solid var(--brd);border-left:none;border-top:none;border-radius:0 0 4px 0;padding:.3rem .5rem;font-size:.7rem;color:var(--fg-d);cursor:pointer;font-family:var(--f-mono)}
    .sb-toggle:hover{color:var(--ac)}

    /* Tablet: overlay sidebar */
    @media(max-width:900px){
      body.has-sidebar #app{margin-left:0!important}
      body.has-sidebar #sidebar{display:none!important;width:300px}
      .sb-toggle{display:block}
      body.sb-open #sidebar{display:block!important;width:min(300px,80vw);box-shadow:4px 0 20px rgba(0,0,0,.3);overflow-y:auto;padding:.6rem 0}
    }
    /* Phone: full-width overlay */
    @media(max-width:500px){
      body.sb-open #sidebar{width:100vw;border-right:none}
    }

    /* Header */
    .hdr{text-align:center;padding:2.5rem 0 2rem;border-bottom:1px solid var(--brd);margin-bottom:2rem}
    .hdr h1{font-family:var(--f-head);font-size:1.9rem;font-weight:600;color:var(--fg-b);margin-bottom:.4rem}
    .hdr .au{font-family:var(--f-head);font-size:.9rem;color:var(--fg-d)}
    .hdr .af{font-family:var(--f-head);font-size:.75rem;color:var(--fg-d);font-style:italic;margin-top:.1rem}
    .hdr .dt{font-family:var(--f-mono);font-size:.75rem;color:var(--fg-d);margin-top:.2rem}

    /* Structure */
    .ch{margin-bottom:3rem}
    .ch-t{font-family:var(--f-head);font-size:1.5rem;font-weight:600;color:var(--fg-b);margin-bottom:1.5rem;padding-bottom:.4rem;border-bottom:1px solid var(--brd);display:flex;align-items:baseline;gap:.6rem}
    .ch-t .n{color:var(--ac);font-weight:400}
    .ch-t .ch-title-text{flex:1}
    .sec-t{font-family:var(--f-head);font-size:1.2rem;font-weight:500;color:var(--fg-b);margin:2rem 0 1rem;display:flex;align-items:baseline;gap:.5rem}
    .sec-t .sec-title-text{flex:1}
    .sec-n{display:none}
    /* Chapter/section feedback actions — right-aligned, inline with title */
    .struct-acts{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
    .struct-acts .sa-btn{font-family:var(--f-mono);font-size:.55rem;color:var(--fg-d);background:none;border:1px solid transparent;border-radius:2px;padding:.1rem .35rem;cursor:pointer;white-space:nowrap;transition:all .15s}
    .struct-acts .sa-btn:hover{color:var(--ac);border-color:var(--ac-d)}
    .struct-acts .sa-count{font-family:var(--f-mono);font-size:.55rem;color:var(--ac);background:var(--bg-r);border-radius:8px;padding:0 .35rem;line-height:1.5;min-width:1.2rem;text-align:center}
    body.reading .struct-acts{display:none!important}

    /* Blocks */
    .blk{margin:1.5rem 0;position:relative}
    .env{background:var(--bg-s);border:1px solid var(--brd);border-left:3px solid var(--ac-d);border-radius:4px;padding:1rem 1.25rem;margin:1.5rem 0;position:relative}
    .env.definition{border-left-color:var(--ac)}
    .env.theorem,.env.proposition{border-left-color:var(--yel)}
    .env.lemma,.env.corollary{border-left-color:var(--ora)}
    .env.conjecture{border-left-color:var(--red)}
    .env.example{border-left-color:var(--grn)}
    .env.remark{border-left-color:var(--fg-d)}

    /* Collapsed remark/example stub */
    .blk-stub{margin:.4rem 0;display:flex;align-items:center;gap:.4rem;cursor:pointer;padding:.25rem .6rem;border-radius:3px;border:1px dashed var(--brd);font-family:var(--f-head);font-size:.7rem;color:var(--fg-d);transition:all .15s}
    .blk-stub:hover{border-color:var(--ac-d);color:var(--fg)}
    .blk-stub .stub-kind{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:.6rem}
    .blk-stub.remark .stub-kind{color:var(--fg-d)}
    .blk-stub.example .stub-kind{color:var(--grn)}
    .blk-stub.proof .stub-kind{color:var(--fg-d);font-style:italic}

    /* Lean source code block */
    /* Block header proof/lean indicators */
    .bh-indicators{display:inline-flex;align-items:center;gap:.4rem;margin-left:.5rem;font-family:var(--f-mono);font-size:.65rem}
    .bh-ind{display:inline-flex;align-items:center;gap:.2rem;cursor:pointer;padding:.1rem .3rem;border-radius:3px;transition:background .15s}
    .bh-ind:hover{background:var(--bg-r)}
    .bh-ind .ind-sym{font-size:.8rem}
    .bh-ind .ind-badge{font-size:.5rem;padding:.05rem .25rem;border-radius:3px;line-height:1.3;font-weight:500}
    .bh-ind .ind-badge.ok{background:var(--grn);color:#fff}
    .bh-ind .ind-badge.warn{background:var(--yel);color:#fff}
    .bh-ind .ind-badge.err{background:var(--red);color:#fff}
    .bh-ind .ind-badge.miss{background:var(--bg-r);color:var(--fg-d);border:1px solid var(--brd)}
    .bh-ind .ind-badge.stub{background:var(--ora);color:#fff}
    .bh-ind .ind-label{font-size:.5rem;color:var(--fg-d)}

    .lean-src{margin-top:.5rem;border:1px solid var(--brd);border-radius:4px;overflow:hidden}
    .lean-src-hdr{display:flex;align-items:center;justify-content:space-between;padding:.25rem .6rem;background:var(--bg-r);border-bottom:1px solid var(--brd);font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d)}
    .lean-src pre{margin:0;padding:.6rem .8rem;font-family:var(--f-mono);font-size:.75rem;line-height:1.5;overflow-x:auto;background:var(--bg-c)!important}
    .lean-src code{font-family:var(--f-mono);font-size:.75rem}
    .collapse-btn{position:absolute;top:.3rem;right:.4rem;background:none;border:none;color:var(--fg-d);cursor:pointer;font-size:.9rem;line-height:1;padding:.1rem .3rem;opacity:0;transition:opacity .15s}
    .env:hover .collapse-btn{opacity:.5}
    .collapse-btn:hover{opacity:1!important;color:var(--fg-b)}
    /* Print styles — paper-like output */
    @media print{
      /* ── Hide all UI chrome ─────────────────────────────── */
      .ctrl,#sidebar,.sb-toggle,.fb-act,.st,.bsrc,.collapse-btn,
      .todo-inline,.blk-stub,.feedback-overlay,.feedback-panel,.diff-overlay,
      .claude-fab,.chat-panel,
      .hash,.decor,.lb,.blk-foot,.bl,.sb-badge,.ex-toggle,
      .ex-panel,.anchor-icon,.bh-copied,.bh-acts,.bh-menu,
      .bh-drop,.tags,.uses,.uref,.upnl,.lean-src{display:none!important}
      body.has-sidebar #app{margin-left:0!important}

      /* ── Page geometry (LaTeX article defaults) ─────────── */
      @page{
        size:letter;
        margin:1in 1.25in;
      }
      @page:first{margin-top:1.5in}

      /* ── Base typography — Latin Modern / Computer Modern ── */
      html{font-size:11pt}
      body{
        font-family:'Latin Modern Roman','CMU Serif','Computer Modern','Crimson Pro','Times New Roman',serif!important;
        line-height:1.45;
        color:#000!important;
        background:#fff!important;
        orphans:3;widows:3;
      }
      #app{max-width:100%!important;padding:0!important;margin:0!important}

      /* ── Title block (centered, LaTeX \maketitle style) ──── */
      .hdr{
        text-align:center;
        padding:0;
        border:none!important;
        margin:0 0 2em 0;
      }
      .hdr h1{
        font-size:17pt;
        font-weight:700;
        color:#000!important;
        margin-bottom:.6em;
        line-height:1.25;
      }
      .hdr .au{
        font-size:12pt;
        font-weight:400;
        color:#000!important;
        margin-bottom:.2em;
      }
      .hdr .af{
        font-size:10pt;
        font-style:italic;
        color:#444!important;
        margin-bottom:.1em;
      }
      .hdr .dt{
        font-family:inherit!important;
        font-size:10pt;
        color:#444!important;
        margin-top:.4em;
      }

      /* ── Chapters — each starts a new page ──────────────── */
      .ch{break-before:page;margin-bottom:0}
      .ch:first-child{break-before:auto}
      .ch-t{
        font-family:'Latin Modern Sans','CMU Sans Serif','Computer Modern Sans','Inter','Helvetica Neue',sans-serif!important;
        font-size:17pt;
        font-weight:700;
        color:#000!important;
        border-bottom:none!important;
        margin-bottom:1.2em;
        padding-bottom:0;
        text-align:left;
      }
      .ch-t .n{color:#000!important;font-weight:700}

      /* ── Sections ───────────────────────────────────────── */
      .sec-t{
        font-family:'Latin Modern Sans','CMU Sans Serif','Computer Modern Sans','Inter','Helvetica Neue',sans-serif!important;
        font-size:13pt;
        font-weight:700;
        color:#000!important;
        margin:1.5em 0 .6em;
      }
      .sec-n{display:inline!important;margin-right:.4em}

      /* ── Environment blocks — LaTeX theorem style ───────── */
      .env{
        border:none!important;
        border-left:none!important;
        padding:0!important;
        margin:.8em 0!important;
        background:none!important;
        border-radius:0!important;
      }

      /* Block header: "Definition 3.1." or "Theorem 2.4 (Name)." */
      .bh{
        display:inline!important;
        margin-bottom:0!important;
        gap:0!important;
      }
      .bh-anchor{
        display:inline!important;
        gap:0!important;
        text-decoration:none!important;
      }
      .bk{
        font-size:11pt!important;
        font-weight:700!important;
        font-style:normal!important;
        text-transform:capitalize!important;
        color:#000!important;
        letter-spacing:0!important;
        display:inline!important;
      }
      .bk::after{content:'.'!important;display:inline!important}
      .bt{
        font-size:11pt!important;
        font-weight:400!important;
        font-style:normal!important;
        color:#000!important;
        display:inline!important;
      }
      /* Wrap title in parens for print: "Theorem (Name)." */
      .bt::before{content:' ('!important}
      .bt::after{content:')'!important}

      /* Block body */
      .bb{font-size:11pt!important;display:inline!important}
      .bb p:first-child{display:inline!important;margin-top:0!important}
      .bb p{margin:.4em 0!important}
      .bb li{margin:.2em 0!important}

      /* Theorem/prop/lemma/corollary body in italic (LaTeX convention) */
      .env.theorem .bb,.env.proposition .bb,
      .env.lemma .bb,.env.corollary .bb,
      .env.conjecture .bb{font-style:italic}
      /* But math inside italic env stays upright */
      .env.theorem .katex,.env.proposition .katex,
      .env.lemma .katex,.env.corollary .katex,
      .env.conjecture .katex{font-style:normal}

      /* Definition body stays roman (LaTeX convention) */
      .env.definition .bb{font-style:normal}

      /* Remark — smaller, roman */
      .env.remark .bb{font-style:normal;font-size:10pt!important}
      .env.remark .bk{font-style:italic!important;font-weight:400!important}

      /* Proof blocks (collapsible in screen, expanded in print) */
      .prf-toggle{display:none!important}
      .prf-body{display:block!important;padding:0!important}
      .prf-body::before{content:'Proof. ';font-style:italic;font-weight:400}
      .prf-body .qed::after{content:'\25A1';font-size:10pt}
      .prf-lean{display:none!important}

      /* Legacy env.proof */
      .env.proof .bk{font-style:italic!important;font-weight:400!important}
      .env.proof .bk::after{content:'.'!important}
      .env.proof .bb{font-style:normal}

      /* ── Math ───────────────────────────────────────────── */
      .katex{color:#000!important}
      .katex-display{margin:.6em 0!important;padding:0!important}
      .txb{padding:.3em 0!important;margin:.5em 0!important;text-align:center}
      .txb img,.txb svg{filter:none!important;transform:scale(1)!important}

      /* ── Links — invisible in print ─────────────────────── */
      a{color:#000!important;text-decoration:none!important}

      /* ── Page break control ─────────────────────────────── */
      .env{break-inside:avoid}
      .section{break-inside:avoid-page}
      h2,h3{break-after:avoid}

      /* ── Prose blocks — clean inline flow ───────────────── */
      .blk{margin:.6em 0!important}
      .blk .bb p{text-indent:0;text-align:justify}

      /* ── Lists ──────────────────────────────────────────── */
      .bb ul{list-style:disc!important;padding-left:1.8em!important}
      .bb ol{padding-left:1.8em!important}

      /* ── Footnotes / references ─────────────────────────── */
      .bb sup{font-size:.75em}
    }
    /* Reading mode — hide decorations, clean layout */
    body.reading .decor,body.reading .lb,body.reading .blk-foot,body.reading .fb-act,body.reading .st,body.reading .bsrc,body.reading .bl,body.reading .collapse-btn,body.reading .todo-inline,body.reading .sb-badge,body.reading .ex-toggle,body.reading .ex-panel,body.reading .bh-acts,body.reading .bh-menu{display:none!important}
    /* LaTeX article styling for block headers */
    body.reading .bh{display:inline!important;margin-bottom:0!important;gap:0!important;font-family:var(--f-body)}
    body.reading .bh-anchor{display:inline!important;gap:0!important}
    body.reading .bk{font-family:var(--f-body)!important;font-size:var(--f-sz)!important;font-weight:700!important;font-style:normal!important;text-transform:capitalize!important;color:var(--fg-b)!important;letter-spacing:0!important;display:inline!important}
    body.reading .bk::after{content:'.'!important;display:inline!important}
    body.reading .bt{font-family:var(--f-body)!important;font-size:var(--f-sz)!important;font-weight:400!important;font-style:normal!important;color:var(--fg-b)!important;display:inline!important}
    body.reading .bt::before{content:' ('!important}
    body.reading .bt::after{content:')'!important}
    /* Block body inline after header */
    body.reading .bb{display:inline!important}
    body.reading .bb p:first-child{display:inline!important;margin-top:0!important}
    /* Theorem-like bodies in italic (LaTeX convention) */
    body.reading .env.theorem .bb,body.reading .env.proposition .bb,body.reading .env.lemma .bb,body.reading .env.corollary .bb,body.reading .env.conjecture .bb{font-style:italic}
    body.reading .env.theorem .katex,body.reading .env.proposition .katex,body.reading .env.lemma .katex,body.reading .env.corollary .katex,body.reading .env.conjecture .katex{font-style:normal}
    body.reading .env.definition .bb{font-style:normal}
    body.reading .env.remark .bk{font-style:italic!important;font-weight:400!important}
    /* Section/chapter titles in body font */
    body.reading .ch-t{font-family:var(--f-body)!important}
    body.reading .sec-t{font-family:var(--f-body)!important}
    /* Remove background, borders, coloring from content blocks */
    body.reading .env{background:none!important;border:none!important;border-left:none!important;padding:.6rem 0!important;border-radius:0!important}
    body.reading .blk{margin:1rem 0}
    /* Condense spacing */
    body.reading .ch{margin-bottom:2rem}
    body.reading .sec-t{margin:1.5rem 0 .8rem}
    /* Expand all proofs — hide stubs, show full blocks */
    body.reading .blk-stub.proof{display:none!important}
    body.reading .blk-proof{display:block!important}
    body.reading .prf-toggle{display:none!important}
    body.reading .prf-body{display:block!important;padding:.4rem 0 .2rem}
    body.reading .prf-body::before{content:'Proof. ';font-style:italic;font-weight:400}
    /* QED: black filled rectangle (tombstone) */
    body.reading .prf-body .qed::after{content:'';display:inline-block;width:8px;height:8px;background:#000;margin-left:.3rem}
    [data-theme="dark"] body.reading .prf-body .qed::after{background:var(--fg)}
    body.reading .prf-body .qed{text-align:right;margin-top:.3rem}
    /* Also handle env.proof blocks */
    body.reading .env.proof .bb::after{content:'';display:inline-block;width:8px;height:8px;background:#000;float:right;margin-top:.3rem}
    [data-theme="dark"] body.reading .env.proof .bb::after{background:var(--fg)}

    .bh{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;font-family:var(--f-head)}
    .bh-anchor{display:flex;align-items:baseline;gap:.5rem;text-decoration:none;cursor:pointer;position:relative;min-width:0;flex:1}
    .bh-anchor:hover .bk{text-decoration:underline}
    .bh-anchor .anchor-icon{opacity:0;font-size:.7rem;color:var(--fg-d);transition:opacity .15s;margin-left:.2rem;flex-shrink:0}
    .bh-anchor:hover .anchor-icon{opacity:.6}
    .bh-copied{position:absolute;left:0;top:100%;font-family:var(--f-mono);font-size:.55rem;color:var(--ac);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
    .bh-copied.show{opacity:1}
    .bk{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ac);flex-shrink:0}
    .env.theorem .bk,.env.proposition .bk{color:var(--yel)}
    .env.lemma .bk,.env.corollary .bk{color:var(--ora)}
    .env.conjecture .bk{color:var(--red)}
    .env.example .bk{color:var(--grn)}
    .env.remark .bk{color:var(--fg-d)}
    .bt{font-size:.95rem;font-weight:500;color:var(--fg-b);overflow:hidden;text-overflow:ellipsis}
    /* Header actions group — right side, plain grey text */
    .bh-acts{display:flex;align-items:center;gap:.5rem;flex-shrink:0;margin-left:auto}
    .bh-acts .lb{margin-left:0;background:none;border:none;padding:0;border-radius:0}
    .bh-acts .bl{font-family:var(--f-mono);font-size:.55rem;color:var(--fg-d);text-decoration:none;padding:0;border-radius:0;background:none;border:none;white-space:nowrap}
    .bh-acts .bl:hover{color:var(--ac)}
    .bh-acts .fb-act{font-family:var(--f-mono);font-size:.55rem;color:var(--fg-d);background:none;border:none;border-radius:0;padding:0;cursor:pointer;white-space:nowrap}
    .bh-acts .fb-act:hover{color:var(--ac)}
    .bh-acts .st{position:static;width:auto;height:auto;opacity:.5;font-size:.55rem;padding:0;display:inline-flex}
    /* Hamburger for narrow — replaces bh-acts */
    .bh-menu{display:none;background:none;border:1px solid var(--brd);border-radius:2px;color:var(--fg-d);cursor:pointer;font-size:.7rem;padding:.1rem .3rem;margin-left:auto;position:relative}
    .bh-menu:hover{color:var(--fg-b);border-color:var(--ac-d)}
    .bh-drop{display:none;position:absolute;right:0;top:100%;background:var(--bg-s);border:1px solid var(--brd);border-radius:4px;padding:.3rem;z-index:50;min-width:120px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
    .bh-drop.open{display:flex;flex-direction:column;gap:.2rem}
    .bh-drop .bl,.bh-drop .fb-act,.bh-drop .lb,.bh-drop .st{font-size:.55rem;display:block;text-align:left;width:100%;background:none;border:none;padding:.15rem .4rem;color:var(--fg-d);cursor:pointer}
    .bh-drop .bl:hover,.bh-drop .fb-act:hover,.bh-drop .lb:hover,.bh-drop .st:hover{color:var(--ac)}
    @media(max-width:600px){
      .bh-acts{display:none}
      .bh-menu{display:block}
    }

    /* Tags */
    .blk-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem;padding-top:.3rem;border-top:1px solid var(--brd);gap:.5rem}
    .blk-foot .tags{margin-top:0}
    .blk-foot .uses{margin-top:0;text-align:right;margin-left:auto}
    .tags{display:flex;gap:.3rem;flex-wrap:wrap}
    .tag{font-family:var(--f-mono);font-size:.55rem;padding:.1rem .4rem;border-radius:2px;background:var(--bg-r);border:1px solid var(--brd);color:var(--fg-d)}

    /* Source toggle */
    .st{position:absolute;top:.4rem;right:.4rem;width:20px;height:16px;background:none;border:none;color:var(--fg-d);cursor:pointer;opacity:0;transition:opacity .2s;font-size:.6rem;font-family:var(--f-mono);display:flex;align-items:center;justify-content:center}
    .blk:hover .st,.env:hover .st{opacity:.4}
    .st:hover{opacity:1!important;color:var(--ac)}
    .st.on{opacity:.7;color:var(--ac)}
    .bsrc{display:none;background:var(--bg-c);border:1px solid var(--brd);border-radius:3px;padding:.6rem .8rem;margin-top:.6rem;font-family:var(--f-mono);font-size:.7rem;line-height:1.5;white-space:pre-wrap;overflow-x:auto;color:var(--fg-d)}
    .bsrc.vis{display:block}

    /* Lean badge — plain grey text, colored by status */
    .lb{display:inline-flex;align-items:center;gap:.2rem;font-family:var(--f-mono);font-size:.55rem;padding:0;border-radius:0;background:none;border:none;color:var(--fg-d);margin-left:auto;white-space:nowrap}
    .lb.proved{color:var(--grn)}
    .lb.has_sorry{color:var(--yel)}
    .lb.stated{color:var(--ac)}
    .lb.validated{color:var(--grn)}
    .lb.stub{color:var(--red)}
    .lb.external{color:var(--ora)}
    .lb.trivial{color:var(--fg-d)}

    /* Lean validation icon */
    .vi{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.2rem}
    .vi.validated{background:var(--grn)}
    .vi.stub{background:var(--red)}
    .vi.external{background:var(--ora)}
    .vi.trivial{background:var(--fg-d)}
    .vi.not_checked{background:var(--brd)}
    .vi.error{background:var(--red);box-shadow:0 0 4px var(--red)}

    /* Proof block (collapsible, default closed) */
    .prf{margin-top:.4rem}
    .prf-toggle{font-family:var(--f-head);font-size:.8rem;color:var(--fg-d);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;font-style:italic;padding:.2rem 0}
    .prf-toggle:hover{color:var(--fg-b)}
    .prf-toggle .arrow{transition:transform .2s;font-style:normal;font-size:.6rem}
    .prf-toggle.open .arrow{transform:rotate(90deg)}
    .prf-toggle .prf-lean{font-style:normal;font-family:var(--f-mono);font-size:.55rem;color:var(--fg-d);margin-left:.5rem}
    .prf-body{display:none;padding:.6rem 0 .4rem;font-size:var(--f-sz);line-height:var(--f-lh)}
    .prf-body.open{display:block}
    .prf-body p{margin:.4em 0}
    .prf-body .qed{text-align:right;color:var(--fg-d);font-size:.8rem;margin-top:.2rem}

    /* Examples panel (hidden by default) */
    .ex-panel{display:none;margin-top:.6rem;border:1px solid var(--brd);border-radius:4px;overflow:hidden}
    .ex-panel.open{display:block}
    .ex-toggle{font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);cursor:pointer;margin-top:.4rem;display:inline-flex;align-items:center;gap:.3rem}
    .ex-toggle:hover{color:var(--ac)}
    .ex-toggle .arrow{transition:transform .2s}
    .ex-toggle.open .arrow{transform:rotate(90deg)}

    /* Uses */
    .uses{font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);margin-top:.5rem;text-align:right}
    .uref{color:var(--ac-d);cursor:pointer;border-bottom:1px dotted var(--ac-d);text-decoration:none}
    .uref:hover{color:var(--ac);border-bottom-color:var(--ac)}

    /* Uses expand panel */
    .upnl{display:none;background:var(--bg-c);border:1px solid var(--brd);border-radius:4px;margin-top:.4rem;overflow:hidden}
    .upnl.open{display:block}
    .uph{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;background:var(--bg-r);border-bottom:1px solid var(--brd);font-family:var(--f-head);font-size:.7rem;color:var(--fg-d);flex-wrap:wrap}
    .uph-goto{margin-left:auto;font-family:var(--f-mono);font-size:.6rem;color:var(--ac-d);text-decoration:none;cursor:pointer;white-space:nowrap}
    .uph-goto:hover{color:var(--ac)}
    .upt{display:flex;border-bottom:1px solid var(--brd)}
    .uptb{padding:.25rem .6rem;font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent}
    .uptb:hover{color:var(--fg)}
    .uptb.on{color:var(--ac);border-bottom-color:var(--ac)}
    .upc{padding:.6rem;font-family:var(--f-mono);font-size:.7rem;line-height:1.5;white-space:pre-wrap;overflow-x:auto;max-height:280px;overflow-y:auto}

    /* Content */
    .bb p{margin:.5em 0}
    .bb ul{margin:.4em 0;padding-left:1.5em;list-style:none}
    .bb ol{margin:.4em 0;padding-left:1.5em}
    .bb li{margin:.4em 0}
    .bb strong{color:var(--fg-b)}
    .bb a{color:var(--ac);text-decoration:none;border-bottom:1px solid var(--ac-d)}
    .bb a:hover{color:var(--fg-b)}
    .katex-display{overflow-x:auto;overflow-y:hidden;padding:.4rem 0}
    .katex{color:var(--fg)}

    /* TeX blocks */
    .txb{background:transparent;border:none;border-radius:4px;padding:.8rem;margin:.8rem 0;text-align:center;overflow-x:auto}
    .txb img,.txb svg{max-width:100%;height:auto;filter:var(--svg-f);transform:scale(1.25);transform-origin:center}
    .txb.ph{font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);white-space:pre-wrap;text-align:left}

    /* Folio */
    .folio-list{display:flex;flex-direction:column;gap:1rem}
    .folio-card{background:var(--bg-s);border:1px solid var(--brd);border-radius:6px;padding:1.2rem 1.5rem;transition:border-color .15s,box-shadow .15s}
    .folio-card:hover{border-color:var(--ac-d);box-shadow:0 2px 12px rgba(0,0,0,.15)}
    .fc-title{font-family:var(--f-head);font-size:1.2rem;font-weight:600;color:var(--fg-b);margin-bottom:.3rem}
    .fc-desc{font-size:.9rem;color:var(--fg);margin-bottom:.4rem}
    .fc-meta{font-family:var(--f-mono);font-size:.7rem;color:var(--fg-d)}

    /* Paper importer */
    .importer{margin-top:1.5rem;border:1px dashed var(--brd);border-radius:8px;padding:1.2rem;background:var(--bg-s)}
    .importer-title{font-family:var(--f-head);font-size:.85rem;font-weight:600;color:var(--fg-b);margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
    .importer-tabs{display:flex;gap:.4rem;margin-bottom:.8rem}
    .importer-tabs button{background:var(--bg-r);border:1px solid var(--brd);border-radius:4px;padding:.3rem .7rem;font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);cursor:pointer}
    .importer-tabs button.active{background:var(--ac);color:#fff;border-color:var(--ac)}
    .imp-form{display:flex;flex-direction:column;gap:.5rem}
    .imp-form input[type=text],.imp-form input[type=url]{width:100%;background:var(--bg);border:1px solid var(--brd);border-radius:4px;padding:.4rem .6rem;font-family:var(--f-mono);font-size:.75rem;color:var(--fg)}
    .imp-form input[type=file]{font-family:var(--f-mono);font-size:.7rem;color:var(--fg-d)}
    .imp-submit{background:var(--ac);border:none;color:#fff;font-family:var(--f-mono);font-size:.7rem;padding:.4rem .8rem;border-radius:4px;cursor:pointer;align-self:flex-start}
    .imp-submit:disabled{opacity:.5;cursor:not-allowed}
    .imp-status{font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);min-height:1.2rem}

    /* Scan results */
    .scan-results{margin-top:.8rem}
    .scan-summary{font-family:var(--f-mono);font-size:.7rem;color:var(--fg-d);margin-bottom:.6rem}
    .scan-block{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;border:1px solid var(--brd);border-radius:4px;margin-bottom:.3rem;font-size:.75rem;background:var(--bg)}
    .scan-block input[type=checkbox]{margin:0}
    .scan-block .sb-kind{font-family:var(--f-mono);font-size:.55rem;color:var(--fg-d);min-width:5rem;text-transform:uppercase}
    .scan-block .sb-title{flex:1;color:var(--fg-b);font-weight:500}
    .scan-block .sb-label{font-family:var(--f-mono);font-size:.55rem;color:var(--fg-d)}
    .scan-block .sb-body-preview{font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);max-height:3rem;overflow:hidden;margin-top:.2rem;padding:.3rem;background:var(--bg-r);border-radius:3px;width:100%;display:none}
    .scan-block.expanded .sb-body-preview{display:block}
    .scan-actions{display:flex;gap:.4rem;margin-top:.6rem}

    /* Import history */
    .import-history{margin-top:1rem}
    .import-card{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border:1px solid var(--brd);border-radius:4px;margin-bottom:.3rem;font-size:.75rem;background:var(--bg)}
    .import-card .ic-source{font-family:var(--f-mono);font-size:.55rem;color:var(--ac);min-width:4rem}
    .import-card .ic-title{flex:1;color:var(--fg-b)}
    .import-card .ic-status{font-family:var(--f-mono);font-size:.55rem;padding:.1rem .35rem;border-radius:3px}
    .import-card .ic-status.scanned{background:var(--yel);color:#fff}
    .import-card .ic-status.generated{background:var(--grn);color:#fff}
    .import-card .ic-status.pending{background:var(--fg-d);color:#fff}

    /* Feedback panel */
    .feedback-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:none}
    .feedback-overlay.open{display:block}
    .feedback-panel{position:fixed;top:0;right:-400px;bottom:0;width:400px;background:var(--bg-s);border-left:1px solid var(--brd);z-index:301;transition:right .3s var(--ease);display:flex;flex-direction:column}
    .feedback-panel.open{right:0}
    .fb-head{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--brd)}
    .fb-head h3{font-family:var(--f-head);font-size:.9rem;color:var(--fg-b)}
    .fb-close{background:none;border:none;color:var(--fg-d);font-size:1.2rem;cursor:pointer}
    .fb-close:hover{color:var(--fg-b)}
    .fb-target{padding:.5rem 1rem;font-family:var(--f-mono);font-size:.65rem;color:var(--ac);border-bottom:1px solid var(--brd)}
    .fb-input-area{padding:1rem}
    .fb-input-area textarea{width:100%;background:var(--bg-r);border:1px solid var(--brd);border-radius:4px;color:var(--fg);font-family:var(--f-body);font-size:.85rem;padding:.6rem;resize:vertical}
    .fb-input-area textarea:focus{outline:none;border-color:var(--ac)}
    .fb-controls{display:flex;gap:.4rem;margin-top:.5rem;align-items:center}
    .fb-controls select{background:var(--bg-r);border:1px solid var(--brd);color:var(--fg-d);font-family:var(--f-mono);font-size:.6rem;padding:.2rem .4rem;border-radius:3px}
    .fb-submit{background:var(--ac);border:1px solid var(--ac);color:var(--bg);font-family:var(--f-mono);font-size:.65rem;padding:.3rem .8rem;border-radius:3px;cursor:pointer;margin-left:auto}
    .fb-submit:hover{opacity:.85}
    .fb-voice{background:none;border:1px solid var(--brd);color:var(--fg-d);cursor:pointer;border-radius:3px;padding:.3rem .6rem;font-size:.75rem;font-family:var(--f-mono);transition:all .2s}
    .fb-voice:hover{border-color:var(--ac);color:var(--ac)}
    .fb-voice.recording{border-color:var(--red);color:var(--red);animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .fb-history{flex:1;overflow-y:auto;padding:.5rem 1rem}
    .fb-item{padding:.5rem;border:1px solid var(--brd);border-radius:4px;margin-bottom:.4rem;font-size:.75rem}
    .fb-item .fb-meta{font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);margin-top:.2rem}
    .fb-item.open{border-left:2px solid var(--ac)}
    .fb-item.resolved{border-left:2px solid var(--green,#4a4);opacity:.6}
    .todo-inline{display:flex;gap:.4rem;align-items:center;font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);margin-top:.3rem;padding:.2rem .5rem;background:var(--bg-r);border-radius:3px;border:1px solid var(--brd)}
    .todo-inline .todo-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .todo-inline .todo-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .todo-inline .todo-pri{font-size:.55rem;opacity:.7;min-width:2.5rem;text-align:center}
    .todo-inline .todo-btn{background:none;border:1px solid var(--brd);border-radius:2px;color:var(--fg-d);cursor:pointer;font-family:var(--f-mono);font-size:.55rem;padding:0 .25rem;line-height:1.3}
    .todo-inline .todo-btn:hover{background:var(--bg-h);color:var(--fg)}
    .todo-inline .todo-btn.todo-rm{color:var(--red,#c44)}
    .todo-inline .todo-btn.todo-rm:hover{background:var(--red,#c44);color:#fff}

    /* Feedback button on blocks */
    /* (old .fb-btn removed — feedback now in .bh-acts) */

    /* Claude chat panel */
    .claude-fab{position:fixed;bottom:1.5rem;right:1.5rem;width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;border:none;font-size:1.3rem;cursor:pointer;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease),background .15s}
    .claude-fab:hover{transform:scale(1.08)}
    .claude-fab.open{background:var(--fg-d);transform:rotate(45deg)}
    .claude-fab .fab-badge{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--grn);border:2px solid var(--bg-s)}

    .chat-panel{position:fixed;bottom:5rem;right:1.5rem;width:380px;max-height:min(70vh,560px);background:var(--bg-s);border:1px solid var(--brd);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:199;display:none;flex-direction:column;overflow:hidden;font-family:var(--f-head);transition:all .2s var(--ease)}
    .chat-panel.open{display:flex}
    .chat-panel.expanded{top:35px;left:0;right:0;bottom:0;width:auto;max-height:none;border-radius:0;box-shadow:none}
    @media(max-width:500px){.chat-panel{left:1rem;right:1rem;width:auto;bottom:4.5rem;max-height:60vh}}

    .chat-head{display:flex;align-items:center;padding:.6rem .8rem;border-bottom:1px solid var(--brd);gap:.5rem;flex-shrink:0}
    .chat-head .chat-title{font-size:.8rem;font-weight:600;color:var(--fg-b);flex:1}
    .chat-head .chat-mode{font-size:.55rem;padding:.15rem .4rem;border-radius:3px;background:var(--bg-r);color:var(--fg-d);font-family:var(--f-mono)}
    .chat-head button{background:none;border:none;color:var(--fg-d);cursor:pointer;font-size:.75rem;padding:.2rem}
    .chat-head button:hover{color:var(--fg-b)}

    .chat-ctx{padding:.25rem .8rem;font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);border-bottom:1px solid var(--brd);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
    .chat-ctx.active{display:block}
    .chat-ctx .ctx-label{color:var(--ac);cursor:pointer}
    .chat-ctx .ctx-label:hover{text-decoration:underline}
    .chat-ctx .ctx-kind{opacity:.6;margin-right:.3rem}
    .chat-actions{display:flex;gap:.3rem;padding:.4rem .8rem;border-bottom:1px solid var(--brd);flex-wrap:wrap;flex-shrink:0}
    .chat-action{font-size:.6rem;padding:.2rem .5rem;border-radius:12px;border:1px solid var(--brd);background:var(--bg-r);color:var(--fg-d);cursor:pointer;font-family:var(--f-mono);transition:all .15s}
    .chat-action:hover{border-color:var(--ac);color:var(--ac)}

    .chat-messages{flex:1;overflow-y:auto;padding:.6rem .8rem;display:flex;flex-direction:column;gap:.5rem;min-height:80px}
    .chat-msg{max-width:90%;padding:.5rem .7rem;border-radius:10px;font-size:.78rem;line-height:1.5;word-wrap:break-word}
    .chat-msg.user{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:3px}
    .chat-msg.assistant{align-self:flex-start;background:var(--bg-r);color:var(--fg);border-bottom-left-radius:3px}
    .chat-msg.system{align-self:center;background:none;color:var(--fg-d);font-size:.65rem;font-style:italic;padding:.2rem}
    .chat-msg .chat-math{margin:.3rem 0}
    .chat-msg code{background:rgba(0,0,0,.1);padding:.1rem .3rem;border-radius:3px;font-family:var(--f-mono);font-size:.7rem}
    .chat-msg a{color:inherit;text-decoration:underline}
    .chat-msg table{border-collapse:collapse;font-size:.72rem;margin:.4rem 0;width:100%}
    .chat-msg th,.chat-msg td{border:1px solid var(--brd);padding:.25rem .4rem;text-align:left}
    .chat-msg th{background:var(--bg-s);font-weight:600;font-size:.65rem;text-transform:uppercase;letter-spacing:.03em}
    .chat-msg tr:nth-child(even){background:rgba(0,0,0,.03)}

    .chat-typing{align-self:flex-start;color:var(--fg-d);font-size:.7rem;padding:.3rem .7rem;font-style:italic;display:none}
    .chat-typing.active{display:block}

    .chat-suggestions{display:none;flex-wrap:wrap;gap:.3rem;padding:.4rem .8rem;border-top:1px solid var(--brd);flex-shrink:0}
    .chat-suggestions.active{display:flex}
    .chat-sug{font-size:.65rem;padding:.3rem .6rem;border-radius:14px;border:1px solid var(--brd);background:var(--bg-r);color:var(--fg);cursor:pointer;font-family:var(--f-body);transition:all .15s;line-height:1.3;text-align:left}
    .chat-sug:hover{border-color:var(--ac);color:var(--ac);background:var(--bg-s)}

    .chat-input-area{display:flex;align-items:flex-end;padding:.5rem .8rem;border-top:1px solid var(--brd);gap:.4rem;flex-shrink:0}
    .chat-input{flex:1;border:1px solid var(--brd);background:var(--bg-r);color:var(--fg);border-radius:8px;padding:.4rem .6rem;font-family:var(--f-body);font-size:.78rem;resize:none;max-height:80px;min-height:34px;line-height:1.4}
    .chat-input:focus{outline:none;border-color:var(--ac)}
    .chat-send{background:var(--ac);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
    .chat-send:disabled{opacity:.4;cursor:default}

    /* Diff button + overlay */
    #c-diff{display:none}
    #c-diff.visible{display:inline-block}
    #c-diff.on{color:var(--ac);border-color:var(--ac)}
    .diff-overlay{position:fixed;top:35px;left:0;right:0;bottom:0;z-index:300;background:var(--bg);overflow-y:auto;display:none;flex-direction:column}
    .diff-overlay.open{display:flex}
    .diff-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:.6rem;padding:.6rem 1.2rem;background:var(--bg-s);border-bottom:1px solid var(--brd);flex-shrink:0}
    .diff-head h2{font-family:var(--f-head);font-size:1rem;font-weight:600;color:var(--fg-b);flex:1}
    .diff-head .diff-summary{font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d)}
    .diff-head .diff-summary .da{color:var(--grn)} .diff-head .diff-summary .dr{color:var(--red)} .diff-head .diff-summary .dc{color:var(--yel)}
    .diff-close{background:none;border:1px solid var(--brd);color:var(--fg-d);font-size:.85rem;width:28px;height:28px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .diff-close:hover{color:var(--fg-b);border-color:var(--ac)}

    .diff-body{max-width:1100px;width:100%;margin:0 auto;padding:1rem 1.5rem 3rem}
    .diff-ch{margin-top:1.5rem}
    .diff-ch-title{font-family:var(--f-head);font-size:.85rem;font-weight:600;color:var(--fg-b);padding-bottom:.3rem;border-bottom:1px solid var(--brd);margin-bottom:.6rem}
    .diff-card{border:1px solid var(--brd);border-radius:6px;margin-bottom:.8rem;overflow:hidden;background:var(--bg-s)}
    .diff-card.added{border-left:3px solid var(--grn)}
    .diff-card.removed{border-left:3px solid var(--red)}
    .diff-card.changed{border-left:3px solid var(--yel)}
    .diff-card-head{display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;cursor:pointer;font-family:var(--f-head);font-size:.78rem}
    .diff-card-head:hover{background:var(--bg-r)}
    .diff-card-head .diff-status{font-family:var(--f-mono);font-size:.55rem;padding:.1rem .35rem;border-radius:3px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .diff-status.added{background:var(--grn);color:#fff}
    .diff-status.removed{background:var(--red);color:#fff}
    .diff-status.changed{background:var(--yel);color:#fff}
    .diff-card-head .diff-stats{font-family:var(--f-mono);font-size:.55rem;display:flex;gap:.3rem}
    .diff-card-head .diff-stats .ds-add{color:var(--grn)} .diff-card-head .diff-stats .ds-del{color:var(--red)}
    .diff-card-head .diff-kind{color:var(--fg-d);font-size:.65rem;font-family:var(--f-mono)}
    .diff-loading{display:flex;align-items:center;justify-content:center;padding:4rem;color:var(--fg-d);gap:.6rem;font-size:.85rem}
    .diff-loading .spinner{width:18px;height:18px;border:2px solid var(--brd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .diff-card-head .diff-title{flex:1;color:var(--fg-b);font-weight:500}
    .diff-card-head .diff-goto{font-size:.6rem;color:var(--ac);text-decoration:none;font-family:var(--f-mono)}
    .diff-card-head .diff-goto:hover{text-decoration:underline}
    .diff-card-body{display:none;padding:.6rem .8rem;border-top:1px solid var(--brd);font-size:.78rem;line-height:1.6}
    .diff-card.expanded .diff-card-body{display:block}
    .diff-card-body pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:.7rem;line-height:1.6}
    .diff-tabs{display:flex;gap:0;margin-bottom:.6rem;border-bottom:1px solid var(--brd)}
    .diff-tab{padding:.3rem .7rem;font-size:.65rem;font-family:var(--f-mono);cursor:pointer;border:none;background:none;color:var(--fg-d);border-bottom:2px solid transparent}
    .diff-tab:hover{color:var(--fg-b)}
    .diff-tab.active{color:var(--ac);border-bottom-color:var(--ac)}
    .diff-tab-panel{display:none}
    .diff-tab-panel.active{display:block}
    .diff-rendered{font-family:var(--f-text);font-size:.82rem;line-height:1.7}
    .diff-rendered .bb{margin:0}
    .diff-edit-btn{display:inline-block;font-size:.6rem;font-family:var(--f-mono);color:var(--ac);cursor:pointer;padding:.2rem .5rem;border:1px solid var(--ac);border-radius:3px;margin-top:.4rem;background:none}
    .diff-edit-btn:hover{background:var(--ac);color:#fff}
    .diff-line-add{background:rgba(42,170,70,.15);color:var(--grn);padding:0 .3rem}
    .diff-line-del{background:rgba(200,70,70,.15);color:var(--red);text-decoration:line-through;padding:0 .3rem}
    .diff-line-ctx{color:var(--fg-d);opacity:.45;padding:0 .3rem}
    .diff-status-change{font-family:var(--f-mono);font-size:.65rem;color:var(--fg-d);padding:.3rem 0}
    .diff-status-change span{padding:.1rem .3rem;border-radius:3px}

    /* Branch switch dialog */
    .switch-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
    .switch-dialog{background:var(--bg-s);border:1px solid var(--brd);border-radius:8px;max-width:520px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.3)}
    .switch-dialog h3{font-family:var(--f-head);font-size:.9rem;font-weight:600;padding:.8rem 1rem;margin:0;border-bottom:1px solid var(--brd);color:var(--fg-b)}
    .switch-dialog .sd-body{padding:.8rem 1rem;font-size:.78rem;line-height:1.5;color:var(--fg-d)}
    .switch-dialog .sd-changes{max-height:200px;overflow-y:auto;background:var(--bg);border:1px solid var(--brd);border-radius:4px;padding:.5rem;margin:.6rem 0;font-family:var(--f-mono);font-size:.65rem;line-height:1.6}
    .switch-dialog .sd-change{padding:.1rem 0}
    .switch-dialog .sd-change.sd-m{color:var(--yel)} .switch-dialog .sd-change.sd-a{color:var(--grn)} .switch-dialog .sd-change.sd-d{color:var(--red)} .switch-dialog .sd-change.sd-u{color:var(--fg-d)}
    .switch-dialog .sd-actions{display:flex;gap:.5rem;padding:.8rem 1rem;border-top:1px solid var(--brd);justify-content:flex-end;flex-wrap:wrap}
    .switch-dialog .sd-btn{font-family:var(--f-mono);font-size:.7rem;padding:.4rem .8rem;border-radius:4px;border:1px solid var(--brd);cursor:pointer;background:var(--bg);color:var(--fg-b)}
    .switch-dialog .sd-btn:hover{border-color:var(--ac);color:var(--ac)}
    .switch-dialog .sd-btn.sd-primary{background:var(--ac);color:#fff;border-color:var(--ac)}
    .switch-dialog .sd-btn.sd-primary:hover{opacity:.9}
    .switch-dialog .sd-btn.sd-danger{color:var(--red);border-color:var(--red)}
    .switch-dialog .sd-btn.sd-danger:hover{background:var(--red);color:#fff}
    .switch-dialog .sd-error{background:rgba(200,70,70,.1);border:1px solid var(--red);border-radius:4px;padding:.6rem .8rem;margin:.6rem 0;color:var(--red);font-size:.75rem;white-space:pre-wrap;font-family:var(--f-mono);line-height:1.5}

    /* Inline diff highlights (applied to .bb when diff mode active) */
    .inline-diff-add{background:rgba(42,170,70,.15);border-left:2px solid var(--grn);padding-left:.3rem;margin:.1rem 0}
    .inline-diff-del{background:rgba(200,70,70,.12);border-left:2px solid var(--red);padding-left:.3rem;margin:.1rem 0;text-decoration:line-through;opacity:.7}

    /* Referenced-by panel */
    .ref-by{margin:.8rem 0;padding:.6rem .8rem;background:var(--bg-r);border:1px solid var(--brd);border-radius:4px;font-family:var(--f-head);font-size:.75rem}
    .ref-by-title{font-weight:600;font-size:.7rem;color:var(--fg-d);margin-bottom:.4rem;font-family:var(--f-mono)}
    .ref-by-list{display:flex;flex-direction:column;gap:.3rem}
    .ref-by-item{display:flex;align-items:center;gap:.4rem}
    .ref-by-item .ref-kind{font-family:var(--f-mono);font-size:.55rem;color:var(--fg-d);min-width:3.5rem}
    .ref-by-item a{color:var(--ac);text-decoration:none;font-size:.73rem}
    .ref-by-item a:hover{text-decoration:underline}
    .ref-by-paper{font-size:.6rem;color:var(--fg-d);font-family:var(--f-mono);margin-left:auto}

    /* Inline editor */
    .inline-editor{display:none;border-top:1px solid var(--brd);margin-top:.5rem;padding-top:.5rem}
    .inline-editor.open{display:block}
    .inline-editor textarea{width:100%;min-height:150px;background:var(--bg-r);border:1px solid var(--brd);border-radius:4px;color:var(--fg);font-family:var(--f-mono);font-size:.78rem;padding:.6rem;resize:vertical;line-height:1.5}
    .inline-editor textarea:focus{outline:none;border-color:var(--ac)}
    .ie-toolbar{display:flex;align-items:center;gap:.4rem;margin-bottom:.4rem}
    .ie-toolbar button{font-family:var(--f-mono);font-size:.6rem;padding:.2rem .5rem;border-radius:3px;border:1px solid var(--brd);background:var(--bg-r);color:var(--fg-d);cursor:pointer}
    .ie-toolbar button:hover{border-color:var(--ac);color:var(--ac)}
    .ie-toolbar .ie-save{background:var(--ac);border-color:var(--ac);color:#fff}
    .ie-toolbar .ie-save:hover{opacity:.9}
    .ie-toolbar .ie-status{font-size:.55rem;color:var(--fg-d);margin-left:auto}
    .ie-preview{margin-top:.5rem;padding:.5rem;border:1px dashed var(--brd);border-radius:4px;min-height:40px}
    .ie-preview-label{font-size:.55rem;color:var(--fg-d);font-family:var(--f-mono);margin-bottom:.2rem}

    .loading{text-align:center;padding:4rem 0;font-family:var(--f-mono);color:var(--fg-d)}
    .err{background:rgba(230,124,124,.08);border:1px solid var(--red);border-radius:4px;padding:1rem;color:var(--red);font-family:var(--f-mono);font-size:.8rem}

    /* ── Dependency graph lightning bolt ─────────────────── */
    .dep-bolt{background:none;border:none;cursor:pointer;color:var(--fg-d);font-size:.75rem;padding:.1rem .2rem;margin-left:.15rem;transition:color .15s;line-height:1}
    .dep-bolt:hover{color:var(--yel)}
    .dep-bolt svg{width:14px;height:14px;fill:currentColor;vertical-align:middle}

    /* ── Dependency graph overlay ────────────────────────── */
    .dep-overlay{display:none;position:fixed;top:34px;left:0;right:0;bottom:0;background:var(--bg);z-index:200;overflow:auto}
    .dep-overlay.open{display:flex;flex-direction:column}
    .dep-overlay-bar{display:flex;align-items:center;gap:.6rem;padding:.4rem 1rem;background:var(--bg-s);border-bottom:1px solid var(--brd);font-family:var(--f-head);font-size:.75rem;color:var(--fg-d);flex-shrink:0}
    .dep-overlay-bar .dep-title{font-weight:600;color:var(--fg-b);font-size:.8rem}
    .dep-overlay-bar .dep-close{margin-left:auto;background:none;border:1px solid var(--brd);color:var(--fg-d);font-family:var(--f-mono);font-size:.65rem;padding:.15rem .5rem;border-radius:3px;cursor:pointer}
    .dep-overlay-bar .dep-close:hover{color:var(--fg-b);border-color:var(--ac-d)}
    .dep-graph-wrap{flex:1;overflow:auto;display:flex;flex-direction:column}
    .dep-graph-svg{flex:1;min-height:300px}
    .dep-graph-svg svg{width:100%;height:100%}
    /* Graph node styles */
    .dep-node{cursor:pointer}
    .dep-node rect{rx:6;ry:6;stroke-width:1.5;transition:stroke .15s}
    .dep-node:hover rect{stroke-width:2.5}
    .dep-node text{font-family:var(--f-head);font-size:11px;fill:var(--fg)}
    .dep-node .node-kind{font-family:var(--f-mono);font-size:9px;fill:var(--fg-d)}
    .dep-node .node-lean{font-family:var(--f-mono);font-size:8px}
    .dep-edge{fill:none;stroke-width:1.5}
    .dep-edge.narrative{stroke:var(--ac)}
    .dep-edge.lean-complete{stroke:var(--grn)}
    .dep-edge.lean-incomplete{stroke:var(--ora);stroke-dasharray:6 3}
    .dep-edge.lean-none{stroke:var(--fg-d);stroke-dasharray:3 3;opacity:.4}
    .dep-arrowhead-narrative{fill:var(--ac)}
    .dep-arrowhead-lean-complete{fill:var(--grn)}
    .dep-arrowhead-lean-incomplete{fill:var(--ora)}
    .dep-arrowhead-lean-none{fill:var(--fg-d);opacity:.4}
    /* Legend */
    .dep-legend{display:flex;gap:1.2rem;flex-wrap:wrap;padding:.5rem 1rem;border-bottom:1px solid var(--brd);font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);flex-shrink:0;background:var(--bg-s)}
    .dep-legend-item{display:flex;align-items:center;gap:.3rem}
    .dep-legend-line{width:24px;height:0;border-top:2px solid}
    .dep-legend-line.narrative{border-color:var(--ac)}
    .dep-legend-line.lean-complete{border-color:var(--grn)}
    .dep-legend-line.lean-incomplete{border-color:var(--ora);border-top-style:dashed}
    /* Node colors by status */
    .dep-node-ok rect{fill:rgba(42,170,85,.12);stroke:var(--grn)}
    .dep-node-sorry rect{fill:rgba(230,200,124,.1);stroke:var(--yel)}
    .dep-node-stated rect{fill:rgba(122,168,230,.1);stroke:var(--ac)}
    .dep-node-none rect{fill:var(--bg-r);stroke:var(--brd)}
    .dep-node-err rect{fill:rgba(230,124,124,.08);stroke:var(--red)}
    .dep-node-ext rect{fill:rgba(230,164,124,.08);stroke:var(--ora);stroke-dasharray:4 2}
    .dep-node-root rect{stroke-width:2.5}
    /* External deps panel */
    .dep-ext-panel{padding:.5rem 1rem;border-top:1px solid var(--brd);font-family:var(--f-mono);font-size:.6rem;color:var(--fg-d);flex-shrink:0;background:var(--bg-s)}
    .dep-ext-panel summary{cursor:pointer;font-weight:500;color:var(--fg)}
    .dep-ext-list{display:flex;flex-direction:column;gap:.2rem;margin-top:.3rem;padding-left:.5rem}
    .dep-ext-list a{color:var(--ac);text-decoration:none;font-size:.6rem}
    .dep-ext-list a:hover{text-decoration:underline}
  </style>
</head>
<body data-font="web">
  <div class="ctrl">
    <a href="#/" style="font-weight:500;color:var(--fg);text-decoration:none;cursor:pointer">Folio</a>
    <div class="br-picker" id="br-picker">
      <input id="br-input" type="text" placeholder="branch..." autocomplete="off">
      <div class="br-drop" id="br-drop"></div>
    </div>
    <span class="sp"></span>
    <button id="c-ex" title="Show/hide examples">examples</button>
    <button id="c-rm" title="Show/hide remarks">remarks</button>
    <button id="c-diff" title="Show changes vs main">diff</button>
    <button id="c-rd" title="Reading mode: hide decorations">reading</button>
    <button id="c-th" title="Toggle dark/light">dark</button>
    <button id="c-fn" title="Toggle paper/web font">paper font</button>
    <button id="c-pdf" title="Render LaTeX PDF via build pipeline">pdf</button>
    <button id="c-pr" title="Browser print preview (LaTeX-styled)">preview</button>
    <span class="hash" id="c-hash"></span>
  </div>

  <button class="sb-toggle" id="sb-toggle">☰</button>
  <div id="sidebar"></div>
  <div id="app"><div class="loading">loading...</div></div>

  <!-- Dependency graph overlay -->
  <div class="dep-overlay" id="dep-overlay">
    <div class="dep-overlay-bar">
      <span>&#x26A1;</span>
      <span class="dep-title" id="dep-title">Dependency Graph</span>
      <span id="dep-subtitle" style="font-size:.65rem"></span>
      <button class="dep-close" id="dep-close">&times; close</button>
    </div>
    <div class="dep-legend">
      <div class="dep-legend-item"><div class="dep-legend-line narrative"></div> narrative proof</div>
      <div class="dep-legend-item"><div class="dep-legend-line lean-complete"></div> Lean proof (complete)</div>
      <div class="dep-legend-item"><div class="dep-legend-line lean-incomplete"></div> Lean proof (stub/sorry)</div>
    </div>
    <div class="dep-graph-wrap">
      <div class="dep-graph-svg" id="dep-graph-svg"></div>
    </div>
    <div class="dep-ext-panel" id="dep-ext-panel" style="display:none">
      <details>
        <summary>External Lean dependencies</summary>
        <div class="dep-ext-list" id="dep-ext-list"></div>
      </details>
    </div>
  </div>

  <!-- Feedback panel -->
  <div class="feedback-overlay" id="feedback-overlay"></div>
  <div class="feedback-panel" id="feedback-panel">
    <div class="fb-head">
      <h3>Feedback</h3>
      <button class="fb-close" id="fb-close">&times;</button>
    </div>
    <div class="fb-target" id="fb-target"></div>
    <div class="fb-input-area">
      <textarea id="fb-text" placeholder="Describe the issue, question, or suggestion..." rows="4"></textarea>
      <div class="fb-controls">
        <button class="fb-voice" id="fb-voice" title="Voice input (click to start/stop)">mic</button>
        <select id="fb-priority">
          <option value="medium">Medium</option>
          <option value="high">High</option>

          <option value="editor-agent">Editor Agent</option>
          <option value="proof-agent">Proof Agent</option>
