        toggle.innerHTML = `<span class="arrow">▸</span> ${block.examples.length} example(s)`;
        const panel = mk('div','ex-panel');
        let exLoaded = false;

        toggle.onclick = () => {
          toggle.classList.toggle('open');
          panel.classList.toggle('open');
          // Lazy load example content on first open
          if (!exLoaded) {
            exLoaded = true;
            block.examples.forEach(exLabel => {
              const exBlock = bix.get(exLabel);
              if (exBlock) {
                const {html: exHtml, texBlocks: exTx} = parseMd(exBlock.md || '');
                const exDiv = mk('div','env example');
                exDiv.style.borderLeft = 'none';
                exDiv.style.margin = '0';
                let exHd = `<span class="bk">example</span>`;
                if (exBlock.title) exHd += `<span class="bt">${inl(exBlock.title)}</span>`;
                exDiv.innerHTML = `<div class="bh">${exHd}</div><div class="bb">${exHtml}</div>`;
                fillTex(exDiv, exTx, exBlock.rendered);
                renderMath(exDiv);
                panel.appendChild(exDiv);
              }
            });
          }
        };
        d.appendChild(toggle);
        d.appendChild(panel);
      }

      // Footer bar: tags (left) + uses (right)
      if (block.tags?.length || block.uses?.length) {
        const foot = mk('div','blk-foot decor');
        if (block.tags?.length) foot.appendChild(mkTags(block.tags));
        if (block.uses?.length) foot.appendChild(mkUsesInline(block));
        d.appendChild(foot);
      }
      addTodoIndicators(d, block);

      // Proofs toggle (if block has associated proofs, like examples[])
      if (block.proofs?.length) {
        const toggle = mk('div','prf-toggle');
        toggle.innerHTML = `<span class="arrow">▸</span> ${block.proofs.length} proof(s)`;
        const panel = mk('div','prf-body');
        let prfLoaded = false;

        toggle.onclick = () => {
          toggle.classList.toggle('open');
          panel.classList.toggle('open');
          if (!prfLoaded) {
            prfLoaded = true;
            block.proofs.forEach(prfLabel => {
              const prfBlock = bix.get(prfLabel);
              if (prfBlock) {
                const {html: ph, texBlocks: ptx} = parseMd(prfBlock.md || '');
                const prfDiv = mk('div','env proof');
                prfDiv.style.borderLeft = 'none';
                prfDiv.style.margin = '.4rem 0';
                let prfHd = `<span class="bk">proof</span>`;
                if (prfBlock.title) prfHd += `<span class="bt">${inl(prfBlock.title)}</span>`;
                if (prfBlock.lean) {
                  const v = prfBlock.lean.validation || 'not_checked';
                  prfHd += `<span class="prf-lean">${leanIcon(v)}${esc(prfBlock.lean.decl)}</span>`;
                }
                prfDiv.innerHTML = `<div class="bh">${prfHd}</div><div class="bb">${ph}<div class="qed"></div></div>`;
                fillTex(prfDiv, ptx, prfBlock.rendered);
                renderMath(prfDiv);
                // Lean source for this proof
                const prfLean = mkLeanSrc(prfBlock);
                if (prfLean) prfDiv.appendChild(prfLean);
                panel.appendChild(prfDiv);
              }
            });
          }
        };
        d.appendChild(toggle);
        d.appendChild(panel);
      }

      // Lazy hydrate the main content
      lazyInit(d, () => {
        const {bh, tx} = hydrateContent();
        bb.innerHTML = bh;
        fillTex(bb, tx, block.rendered);
        renderMath(bb);
      });

      return d;
    }

    // ── Helpers ───────────────────────────────────────────
    function mk(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

    function addSrc(el, md, hdr, block) {
      if (!md) return;
      const b = mk('button','st'); b.textContent = 'edit'; b.title = 'Edit source inline';

      // Build inline editor (hidden by default)
      const editor = mk('div','inline-editor');

      const toolbar = mk('div','ie-toolbar');
      const saveBtn = mk('button','ie-save'); saveBtn.textContent = 'save';
      const cancelBtn = mk('button',''); cancelBtn.textContent = 'close';
      const previewToggle = mk('button',''); previewToggle.textContent = 'preview';
      const statusSpan = mk('span','ie-status');
      toolbar.appendChild(saveBtn);
      toolbar.appendChild(cancelBtn);
      toolbar.appendChild(previewToggle);
      toolbar.appendChild(statusSpan);

      const ta = document.createElement('textarea');
      ta.value = md;

      const prevLabel = mk('div','ie-preview-label');
      prevLabel.textContent = 'live preview';
      prevLabel.style.display = 'none';
      const prevBody = mk('div','ie-preview');
      prevBody.style.display = 'none';

      editor.appendChild(toolbar);
      editor.appendChild(ta);
      editor.appendChild(prevLabel);
      editor.appendChild(prevBody);

      let showingPreview = false;
      function updatePreview() {
        if (!showingPreview) return;
        const {html: bh, texBlocks: tx} = parseMd(ta.value);
        prevBody.innerHTML = bh;
        fillTex(prevBody, tx, block?.rendered);
        renderMath(prevBody);
      }

      previewToggle.onclick = () => {
        showingPreview = !showingPreview;
        prevLabel.style.display = showingPreview ? '' : 'none';
        prevBody.style.display = showingPreview ? '' : 'none';
        previewToggle.classList.toggle('on', showingPreview);
        if (showingPreview) updatePreview();
      };
      ta.addEventListener('input', updatePreview);

      saveBtn.onclick = async () => {
        if (!paper?.id || !block?.rootName) { statusSpan.textContent = 'no context'; return; }
        statusSpan.textContent = 'saving...';
        try {
          const res = await fetch('/api/block/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paperId: paper.id, rootName: block.rootName, md: ta.value })
          });
          if (!res.ok) throw new Error(`${res.status}`);
          block.md = ta.value;
          console.log(`[folio:edit] saved block: ${block.rootName} (${ta.value.length} chars)`);
          // Re-render the block body
          const bb = el.querySelector('.bb');
          if (bb) {
            const {html: bh, texBlocks: tx} = parseMd(ta.value);
            bb.innerHTML = bh;
            fillTex(bb, tx, block?.rendered);
            renderMath(bb); resolveRefs(bb);
          }
          statusSpan.textContent = 'saved';
          setTimeout(() => { statusSpan.textContent = ''; }, 1500);
        } catch (e) {
          console.error(`[folio:edit] save failed for ${block.rootName}:`, e.message);
          statusSpan.textContent = 'error: ' + e.message;
          setTimeout(() => { statusSpan.textContent = ''; }, 3000);
        }
      };

      cancelBtn.onclick = () => {
        editor.classList.remove('open');
        b.classList.remove('on');
      };

      b.onclick = () => {
        const opening = !editor.classList.contains('open');
        editor.classList.toggle('open');
        b.classList.toggle('on');
        if (opening) {
          ta.value = block?.md || md;
          ta.focus();
        }
      };

      // Store editor reference on element for programmatic opening
      el._inlineEditor = { editor, btn: b, ta };

      if (hdr && hdr._acts) {
        hdr._acts.appendChild(b);
      } else {
        el.appendChild(b);
      }
      el.appendChild(editor);
    }

    // Shiki highlighter (lazy-loaded)
    let shikiHighlighter = null;
    async function getShiki() {
      if (shikiHighlighter) return shikiHighlighter;
      try {
        const { createHighlighter } = await import('https://esm.sh/shiki@3.2.1');
        shikiHighlighter = await createHighlighter({
          themes: ['github-light', 'github-dark'],
          langs: ['lean4'],
        });
        return shikiHighlighter;
      } catch (e) {
        console.warn('Shiki load failed:', e);
        return null;
      }
    }

    function mkLeanSrc(block) {
      if (!block.lean?.source) return null;
      const wrap = mk('div','lean-src');
      const hdr = mk('div','lean-src-hdr');
      hdr.innerHTML = `<span>${esc(block.lean.file || block.lean.decl)}</span>`;
      wrap.appendChild(hdr);
      const pre = document.createElement('pre');
      pre.style.margin = '0';
      const code = document.createElement('code');
      code.textContent = block.lean.source;
      code.style.fontFamily = 'var(--f-mono)';
      code.style.fontSize = '.75rem';
      pre.appendChild(code);
      wrap.appendChild(pre);
      // Async highlight with Shiki
      getShiki().then(hl => {
        if (!hl) return;
        const theme = document.documentElement.dataset.theme === 'dark' ? 'github-dark' : 'github-light';
        const html = hl.codeToHtml(block.lean.source, { lang: 'lean4', theme });
        // Replace pre with highlighted version
        const container = mk('div','');
        container.innerHTML = html;
        const highlighted = container.querySelector('pre');
        if (highlighted) {
          highlighted.style.margin = '0';
          highlighted.style.padding = '.6rem .8rem';
          highlighted.style.fontSize = '.75rem';
          highlighted.style.lineHeight = '1.5';
          highlighted.style.overflowX = 'auto';
          highlighted.style.borderRadius = '0';
          wrap.replaceChild(highlighted, pre);
        }
      });
      return wrap;
    }

    function mkTags(tags) {
      const d = mk('div','tags');
      tags.forEach(t => { const s = mk('span','tag'); s.textContent = t; d.appendChild(s); });
      return d;
    }

    function fillTex(el, tx, rendered) {
      for (const t of el.querySelectorAll('.txb[data-ti]')) {
        const i = +t.dataset.ti;
        const a = rendered?.find(r => r.blockIndex === i);
        if (a) { t.innerHTML = renderAsset(a); t.classList.remove('ph'); }
        else { t.textContent = tx[i] || ''; t.classList.add('ph'); }
      }
    }

    function renderAsset(a) {
      if (a.mime === 'image/svg+xml') return `<img src="${a.url}" alt="diagram" loading="lazy">`;
      if (a.mime?.startsWith('image/')) return `<img src="${a.url}" alt="" loading="lazy">`;
      return `<a href="${a.url}" target="_blank">[${a.mime}]</a>`;
    }

    // ── Lazy loading via IntersectionObserver ──────────────
    const lazyQueue = []; // {el, init}
    const lazyObs = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          const el = entry.target;
          const task = lazyQueue.find(t => t.el === el);
          if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); }
          lazyObs.unobserve(el);
        }
      }
    }, { rootMargin: '200px 0px' }); // start loading 200px before visible

    function lazyInit(el, init) {
      lazyQueue.push({el, init});
      lazyObs.observe(el);
    }

    // ── Paper ────────────────────────────────────────────
    function renderPaper(p) {
      paper = p;
      katexMacros = buildKatexMacros(p.macros);
      bix.clear();
      const childBlocks = new Set(); // examples/proofs shown via parent's toggle
      for (const ch of p.chapters) for (const s of ch.sections) for (const b of s.blocks) {
        if (b.label) bix.set(b.label, b);
        if (b.examples) for (const ex of b.examples) childBlocks.add(ex);

      const app = document.getElementById('app');

      // Build sidebar

      document.body.classList.add('has-sidebar');
      for (const ch of p.chapters) {

        sb.appendChild(chEl);

            const nl = ['definition','theorem','lemma','proposition','corollary'].includes(b.kind);
            if (nl && (!b.lean || !b.lean.file)) secLeanMiss++;
            if (nl && b.lean && ((b.lean.validation === 'error') || b.status === 'has_sorry')) secLeanErr++;
          }
          let secLabel = sec.title;
          const badges = [];
          if (secTodos) badges.push(`${secTodos}T`);

          sEl.style.display = 'flex'; sEl.style.alignItems = 'center';

            bEl.appendChild(nameSpan);

            // Todo count badge
            const openTodos = (b.todos || []).filter(t => t.status === 'open').length;
            if (openTodos) {
              const tb = mk('span','sb-badge todo');
              tb.textContent = `${openTodos}`;
              tb.title = `${openTodos} open todo(s)`;
              bEl.appendChild(tb);
            }

            // Lean status badge
            const needsLean = ['definition','theorem','lemma','proposition','corollary'].includes(b.kind);
            if (needsLean) {
              const lb = mk('span','sb-badge');
              const s = b.status || 'not_started';
              const v = b.lean?.validation || 'not_checked';
              if (!b.lean || !b.lean.file) {
                lb.className = 'sb-badge lean-miss';

              } else if (s === 'stub' || s === 'not_started') {
                lb.className = 'sb-badge lean-warn';

              } else if (v === 'error' || s === 'has_sorry') {
                lb.className = 'sb-badge lean-err';
                lb.textContent = 'E';
                lb.title = `Lean: ${v === 'error' ? 'validation error' : 'has sorry'}`;
              } else if (v === 'ok' || s === 'proved') {

                lb.title = 'Lean: verified';

            bEl.onclick = () => {

                t.scrollIntoView({behavior:'smooth', block:'center'});

          }
          sb.appendChild(blkList);
        }
      }
      renderMath(sb);

      // Header
      const hdr = mk('div','hdr');
      hdr.innerHTML = `<h1>${esc(p.title)}</h1><div class="au">${p.authors.map(esc).join(', ')}</div>${p.affiliations?.length?`<div class="af">${p.affiliations.map(esc).join('; ')}</div>`:''}${p.date?`<div class="dt">${p.date}</div>`:''}`;
      app.appendChild(hdr);

      for (const ch of p.chapters) {
        const cd = mk('div','ch');
        if (ch.label) cd.id = ch.label;
        cd.innerHTML = `<h2 class="ch-t"><span class="n">Chapter ${ch.number}.</span> ${inl(ch.title)}</h2>`;
        renderMath(cd);
        let secNum = 0;
        for (const sec of ch.sections) {
          secNum++;

          renderMath(sd);
          for (const b of sec.blocks) {
            // Skip child examples unless they're the scroll target
            if ((b.kind === 'example' || b.kind === 'proof') && b.label && childBlocks.has(b.label) && pendingScroll !== b.label) continue;
            sd.appendChild(renderBlock(b));
          }
          cd.appendChild(sd);

        app.appendChild(cd);

      document.getElementById('c-hash').textContent = p._hash || '';

      // Scroll-spy: highlight active section in sidebar

      const sbSecs = sb.querySelectorAll('.sb-sec');
      const secMap = new Map();
      sbSecs.forEach(s => { secMap.set(s.textContent, s); });
      const secObs = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) {
            const secDiv = e.target;
            const h3 = secDiv.querySelector('.sec-t');
            if (h3) {
              sbSecs.forEach(s => s.classList.remove('active'));
              const match = secMap.get(h3.textContent);
              if (match) { match.classList.add('active'); match.scrollIntoView({block:'nearest'}); }
            }
          }
        }
      }, { rootMargin: '-20% 0px -70% 0px' });
      sectionEls.forEach(el => secObs.observe(el));

      // Scroll to pending label anchor
      if (pendingScroll) {
        requestAnimationFrame(() => scrollToLabel(pendingScroll));
      }
    }

    // ── Feedback panel ────────────────────────────────────
    let fbBlock = null;
    function openFeedback(block) {
      fbBlock = block;
      document.getElementById('fb-target').textContent = block.label || block.rootName || 'block';
      document.getElementById('fb-text').value = '';
      document.getElementById('feedback-overlay').classList.add('open');
      document.getElementById('feedback-panel').classList.add('open');
      document.getElementById('fb-text').focus();

      // Populate history from block todos
      const hist = document.getElementById('fb-history');
      hist.innerHTML = '';

        hist.innerHTML = '<div style="color:var(--fg-d);font-size:.7rem;padding:.5rem 0">No feedback yet</div>';
      } else {
        for (const t of todos.slice().reverse()) {
          const item = mk('div', `fb-item ${t.status || 'open'}`);
          item.innerHTML = `<div>${esc(t.comment || t.summary || '')}</div>
            <div class="fb-meta">${t.priority || ''} · ${t.assignee || ''} · ${t.status || 'open'} · ${t.createdAt ? new Date(t.createdAt).toLocaleDateString() : ''}</div>`;
          hist.appendChild(item);
        }
      }
    }
    function closeFeedback() {
      document.getElementById('feedback-overlay').classList.remove('open');
      document.getElementById('feedback-panel').classList.remove('open');
      fbBlock = null;
      // Stop voice recording if active
      if (isRecording && recognition) {
        isRecording = false;
        recognition.stop();
        const vb = document.getElementById('fb-voice');
        if (vb) { vb.classList.remove('recording'); vb.textContent = 'mic'; }
      }
    }
    document.getElementById('fb-close').onclick = closeFeedback;
    document.getElementById('feedback-overlay').onclick = closeFeedback;
    document.getElementById('fb-submit').onclick = async () => {
      if (!fbBlock || !document.getElementById('fb-text').value.trim()) return;
      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            paperId: paper?.id,
            rootName: fbBlock.rootName,
            summary: document.getElementById('fb-text').value.trim().slice(0, 80),
            comment: document.getElementById('fb-text').value.trim(),
            priority: document.getElementById('fb-priority').value,
            assignee: document.getElementById('fb-assignee').value
          })
        });
        if (!res.ok) throw new Error(`${res.status}`);
        const { todo } = await res.json();
        console.log(`[folio:feedback] submitted: ${todo.id} for ${fbBlock.rootName} (priority=${todo.priority})`);
        // Add to block's local todos so UI updates immediately
        if (!fbBlock.todos) fbBlock.todos = [];
        fbBlock.todos.push(todo);
        document.getElementById('fb-text').value = '';
        // Refresh the history panel to show the new item
        openFeedback(fbBlock);
        closeFeedback();
      } catch (e) {
        console.error('[folio:feedback] submit failed:', e.message);
        alert('Failed to submit: ' + e.message);
      }
    };

    // ── Voice input (Web Speech API) ──────────────────────
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    const voiceBtn = document.getElementById('fb-voice');

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = (e) => {
        const ta = document.getElementById('fb-text');
        let final = '', interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) final += t; else interim = t;
        }
        if (final) {
          ta.value += (ta.value && !ta.value.endsWith(' ') ? ' ' : '') + final;
        }
        // Show interim in placeholder
        if (interim) ta.placeholder = interim + '...';
        else ta.placeholder = 'Listening...';
      };
      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') console.warn('Speech error:', e.error);
      };
      recognition.onend = () => {
        if (isRecording) recognition.start(); // auto-restart if still recording
      };

      voiceBtn.onclick = () => {
        if (isRecording) {
          isRecording = false;
          recognition.stop();
          voiceBtn.classList.remove('recording');
          voiceBtn.textContent = 'mic';
          document.getElementById('fb-text').placeholder = 'Describe the issue, question, or suggestion...';
        } else {
          isRecording = true;
          recognition.start();
          voiceBtn.classList.add('recording');
          voiceBtn.textContent = 'stop';
        }
      };
    } else {
      voiceBtn.style.display = 'none'; // hide if not supported
    }

    function addTodoIndicators(el, block) {
      if (!block.todos?.length) return;
      const open = block.todos.filter(t => t.status === 'open');
      for (const t of open) {
        const d = mk('div', 'todo-inline decor');
        d.innerHTML = `<span class="todo-dot"></span><span class="todo-text">${esc(t.summary || t.comment || '')}</span><span>${t.priority || ''}</span>`;
        d.onclick = (e) => { e.stopPropagation(); openFeedback(block); };
        d.style.cursor = 'pointer';
        el.appendChild(d);
      }
    }

    // ── Folio (paper listing) ────────────────────────────
    function renderFolio(data) {
      document.body.classList.remove('has-sidebar');
      document.getElementById('sidebar').innerHTML = '';
      const app = document.getElementById('app');
      app.innerHTML = '';

      const hdr = mk('div','hdr');
      hdr.innerHTML = `<h1>${esc(data.title || 'Papers')}</h1>`;
      app.appendChild(hdr);

      const list = mk('div','folio-list');
      for (const p of (data.papers || [])) {
        const card = mk('div','folio-card');
        card.innerHTML = `
          <h2 class="fc-title">${esc(p.title)}</h2>
          ${p.description ? `<p class="fc-desc">${esc(p.description)}</p>` : ''}
          <div class="fc-meta">${p.stats?.chapters ?? '?'} chapters · ${p.stats?.blocks ?? '?'} blocks</div>
        `;

          location.hash = `#/${hashWithBranch(`view/${p.id}`)}`;
        };

      app.appendChild(list);

    }

    // ── Router ────────────────────────────────────────────
    // Routes (@ separates slug from branch, since branch names contain /):
    //   #/                                          → folio (current branch)
    //   #/@branch/name                              → folio on specific branch
    //   #/view/paper-id                             → paper (current branch)
    //   #/view/paper-id@branch/name                 → paper on specific branch
    //   #/view/label@branch/name                    → paper scrolled to block, on branch
    //   #/edit/label                                → inline edit (current branch)
    //   #/edit/label@branch/name                    → inline edit on branch
    //   #label                                      → shorthand for #/view/label
    const LABEL_RE = /^(def|thm|lem|prop|cor|conj|ex|rem|prf|eq|fig|sec|chap):/;
    let pendingScroll = null;

    /** Split "slug@branch/name" → { slug, branch } or { slug, branch: null }. */
    function parseBranchFromSlug(raw) {
      const at = raw.indexOf('@');
      if (at === -1) return { slug: raw, branch: null };
      return { slug: raw.slice(0, at), branch: decodeURIComponent(raw.slice(at + 1)) };
    }

    /** Update selectedBranch from URL if present, and sync the picker. */
    function applyUrlBranch(branch) {
      if (branch && branch !== selectedBranch) {
        selectedBranch = branch;
        brInput.value = branch;
        paper = null;
        bix.clear();
        console.log(`[folio:git] branch from URL: ${branch}`);
      }
    }

    /** Build a hash string with the current branch embedded (if not default). */
    function hashWithBranch(path, branch) {
      const br = branch || selectedBranch;
      if (!br || br === currentBranchName) return path;
      return `${path}@${encodeURIComponent(br)}`;
    }

    async function route() {
      const hash = location.hash || '#/';
      const raw = hash.slice(1); // remove #

      // Shorthand: #rem:foo or #rem:foo@branch → treat as view
      if (LABEL_RE.test(raw) || (raw.includes('@') && LABEL_RE.test(raw.split('@')[0]))) {
        const { slug, branch } = parseBranchFromSlug(raw);
        applyUrlBranch(branch);
        await routeView(slug);
        return;
      }

      const stripped = raw.replace(/^\//, '');

      // #/@branch/name → folio on branch
      if (stripped.startsWith('@')) {
        const branch = decodeURIComponent(stripped.slice(1));
        applyUrlBranch(branch);
        await loadFolio();
        return;
      }

      // Split only first two segments: action / rest (rest may contain @branch)
      const firstSlash = stripped.indexOf('/');
      const action = firstSlash === -1 ? stripped : stripped.slice(0, firstSlash);
      const rest = firstSlash === -1 ? '' : stripped.slice(firstSlash + 1);

      if (action === 'view' && rest) {
        const { slug, branch } = parseBranchFromSlug(rest);
        applyUrlBranch(branch);
        await routeView(slug);
      } else if (action === 'edit' && rest) {
        const { slug, branch } = parseBranchFromSlug(rest);
        applyUrlBranch(branch);
        await routeEdit(slug);
      } else {
        await loadFolio();
      }
    }

    async function routeView(slug) {
      // Is it a label? (has prefix like def:, rem:, etc.)
      const isLabel = LABEL_RE.test(slug);
      if (isLabel) {
        pendingScroll = slug;
        if (!paper) await loadDefaultPaper();
        else scrollToLabel(slug);
      } else {
        // It's a paper id
        await loadPaper(slug);
      }
    }

    async function routeEdit(slug) {
      // Load paper if needed, then scroll to block and open inline editor
      if (!paper) await loadDefaultPaper();
      const block = bix.get(slug);
      if (block) {
        const el = document.getElementById(slug);
        if (el) {
          // Force lazy-hydrate
          const task = lazyQueue.find(t => t.el === el || t.el.contains?.(el) || el.contains?.(t.el));
          if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); lazyObs.unobserve(task.el); }
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          // Open inline editor if it exists
          setTimeout(() => {
            if (el._inlineEditor && !el._inlineEditor.editor.classList.contains('open')) {
              el._inlineEditor.btn.click();
            }
          }, 300);
        }
      } else {
        document.getElementById('app').innerHTML =
          `<div class="err">Block not found: ${esc(slug)}</div>`;
      }
    }

    function renderEditView(block) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      document.body.classList.remove('has-sidebar');
      document.getElementById('sidebar').innerHTML = '';

      const hdr = mk('div','hdr');
      hdr.innerHTML = `<h1>${esc(block.title || block.label || block.rootName)}</h1>
        <div class="au"><span class="bk">${block.kind}</span> ${block.label ? `<span class="bl">${block.label}</span>` : ''}</div>
        <div class="dt"><a href="#/view/${esc(block.label || '')}" style="color:var(--ac)">back to paper</a></div>`;
      app.appendChild(hdr);

      // Source editor
      const edArea = mk('div','blk');
      const edHead = mk('div','');
      edHead.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem';
      edHead.innerHTML = `<h3 class="sec-t" style="margin:0">Markdown source</h3>`;
      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'save';
      saveBtn.style.cssText = 'background:var(--ac);border:none;color:var(--bg);font-family:var(--f-mono);font-size:.7rem;padding:.3rem .8rem;border-radius:3px;cursor:pointer';
      saveBtn.onclick = async () => {
        saveBtn.textContent = 'saving...';
        try {
          const res = await fetch('/api/block/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paperId: paper?.id, rootName: block.rootName, md: ta.value })
          });
          if (!res.ok) throw new Error(`${res.status}`);
          block.md = ta.value;
          saveBtn.textContent = 'saved';
          setTimeout(() => { saveBtn.textContent = 'save'; }, 1500);
        } catch (e) { saveBtn.textContent = 'error'; setTimeout(() => { saveBtn.textContent = 'save'; }, 2000); }
      };
      edHead.appendChild(saveBtn);
      edArea.appendChild(edHead);
      const ta = document.createElement('textarea');
      ta.value = block.md || '';
      ta.style.cssText = 'width:100%;min-height:300px;background:var(--bg-r);border:1px solid var(--brd);border-radius:4px;color:var(--fg);font-family:var(--f-mono);font-size:.8rem;padding:.8rem;resize:vertical';
      edArea.appendChild(ta);
      app.appendChild(edArea);

      // Live preview
      const prev = mk('div','blk');
      prev.innerHTML = `<h3 class="sec-t">Preview</h3>`;
      const prevBody = mk('div',`env ${block.kind}`);
      prev.appendChild(prevBody);
      app.appendChild(prev);

      function updatePreview() {
        const {html: bh, texBlocks: tx} = parseMd(ta.value);
        prevBody.innerHTML = `<div class="bb">${bh}</div>`;
        fillTex(prevBody, tx, block.rendered);
        renderMath(prevBody);
      }
      ta.addEventListener('input', updatePreview);
      updatePreview();

      // Manifest view
      const manifest = mk('div','blk');
      manifest.innerHTML = `<h3 class="sec-t">Manifest (.ts)</h3>
        <pre style="background:var(--bg-r);border:1px solid var(--brd);border-radius:4px;padding:.8rem;font-size:.75rem;color:var(--fg-d);overflow-x:auto">${esc(JSON.stringify({kind:block.kind,label:block.label,title:block.title,uses:block.uses,lean:block.lean,tags:block.tags,status:block.status}, null, 2))}</pre>`;
      app.appendChild(manifest);

      document.title = `Edit: ${block.title || block.label} — Folio`;
    }

    function scrollToLabel(label) {
      const el = document.getElementById(label);
      if (!el) { pendingScroll = null; return; }

      // Force lazy-hydrate so content is visible
      const task = lazyQueue.find(t => t.el === el || t.el.contains?.(el) || el.contains?.(t.el));
      if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); lazyObs.unobserve(task.el); }

      // If hidden (remark/example), show it and its wrapper
      const wrap = el.closest('.blk-remark, .blk-example');
      if (wrap && wrap.style.display === 'none') wrap.style.display = '';

      // If inside a collapsed example toggle panel, open it
      const exPanel = el.closest('.ex-panel');
      if (exPanel && !exPanel.classList.contains('open')) {
        exPanel.classList.add('open');
        const toggle = exPanel.previousElementSibling;
        if (toggle?.classList.contains('ex-toggle')) toggle.classList.add('open');
      }

      // Also hide the stub if there is one
      const stub = wrap?.previousElementSibling;
      if (stub?.classList.contains('blk-stub')) stub.style.display = 'none';

      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.outline = '2px solid var(--ac)';
      setTimeout(() => { el.style.outline = ''; }, 2000);
      pendingScroll = null;
    }

    async function loadFolio() {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loading">loading folio...</div>';
      try {
        const r = await fetch(`/api/folio?_=1${branchParam()}`);
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        renderFolio(await r.json());
        updateDiffButton();
      } catch (e) {
        app.innerHTML = `<div class="err">Could not load folio: ${esc(e.message)}<br><br>Ensure the MCP server is running (port 3200).</div>`;
      }
    }

    async function loadDefaultPaper() {
      // Load first paper from folio
      try {
        const r = await fetch(`/api/folio?_=1${branchParam()}`);
        if (!r.ok) throw new Error(`${r.status}`);
        const data = await r.json();
        const id = data.papers?.[0]?.id || 'quantum-observable-universe';
        await loadPaper(id);
      } catch {
        await loadPaper('quantum-observable-universe');
      }
    }

    async function loadPaper(id) {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loading">loading paper...</div>';
      try {
        const r = await fetch(`/api/paper?id=${encodeURIComponent(id)}${branchParam()}`);
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        renderPaper(await r.json());
        // Update URL to be shareable (embed branch if non-default)
        const target = hashWithBranch(`view/${id}`);
        history.replaceState(null, '', `#/${target}`);
        updateDiffButton();
        // Clear cached diff when switching papers
        diffData = null; diffMode = false; clearInlineDiffs();
      } catch (e) {
        app.innerHTML = `<div class="err">Could not load paper: ${esc(e.message)}</div>`;
      }
    }

    window.addEventListener('hashchange', route);
    route();

    // ── Diff overlay + inline diff mode ─────────────────────
    const diffBtn = document.getElementById('c-diff');
    const diffOverlay = document.getElementById('diff-overlay');
    const diffBody = document.getElementById('diff-body');
    const diffTitle = document.getElementById('diff-title');
    const diffSummaryEl = document.getElementById('diff-summary');
    let diffData = null; // cached diff response
    let diffMode = false; // inline diff highlights active
    let diffBaseBlocks = new Map(); // rootName → base md for inline diff

    // Show/hide diff button based on branch
    function updateDiffButton() {
      const show = selectedBranch && selectedBranch !== 'main' && selectedBranch !== 'master' && paper;
      diffBtn.classList.toggle('visible', !!show);
    }

    // Simple line-level diff: returns array of {type: 'add'|'del'|'ctx', text}
    function lineDiff(base, head) {
      const baseLines = (base || '').split('\n');
      const headLines = (head || '').split('\n');
      const result = [];

      // LCS-based diff (simplified Myers)
      const n = baseLines.length, m = headLines.length;
      // For large files, fall back to simple comparison
      if (n + m > 2000) {
        baseLines.forEach(l => result.push({type:'del',text:l}));
        headLines.forEach(l => result.push({type:'add',text:l}));
        return result;
      }

      // Build edit script via DP
      const dp = Array.from({length:n+1}, () => new Uint16Array(m+1));
      for (let i = 0; i <= n; i++) dp[i][0] = i;
      for (let j = 0; j <= m; j++) dp[0][j] = j;
      for (let i = 1; i <= n; i++)
        for (let j = 1; j <= m; j++)
          dp[i][j] = baseLines[i-1] === headLines[j-1]
            ? dp[i-1][j-1]
            : 1 + Math.min(dp[i-1][j], dp[i][j-1]);

      // Traceback
      let i = n, j = m;
      const ops = [];
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && baseLines[i-1] === headLines[j-1]) {
          ops.push({type:'ctx',text:baseLines[i-1]}); i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j-1] <= dp[i-1][j])) {
          ops.push({type:'add',text:headLines[j-1]}); j--;
        } else {
          ops.push({type:'del',text:baseLines[i-1]}); i--;
        }
      }
      ops.reverse();
      return ops;
    }

    function renderDiffLines(ops) {
      return ops.map(op => {
        const prefix = op.type === 'add' ? '+' : op.type === 'del' ? '-' : ' ';
        const cls = op.type === 'add' ? 'diff-line-add' : op.type === 'del' ? 'diff-line-del' : 'diff-line-ctx';
        return `<span class="${cls}">${prefix} ${esc(op.text)}</span>`;
      }).join('\n');
    }

    async function loadDiff() {
      if (!paper?.id) return null;
      const base = 'main';
      const head = selectedBranch || currentBranchName;
      if (head === 'main' || head === 'master') return null;
      console.log(`[folio:diff] loading diff: ${base}..${head} for ${paper.id}`);
      try {
        const r = await fetch(`/api/diff?id=${encodeURIComponent(paper.id)}&base=${encodeURIComponent(base)}&head=${encodeURIComponent(head)}`);
        if (!r.ok) throw new Error(`${r.status}`);
        const data = await r.json();
        console.log(`[folio:diff] loaded: +${data.summary.added} -${data.summary.removed} ~${data.summary.changed}`);
        return data;
      } catch (e) {
        console.error('[folio:diff] load failed:', e.message);
        return null;
      }
    }

    function renderDiffOverlay(data) {
      diffData = data;
      diffTitle.textContent = `Changes: ${data.base} → ${data.head}`;
      const s = data.summary;
      diffSummaryEl.innerHTML = `<span class="da">+${s.added}</span> <span class="dr">-${s.removed}</span> <span class="dc">~${s.changed}</span> · ${s.unchanged} unchanged`;

      diffBody.innerHTML = '';
      const changed = data.blocks.filter(b => b.status !== 'unchanged');
      if (!changed.length) {
        diffBody.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--fg-d)">No changes between branches</div>';
        return;
      }

      // Group by chapter (use paper's chapter order)
      const chapterOrder = [];
      const chapterBlocks = new Map();
      if (paper) {
        for (const ch of paper.chapters) {
          const chKey = ch.title;
          chapterOrder.push(chKey);
          chapterBlocks.set(chKey, []);
          const secBlocks = new Set();
          for (const sec of ch.sections)
            for (const blk of sec.blocks)
              secBlocks.add(blk.rootName);
          for (const d of changed) {
            if (secBlocks.has(d.rootName)) chapterBlocks.get(chKey).push(d);
          }
        }
      }
      // Catch any orphans (removed blocks not in current paper)
      const placed = new Set();
      for (const [, blks] of chapterBlocks) for (const b of blks) placed.add(b.rootName);
      const orphans = changed.filter(b => !placed.has(b.rootName));
      if (orphans.length) { chapterOrder.push('Other'); chapterBlocks.set('Other', orphans); }

      for (const chTitle of chapterOrder) {
        const blks = chapterBlocks.get(chTitle);
        if (!blks?.length) continue;

        const chDiv = mk('div','diff-ch');
        const chHead = mk('div','diff-ch-title');
        chHead.textContent = chTitle;
        chDiv.appendChild(chHead);

        for (const bd of blks) {
          const card = mk('div',`diff-card ${bd.status}`);
          const head = mk('div','diff-card-head');

          const statusBadge = mk('span',`diff-status ${bd.status}`);
          statusBadge.textContent = bd.status;
          head.appendChild(statusBadge);

          const kind = mk('span','diff-kind');
          kind.textContent = bd.kind;
          head.appendChild(kind);

          const title = mk('span','diff-title');
          title.innerHTML = inl(bd.title || bd.rootName);
          renderMath(title);
          head.appendChild(title);

          // Link to view inline
          if (bd.label) {
            const goto = document.createElement('a');
            goto.className = 'diff-goto';
            goto.textContent = 'view inline ↗';
            goto.href = `#${bd.label}`;
            goto.onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              closeDiffOverlay();
              // Enable inline diff mode
              if (!diffMode) toggleDiffMode(true);
              setTimeout(() => {
                const el = document.getElementById(bd.label);
                if (el) {
                  const task = lazyQueue.find(t => t.el === el || t.el.contains?.(el) || el.contains?.(t.el));
                  if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); lazyObs.unobserve(task.el); }
                  el.scrollIntoView({behavior:'smooth',block:'center'});
                  el.style.outline = '2px solid var(--yel)';
                  setTimeout(() => { el.style.outline = ''; }, 2500);
                }
              }, 100);
            };
            head.appendChild(goto);
          }

          // Body (collapsed by default)
          const body = mk('div','diff-card-body');

          if (bd.statusDiff) {
            const sc = mk('div','diff-status-change');
            sc.innerHTML = `status: <span style="background:rgba(200,70,70,.15)">${esc(bd.statusDiff.base || 'none')}</span> → <span style="background:rgba(42,170,70,.15)">${esc(bd.statusDiff.head || 'none')}</span>`;
            body.appendChild(sc);
          }

          if (bd.mdDiff) {
            const ops = lineDiff(bd.mdDiff.base, bd.mdDiff.head);
            const pre = document.createElement('pre');
            pre.innerHTML = renderDiffLines(ops);
            body.appendChild(pre);
          } else if (bd.status === 'added') {
            // Show full content for new blocks
            const blk = bix.get(bd.label);
            if (blk?.md) {
              const pre = document.createElement('pre');
              pre.innerHTML = blk.md.split('\n').map(l => `<span class="diff-line-add">+ ${esc(l)}</span>`).join('\n');
              body.appendChild(pre);
            }
          }

          if (bd.leanDiff) {
            const lh = mk('div','diff-status-change');
            lh.textContent = 'Lean source changed:';
            body.appendChild(lh);
            const ops = lineDiff(bd.leanDiff.base, bd.leanDiff.head);
            const pre = document.createElement('pre');
            pre.innerHTML = renderDiffLines(ops);
            body.appendChild(pre);
          }

          head.onclick = () => card.classList.toggle('expanded');
          card.appendChild(head);
          card.appendChild(body);
          chDiv.appendChild(card);
        }

        diffBody.appendChild(chDiv);
      }
    }

    function openDiffOverlay() {
      diffOverlay.classList.add('open');
      diffBtn.classList.add('on');
    }
    function closeDiffOverlay() {
      diffOverlay.classList.remove('open');
      if (!diffMode) diffBtn.classList.remove('on');
    }
    document.getElementById('diff-close').onclick = closeDiffOverlay;

    // Toggle inline diff mode (red/green highlights on blocks)
    function toggleDiffMode(force) {
      diffMode = typeof force === 'boolean' ? force : !diffMode;
      diffBtn.classList.toggle('on', diffMode || diffOverlay.classList.contains('open'));
      if (diffMode && diffData) {
        applyInlineDiffs(diffData);
      } else {
        clearInlineDiffs();
      }
    }

    function applyInlineDiffs(data) {
      // Build map of base content
      diffBaseBlocks.clear();
      for (const bd of data.blocks) {
        if (bd.mdDiff) diffBaseBlocks.set(bd.rootName, bd.mdDiff.base);
        if (bd.status === 'added') diffBaseBlocks.set(bd.rootName, null); // new block
        if (bd.status === 'removed') diffBaseBlocks.set(bd.rootName, bd.rootName); // sentinel
      }

      // Walk all rendered blocks and annotate
      for (const [label, block] of bix) {
        const el = document.getElementById(label);
        if (!el) continue;
        const bd = data.blocks.find(b => b.rootName === block.rootName);
        if (!bd || bd.status === 'unchanged') {
          el.style.removeProperty('outline');
          continue;
        }

        if (bd.status === 'added') {
          el.style.outline = '2px solid var(--grn)';
          el.title = 'New in this branch';
        } else if (bd.status === 'changed') {
          el.style.outline = '2px solid var(--yel)';
          // If the block body is hydrated, show inline diff
          const bb = el.querySelector('.bb');
          if (bb && bd.mdDiff) {
            const ops = lineDiff(bd.mdDiff.base, bd.mdDiff.head);
            const diffHtml = ops.map(op => {
              if (op.type === 'add') return `<div class="inline-diff-add">${inl(op.text)}</div>`;
              if (op.type === 'del') return `<div class="inline-diff-del">${inl(op.text)}</div>`;
              return `<div>${inl(op.text)}</div>`;
            }).join('');
            bb.innerHTML = diffHtml;
            renderMath(bb);
            bb.dataset.diffActive = '1';
          }
        }
      }
    }

    function clearInlineDiffs() {
      diffBaseBlocks.clear();
      for (const [label, block] of bix) {
        const el = document.getElementById(label);
        if (!el) continue;
        el.style.removeProperty('outline');
        // Restore original content if diff was applied
        const bb = el.querySelector('.bb');
        if (bb?.dataset.diffActive) {
          delete bb.dataset.diffActive;
          const {html: bh, texBlocks: tx} = parseMd(block.md || '');
          bb.innerHTML = bh;
          fillTex(bb, tx, block.rendered);
          renderMath(bb); resolveRefs(bb);
        }
      }
    }

    // Diff button: first click opens overlay, toggle to close
    diffBtn.addEventListener('click', async () => {
      if (diffOverlay.classList.contains('open')) {
        closeDiffOverlay();
        // If diff mode was on before overlay, keep it on
        return;
      }
      // Load diff data if needed
      if (!diffData || diffData.head !== (selectedBranch || currentBranchName)) {
        diffBtn.textContent = 'loading...';
        diffBtn.disabled = true;
        diffData = await loadDiff();
        diffBtn.textContent = 'diff';
        diffBtn.disabled = false;
        if (!diffData) return;
      }
      renderDiffOverlay(diffData);
      openDiffOverlay();
    });

    // Right-click diff button toggles inline diff mode
    diffBtn.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (!diffData) return;
      closeDiffOverlay();
      toggleDiffMode();
    });

    // ── Claude Chat Assistant ─────────────────────────────
    const chatFab = document.getElementById('claude-fab');
    const chatPanel = document.getElementById('chat-panel');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const chatTyping = document.getElementById('chat-typing');
    const chatModeEl = document.getElementById('chat-mode');
    const chatActions = document.getElementById('chat-actions');

    let chatHistory = []; // {role, content}
    let chatStreaming = false;
    let chatInitialized = false;
    let chatOpen = false;

    // Determine mode: reading mode = reader, otherwise editor
    function getChatMode() {
      return readingMode ? 'read' : 'edit';
    }

    function updateChatMode() {
      const mode = getChatMode();
      chatModeEl.textContent = mode === 'read' ? 'reader' : 'editor';
    }

    // Get context: currently visible block or selected text
    function getChatContext() {
      const ctx = { paperId: paper?.id };
      // Check for text selection
      const sel = window.getSelection();
      if (sel && sel.toString().trim().length > 5) {
        ctx.selectedText = sel.toString().trim();
        // Find the block containing the selection
        const anchor = sel.anchorNode?.parentElement?.closest?.('.env[id], .blk[id]');
        if (anchor) {
          const label = anchor.id;
          const block = bix.get(label);
          if (block) {
            ctx.blockLabel = label;
            ctx.blockMd = block.md;
            ctx.blockKind = block.kind;
          }
        }
      }
      // If no selection, find the block currently in viewport center
      if (!ctx.blockLabel) {
        const viewY = window.innerHeight / 2;
        for (const [label, block] of bix) {
          const el = document.getElementById(label);
          if (!el) continue;
          const r = el.getBoundingClientRect();
          if (r.top < viewY && r.bottom > viewY - 100) {
            ctx.blockLabel = label;
            ctx.blockMd = block.md;
            ctx.blockKind = block.kind;
            break;
          }
        }
      }
      return ctx;
    }

    function addChatMessage(role, content) {
      const div = mk('div', `chat-msg ${role}`);
      // Basic markdown rendering for assistant messages
      if (role === 'assistant' || role === 'system') {
        let html = esc(content);
        // Inline math
        html = html.replace(/\$([^$]+)\$/g, '<span data-mi>$1</span>');
        // Bold
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        // Italic
        html = html.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
        // Code
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        // Cross-refs to blocks
        html = html.replace(/\b(def|thm|lem|prop|cor|rem|ex):([a-z0-9-]+)/g,
          '<a href="#$1:$2" style="color:var(--ac)">$1:$2</a>');
        div.innerHTML = html;
        renderMath(div);
      } else {
        div.textContent = content;
      }
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }

    async function sendChatMessage(text) {
      if (chatStreaming || !text.trim()) return;

      chatHistory.push({ role: 'user', content: text.trim() });
      addChatMessage('user', text.trim());
      chatInput.value = '';
      chatInput.style.height = 'auto';
      chatStreaming = true;
      chatSend.disabled = true;
      chatTyping.classList.add('active');

      const mode = getChatMode();
      const context = getChatContext();

      // Create assistant message container for streaming
      const assistDiv = mk('div', 'chat-msg assistant');
      chatMessages.appendChild(assistDiv);

      let fullResponse = '';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: chatHistory.slice(-10), // last 10 messages for context
            context,
            mode,
          }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: 'Unknown error' }));
          throw new Error(err.error || `HTTP ${res.status}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6);
            if (data === '[DONE]') break;
            try {
              const parsed = JSON.parse(data);
              if (parsed.text) {
                fullResponse += parsed.text;
                // Re-render with formatting
                let html = esc(fullResponse);
                html = html.replace(/\$([^$]+)\$/g, '<span data-mi>$1</span>');
                html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                html = html.replace(/\b(def|thm|lem|prop|cor|rem|ex):([a-z0-9-]+)/g,
                  '<a href="#$1:$2" style="color:var(--ac)">$1:$2</a>');
                // Paragraphs
                html = html.replace(/\n\n/g, '</p><p>');
                assistDiv.innerHTML = '<p>' + html + '</p>';
                renderMath(assistDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
              }
              if (parsed.error) throw new Error(parsed.error);
            } catch (e) {
              if (e.message !== 'Unexpected end of JSON input') console.warn('Chat parse:', e);
            }
          }
        }

        chatHistory.push({ role: 'assistant', content: fullResponse });

        // Check if error was reported — offer to create todo
        if (mode !== 'read' && /error|mistake|wrong|incorrect|typo|bug/i.test(chatHistory[chatHistory.length - 2]?.content || '')) {
          const todoBtn = mk('button', 'chat-action');
          todoBtn.textContent = 'Create feedback todo from this';
          todoBtn.style.margin = '.3rem 0';
          todoBtn.onclick = async () => {
            const ctx = getChatContext();
            if (!ctx.blockLabel || !paper?.id) {
              addChatMessage('system', 'Could not determine which block to attach feedback to. Navigate to a block first.');
              return;
            }
            const userMsg = chatHistory[chatHistory.length - 2]?.content || '';
            try {
              const res = await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  paperId: paper.id,
                  rootName: ctx.blockLabel.replace(/^(def|thm|lem|prop|cor|rem|ex):/, ''),
                  summary: userMsg.slice(0, 80),
                  comment: userMsg,
                  priority: 'medium',
                  assignee: 'editor-agent',
                }),
              });
              if (res.ok) {
                addChatMessage('system', 'Feedback todo created.');
                todoBtn.remove();
              }
            } catch (e) {
              addChatMessage('system', 'Failed to create todo: ' + e.message);
            }
          };
          chatMessages.appendChild(todoBtn);
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }

      } catch (e) {
        assistDiv.textContent = `Error: ${e.message}`;
        assistDiv.style.color = 'var(--red)';
      } finally {
        chatStreaming = false;
        chatSend.disabled = false;
        chatTyping.classList.remove('active');
      }
    }

    // FAB toggle
    chatFab.onclick = () => {
      chatOpen = !chatOpen;
      chatPanel.classList.toggle('open', chatOpen);
      chatFab.classList.toggle('open', chatOpen);
      if (chatOpen) {
        updateChatMode();
        chatInput.focus();
        if (!chatInitialized) {
          chatInitialized = true;
          // Auto-greeting based on mode
          const mode = getChatMode();
          if (mode === 'read') {
            addChatMessage('assistant', 'Welcome! What would you like to learn about this paper? I can explain concepts, help you navigate between definitions and theorems, or answer questions about the mathematics.');
          } else {
            // Editor mode: prompt to get paper status
            addChatMessage('assistant', 'Editor mode. I can help you review the paper, check status, or triage feedback. What would you like to work on?');
            // Auto-send a status request
            setTimeout(() => {
              chatHistory.push({ role: 'user', content: 'Get paper status — give me a quick overview of what needs attention.' });
              addChatMessage('user', 'Get paper status');
              sendChatMessage.call(null, ''); // trigger with history already set
              // Actually send properly:
              chatHistory.pop(); // undo the push since sendChatMessage will re-push
              chatMessages.lastChild.remove(); // undo the addChatMessage
              sendChatMessage('Get paper status — give me a quick overview of what needs attention.');
            }, 300);
          }
        }
      }
    };

    // Close button
    document.getElementById('chat-close').onclick = () => {
      chatOpen = false;
      chatPanel.classList.remove('open');
      chatFab.classList.remove('open');
    };

    // Clear button
    document.getElementById('chat-clear').onclick = () => {
      chatHistory = [];
      chatMessages.innerHTML = '';
      chatInitialized = false;
      addChatMessage('system', 'Chat cleared.');
    };

    // Quick action buttons
    chatActions.addEventListener('click', (e) => {
      const btn = e.target.closest('.chat-action');
      if (!btn || !btn.dataset.prompt) return;
      const prompt = btn.dataset.prompt;
      if (prompt.endsWith(':')) {
        // Partial prompt — put in input for user to complete
        chatInput.value = prompt + ' ';
        chatInput.focus();
      } else {
        sendChatMessage(prompt);
      }
    });

    // Send on click or Enter (Shift+Enter for newline)
    chatSend.onclick = () => sendChatMessage(chatInput.value);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage(chatInput.value);
      }
    });

    // Auto-resize textarea
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 80) + 'px';
    });

    // Update chat mode when reading mode toggles
    const origBtnRdClick = btnRd.onclick;
    btnRd.addEventListener('click', () => {
      setTimeout(updateChatMode, 0);
    });
  </script>
</body>
