    // ── Dependency graph overlay ─────────────────────────
    const depOverlay = document.getElementById('dep-overlay');
    const depGraphSvg = document.getElementById('dep-graph-svg');
    const depTitle = document.getElementById('dep-title');
    const depSubtitle = document.getElementById('dep-subtitle');
    const depExtPanel = document.getElementById('dep-ext-panel');
    const depExtList = document.getElementById('dep-ext-list');
    document.getElementById('dep-close').onclick = () => depOverlay.classList.remove('open');
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && depOverlay.classList.contains('open')) depOverlay.classList.remove('open'); });

    /** Determine lean status class for a block */
    function depNodeClass(b) {
      if (!b) return 'dep-node-none';
      if (b._external) return 'dep-node-ext';
      const v = b.lean?.validation || '';
      const s = b.status || '';
      if (v === 'validated' || v === 'leanok' || s === 'proved' || s === 'mathlib_ok') return 'dep-node-ok';
      if (v === 'error') return 'dep-node-err';
      if (s === 'has_sorry') return 'dep-node-sorry';
      if (s === 'stated' || v === 'stub') return 'dep-node-stated';
      return 'dep-node-none';
    }

    /** Determine edge type between two blocks */
    function depEdgeInfo(from, to) {
      // "from" uses "to" — check if there's a narrative proof and/or lean proof
      const hasNarrative = from.proofs?.some(pl => { const p = bix.get(pl); return p && p.md && p.md.trim().length > 20; })
        || (from.md && from.md.trim().length > 20 && ['theorem','lemma','proposition','corollary'].includes(from.kind));
      const fromLean = from.lean || from.proofs?.some(pl => { const p = bix.get(pl); return p?.lean; });
      const toLean = to.lean;
      let leanStatus = 'lean-none';
      if (fromLean && toLean) {
        const fromOk = from.lean?.validation === 'validated' || from.lean?.validation === 'leanok' ||
          from.status === 'proved' || from.status === 'mathlib_ok';
        leanStatus = fromOk ? 'lean-complete' : 'lean-incomplete';
      }
      return { hasNarrative, leanStatus };
    }

    /**
     * Build the dependency subgraph rooted at `rootLabel`.
     * Walks `uses[]` transitively. Returns { nodes: Map<label, block>, edges: [{from,to}], externals: [] }
     */
    function buildDepGraph(rootLabel) {
      const nodes = new Map();
      const edges = [];
      const externals = []; // lean dependencies not in paper
      const visited = new Set();

      function walk(label) {
        if (visited.has(label)) return;
        visited.add(label);
        const b = bix.get(label);
        if (!b) return; // label not found
        nodes.set(label, b);

        // Collect Lean mathlibLinks as external dependencies
        if (b.lean?.mathlibLinks) {
          for (const ml of b.lean.mathlibLinks) {
            if (!externals.some(e => e.decl === ml)) {
              externals.push({ decl: ml, fromLabel: label });
            }
          }
        }

        // Walk uses[] edges
        if (b.uses) {
          for (const dep of b.uses) {
            const depBlock = bix.get(dep);
            if (depBlock) {
              edges.push({ from: label, to: dep });
              walk(dep);
            }
          }
        }
      }

      walk(rootLabel);

      // Also walk "upward" — blocks that use the root
      function walkUp(label) {
        const refs = usedByIndex.get(label) || [];
        for (const ref of refs) {
          if (visited.has(ref.label)) continue;
          visited.add(ref.label);
          const b = bix.get(ref.label);
          if (!b) continue;
          nodes.set(ref.label, b);
          edges.push({ from: ref.label, to: label });
          if (b.lean?.mathlibLinks) {
            for (const ml of b.lean.mathlibLinks) {
              if (!externals.some(e => e.decl === ml)) {
                externals.push({ decl: ml, fromLabel: ref.label });
              }
            }
          }
          // Only one level up to keep graph manageable
        }
      }
      walkUp(rootLabel);

      return { nodes, edges, externals };
    }

    /**
     * Assign layers via topological sort (Kahn's algorithm).
     * Root gets layer 0; its dependencies get deeper layers.
     */
    function layoutGraph(nodes, edges, rootLabel) {
      // Build adjacency (from → [to]) and reverse
      const adj = new Map();
      const indeg = new Map();
      for (const label of nodes.keys()) { adj.set(label, []); indeg.set(label, 0); }
      for (const {from, to} of edges) {
        if (adj.has(from) && adj.has(to)) {
          adj.get(from).push(to);
          indeg.set(to, (indeg.get(to) || 0) + 1);
        }
      }

      // Topological layers (BFS from sources)
      const layers = [];
      let queue = [];
      for (const [label, deg] of indeg) { if (deg === 0) queue.push(label); }
      if (queue.length === 0 && nodes.size > 0) queue = [rootLabel]; // cycle fallback
      while (queue.length > 0) {
        layers.push([...queue]);
        const next = [];
        for (const label of queue) {
          for (const dep of (adj.get(label) || [])) {
            indeg.set(dep, indeg.get(dep) - 1);
            if (indeg.get(dep) === 0) next.push(dep);
          }
        }
        queue = next;
      }
      // Ensure all nodes appear (handle cycles)
      const placed = new Set(layers.flat());
      const remaining = [...nodes.keys()].filter(l => !placed.has(l));
      if (remaining.length) layers.push(remaining);

      return layers;
    }

    /** Render the dependency graph as SVG into depGraphSvg */
    function renderDepGraph(rootLabel) {
      const { nodes, edges, externals } = buildDepGraph(rootLabel);
      const root = bix.get(rootLabel);
      if (!root) return;

      depTitle.textContent = `${root.kind}: ${root.title || rootLabel}`;
      depSubtitle.textContent = rootLabel;

      // Layout
      const layers = layoutGraph(nodes, edges, rootLabel);
      const nodeW = 180, nodeH = 52, layerGap = 80, nodeGap = 24;

      // Compute positions
      const pos = new Map();
      let maxX = 0, maxY = 0;
      layers.forEach((layer, li) => {
        const totalW = layer.length * nodeW + (layer.length - 1) * nodeGap;
        const startX = -totalW / 2;
        layer.forEach((label, ni) => {
          const x = startX + ni * (nodeW + nodeGap);
          const y = li * (nodeH + layerGap);
          pos.set(label, { x, y });
          maxX = Math.max(maxX, x + nodeW);
          maxY = Math.max(maxY, y + nodeH);
        });
      });

      // Compute viewBox centering
      let minX = Infinity;
      for (const p of pos.values()) minX = Math.min(minX, p.x);
      const pad = 40;
      const vbX = minX - pad;
      const vbY = -pad;
      const vbW = (maxX - minX) + nodeW + pad * 2;
      const vbH = maxY + nodeH + pad * 2;

      // Build SVG
      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vbX} ${vbY} ${vbW} ${vbH}" style="min-height:${Math.min(vbH + 60, 600)}px">`;

      // Defs for arrowheads
      svg += `<defs>
        <marker id="ah-narrative" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" class="dep-arrowhead-narrative"/></marker>
        <marker id="ah-lean-complete" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" class="dep-arrowhead-lean-complete"/></marker>
        <marker id="ah-lean-incomplete" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" class="dep-arrowhead-lean-incomplete"/></marker>
        <marker id="ah-lean-none" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" class="dep-arrowhead-lean-none"/></marker>
      </defs>`;

      // Draw edges
      for (const {from, to} of edges) {
        const fp = pos.get(from), tp = pos.get(to);
        if (!fp || !tp) continue;
        const fromBlock = nodes.get(from), toBlock = nodes.get(to);
        const info = depEdgeInfo(fromBlock, toBlock);

        const fx = fp.x + nodeW / 2, fy = fp.y + nodeH;
        const tx = tp.x + nodeW / 2, ty = tp.y;
        const cy1 = fy + layerGap * 0.35, cy2 = ty - layerGap * 0.35;

        // Narrative edge (solid blue)
        if (info.hasNarrative) {
          const ox = -4; // slight offset so both edges visible
          svg += `<path class="dep-edge narrative" d="M${fx+ox},${fy} C${fx+ox},${cy1} ${tx+ox},${cy2} ${tx+ox},${ty}" marker-end="url(#ah-narrative)"/>`;
        }
        // Lean edge
        const lox = info.hasNarrative ? 4 : 0;
        svg += `<path class="dep-edge ${info.leanStatus}" d="M${fx+lox},${fy} C${fx+lox},${cy1} ${tx+lox},${cy2} ${tx+lox},${ty}" marker-end="url(#ah-${info.leanStatus})"/>`;
      }

      // Draw nodes
      for (const [label, block] of nodes) {
        const p = pos.get(label);
        if (!p) continue;
        const cls = depNodeClass(block);
        const isRoot = label === rootLabel;
        const kindAbbr = {definition:'def',theorem:'thm',lemma:'lem',proposition:'prop',corollary:'cor',conjecture:'conj',example:'ex',remark:'rem',proof:'prf'}[block.kind] || block.kind;
        const title = block.title ? esc(block.title).substring(0, 22) + (block.title.length > 22 ? '…' : '') : label;
        const leanDecl = block.lean?.decl ? esc(block.lean.decl).substring(0, 24) : '';

        svg += `<g class="dep-node ${cls}${isRoot ? ' dep-node-root' : ''}" data-label="${esc(label)}" transform="translate(${p.x},${p.y})">`;
        svg += `<rect width="${nodeW}" height="${nodeH}" />`;
        svg += `<text class="node-kind" x="8" y="15">${kindAbbr}</text>`;
        svg += `<text x="8" y="30">${title}</text>`;
        if (leanDecl) {
          const leanColor = cls === 'dep-node-ok' ? 'var(--grn)' : cls === 'dep-node-sorry' ? 'var(--yel)' : 'var(--fg-d)';
          svg += `<text class="node-lean" x="8" y="44" fill="${leanColor}">${leanDecl}</text>`;
        }
        svg += `</g>`;
      }

      svg += `</svg>`;
      depGraphSvg.innerHTML = svg;

      // Wire up node clicks → navigate to block
      depGraphSvg.querySelectorAll('.dep-node').forEach(node => {
        node.addEventListener('click', () => {
          const label = node.dataset.label;
          depOverlay.classList.remove('open');
          const el = document.getElementById(label);
          if (el) el.scrollIntoView({ behavior: 'smooth' });
        });
      });

      // External deps
      if (externals.length > 0) {
        depExtPanel.style.display = '';
        depExtList.innerHTML = '';
        for (const ext of externals) {
          const row = mk('div','');
          const parts = ext.decl.split('.');
          const name = parts[parts.length - 1];
          // Link to Mathlib docs if it looks like a Mathlib declaration
          const url = ext.decl.startsWith('Mathlib') || ext.decl.includes('.')
            ? `https://leanprover-community.github.io/mathlib4_docs/find/#doc/${encodeURIComponent(ext.decl)}`
            : null;
          if (url) {
            row.innerHTML = `<a href="${url}" target="_blank" rel="noopener">${esc(ext.decl)}</a> <span style="color:var(--fg-d);font-size:.55rem">(from ${esc(ext.fromLabel)})</span>`;
          } else {
            row.innerHTML = `<span>${esc(ext.decl)}</span> <span style="color:var(--fg-d);font-size:.55rem">(from ${esc(ext.fromLabel)})</span>`;
          }
          depExtList.appendChild(row);
        }
      } else {
        depExtPanel.style.display = 'none';
      }

      depOverlay.classList.add('open');
    }

    /** Create lightning bolt button for dependency graph */
    function mkDepBolt(label) {
      const btn = mk('button','dep-bolt');
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg>';
      btn.title = 'Show dependency graph';
      btn.onclick = (e) => { e.stopPropagation(); renderDepGraph(label); };
      return btn;
    }

    // ── Block header helper ────────────────────────────────
    function mkBlockHeader(kind, title, label) {
      const div = mk('div','bh');
      // Anchor wrapping kind + title — click to copy permalink
      const anchor = document.createElement('a');
      anchor.className = 'bh-anchor';
      if (label) anchor.href = `#${label}`;
      anchor.innerHTML = `<span class="bk">${kind}</span>${title ? `<span class="bt">${inl(title)}</span>` : ''}<span class="anchor-icon">#</span>`;
      const copied = document.createElement('span');
      copied.className = 'bh-copied';
      copied.textContent = 'link copied';
      anchor.appendChild(copied);
      anchor.onclick = (e) => {
        e.preventDefault();
        if (label) {
          const brSuffix = selectedBranch && selectedBranch !== currentBranchName ? `@${encodeURIComponent(selectedBranch)}` : '';
          const url = `${location.origin}${location.pathname}#${label}${brSuffix}`;
          navigator.clipboard.writeText(url).then(() => {
            copied.classList.add('show');
            setTimeout(() => copied.classList.remove('show'), 1200);
          });
          history.replaceState(null, '', `#${label}${brSuffix}`);
        }
      };
      div.appendChild(anchor);

      // Actions group (wide) + hamburger (narrow)
      div._acts = mk('div','bh-acts decor');
      if (label) {
        const lbl = document.createElement('a');
        lbl.className = 'bl';
        lbl.href = `#/edit/${label}`;
        lbl.title = `Edit ${label}`;
        lbl.textContent = label;
        div._acts.appendChild(lbl);
      }
      div.appendChild(div._acts);

      // Hamburger for narrow screens
      const menu = mk('button','bh-menu decor');
      menu.textContent = '⋯';
      menu.title = 'More';
      const drop = mk('div','bh-drop');
      menu.appendChild(drop);
      menu.onclick = (e) => { e.stopPropagation(); drop.classList.toggle('open'); };
      document.addEventListener('click', () => drop.classList.remove('open'));
      div._menu = menu;
      div._drop = drop;
      div.appendChild(menu);

      renderMath(div);
      return div;
    }

    // ── Uses inline helper ─────────────────────────────────
    function mkUsesInline(block) {
      const u = mk('div','uses');
      u.innerHTML = 'uses: ';
      block.uses.forEach((label, i) => {
        if (i > 0) u.append(', ');
        const r = document.createElement('span');
        r.className = 'uref';
        r.textContent = label;
        r.onclick = () => {
          let p = u.querySelector(`.upnl[data-for="${label}"]`);
          if (p) { p.classList.toggle('open'); }
          else { p = mkUsesPanel(label); if (p) { p.dataset.for = label; p.classList.add('open'); u.appendChild(p); } }
        };
        u.appendChild(r);
      });
      return u;
    }

    // ── Block renderer ───────────────────────────────────
    function renderBlock(block) {
      // Defer markdown parsing to lazy init for most blocks
      function hydrateContent(container) {
        const {html: bh, texBlocks: tx} = parseMd(block.md || '');
        return {bh, tx};
      }

      // Example — with collapsible stub
      if (block.kind === 'example') {
        const frag = document.createDocumentFragment();

        const stub = mk('div', 'blk-stub example');
        stub.innerHTML = `<span class="stub-kind">example</span> ${block.title ? inl(block.title) : (block.label || '')}`;
        renderMath(stub);
        stub.style.display = showExamples ? 'none' : '';
        stub.onclick = () => { wrap.style.display = ''; stub.style.display = 'none'; };
        frag.appendChild(stub);

        const wrap = mk('div', 'blk blk-example');
        wrap.style.display = showExamples ? '' : 'none';

        const d = mk('div', 'env example');
        if (block.label) d.id = block.label;
        const exHdr = mkBlockHeader('example', block.title, block.label);
        // Collapse into header actions
        if (block.label) { const exBolt = mkDepBolt(block.label); exHdr._acts.appendChild(exBolt); }
        const exColBtn = mk('button','fb-act'); exColBtn.textContent = '−'; exColBtn.title = 'Collapse';
        exColBtn.onclick = (e) => { e.stopPropagation(); wrap.style.display = 'none'; stub.style.display = ''; };
        exHdr._acts.appendChild(exColBtn);
        const exFb = mk('button','fb-act'); exFb.textContent = 'feedback';
        exFb.onclick = (e) => { e.stopPropagation(); openFeedback(block); };
        exHdr._acts.appendChild(exFb);
        d.appendChild(exHdr);
        const bb = mk('div','bb');
        bb.innerHTML = '<span style="color:var(--fg-d);font-size:.8rem">...</span>';
        d.appendChild(bb);
        addSrc(d, block.md, exHdr, block);
        if (block.tags?.length) d.appendChild(mkTags(block.tags));
        wrap.appendChild(d);
        frag.appendChild(wrap);

        lazyInit(wrap, () => {
          const {bh, tx} = hydrateContent();
          bb.innerHTML = bh;
          fillTex(bb, tx, block.rendered);
          renderMath(bb); resolveRefs(bb);
        });
        return frag;
      }

      // Remark — with collapsible stub
      if (block.kind === 'remark') {
        const frag = document.createDocumentFragment();

        // Stub (shown when remarks globally hidden)
        const stub = mk('div', 'blk-stub remark');
        stub.innerHTML = `<span class="stub-kind">remark</span> ${block.title ? inl(block.title) : (block.label || '')}`;
        renderMath(stub);
        stub.style.display = showRemarks ? 'none' : '';
        stub.onclick = () => { wrap.style.display = ''; stub.style.display = 'none'; };
        frag.appendChild(stub);

        const wrap = mk('div', 'blk blk-remark');
        wrap.style.display = showRemarks ? '' : 'none';

        const d = mk('div', 'env remark');
        if (block.label) d.id = block.label;
        const rmHdr = mkBlockHeader('remark', block.title, block.label);
        if (block.label) { const rmBolt = mkDepBolt(block.label); rmHdr._acts.appendChild(rmBolt); }
        const rmColBtn = mk('button','fb-act'); rmColBtn.textContent = '−'; rmColBtn.title = 'Collapse';
        rmColBtn.onclick = (e) => { e.stopPropagation(); wrap.style.display = 'none'; stub.style.display = ''; };
        rmHdr._acts.appendChild(rmColBtn);
        const rmFb = mk('button','fb-act'); rmFb.textContent = 'feedback';
        rmFb.onclick = (e) => { e.stopPropagation(); openFeedback(block); };
        rmHdr._acts.appendChild(rmFb);
        d.appendChild(rmHdr);
        const bb = mk('div','bb');
        bb.innerHTML = '<span style="color:var(--fg-d);font-size:.8rem">...</span>';
        d.appendChild(bb);
        addSrc(d, block.md, rmHdr, block);
        if (block.tags?.length) d.appendChild(mkTags(block.tags));
        if (block.uses?.length) d.appendChild(mkUsesInline(block));
        wrap.appendChild(d);
        frag.appendChild(wrap);

        lazyInit(wrap, () => {
          const {bh, tx} = hydrateContent();
          bb.innerHTML = bh;
          fillTex(bb, tx, block.rendered);
          renderMath(bb); resolveRefs(bb);
        });
        return frag;
      }

      // Proof — collapsible, default closed
      if (block.kind === 'proof') {
        const frag = document.createDocumentFragment();

        const stub = mk('div', 'blk-stub proof');
        let stubLean = '';
        if (block.lean) {
          const v = block.lean.validation || 'not_checked';
          stubLean = ` <span style="font-family:var(--f-mono);font-size:.5rem;color:var(--fg-d)">${leanIcon(v)}${esc(block.lean.decl)}</span>`;
        }
        stub.innerHTML = `<span class="stub-kind">proof</span> ${block.title ? inl(block.title) : (block.label || '')}${stubLean}`;
        renderMath(stub);
        stub.onclick = () => { wrap.style.display = ''; stub.style.display = 'none'; };
        frag.appendChild(stub);

        const wrap = mk('div', 'blk blk-proof');
        wrap.style.display = 'none'; // default closed

        const d = mk('div', 'env proof');
        if (block.label) d.id = block.label;
        const prfHdr = mkBlockHeader('proof', block.title, block.label);
        // Lean icon — click to toggle lean source
        let prfLeanPanel = null;
        if (block.lean) {
          const v = block.lean.validation || 'not_checked';
          const icon = leanIcon(v);
          if (icon) {
            const badge = mk('span',`lb ${block.status || 'not_started'}`);
            badge.innerHTML = icon;
            badge.title = `${block.lean.decl} — click to show Lean source`;
            badge.style.cursor = 'pointer';
            badge.onclick = (e) => {
              e.stopPropagation();
              if (!prfLeanPanel) {
                prfLeanPanel = mkLeanSrc(block);
                if (prfLeanPanel) d.appendChild(prfLeanPanel);
              } else {
                prfLeanPanel.style.display = prfLeanPanel.style.display === 'none' ? '' : 'none';
              }
            };
            prfHdr._acts.insertBefore(badge, prfHdr._acts.firstChild);
          }
        }
        // Dependency graph bolt for proof blocks
        if (block.label) {
          const prfBolt = mkDepBolt(block.label);
          prfHdr._acts.insertBefore(prfBolt, prfHdr._acts.firstChild);
        }
        const prfColBtn = mk('button','fb-act'); prfColBtn.textContent = '−'; prfColBtn.title = 'Collapse';
        prfColBtn.onclick = (e) => { e.stopPropagation(); wrap.style.display = 'none'; stub.style.display = ''; };
        prfHdr._acts.appendChild(prfColBtn);
        const prfFb = mk('button','fb-act'); prfFb.textContent = 'feedback';
        prfFb.onclick = (e) => { e.stopPropagation(); openFeedback(block); };
        prfHdr._acts.appendChild(prfFb);
        d.appendChild(prfHdr);
        const bb = mk('div','bb');
        bb.innerHTML = '<span style="color:var(--fg-d);font-size:.8rem">...</span>';
        d.appendChild(bb);
        addSrc(d, block.md, prfHdr, block);
        wrap.appendChild(d);
        frag.appendChild(wrap);

        lazyInit(wrap, () => {
          const {bh, tx} = hydrateContent();
          bb.innerHTML = bh + '<div class="qed"></div>';
          fillTex(bb, tx, block.rendered);
          renderMath(bb); resolveRefs(bb);
        });
        return frag;
      }

      // Prose
      if (block.kind === 'prose') {
        const d = mk('div','blk');
        if (block.label) d.id = block.label;
        d.innerHTML = '<div class="bb"></div>';
        addSrc(d, block.md, null, block);

        lazyInit(d, () => {
          const {bh, tx} = hydrateContent();
          d.querySelector('.bb').innerHTML = bh;
          fillTex(d, tx, block.rendered);
          renderMath(d); resolveRefs(d);
        });
        return d;
      }

      // Equation
      if (block.kind === 'equation') {
        const d = mk('div','blk');
        if (block.label) d.id = block.label;
        d.innerHTML = `<div data-md>${esc(block.tex||'')}</div>`;
        lazyInit(d, () => renderMath(d));
        return d;
      }

      // Diagram
      if (block.kind === 'diagram') {
        const d = mk('div','blk');
        if (block.label) d.id = block.label;
        if (block.rendered?.length) d.innerHTML = renderAsset(block.rendered[0]);
        else d.innerHTML = `<div class="txb ph">${esc(block.tex||block.md||'')}</div>`;
        return d;
      }

      // Environment block (definition, theorem, proposition, lemma, corollary, conjecture)
      const d = mk('div',`blk env ${block.kind}`);
      if (block.label) d.id = block.label;

      const hdr = mkBlockHeader(block.kind, block.title, block.label);
      const isProvable = ['theorem','proposition','lemma','corollary'].includes(block.kind);

      // ── Indicators row (lean ∀ + proof ∎) for provable and definition blocks ──
      let leanPanel = null;
      const indicators = mk('span','bh-indicators');

      // Lean indicator (∀ symbol + status badge)
      if (block.lean || isProvable || block.kind === 'definition') {
        const leanInd = mk('span','bh-ind');
        const leanSym = mk('span','ind-sym');
        leanSym.innerHTML = '&#x2200;'; // ∀
        leanSym.style.color = block.lean ? 'var(--ac)' : 'var(--fg-d)';
        leanInd.appendChild(leanSym);

        // Status badge
        const leanBadge = mk('span','ind-badge');
        if (!block.lean) {
          leanBadge.className = 'ind-badge miss';
          leanBadge.textContent = 'none';
          leanInd.title = 'No Lean formalization';
        } else {
          const v = block.lean.validation || 'not_checked';
          const s = block.status || 'not_started';
          if (v === 'validated' || v === 'leanok' || s === 'proved' || s === 'mathlib_ok') {
            leanBadge.className = 'ind-badge ok';
            leanBadge.textContent = 'proved';
          } else if (s === 'has_sorry') {
            leanBadge.className = 'ind-badge warn';
            leanBadge.textContent = 'sorry';
          } else if (v === 'error') {
            leanBadge.className = 'ind-badge err';
            leanBadge.textContent = 'error';
          } else if (s === 'stated' || v === 'stub') {
            leanBadge.className = 'ind-badge stub';
            leanBadge.textContent = 'stated';
          } else {
            leanBadge.className = 'ind-badge miss';
            leanBadge.textContent = s === 'not_started' ? 'stub' : s;
          }
          leanInd.title = `${block.lean.decl} — click to show Lean source`;
        }
        leanInd.appendChild(leanBadge);

        // Click to toggle lean source panel (inserted right after header)
        if (block.lean?.source) {
          leanInd.onclick = (e) => {
            e.stopPropagation();
            if (!leanPanel) {
              leanPanel = mkLeanSrc(block);
              if (leanPanel) {
                // Insert after header so it appears under the ∀ indicator
                const hdrEl = d.querySelector('.bh');
                if (hdrEl && hdrEl.nextSibling) d.insertBefore(leanPanel, hdrEl.nextSibling);
                else d.appendChild(leanPanel);
              }
            } else {
              leanPanel.style.display = leanPanel.style.display === 'none' ? '' : 'none';
            }
          };
        }
        indicators.appendChild(leanInd);
      }

      // Proof indicator (∎ symbol + status badge) for provable blocks
      if (isProvable) {
        const prfInd = mk('span','bh-ind');
        const prfSym = mk('span','ind-sym');
        prfSym.innerHTML = '&#x220E;'; // ∎
        const prfBadge = mk('span','ind-badge');

        // Check if block has associated proof blocks
        const hasProofs = block.proofs?.length > 0;
        if (hasProofs) {
          // Check proof block statuses
          const proofBlocks = block.proofs.map(l => bix.get(l)).filter(Boolean);
          const allComplete = proofBlocks.length > 0 && proofBlocks.every(p => p.md && p.md.trim().length > 20);
          const hasLeanProof = proofBlocks.some(p => p.lean?.source);
          prfSym.style.color = 'var(--yel)';
          if (allComplete) {
            prfBadge.className = 'ind-badge ok';
            prfBadge.textContent = hasLeanProof ? 'written+lean' : 'written';
          } else {
            prfBadge.className = 'ind-badge warn';
            prfBadge.textContent = 'partial';
          }
          prfInd.title = `${proofBlocks.length} proof(s) — scroll to proofs toggle`;
          prfInd.onclick = (e) => {
            e.stopPropagation();
            // Click the proofs toggle to open it
            const toggle = d.querySelector('.prf-toggle');
            if (toggle && !toggle.classList.contains('open')) toggle.click();
            else if (toggle) toggle.scrollIntoView({behavior:'smooth',block:'nearest'});
          };
        } else {
          prfSym.style.color = 'var(--fg-d)';
          prfBadge.className = 'ind-badge miss';
          prfBadge.textContent = 'none';
          prfInd.title = 'No written proof';
        }
        prfInd.appendChild(prfSym);
        prfInd.appendChild(prfBadge);
        indicators.appendChild(prfInd);
      }

      // Insert indicators into header (after title, before actions)
      if (indicators.children.length) {
        hdr.insertBefore(indicators, hdr._acts);
      }

      // Dependency graph lightning bolt — shown on all environment blocks with a label
      if (block.label) {
        const bolt = mkDepBolt(block.label);
        hdr._acts.insertBefore(bolt, hdr._acts.firstChild);
      }

      // Feedback button in header actions
      const fbBtn = mk('button','fb-act');
      fbBtn.textContent = 'feedback';
      fbBtn.onclick = (e) => { e.stopPropagation(); openFeedback(block); };
      hdr._acts.appendChild(fbBtn);
      // Clone label + feedback into hamburger
      if (block.label) {
        const lbl2 = mk('a','bl'); lbl2.href = `#/edit/${block.label}`; lbl2.textContent = block.label;
        hdr._drop.appendChild(lbl2);
      }
      const fb2 = mk('button','fb-act'); fb2.textContent = 'feedback';
      fb2.onclick = (e) => { e.stopPropagation(); openFeedback(block); };
      hdr._drop.appendChild(fb2);

      d.appendChild(hdr);

      const bb = mk('div','bb');
      bb.innerHTML = '<span style="color:var(--fg-d);font-size:.8rem">...</span>';
      d.appendChild(bb);
      addSrc(d, block.md, hdr, block);

      // Examples toggle (if block has associated examples)
      if (block.examples?.length) {
        const toggle = mk('div','ex-toggle');
        toggle.innerHTML = `<span class="arrow">▸</span> ${block.examples.length} example(s)`;
        const panel = mk('div','ex-panel');
        let exLoaded = false;

        toggle.onclick = () => {
          toggle.classList.toggle('open');
          panel.classList.toggle('open');
          // Lazy load example content on first open
          if (!exLoaded) {
            exLoaded = true;
            block.examples.forEach(exLabel => {
              const exBlock = bix.get(exLabel);
              if (exBlock) {
                const {html: exHtml, texBlocks: exTx} = parseMd(exBlock.md || '');
                const exDiv = mk('div','env example');
                exDiv.style.borderLeft = 'none';
                exDiv.style.margin = '0';
                let exHd = `<span class="bk">example</span>`;
                if (exBlock.title) exHd += `<span class="bt">${inl(exBlock.title)}</span>`;
                exDiv.innerHTML = `<div class="bh">${exHd}</div><div class="bb">${exHtml}</div>`;
                fillTex(exDiv, exTx, exBlock.rendered);
                renderMath(exDiv);
                panel.appendChild(exDiv);
              }
            });
          }
        };
        d.appendChild(toggle);
        d.appendChild(panel);
      }

      // Footer bar: tags (left) + uses (right)
      if (block.tags?.length || block.uses?.length) {
        const foot = mk('div','blk-foot decor');
        if (block.tags?.length) foot.appendChild(mkTags(block.tags));
        if (block.uses?.length) foot.appendChild(mkUsesInline(block));
        d.appendChild(foot);
      }
      addTodoIndicators(d, block);

      // Proofs toggle (if block has associated proofs, like examples[])
      if (block.proofs?.length) {
        const toggle = mk('div','prf-toggle');
        toggle.innerHTML = `<span class="arrow">▸</span> ${block.proofs.length} proof(s)`;
        const panel = mk('div','prf-body');
        let prfLoaded = false;

        toggle.onclick = () => {
          toggle.classList.toggle('open');
          panel.classList.toggle('open');
          if (!prfLoaded) {
            prfLoaded = true;
            block.proofs.forEach(prfLabel => {
              const prfBlock = bix.get(prfLabel);
              if (prfBlock) {
                const {html: ph, texBlocks: ptx} = parseMd(prfBlock.md || '');
                const prfDiv = mk('div','env proof');
                prfDiv.style.borderLeft = 'none';
                prfDiv.style.margin = '.4rem 0';
                let prfHd = `<span class="bk">proof</span>`;
                if (prfBlock.title) prfHd += `<span class="bt">${inl(prfBlock.title)}</span>`;
                if (prfBlock.lean) {
                  const v = prfBlock.lean.validation || 'not_checked';
                  prfHd += `<span class="prf-lean">${leanIcon(v)}${esc(prfBlock.lean.decl)}</span>`;
                }
                prfDiv.innerHTML = `<div class="bh">${prfHd}</div><div class="bb">${ph}<div class="qed"></div></div>`;
                fillTex(prfDiv, ptx, prfBlock.rendered);
                renderMath(prfDiv);
                // Lean source for this proof
                const prfLean = mkLeanSrc(prfBlock);
                if (prfLean) prfDiv.appendChild(prfLean);
                panel.appendChild(prfDiv);
              }
            });
          }
        };
        d.appendChild(toggle);
        d.appendChild(panel);
      }

      // Lazy hydrate the main content
      lazyInit(d, () => {
        const {bh, tx} = hydrateContent();
        bb.innerHTML = bh;
        fillTex(bb, tx, block.rendered);
        renderMath(bb);
      });

      return d;
    }

    // ── Helpers ───────────────────────────────────────────
    function mk(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

    function addSrc(el, md, hdr, block) {
      if (!md) return;
      const b = mk('button','st'); b.textContent = 'edit'; b.title = 'Edit source inline';

      // Build inline editor (hidden by default)
      const editor = mk('div','inline-editor');

      const toolbar = mk('div','ie-toolbar');
      const saveBtn = mk('button','ie-save'); saveBtn.textContent = 'save';
      const cancelBtn = mk('button',''); cancelBtn.textContent = 'close';
      const previewToggle = mk('button',''); previewToggle.textContent = 'preview';
      const statusSpan = mk('span','ie-status');
      toolbar.appendChild(saveBtn);
      toolbar.appendChild(cancelBtn);
      toolbar.appendChild(previewToggle);
      toolbar.appendChild(statusSpan);

      const ta = document.createElement('textarea');
      ta.value = md;

      const prevLabel = mk('div','ie-preview-label');
      prevLabel.textContent = 'live preview';
      prevLabel.style.display = 'none';
      const prevBody = mk('div','ie-preview');
      prevBody.style.display = 'none';

      editor.appendChild(toolbar);
      editor.appendChild(ta);
      editor.appendChild(prevLabel);
      editor.appendChild(prevBody);

      let showingPreview = false;
      function updatePreview() {
        if (!showingPreview) return;
        const {html: bh, texBlocks: tx} = parseMd(ta.value);
        prevBody.innerHTML = bh;
        fillTex(prevBody, tx, block?.rendered);
        renderMath(prevBody);
      }

      previewToggle.onclick = () => {
        showingPreview = !showingPreview;
        prevLabel.style.display = showingPreview ? '' : 'none';
        prevBody.style.display = showingPreview ? '' : 'none';
        previewToggle.classList.toggle('on', showingPreview);
        if (showingPreview) updatePreview();
      };
      ta.addEventListener('input', updatePreview);

      saveBtn.onclick = async () => {
        if (!paper?.id || !block?.rootName) { statusSpan.textContent = 'no context'; return; }
        statusSpan.textContent = 'saving...';
        try {
          const res = await fetch('/api/block/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paperId: paper.id, rootName: block.rootName, md: ta.value })
          });
          if (!res.ok) throw new Error(`${res.status}`);
          block.md = ta.value;
          console.log(`[folio:edit] saved block: ${block.rootName} (${ta.value.length} chars)`);
          // Re-render the block body
          const bb = el.querySelector('.bb');
          if (bb) {
            const {html: bh, texBlocks: tx} = parseMd(ta.value);
            bb.innerHTML = bh;
            fillTex(bb, tx, block?.rendered);
            renderMath(bb); resolveRefs(bb);
          }
          statusSpan.textContent = 'saved';
          setTimeout(() => { statusSpan.textContent = ''; }, 1500);
        } catch (e) {
          console.error(`[folio:edit] save failed for ${block.rootName}:`, e.message);
          statusSpan.textContent = 'error: ' + e.message;
          setTimeout(() => { statusSpan.textContent = ''; }, 3000);
        }
      };

      cancelBtn.onclick = () => {
        editor.classList.remove('open');
        b.classList.remove('on');
      };

      b.onclick = () => {
        const opening = !editor.classList.contains('open');
        editor.classList.toggle('open');
        b.classList.toggle('on');
        if (opening) {
          ta.value = block?.md || md;
          ta.focus();
        }
      };

      // Store editor reference on element for programmatic opening
      el._inlineEditor = { editor, btn: b, ta };

      if (hdr && hdr._acts) {
        hdr._acts.appendChild(b);
      } else {
        el.appendChild(b);
      }
      el.appendChild(editor);
    }

    // Shiki highlighter (lazy-loaded)
    let shikiHighlighter = null;
    async function getShiki() {
      if (shikiHighlighter) return shikiHighlighter;
      try {
        const { createHighlighter } = await import('https://esm.sh/shiki@3.2.1');
        shikiHighlighter = await createHighlighter({
          themes: ['github-light', 'github-dark'],
          langs: ['lean4'],
        });
        return shikiHighlighter;
      } catch (e) {
        console.warn('Shiki load failed:', e);
        return null;
      }
    }

    function mkLeanSrc(block) {
      if (!block.lean?.source) return null;
      const wrap = mk('div','lean-src');
      const hdr = mk('div','lean-src-hdr');
      hdr.innerHTML = `<span>${esc(block.lean.file || block.lean.decl)}</span>`;
      wrap.appendChild(hdr);
      const pre = document.createElement('pre');
      pre.style.margin = '0';
      const code = document.createElement('code');
      code.textContent = block.lean.source;
      code.style.fontFamily = 'var(--f-mono)';
      code.style.fontSize = '.75rem';
      pre.appendChild(code);
      wrap.appendChild(pre);
      // Async highlight with Shiki
      getShiki().then(hl => {
        if (!hl) return;
        const theme = document.documentElement.dataset.theme === 'dark' ? 'github-dark' : 'github-light';
        const html = hl.codeToHtml(block.lean.source, { lang: 'lean4', theme });
        // Replace pre with highlighted version
        const container = mk('div','');
        container.innerHTML = html;
        const highlighted = container.querySelector('pre');
        if (highlighted) {
          highlighted.style.margin = '0';
          highlighted.style.padding = '.6rem .8rem';
          highlighted.style.fontSize = '.75rem';
          highlighted.style.lineHeight = '1.5';
          highlighted.style.overflowX = 'auto';
          highlighted.style.borderRadius = '0';
          wrap.replaceChild(highlighted, pre);
        }
      });
      return wrap;
    }

    function mkTags(tags) {
      const d = mk('div','tags');
      tags.forEach(t => { const s = mk('span','tag'); s.textContent = t; d.appendChild(s); });
      return d;
    }

    function fillTex(el, tx, rendered) {
      for (const t of el.querySelectorAll('.txb[data-ti]')) {
        const i = +t.dataset.ti;
        const a = rendered?.find(r => r.blockIndex === i);
        if (a) { t.innerHTML = renderAsset(a); t.classList.remove('ph'); }
        else { t.textContent = tx[i] || ''; t.classList.add('ph'); }
      }
    }

    function renderAsset(a) {
      if (a.mime === 'image/svg+xml') return `<img src="${a.url}" alt="diagram" loading="lazy">`;
      if (a.mime?.startsWith('image/')) return `<img src="${a.url}" alt="" loading="lazy">`;
      return `<a href="${a.url}" target="_blank">[${a.mime}]</a>`;
    }

    // ── Lazy loading via IntersectionObserver ──────────────
    const lazyQueue = []; // {el, init}
    const lazyObs = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          const el = entry.target;
          const task = lazyQueue.find(t => t.el === el);
          if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); }
          lazyObs.unobserve(el);
        }
      }
    }, { rootMargin: '200px 0px' }); // start loading 200px before visible

    function lazyInit(el, init) {
      lazyQueue.push({el, init});
      lazyObs.observe(el);
    }

    // ── Paper ────────────────────────────────────────────
    function renderPaper(p) {
      paper = p;
      katexMacros = buildKatexMacros(p.macros);
      bix.clear();
      const childBlocks = new Set(); // examples/proofs shown via parent's toggle
      usedByIndex.clear();
      for (const ch of p.chapters) for (const s of ch.sections) for (const b of s.blocks) {
        if (b.label) bix.set(b.label, b);
        if (b.examples) for (const ex of b.examples) childBlocks.add(ex);
        if (b.proofs) for (const prf of b.proofs) childBlocks.add(prf);
        // Build reverse-reference index: label → [{label, kind, title}]
        if (b.uses) for (const dep of b.uses) {
          if (!usedByIndex.has(dep)) usedByIndex.set(dep, []);
          usedByIndex.get(dep).push({ label: b.label, kind: b.kind, title: b.title, rootName: b.rootName });
        }
      }

      const app = document.getElementById('app');
      app.innerHTML = '';

      // Build sidebar
      const sb = document.getElementById('sidebar');
      sb.innerHTML = '';
      document.body.classList.add('has-sidebar');

      // Pin control
      const pinRow = mk('div','sb-pin');
      const pinBtn = document.createElement('button');
      pinBtn.textContent = localStorage.getItem('qou-sb-pinned') === '1' ? '📌' : '📍';
      if (localStorage.getItem('qou-sb-pinned') === '1') document.body.classList.add('sb-pinned');
      pinBtn.onclick = () => {
        const pinned = document.body.classList.toggle('sb-pinned');
        pinBtn.textContent = pinned ? '📌' : '📍';
        localStorage.setItem('qou-sb-pinned', pinned ? '1' : '0');
      };
      pinRow.appendChild(pinBtn);
      sb.appendChild(pinRow);

      // Collapse all chapters when sidebar collapses (not pinned)
      // Collapse chapters visually on mouseleave, restore on mouseenter
      let savedOpenChapters = new Set();
      sb.addEventListener('mouseleave', () => {
        if (document.body.classList.contains('sb-pinned')) return;
        savedOpenChapters.clear();
        sb.querySelectorAll('.sb-ch.open').forEach(ch => {
          savedOpenChapters.add(ch.dataset.num);
          ch.classList.remove('open');
          const body = ch.nextElementSibling;
          if (body?.classList.contains('sb-ch-body')) body.style.display = 'none';
        });
      });
      sb.addEventListener('mouseenter', () => {
        if (document.body.classList.contains('sb-pinned')) return;
        if (!savedOpenChapters.size) return;
        sb.querySelectorAll('.sb-ch').forEach(ch => {
          if (savedOpenChapters.has(ch.dataset.num)) {
            ch.classList.add('open');
            const body = ch.nextElementSibling;
            if (body?.classList.contains('sb-ch-body')) body.style.display = 'block';
          }
        });
      });

      // Persist open/closed chapters to localStorage
      function saveSbOpenChapters() {
        const open = [];
        sb.querySelectorAll('.sb-ch.open').forEach(ch => open.push(ch.dataset.num));
        localStorage.setItem('qou-sb-chapters', JSON.stringify(open));
      }
      const restoredChapters = new Set(
        (() => { try { return JSON.parse(localStorage.getItem('qou-sb-chapters') || '[]'); } catch { return []; } })()
      );

      // ── Chapter containers (one per chapter, show/hide) ──
      const chapterDivs = new Map(); // number → DOM element
      const chapterHydrated = new Set(); // track which chapters have been hydrated
      let activeChapter = null;

      function showChapter(num) {
        if (activeChapter === num) return;
        // Hide current
        if (activeChapter !== null) {
          const prev = chapterDivs.get(activeChapter);
          if (prev) prev.style.display = 'none';
        }
        activeChapter = num;
        const cd = chapterDivs.get(num);
        if (!cd) return;
        cd.style.display = '';
        // Hydrate lazy blocks on first show
        if (!chapterHydrated.has(num)) {
          chapterHydrated.add(num);
          const lazies = lazyQueue.filter(t => cd.contains(t.el));
          for (const t of lazies) {
            t.init();
            lazyObs.unobserve(t.el);
            lazyQueue.splice(lazyQueue.indexOf(t), 1);
          }
        }
        // Highlight sidebar
        sb.querySelectorAll('.sb-ch').forEach(el => {
          const isActive = el.dataset.num === String(num);
          el.classList.toggle('active', isActive);
          if (isActive && !el.classList.contains('open')) {
            el.classList.add('open');
            const body = el.nextElementSibling;
            if (body?.classList.contains('sb-ch-body')) body.style.display = 'block';
          }
        });
        window.scrollTo(0, 0);
      }

      // Find which chapter a label belongs to
      function chapterForLabel(label) {
        for (const ch of p.chapters) {
          for (const sec of ch.sections) {
            for (const b of sec.blocks) {
              if (b.label === label) return ch.number;
            }
          }
        }
        return null;
      }

      for (const ch of p.chapters) {
        const chEl = mk('div','sb-ch');
        chEl.dataset.num = ch.number != null ? String(ch.number) : '';
        chEl.innerHTML = `<span class="sb-arrow">&#9654;</span><span>${ch.number != null ? ch.number + '. ' : ''}${inl(ch.title)}</span>`;
        const chBody = mk('div','sb-ch-body');

        // Restore open/closed state from localStorage
        if (restoredChapters.has(String(ch.number))) {
          chEl.classList.add('open');
          chBody.style.display = 'block';
        }

        // Click chapter title → show chapter content
        chEl.onclick = (e) => {
          // Toggle sections in sidebar
          chEl.classList.toggle('open');
          chBody.style.display = chEl.classList.contains('open') ? 'block' : 'none';
          saveSbOpenChapters();
          // Show chapter content
          showChapter(ch.number);
        };
        sb.appendChild(chEl);
        for (const sec of ch.sections) {
          const sEl = mk('div','sb-sec');
          // Count stats for section
          let secTodos = 0, secLeanMiss = 0, secLeanErr = 0;
          for (const b of sec.blocks) {
            secTodos += (b.todos || []).filter(t => t.status === 'open').length;
            const nl = ['definition','theorem','lemma','proposition','corollary'].includes(b.kind);
            if (nl && (!b.lean || !b.lean.file)) secLeanMiss++;
            if (nl && b.lean && ((b.lean.validation === 'error') || b.status === 'has_sorry')) secLeanErr++;
          }
          const badges = [];
          if (secTodos) badges.push(`${secTodos} todo${secTodos > 1 ? 's' : ''}`);
          if (secLeanMiss) badges.push(`${secLeanMiss} no lean`);
          if (secLeanErr) badges.push(`${secLeanErr} err${secLeanErr > 1 ? 's' : ''}`);
          sEl.innerHTML = `<span style="flex:1">${inl(sec.title)}</span>${badges.length ? `<span style="font-size:.5rem;color:var(--fg-d);margin-left:.3rem">${badges.join(' ')}</span>` : ''}`;
          sEl.style.display = 'flex'; sEl.style.alignItems = 'center';
          sEl.title = sec.title;
          sEl.onclick = (e) => {
            e.stopPropagation();
            showChapter(ch.number);
            setTimeout(() => {
              const t = document.getElementById(sec.label);
              if (t) t.scrollIntoView({behavior:'smooth'});
            }, 50);
            blkList.style.display = blkList.style.display === 'none' ? '' : 'none';
          };
          chBody.appendChild(sEl);
          const blkList = mk('div','');
          blkList.style.display = 'none';
          for (const b of sec.blocks) {
            const kind = b.kind[0].toUpperCase();
            const bEl = mk('div','sb-blk');
            const nameSpan = mk('span','sb-name');
            nameSpan.innerHTML = `${kind} ${b.title ? inl(b.title) : (b.label || b.rootName)}`;
            bEl.appendChild(nameSpan);
            bEl.title = b.label || b.rootName;

            // Todo count badge
            const openTodos = (b.todos || []).filter(t => t.status === 'open').length;
            if (openTodos) {
              const tb = mk('span','sb-badge todo');
              tb.textContent = `${openTodos} todo${openTodos > 1 ? 's' : ''}`;
              tb.setAttribute('data-tip', `${openTodos} open todo${openTodos > 1 ? 's' : ''}`);
              bEl.appendChild(tb);
            }

            // Lean status badge
            const needsLean = ['definition','theorem','lemma','proposition','corollary'].includes(b.kind);
            if (needsLean) {
              const lb = mk('span','sb-badge');
              const s = b.status || 'not_started';
              const v = b.lean?.validation || 'not_checked';
              if (!b.lean || !b.lean.file) {
                lb.className = 'sb-badge lean-miss';
                lb.textContent = 'no lean';
                lb.setAttribute('data-tip', 'No Lean formalization file');
              } else if (s === 'stub' || s === 'not_started') {
                lb.className = 'sb-badge lean-warn';
                lb.textContent = 'stub';
                lb.setAttribute('data-tip', 'Lean file exists but proof not started');
              } else if (v === 'error' || s === 'has_sorry') {
                lb.className = 'sb-badge lean-err';
                lb.textContent = v === 'error' ? 'err' : 'sorry';
                lb.setAttribute('data-tip', v === 'error' ? 'Lean validation error' : 'Proof contains sorry');
              } else if (v === 'ok' || v === 'leanok' || v === 'validated' || s === 'proved') {
                lb.className = 'sb-badge lean-ok';
                lb.textContent = '✓';
                lb.setAttribute('data-tip', 'Lean proof verified');
              } else {
                lb.className = 'sb-badge lean-warn';
                lb.textContent = s === 'stated' ? 'stated' : 'todo';
                lb.setAttribute('data-tip', `Status: ${s}, validation: ${v}`);
              }
              bEl.appendChild(lb);
            }

            bEl.onclick = () => {
              showChapter(ch.number);
              setTimeout(() => {
                const t = document.getElementById(b.label);
                if (t) {
                  const task = lazyQueue.find(q => q.el === t || q.el.contains?.(t) || t.contains?.(q.el));
                  if (task) { task.init(); lazyQueue.splice(lazyQueue.indexOf(task), 1); lazyObs.unobserve(task.el); }
                  t.scrollIntoView({behavior:'smooth', block:'start'});
                }
              }, 50);
            };
            blkList.appendChild(bEl);
          }
          chBody.appendChild(blkList);
        }
        sb.appendChild(chBody);
      }
      renderMath(sb);

      // Header
      const hdr = mk('div','hdr');
      hdr.innerHTML = `<h1>${esc(p.title)}</h1><div class="au">${p.authors.map(esc).join(', ')}</div>${p.affiliations?.length?`<div class="af">${p.affiliations.map(esc).join('; ')}</div>`:''}${p.date?`<div class="dt">${p.date}</div>`:''}`;
      app.appendChild(hdr);

      // Render each chapter into its own hidden div
      for (const ch of p.chapters) {
        const cd = mk('div','ch');
        cd.dataset.chNum = String(ch.number);
        cd.style.display = 'none';
        if (ch.label) cd.id = ch.label;
        cd.innerHTML = `<h2 class="ch-t"><span class="ch-title-text">${ch.number != null ? `<span class="n">Chapter ${ch.number}.</span> ` : ''}${inl(ch.title)}</span><span class="struct-acts" data-target="${ch.label || 'ch' + ch.number}" data-kind="chapter"><button class="sa-btn sa-fb">feedback</button></span></h2>`;
        renderMath(cd);
        let secNum = 0;
        for (const sec of ch.sections) {
          secNum++;
          const sd = mk('div','section');
          sd.dataset.secNum = `${ch.number}.${secNum}`;
          if (sec.label) sd.id = sec.label;
          sd.innerHTML = `<h3 class="sec-t"><span class="sec-title-text"><span class="sec-n">${ch.number}.${secNum}</span> ${inl(sec.title)}</span><span class="struct-acts" data-target="${sec.label || 'sec' + ch.number + '.' + secNum}" data-kind="section"><button class="sa-btn sa-fb">feedback</button></span></h3>`;
          renderMath(sd);
          for (const b of sec.blocks) {
            if ((b.kind === 'example' || b.kind === 'proof') && b.label && childBlocks.has(b.label) && pendingScroll !== b.label) continue;
            sd.appendChild(renderBlock(b));
          }
          cd.appendChild(sd);
        }
        chapterDivs.set(ch.number, cd);
        app.appendChild(cd);
      }

      document.getElementById('c-hash').textContent = p._hash || '';
      document.title = `${p.title} — Folio`;

      // Show first chapter (or the one containing pendingScroll)
      let startChapter = p.chapters[0]?.number || 1;
      if (pendingScroll) {
        const target = chapterForLabel(pendingScroll);
        if (target) startChapter = target;
      }
      // Expose chapter navigation for cross-function use
      paper._showChapter = showChapter;
      paper._chapterForLabel = chapterForLabel;
      showChapter(startChapter);

      // Scroll to pending label anchor
      if (pendingScroll) {
        requestAnimationFrame(() => scrollToLabel(pendingScroll));
      }
    }

    // ── Feedback draft persistence ─────────────────────────
    const FB_DRAFT_KEY = 'qou-fb-drafts';
    function loadDrafts() {
      try { return JSON.parse(localStorage.getItem(FB_DRAFT_KEY) || '{}'); } catch { return {}; }
    }
    function saveDraft(target, text, priority, assignee) {
      const drafts = loadDrafts();
      if (text.trim()) {
        drafts[target] = { text, priority, assignee, ts: Date.now() };
      } else {
        delete drafts[target];
      }
      localStorage.setItem(FB_DRAFT_KEY, JSON.stringify(drafts));
    }
    function clearDraft(target) {
      const drafts = loadDrafts();
      delete drafts[target];
      localStorage.setItem(FB_DRAFT_KEY, JSON.stringify(drafts));
    }
    function getDraft(target) {
      return loadDrafts()[target] || null;
    }

    // ── Feedback panel ────────────────────────────────────
    let fbBlock = null;
    // openFeedback can accept a block object or a {label, rootName, todos, kind} stub
    function openFeedback(block) {
      fbBlock = block;
      const target = block.label || block.rootName || 'block';
      document.getElementById('fb-target').textContent = target;

      // Restore draft if one exists
      const draft = getDraft(target);
      const ta = document.getElementById('fb-text');
      if (draft) {
        ta.value = draft.text || '';
        document.getElementById('fb-priority').value = draft.priority || 'medium';
        document.getElementById('fb-assignee').value = draft.assignee || 'editor-agent';
      } else {
        ta.value = '';
      }

      document.getElementById('feedback-overlay').classList.add('open');
      document.getElementById('feedback-panel').classList.add('open');
      ta.focus();

      // Populate history from block todos
      const hist = document.getElementById('fb-history');
      hist.innerHTML = '';
      const todos = block.todos || [];
      if (!todos.length) {
        hist.innerHTML = '<div style="color:var(--fg-d);font-size:.7rem;padding:.5rem 0">No feedback yet</div>';
      } else {
        for (const t of todos.slice().reverse()) {
          const item = mk('div', `fb-item ${t.status || 'open'}`);
          const priDot = t.priority === 'high' ? 'background:var(--red)' :
                         t.priority === 'medium' ? 'background:var(--yel)' : 'background:var(--fg-d)';
          item.innerHTML = `<div style="display:flex;gap:.4rem;align-items:start">
              <span class="todo-dot" style="${priDot};margin-top:.35rem"></span>
              <div style="flex:1">
                <div style="white-space:pre-wrap">${esc(t.comment || t.summary || '')}</div>
                <div class="fb-meta">
                  <select class="fb-item-pri" data-id="${t.id}" style="font-size:.6rem;background:var(--bg-r);border:1px solid var(--brd);color:var(--fg-d);border-radius:2px;padding:0 .2rem;font-family:var(--f-mono);cursor:pointer">
                    <option value="high" ${t.priority==='high'?'selected':''}>high</option>
                    <option value="medium" ${t.priority==='medium'?'selected':''}>med</option>
                    <option value="low" ${t.priority==='low'?'selected':''}>low</option>
                  </select>
                  · ${t.assignee || ''} · ${t.status || 'open'} · ${t.createdAt ? new Date(t.createdAt).toLocaleDateString() : ''}
                  <button class="fb-item-edit" data-id="${t.id}" style="font-family:var(--f-mono);font-size:.55rem;background:none;border:1px solid var(--brd);border-radius:2px;color:var(--fg-d);cursor:pointer;padding:0 .3rem;margin-left:.3rem">edit</button>
                  <button class="fb-item-del" data-id="${t.id}" style="font-family:var(--f-mono);font-size:.55rem;background:none;border:1px solid var(--brd);border-radius:2px;color:var(--red);cursor:pointer;padding:0 .3rem">del</button>
                </div>
              </div>
            </div>`;
          hist.appendChild(item);
        }
      }
    }

    // Delegated handlers for feedback item edit/delete/priority in the panel
    document.getElementById('fb-history')?.addEventListener('click', (e) => {
      const del = e.target.closest('.fb-item-del');
      if (del && fbBlock) {
        const id = del.dataset.id;
        if (fbBlock.todos) {
          fbBlock.todos = fbBlock.todos.filter(t => t.id !== id);
        }
        // Also delete from backend
        fetch('/api/feedback', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paperId: paper?.id, rootName: fbBlock.rootName || fbBlock.label, todoId: id })
        }).catch(() => {});
        openFeedback(fbBlock);
        refreshFeedbackBadges();
        return;
      }
      const edit = e.target.closest('.fb-item-edit');
      if (edit && fbBlock) {
        const id = edit.dataset.id;
        const todo = (fbBlock.todos || []).find(t => t.id === id);
        if (todo) {
          const newText = prompt('Edit feedback:', todo.comment || todo.summary || '');
          if (newText !== null && newText.trim()) {
            todo.comment = newText.trim();
            todo.summary = newText.trim().slice(0, 80);
            todo.updatedAt = new Date().toISOString();
            // Persist
            fetch('/api/feedback', {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ paperId: paper?.id, rootName: fbBlock.rootName || fbBlock.label, todoId: id, updates: { comment: todo.comment, summary: todo.summary } })
            }).catch(() => {});
            openFeedback(fbBlock);
          }
        }
        return;
      }
    });
    document.getElementById('fb-history')?.addEventListener('change', (e) => {
      const priSel = e.target.closest('.fb-item-pri');
      if (priSel && fbBlock) {
        const id = priSel.dataset.id;
        const todo = (fbBlock.todos || []).find(t => t.id === id);
        if (todo) {
          todo.priority = priSel.value;
          todo.updatedAt = new Date().toISOString();
          fetch('/api/feedback', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paperId: paper?.id, rootName: fbBlock.rootName || fbBlock.label, todoId: id, updates: { priority: todo.priority } })
          }).catch(() => {});
          openFeedback(fbBlock);
        }
      }
    });

    // Delegated handler for chapter/section feedback buttons
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.struct-acts .sa-fb');
      if (!btn) return;
      const acts = btn.closest('.struct-acts');
      const target = acts.dataset.target;
      const kind = acts.dataset.kind;
      // Create a stub "block" for the chapter/section
      openFeedback({
        label: target,
        rootName: target,
        kind: kind,
        todos: structFeedback[target] || [],
      });
    });

    // Track chapter/section-level feedback (local cache, synced to backend)
    const structFeedback = {};
    function refreshStructBadges() {
      document.querySelectorAll('.struct-acts').forEach(acts => {
        const target = acts.dataset.target;
        const todos = structFeedback[target] || [];
        const openTodos = todos.filter(t => t.status !== 'resolved' && t.status !== 'wontfix');
        let badge = acts.querySelector('.sa-count');
        if (openTodos.length > 0) {
          if (!badge) { badge = mk('span','sa-count'); acts.appendChild(badge); }
          badge.textContent = openTodos.length;
        } else if (badge) {
          badge.remove();
        }
      });
    }
    // Auto-save draft as user types
    document.getElementById('fb-text')?.addEventListener('input', () => {
      if (!fbBlock) return;
      const target = fbBlock.label || fbBlock.rootName || 'block';
      saveDraft(target,
        document.getElementById('fb-text').value,
        document.getElementById('fb-priority').value,
        document.getElementById('fb-assignee').value
      );
    });
    document.getElementById('fb-priority')?.addEventListener('change', () => {
      if (!fbBlock) return;
      const target = fbBlock.label || fbBlock.rootName || 'block';
      const text = document.getElementById('fb-text').value;
      if (text.trim()) saveDraft(target, text, document.getElementById('fb-priority').value, document.getElementById('fb-assignee').value);
    });
    document.getElementById('fb-assignee')?.addEventListener('change', () => {
      if (!fbBlock) return;
      const target = fbBlock.label || fbBlock.rootName || 'block';
      const text = document.getElementById('fb-text').value;
      if (text.trim()) saveDraft(target, text, document.getElementById('fb-priority').value, document.getElementById('fb-assignee').value);
    });

    function closeFeedback() {
      // Draft is already auto-saved on input — no need to save again here
      document.getElementById('feedback-overlay').classList.remove('open');
      document.getElementById('feedback-panel').classList.remove('open');
      fbBlock = null;
      // Stop voice recording if active
      if (isRecording && recognition) {
        isRecording = false;
        recognition.stop();
        const vb = document.getElementById('fb-voice');
        if (vb) { vb.classList.remove('recording'); vb.textContent = 'mic'; }
      }
    }
    document.getElementById('fb-close').onclick = closeFeedback;
    document.getElementById('feedback-overlay').onclick = closeFeedback;
    document.getElementById('fb-submit').onclick = async () => {
      if (!fbBlock || !document.getElementById('fb-text').value.trim()) return;
      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            paperId: paper?.id,
            rootName: fbBlock.rootName,
            summary: document.getElementById('fb-text').value.trim().slice(0, 80),
            comment: document.getElementById('fb-text').value.trim(),
            priority: document.getElementById('fb-priority').value,
            assignee: document.getElementById('fb-assignee').value
          })
        });
        if (!res.ok) throw new Error(`${res.status}`);
        const { todo } = await res.json();
        console.log(`[folio:feedback] submitted: ${todo.id} for ${fbBlock.rootName} (priority=${todo.priority})`);
        // Add to block's local todos so UI updates immediately
        if (!fbBlock.todos) fbBlock.todos = [];
        fbBlock.todos.push(todo);
        // Also track in structFeedback if this is a chapter/section
        if (fbBlock.kind === 'chapter' || fbBlock.kind === 'section') {
          if (!structFeedback[fbBlock.label]) structFeedback[fbBlock.label] = [];
          structFeedback[fbBlock.label] = fbBlock.todos;
          refreshStructBadges();
        }
        document.getElementById('fb-text').value = '';
        document.getElementById('fb-priority').value = 'medium';
        // Clear the saved draft since feedback was submitted
        clearDraft(fbBlock.rootName || fbBlock.label || 'block');
        // Refresh the history panel to show the new item (stay open)
        openFeedback(fbBlock);
        // Update sidebar badges to reflect the new todo
        refreshFeedbackBadges();
      } catch (e) {
        console.error('[folio:feedback] submit failed:', e.message);
        alert('Failed to submit: ' + e.message);
      }
    };

    // ── Voice input (Web Speech API) ──────────────────────
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    const voiceBtn = document.getElementById('fb-voice');

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = (e) => {
        const ta = document.getElementById('fb-text');
        let final = '', interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) final += t; else interim = t;
        }
        if (final) {
          ta.value += (ta.value && !ta.value.endsWith(' ') ? ' ' : '') + final;
        }
        // Show interim in placeholder
        if (interim) ta.placeholder = interim + '...';
        else ta.placeholder = 'Listening...';
      };
      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') console.warn('Speech error:', e.error);
      };
      recognition.onend = () => {
        if (isRecording) recognition.start(); // auto-restart if still recording
      };

      voiceBtn.onclick = () => {
        if (isRecording) {
          isRecording = false;
          recognition.stop();
          voiceBtn.classList.remove('recording');
          voiceBtn.textContent = 'mic';
          document.getElementById('fb-text').placeholder = 'Describe the issue, question, or suggestion...';
        } else {
          isRecording = true;
          recognition.start();
          voiceBtn.classList.add('recording');
          voiceBtn.textContent = 'stop';
        }
      };
    } else {
      voiceBtn.style.display = 'none'; // hide if not supported
    }

    const priOrder = ['critical','high','medium','low'];
    const priColors = {critical:'var(--red,#c44)',high:'var(--ora,#e90)',medium:'var(--ac)',low:'var(--fg-d)'};
    function addTodoIndicators(el, block) {
      if (!block.todos?.length) return;
      const open = block.todos.filter(t => t.status === 'open');
      open.sort((a,b) => (priOrder.indexOf(a.priority||'medium') - priOrder.indexOf(b.priority||'medium')));
      for (const t of open) {
        const pri = t.priority || 'medium';
        const d = mk('div', 'todo-inline decor');
        const dot = mk('span','todo-dot');
        dot.style.background = priColors[pri] || priColors.medium;
        d.appendChild(dot);
        const txt = mk('span','todo-text');
        txt.textContent = t.summary || t.comment || '';
        txt.style.cursor = 'pointer';
        txt.onclick = (e) => { e.stopPropagation(); openFeedback(block); };
        d.appendChild(txt);
        const priLabel = mk('span','todo-pri');
        priLabel.textContent = pri;
        d.appendChild(priLabel);
        // [+] raise priority
        const upBtn = mk('button','todo-btn');
        upBtn.textContent = '+';
        upBtn.title = 'Raise priority';
        const curIdx = priOrder.indexOf(pri);
        if (curIdx <= 0) upBtn.disabled = true;
        upBtn.onclick = (e) => { e.stopPropagation(); updateTodoPri(block, t, priOrder[curIdx-1]); };
        d.appendChild(upBtn);
        // [-] lower priority
        const dnBtn = mk('button','todo-btn');
        dnBtn.textContent = '\u2013';
        dnBtn.title = 'Lower priority';
        if (curIdx >= priOrder.length - 1) dnBtn.disabled = true;
        dnBtn.onclick = (e) => { e.stopPropagation(); updateTodoPri(block, t, priOrder[curIdx+1]); };
        d.appendChild(dnBtn);
        // [x] remove
        const rmBtn = mk('button','todo-btn todo-rm');
        rmBtn.textContent = '\u00d7';
        rmBtn.title = 'Remove todo';
        rmBtn.onclick = (e) => { e.stopPropagation(); removeTodo(block, t); };
        d.appendChild(rmBtn);
        el.appendChild(d);
      }
    }

    async function updateTodoPri(block, todo, newPri) {
      try {
        const res = await fetch('/api/feedback/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paperId: paper?.id, rootName: block.rootName, todoId: todo.id, priority: newPri })
        });
        if (!res.ok) throw new Error(`${res.status}`);
        todo.priority = newPri;
        refreshTodoInline(block);
        refreshFeedbackBadges();
      } catch (e) { console.error('Failed to update priority:', e); }
    }

    async function removeTodo(block, todo) {
      if (!confirm(`Remove todo: "${todo.summary || todo.comment}"?`)) return;
      try {
        const res = await fetch('/api/feedback/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paperId: paper?.id, rootName: block.rootName, todoId: todo.id, status: 'resolved' })
        });
        if (!res.ok) throw new Error(`${res.status}`);
        todo.status = 'resolved';
        refreshTodoInline(block);
        refreshFeedbackBadges();
      } catch (e) { console.error('Failed to remove todo:', e); }
    }

    function refreshTodoInline(block) {
      if (!block.label) return;
      const blockEl = document.getElementById(block.label);
      if (!blockEl) return;
      blockEl.querySelectorAll('.todo-inline').forEach(el => el.remove());
      addTodoIndicators(blockEl, block);
    }

    // ── Feedback badge refresh ──────────────────────────
    // Fetches open todos from server and updates sidebar badges + inline indicators
    // without a full re-render. Called after submit and on a polling interval.
    async function refreshFeedbackBadges() {
      if (!paper) return;
      try {
        const r = await fetch('/api/feedback/all?status=open');
        if (!r.ok) return;
        const allEntries = await r.json();
        // Unwrap {paperId, rootName, todo} → flat todo with rootName attached
        const byRoot = {};
        for (const entry of allEntries) {
          const key = entry.rootName || entry.paperId;
          if (!byRoot[key]) byRoot[key] = [];
          byRoot[key].push({ ...entry.todo, rootName: key });
        }
        // Update block-level data and sidebar badges
        for (const ch of paper.chapters) {
          for (const sec of ch.sections) {
            let secTodos = 0;
            for (const b of sec.blocks) {
              const fresh = byRoot[b.rootName] || [];
              b.todos = fresh;
              const count = fresh.length;
              secTodos += count;
              // Update block badge in sidebar
              const sel = (b.label || b.rootName).replace(/"/g, '\\"');
              const blkEl = document.querySelector(`.sb-blk[title="${sel}"]`);
              if (blkEl) {
                const existing = blkEl.querySelector('.sb-badge.todo');
                if (existing) existing.remove();
                if (count) {
                  const tb = mk('span','sb-badge todo');
                  tb.textContent = `${count} todo`;
                  tb.setAttribute('data-tip', `${count} open todo${count > 1 ? 's' : ''}`);
                  const firstBadge = blkEl.querySelector('.sb-badge');
                  if (firstBadge) blkEl.insertBefore(tb, firstBadge);
                  else blkEl.appendChild(tb);
                }
              }
              // Update inline todo indicators in the rendered block
              if (b.label) {
                const blockEl = document.getElementById(b.label);
                if (blockEl) {
                  blockEl.querySelectorAll('.todo-inline').forEach(el => el.remove());
                  addTodoIndicators(blockEl, b);
                }
              }
            }
            // Update section summary badge
            const sEl = document.querySelector(`.sb-sec[title="${sec.title}"]`);
            if (sEl) {
              const summarySpan = sEl.querySelector('span:last-child');
              if (summarySpan && summarySpan.style.fontSize === '.5rem') {
                // Rebuild just the todo portion of the badge text
                const text = summarySpan.textContent;
                const parts = text.split(' | ').filter(p => !p.includes('todo'));
                if (secTodos) parts.unshift(`${secTodos} todo${secTodos > 1 ? 's' : ''}`);
                summarySpan.textContent = parts.join(' | ');
              }
            }
          }
        }
      } catch (_) { /* silent — polling failure is not fatal */ }
    }

    // Poll for fresh feedback every 3 minutes while page is visible
    let feedbackPollId = null;
    function startFeedbackPolling() {
      if (feedbackPollId) return;
      feedbackPollId = setInterval(() => {
        if (!document.hidden) refreshFeedbackBadges();
      }, 3 * 60 * 1000);
    }
    function stopFeedbackPolling() {
      if (feedbackPollId) { clearInterval(feedbackPollId); feedbackPollId = null; }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopFeedbackPolling();
      else startFeedbackPolling();
    });

    // ── Folio (paper listing) ────────────────────────────
    function renderFolio(data) {
      document.body.classList.remove('has-sidebar');
      document.getElementById('sidebar').innerHTML = '';
      const app = document.getElementById('app');
      app.innerHTML = '';

      const hdr = mk('div','hdr');
      hdr.innerHTML = `<h1>${esc(data.title || 'Papers')}</h1>`;
      app.appendChild(hdr);

      const list = mk('div','folio-list');

        card.innerHTML = `
          <h2 class="fc-title">${esc(p.title)}</h2>
          ${p.description ? `<p class="fc-desc">${esc(p.description)}</p>` : ''}
          <div class="fc-meta">${p.stats?.chapters ?? '?'} chapters · ${p.stats?.blocks ?? '?'} blocks</div>
        `;
        card.style.cursor = 'pointer';
        card.onclick = () => {
          location.hash = `#/${hashWithBranch(`view/${p.id}`)}`;

      }
      app.appendChild(list);

      // ── Paper Importer ────────────────────────────
      const imp = mk('div','importer');
      imp.innerHTML = `
        <div class="importer-title">Import Paper</div>
        <div class="importer-tabs">
          <button class="active" data-tab="arxiv">arXiv</button>
          <button data-tab="upload">Upload</button>
        </div>
        <div class="imp-form" id="imp-arxiv-form">
          <input type="text" id="imp-arxiv-id" placeholder="arXiv ID or URL (e.g. 2301.12345)">
          <button class="imp-submit" id="imp-arxiv-go">Fetch from arXiv</button>
        </div>
        <div class="imp-form" id="imp-upload-form" style="display:none">
          <input type="file" id="imp-file" accept=".pdf,.tex,.zip,.tar.gz,.tar,.bbl,.bib">
          <span style="font-size:.6rem;color:var(--fg-d)">.tex .zip .tar.gz (LaTeX — scans for theorems/definitions) · .pdf (metadata only)</span>
          <input type="text" id="imp-paper-id" placeholder="Paper ID (auto-generated if blank)">
          <button class="imp-submit" id="imp-upload-go">Upload &amp; Scan</button>
        </div>
        <div class="imp-status" id="imp-status"></div>
        <div id="imp-scan-area"></div>
        <div class="import-history" id="imp-history"></div>
      `;
      app.appendChild(imp);

      // Tab switching
      const tabs = imp.querySelectorAll('.importer-tabs button');
      tabs.forEach(tab => {
        tab.onclick = () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
