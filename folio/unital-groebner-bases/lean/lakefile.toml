name = "ugb"
defaultTargets = ["UGB"]

[leanOptions]
autoImplicit = false
profiler = true

[[lean_lib]]
name = "UGB"
srcDir = "."
# WIDEN THE BUILD TO THE WHOLE TREE — the `ugb` counterpart of qou-rc7b.
#
# Lake defaults `globs := roots.map Glob.one`, so a `lean_lib` with no explicit
# `globs` builds ONLY its root module and whatever that root transitively
# imports. `srcDir = "."` widens where Lake *looks for* sources; it does not
# widen what gets *built*.
#
# Measured before this change: 26 modules, 24 reachable from `UGB.lean`. The two
# that were not are `UGB.GrobnerShirshov.HeckeGS` and
# `UGB.GrobnerShirshov.HeckeCompletion` — i.e. the entire Hecke Gröbner–Shirshov
# development, including the refutation of `hecke_is_gs_basis`. `HeckeGS` was
# compiled at all only because `QOU/PhotonThreading.lean` imports it and the
# `qou` package requires this one by path; `HeckeCompletion` was compiled by
# neither project's default build. Breakage in either would have been invisible
# to `lake build` here.
globs = ["UGB", "UGB.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "f897ebcf72cd16f89ab4577d0c826cd14afaafc7"
