name = "qou"
defaultTargets = ["MathlibExt", "QCalculus", "TwistedFrobeniusHopf", "ToricConicOpt", "CompactQuantumMetrics", "HeckeTemperleyLieb", "BraidKnotOctonion", "QOU"]

[leanOptions]
autoImplicit = false
profiler = true          # report per-declaration elaboration times

################################################################################
# Tier-A (`Mathlib4` Core Staging) & Tier-B (6 Standalone Lean Reservoir Libraries)
#
# Strict zero-`QOU.*` upward import boundary (`BP008`, `community_to_qou_cut_edges == 0`)
# and strict inter-library DAG order (`MathlibExt` -> `QCalculus` -> `TwistedFrobeniusHopf`
# -> `ToricConicOpt` -> `CompactQuantumMetrics` -> `HeckeTemperleyLieb` -> `BraidKnotOctonion`).
# All 7 community libraries share `srcDir = "."` (0 extra `.lake/build` roots).
################################################################################

[[lean_lib]]
name = "MathlibExt"
srcDir = "."
globs = ["MathlibExt", "MathlibExt.+"]
moreLeanArgs = ["-s", "65536"]

[[lean_lib]]
name = "QCalculus"
srcDir = "."
globs = ["QCalculus", "QCalculus.+"]
moreLeanArgs = ["-s", "65536"]

[[lean_lib]]
name = "TwistedFrobeniusHopf"
srcDir = "."
globs = ["TwistedFrobeniusHopf", "TwistedFrobeniusHopf.+"]
moreLeanArgs = ["-s", "65536"]

[[lean_lib]]
name = "ToricConicOpt"
srcDir = "."
globs = ["ToricConicOpt", "ToricConicOpt.+"]
moreLeanArgs = ["-s", "65536"]

[[lean_lib]]
name = "CompactQuantumMetrics"
srcDir = "."
globs = ["CompactQuantumMetrics", "CompactQuantumMetrics.+"]
moreLeanArgs = ["-s", "65536"]

[[lean_lib]]
name = "HeckeTemperleyLieb"
srcDir = "."
globs = ["HeckeTemperleyLieb", "HeckeTemperleyLieb.+"]
moreLeanArgs = ["-s", "65536"]

[[lean_lib]]
name = "BraidKnotOctonion"
srcDir = "."
globs = ["BraidKnotOctonion", "BraidKnotOctonion.+"]
moreLeanArgs = ["-s", "65536"]

################################################################################
# Monograph QOU Library (12 Canonical Chapter Subgraphs under `QOU/`)
################################################################################

[[lean_lib]]
name = "QOU"
srcDir = "."
globs = ["QOU", "QOU.+"]
moreLeanArgs = ["-s", "65536"]
# NOTE: Fred2005 has moved to folio/fred2005-formal-groups/lean/
# NOTE: GrobnerShirshov (formerly QOU.GrobnerShirshov) has moved to
#       folio/unital-groebner-bases/lean/

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "f897ebcf72cd16f89ab4577d0c826cd14afaafc7"

# Cross-paper dependency: Gröbner–Shirshov basis engine
# (provides HeckeGS types for crossing energy / categorical mass)
[[require]]
name = "ugb"
path = "../../unital-groebner-bases/lean"

# doc-gen4 and checkdecls are CI-only dependencies.
# Pinned to commit hashes matching the Lean toolchain version.

# doc-gen4 is CI-only (blueprint.yml uses docgen-action; lean_ci.yml has
# a fallback source browser).  Requiring it here forces ~20 heavy
# metaprogramming modules into every local `lake build`, which can hang
# on resource-constrained machines.  Un-comment if you need local docs.
#
# KEEP COMMENTED ON `main`.  `.github/workflows/doc-gen4.yml` un-comments the
# block between the sentinels below before building docs, by stripping the
# leading `# ` from lines starting `# [[require]]` / `# name` / `# git` /
# `# rev` *within that range only*.  Do not remove the sentinels, and do not
# reflow these four lines.
# --- BEGIN doc-gen4 (CI-only) ---
# [[require]]
# name = "doc-gen4"
# git = "https://github.com/leanprover/doc-gen4"
# rev = "1cd7a1113090e216703e323e8fdcdf099f0a9c8a"
# --- END doc-gen4 (CI-only) ---

# [[require]]
# name = "checkdecls"
# git = "https://github.com/PatrickMassot/checkdecls"
# rev = "master"

# BEGIN generated by scripts/gen-lean-blocks-shadow.py — do not edit by hand
# 902 modules. srcDir is a gitignored shadow tree of identifier-safe symlinks
# to the real sources; run `python3 scripts/gen-lean-blocks-shadow.py --write` first.
[[lean_lib]]
name = "QOUBlocks"
srcDir = "blocks-shadow"
globs = ["AppendixKnotPeriodicTable.+", "AppendixNfWitnesses.+", "AppendixQvalues.+", "AppendixStandardModel.+", "AppendixSurreals.+", "AppendixSurrealsArchimedean.+", "BraidsAndKnots.+", "BringsSurface.+", "ClimaxVolumeMass.+", "EightfoldWay.+", "FluidDynamics.+", "Glossary.+", "GravitySpacetime.+", "InformationTheory.+", "KnotsParticlesConfinement.+", "LiftingAndDescent.+", "MassEndomorphism.+", "MassTheory.+", "MeasurementObservation.+", "ModelsOfQous.+", "MolecularConstruction.+", "NuclearInteractions.+", "Observations.+", "OrganicChemistry.+", "PredictedSpectra.+", "QGeometricLanglands.+", "QuantumObservableUniverses.+", "QuantumUniverses.+", "StochasticMechanics.+"]
moreLeanArgs = ["-s", "65536"]
# END generated
