name = "fred2005"
defaultTargets = ["Fred2005"]

[leanOptions]
autoImplicit = false
profiler = true

[[lean_lib]]
name = "Fred2005"
srcDir = "."

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "f897ebcf72cd16f89ab4577d0c826cd14afaafc7"

# BEGIN generated by scripts/gen-lean-blocks-shadow.py — do not edit by hand
# 12 modules. srcDir is a gitignored shadow tree of identifier-safe symlinks
# to the real sources; run `python3 scripts/gen-lean-blocks-shadow.py --write` first.
# The formal-group definitions (formal group laws, Dist(G), Poisson structures on splays)
# live in the qou package, under QOU.FormalGroups; this package re-exports them.
[[require]]
name = "qou"
path = "../../quantum-observable-universe/lean"

[[lean_lib]]
name = "Fred2005Blocks"
srcDir = "blocks-shadow"
