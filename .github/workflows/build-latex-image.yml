# Build and push the LaTeX CI Docker image to GHCR.
#
# Triggers on:
#   - Push to main touching the Dockerfile or main.tex preamble
#   - Manual dispatch
#   - Weekly (to pick up TeX Live security updates)
#
# The image is used by publish.yml as a container for the build job,
# eliminating ~2-3 min of apt-get install on every run.

name: Build LaTeX Image

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/Dockerfile.latex'
      - 'main.tex'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'  # Weekly Sunday 05:00 UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/latex-ci

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.latex
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
