name: Build & Publish (FAST, 8-job DAG)

# **Phase D of the publish.yml parallelization plan**
# (docs/workplans/2026-05-24-publish-yml-parallelization-plan.md — PR #1099).
#
# Shadow workflow that mirrors publish.yml but splits the monolithic
# 1,061-LOC `build-and-publish` job into 8 parallel jobs:
#
#   1. content-pipeline   (sequential — provides inputs to 2a/2b/2c)
#   2a. paper-pdf         (parallel with 2b, 2c)
#   2b. appendix-pdfs     (parallel)
#   2c. schema-docs       (parallel)
#   3a. diff-pdf          (depends on paper-pdf)
#   3b. per-chapter-split (depends on paper-pdf)
#   4. assemble           (depends on 2a/2b/2c/3a/3b)
#   5. deploy             (depends on assemble; gh-pages push)
#
# Critical path: content-pipeline (~5-8 min) + paper-pdf (~3-5 min) +
# max(diff-pdf, per-chapter-split) (~4 min) + assemble (~3 min) +
# deploy (~1 min) ≈ **21 min** vs publish.yml's ~25-30 min
# (25-35% speedup; see PR #1099 §"Wall-clock estimate" — the 13-min
# figure was misleading because it omitted sequential phases).
#
# Per the Phase A plan: this workflow runs in PARALLEL with
# publish.yml for 1-2 weeks of observation. Once metrics confirm
# the speedup + zero-regression assumption, publish.yml is retired
# and this file is renamed.
#
# **Triggers**: pull_request only (avoid double-deploy with
# publish.yml until shadow observation completes). Manual
# workflow_dispatch for ad-hoc runs.

on:
  pull_request:
    paths:
      - 'content/**'
      - 'chapters/**'
      - 'main.tex'
      - 'tools/**'
      - 'folio-assistant/**'
      - '.github/workflows/publish-fast.yml'
      - '.github/workflows/paper-builder-image.yml'
  workflow_dispatch:

concurrency:
  group: publish-fast-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: read   # required to pull ghcr.io/litlfred/qou-paper-builder
                   # (jobs use `container: image: ghcr.io/...`; without
                   # this scope the GHCR pull fails ~13s after job start
                   # and every PR touching folio-assistant/** / content/**
                   # / etc. shows a Content-pipeline check failure.)

env:
  PAPER_BUILDER_IMAGE: ghcr.io/litlfred/qou-paper-builder:latest

jobs:
  # ── 1. content-pipeline (sequential prerequisite) ──────────────
  content-pipeline:
    name: Content pipeline (bun + python + witnesses)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/litlfred/qou-paper-builder:latest
      options: --user 0:0
    outputs:
      papers-json: ${{ steps.folio.outputs.papers_json }}
      filename-base: ${{ steps.filename.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need branches for diff PDF in Job 3a

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('content/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install content pipeline dependencies
        run: cd content && bun install --frozen-lockfile 2>/dev/null || bun install

      - name: Extract paper list from folio
        id: folio
        run: |
          python3 .github/scripts/extract-folio.py > papers.json
          echo "papers_json=$(cat papers.json | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Regenerate stale witnesses
        continue-on-error: true
        run: |
          set -o pipefail
          cd folio-assistant/computations
          python3 hecke_startup_cache.py 2>/dev/null || true
          python3 run_pipeline.py --content-only --timeout 120 2>&1 | tail -20 \
            || echo "::warning::Some witness computations failed"

      - name: Validate and build content objects for all papers
        run: cd content && bun run validate && bun run build

      - name: Compute output filename base
        id: filename
        run: |
          base=$(date -u +"%Y%m%d-%H%M%S")-${GITHUB_SHA:0:7}
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Upload content-pipeline artefacts
        uses: actions/upload-artifact@v4
        with:
          name: content-pipeline-${{ steps.filename.outputs.base }}
          path: |
            chapters/
            papers.json
            folio-assistant/computations/*.witness.json
          retention-days: 1

  # ── 2a. paper-pdf (parallel with 2b, 2c) ───────────────────────
  paper-pdf:
    name: Compile main paper PDF
    needs: content-pipeline
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/litlfred/qou-paper-builder:latest
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: content-pipeline-${{ needs.content-pipeline.outputs.filename-base }}

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - name: Quick LaTeX syntax check (draftmode)
        run: |
          latexmk -pdf -draftmode -interaction=nonstopmode main.tex \
            > latex-syntax.log 2>&1 || \
            { tail -50 latex-syntax.log; exit 1; }

      - name: Compile LaTeX to PDF
        run: latexmk -pdf -interaction=nonstopmode main.tex

      - name: Capture LaTeX build warnings
        run: |
          grep -E '^(Warning|Overfull|Underfull|LaTeX Warning)' main.log \
            > latex-warnings.txt 2>/dev/null || true
          echo "=== LaTeX warnings (${$(wc -l < latex-warnings.txt):-0}) ==="
          cat latex-warnings.txt | head -30 || true

      - name: Flatten \input includes
        run: latexpand main.tex > main-flat.tex 2>/dev/null || true

      - name: Upload paper-pdf artefacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf-${{ needs.content-pipeline.outputs.filename-base }}
          path: |
            main.pdf
            main-flat.tex
            latex-warnings.txt
          retention-days: 1

  # ── 2b. appendix-pdfs (parallel with 2a, 2c) ───────────────────
  appendix-pdfs:
    name: Compile standalone appendix PDFs
    needs: content-pipeline
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/litlfred/qou-paper-builder:latest
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: content-pipeline-${{ needs.content-pipeline.outputs.filename-base }}

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - name: Compile standalone appendix PDFs
        run: |
          mkdir -p appendices/
          # Pattern matches publish.yml step "Compile standalone appendix PDFs".
          # Mirrored verbatim — if the upstream script exists, run it; otherwise
          # skip with a warning. Phase E follow-up flushes this out per
          # the publish.yml line 494-528 logic.
          for tex in $(find chapters/ -name "appendix-*.tex" 2>/dev/null); do
            base=$(basename "$tex" .tex)
            (cd appendices && \
              cp "../$tex" "${base}.tex" && \
              latexmk -pdf -interaction=nonstopmode "${base}.tex" || \
              echo "::warning::appendix ${base} compile failed")
          done

      - name: Upload appendix-pdfs artefacts
        uses: actions/upload-artifact@v4
        with:
          name: appendix-pdfs-${{ needs.content-pipeline.outputs.filename-base }}
          path: appendices/*.pdf
          retention-days: 1
          if-no-files-found: ignore

  # ── 2c. schema-docs (parallel with 2a, 2b) ─────────────────────
  schema-docs:
    name: TypeDoc — schema-docs/
    needs: content-pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: TypeDoc generate
        working-directory: folio-assistant
        run: |
          bun install || npm install
          npx typedoc --out ../schema-docs \
            --entryPointStrategy expand \
            --readme none --hideGenerator \
            schemas/ adapters/paper/schemas/ 2>&1 | tail -10

      - name: Upload schema-docs artefacts
        uses: actions/upload-artifact@v4
        with:
          name: schema-docs-${{ needs.content-pipeline.outputs.filename-base }}
          path: schema-docs/
          retention-days: 1

  # ── 3a. diff-pdf (depends on paper-pdf) ────────────────────────
  diff-pdf:
    name: Generate diff PDF vs main
    needs: [content-pipeline, paper-pdf]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/litlfred/qou-paper-builder:latest
      options: --user 0:0
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: paper-pdf-${{ needs.content-pipeline.outputs.filename-base }}

      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'

      - name: Fetch base branch + flatten + latexdiff
        # Mirror of publish.yml lines 355-489 (Fetch branches → Generate diff
        # PDF → Diff PDF status). `continue-on-error` so a diff failure does
        # not block the rest of the DAG.
        continue-on-error: true
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref || 'main' }}
          git checkout origin/${{ github.event.pull_request.base.ref || 'main' }} -- main.tex
          latexpand main.tex > main-base-flat.tex 2>/dev/null
          # main-flat.tex came from the paper-pdf job's artefact
          latexdiff main-base-flat.tex main-flat.tex > main-diff.tex 2>/dev/null
          latexmk -pdf -interaction=nonstopmode main-diff.tex \
            > diff-build.log 2>&1 || \
            { tail -30 diff-build.log; echo "::warning::diff PDF compile failed"; }

      - name: Upload diff-pdf
        uses: actions/upload-artifact@v4
        with:
          name: diff-pdf-${{ needs.content-pipeline.outputs.filename-base }}
          path: main-diff.pdf
          retention-days: 1
          if-no-files-found: ignore

  # ── 3b. per-chapter-split (depends on paper-pdf) ───────────────
  per-chapter-split:
    name: Split main PDF into per-chapter
    needs: [content-pipeline, paper-pdf]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/litlfred/qou-paper-builder:latest
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: paper-pdf-${{ needs.content-pipeline.outputs.filename-base }}

      - name: Split main.pdf into per-chapter PDFs
        run: |
          mkdir -p chapters-pdf/
          # pypdf is baked into the paper-builder image.
          python3 scripts/split-pdf-by-chapter.py \
            --input main.pdf \
            --output-dir chapters-pdf/ \
            2>&1 | tail -20 || \
            echo "::warning::per-chapter split failed (script may not exist on this branch)"

      - name: Upload per-chapter PDFs
        uses: actions/upload-artifact@v4
        with:
          name: per-chapter-${{ needs.content-pipeline.outputs.filename-base }}
          path: chapters-pdf/*.pdf
          retention-days: 1
          if-no-files-found: ignore

  # ── 4. assemble (fan-in from 2a/2b/2c/3a/3b) ───────────────────
  assemble:
    name: Assemble site/ + builds.json
    needs: [content-pipeline, paper-pdf, appendix-pdfs, schema-docs, per-chapter-split]
    # Note: `diff-pdf` intentionally OMITTED from needs[] — it's
    # pull_request-only and `continue-on-error: true`. Including it
    # in needs[] would cancel the assemble job on push/dispatch
    # (where diff-pdf is skipped) per GH-Actions skip-propagation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefacts/
          merge-multiple: true

      - name: Assemble _site/
        run: |
          mkdir -p _site/papers _site/chapters _site/appendices _site/schema-docs
          # Mirror of publish.yml step "Assemble site artefacts" — keep
          # mechanical for Phase D; full assembly logic remains in
          # publish.yml until the shadow proves itself.
          cp artefacts/main.pdf _site/ 2>/dev/null || true
          cp -r artefacts/*.pdf _site/chapters/ 2>/dev/null || true
          cp -r artefacts/appendix-* _site/appendices/ 2>/dev/null || true
          cp -r artefacts/schema-docs _site/ 2>/dev/null || true
          ls -la _site/

      - name: Upload site artefacts
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ needs.content-pipeline.outputs.filename-base }}
          path: _site/
          retention-days: 7

      - name: Comment preview info on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🚀 Publish-fast preview (shadow workflow)

            This PR was built by **publish-fast.yml** (Phase D shadow), running in parallel with publish.yml.

            **Artefacts** (in this workflow run's "Artifacts" section):
            - \`site-${{ needs.content-pipeline.outputs.filename-base }}\` — full _site/ bundle
            - \`paper-pdf-${{ needs.content-pipeline.outputs.filename-base }}\`
            - \`appendix-pdfs-${{ needs.content-pipeline.outputs.filename-base }}\`
            - \`diff-pdf-${{ needs.content-pipeline.outputs.filename-base }}\` (vs ${{ github.event.pull_request.base.ref }})
            - \`per-chapter-${{ needs.content-pipeline.outputs.filename-base }}\`
            - \`schema-docs-${{ needs.content-pipeline.outputs.filename-base }}\`

            **Wall-clock comparison**: see workflow timing alongside the publish.yml run.

            Phase D shadow observation: planned 1-2 weeks before retiring publish.yml.`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # ── 5. deploy (PHASE D scaffolds it; only fires on workflow_dispatch  ──
  # until shadow observation passes; gh-pages stays owned by publish.yml
  # during the shadow phase to avoid double-deploy)
  deploy:
    name: Deploy to gh-pages (gated)
    needs: assemble
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ needs.content-pipeline.outputs.filename-base }}
          path: _site/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
          commit_message: 'publish-fast(deploy): manual workflow_dispatch from ${{ github.sha }}'
