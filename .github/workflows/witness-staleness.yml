# Witness-staleness — warn-mode CI surface.
#
# Runs the dependency-drift + self-staleness validator and prints the
# report to the job log + step summary. WARN-MODE: never fails the build
# (`|| true`) so it surfaces the backlog without red-walling PRs. Escalate
# to `--self-strict` / `--strict` once the backlog drains (see
# docs/design/2026-06-16-witness-staleness-propagation.md §closure).
#
# NOTE: this branch predates the CI reorg on `main`. At merge, reconcile
# with `main`'s witness-pipeline rather than duplicating this job.
#
# THE PRECISION STEPS HERE DO NOT PROTECT `main`, AND CANNOT.
# Every gate in the precision family below is strict and correct. None of them
# has run on a push since 2026-06-30, because the trigger is `workflow_dispatch`
# only (owner directive, Actions billing — see `on:` below). Three witnesses
# carrying raw float64 reached `main` in that window, from three different
# sessions (bean `qou-mnrd`).
#
# The enforcing copy is therefore agent-side: `scripts/precision-gates.sh` runs
# the same family, in the same order, and is required before every commit that
# touches a witness or a `computations/` script (AGENTS.md §"QA is agent-owned")
# and again at `/prepare-merge` step 4b. KEEP THE TWO LISTS IN SYNC — if you add,
# remove or re-scope a precision step here, edit the `GATES` array in that script
# in the same change. Re-enabling this workflow's push trigger is an owner
# decision about billing, not an agent one; do not flip it unasked.
name: witness-staleness

on:
  # CI auto-triggers disabled (owner directive 2026-06-30): Actions billing.
  workflow_dispatch: {}

# THE GATES ARE NOW ONE TABLE (TOOLS T7, bean qou-4dj1). Each step below calls
# `python3 scripts/compute-qa.py --gate <id>`, which runs the exact command this
# step used to run inline, applies the same strict/warn exit handling, writes the
# step summary, and records a verdict under test/results/compute-qa/. The order
# and grouping live in processes/tools/compute-qa.bpmn; each step names its
# activity with `# bpmn-node:`. The note below is kept as the history of why
# `shell: bash` is set; the runner no longer pipes through tee, so a red gate
# fails its step whatever the shell.
#
# EVERY STRICT GATE IN THIS FILE FAILED OPEN (history).
#
# The steps below all ran `python3 <audit>.py --strict | tee /tmp/x.txt`. The
# default shell for a `run:` block on Linux is `bash -e {0}` — `-e` but NOT
# `-o pipefail` — so the exit status of that pipeline is `tee`'s, which is
# always 0. A red audit printed its own failure into the step summary and the
# step passed anyway. Verified: `bash -e -c 'false | tee /dev/null'` exits 0.
#
# Naming `shell: bash` explicitly (as opposed to leaving the default) runs
# `bash --noprofile --norc -eo pipefail {0}`, which makes all seven real in
# one line. Checked before turning it on rather than after: six of the seven
# were already green, and the seventh is marked at its own step below rather
# than left to red-wall the whole job by surprise.
defaults:
  run:
    shell: bash

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Witness staleness report (warn-only)
        # bpmn-node: Task_Staleness (processes/tools/compute-qa.bpmn); gate `staleness-report`, warn.
        run: python3 scripts/compute-qa.py --gate staleness-report

      - name: q0-anchor flip detector (strict)
        # A witness whose q0Value disagrees with its q0Anchor is the muon/proton
        # flip-flop bug (bean tnjb). Unlike the warn-mode staleness backlog, a
        # flip is a genuine correctness error, so this gate is STRICT: exits 1 on
        # any Q0_FLIP. Missing anchors (pre-backfill) are NOT failures — a witness
        # gains its anchor when next produced via WitnessBuilder (PR #4020).
        # bpmn-node: Task_Staleness (processes/tools/compute-qa.bpmn); gate `q0-anchor-flip`, strict.
        run: python3 scripts/compute-qa.py --gate q0-anchor-flip

      - name: mpf(<float>) source audit (strict — baseline ZERO)
        # Owner directive: NO FLOAT64. The float64-padding ratchet below
        # catches fake precision AFTER it reaches a witness; this catches the
        # same defect where it ORIGINATES:
        #
        #   mp.mpf(0.1)     mpmath receives 0.10000000000000000555111512312...
        #   mp.mpf("0.1")   mpmath receives 0.1 to full precision
        #
        # A float literal is parsed to binary64 before mpmath sees it, so no
        # mp.dps setting can recover it — raising precision only prints more
        # of the error.
        #
        # Unlike the two ratchets, this gate has NO BASELINE: the surface was
        # small enough (4 defects) to fix outright, so it starts and stays at
        # zero. A gate with an empty backlog is one nobody learns to ignore —
        # do not introduce a baseline here, fix the call instead.
        #
        # Only non-exactly-representable literals are DEFECTs. mpf(1.0),
        # mpf(2.5), mpf(1e9) lose nothing. An explicit mpf(float(x)) is
        # reported as advisory, not failed; mark deliberate ones with a
        # `# float64-intentional: <reason>` comment.
        # bpmn-node: Task_Precision (processes/tools/compute-qa.bpmn); gate `mpf-float-source`, strict.
        run: python3 scripts/compute-qa.py --gate mpf-float-source

      - name: import-time dps ratchet (strict on NEW constants built at dps=15)
        # The third member of the float64 family, and the one the other two
        # structurally cannot see. `mp.mpf("2.22456607")` is exactly the
        # COMPLIANT form the source audit above tells you to write — but at
        # module scope it runs at IMPORT time, when mp.dps is still mpmath's
        # default 15. The value is rounded to ~53 bits before set_compute_dps()
        # is ever called, and raising dps afterwards cannot recover it. Printed
        # at 50 dps it yields the binary64 expansion, i.e. padding:
        #   mp.mpf("2.22456607") -> 2.2245660699999998399789546965621411800384…
        #
        # So string-sourcing is NECESSARY BUT NOT SUFFICIENT; the timing matters
        # too. The fix is one line: call the idempotent set_compute_dps() at
        # module scope ABOVE the constant.
        #
        # WIRED 2026-08-10 (bean qou-j6gb). The audit was written 2026-08-07 and
        # belonged to no gate list — not here, not in scripts/precision-gates.sh
        # — so nothing ran it, and its defect class landed five more times in the
        # interim, each caught by a different gate reacting to a downstream
        # symptom rather than the cause.
        #
        # Ratchet: 91 files / 185 proven-lossy / 103 position-risky are baselined
        # and tolerated so the gate can run today; anything new fails. `literal`
        # and `expr` counts are compared SEPARATELY so a statically-proven defect
        # cannot hide behind an unproven one drained from the same file. A file
        # the audit CANNOT PARSE is never baselined and always fails — that is
        # "no information", not "no findings", and conflating the two is the bug
        # bean qou-brkp records this audit having had once already.
        # bpmn-node: Task_Precision (processes/tools/compute-qa.bpmn); gate `import-time-dps`, strict.
        run: python3 scripts/compute-qa.py --gate import-time-dps

      - name: never-raises-dps ratchet (strict on NEW producers stuck at 15 dps)
        # The blind spot the other three float64 gates SHARE, rather than a gap
        # in any one of them. Each of those asks whether a value got in before
        # precision was raised — so all three assume it was raised somewhere. A
        # producer that never calls set_compute_dps(), never assigns mp.dps and
        # never opens a workdps block runs its whole computation at mpmath's
        # default 15, and its numbers are then HONESTLY float64: no padding to
        # detect, no constant built too early. It passes all three cleanly.
        #
        # Reported by #4899, which found it the hard way — markov_trace_recursive.py
        # was "float64 wearing 60 digits", exposed only by tightening a comparison
        # until three assertions failed at digit 17 with dyadic tails.
        #
        # RUNNABLE producers only (a __main__ guard). mp.dps is GLOBAL state, so
        # an imported helper legitimately inherits its caller's precision —
        # _li_2_q_util.py builds 40 mpmath values, raises dps nowhere, and is
        # correct. Flagging library modules would bury the real findings.
        #
        # Ratchet: 46 producers / 206 constructions baselined so the gate can run
        # today; anything new fails. Unlike the import-time audit, the fix here
        # usually MOVES PUBLISHED VALUES — the producer really was computing low,
        # and that movement is the point.
        # bpmn-node: Task_Precision (processes/tools/compute-qa.bpmn); gate `never-raises-dps`, strict.
        run: python3 scripts/compute-qa.py --gate never-raises-dps

      - name: float64-padding ratchet (strict on NEW fake precision)
        # Owner directive: NO FLOAT64. A value that enters a producer as a
        # Python float carries ~17 significant digits; serializing it at 50
        # dps writes out the binary64 EXPANSION — 30+ digits of rounding
        # garbage that reads as exact. Live example:
        #   "B_AME_MeV": "8.4817962000000015621026250300928950309753417968750"
        # The datum is 8.4817962 (8 sig figs); the rest is an artifact.
        #
        # Worse than staleness: a stale value is wrong, a padded one is wrong
        # about how well it is KNOWN, which defeats precision checks silently.
        #
        # ROOT CAUSE is `mpf(<python float>)` instead of `mpf("<literal>")` —
        # the value is already binary-rounded before mpmath sees it. Fix at
        # the producer (carry the value as a string), then re-run it. NEVER
        # hand-edit the number, and never --rebaseline to go green
        # (rebaseline is for draining only; the count must go DOWN).
        #
        # Ratchet: the 452-occurrence backlog is baselined and tolerated so
        # the gate can run today; anything new fails.
        # bpmn-node: Task_Precision (processes/tools/compute-qa.bpmn); gate `float64-padding`, strict.
        run: python3 scripts/compute-qa.py --gate float64-padding

      - name: mp.dps no-op gate (strict — starts at ZERO)
        # Sibling of the step above, catching the OPPOSITE defect.
        #
        #     import mpmath as mp
        #     mp.dps = 50        # sets an attribute on the MODULE — a no-op
        #
        # Precision lives on the context, `mpmath.mp`, so under this alias the
        # line has to read `mp.mp.dps`. As written the file runs at mpmath's
        # default 15 digits while its author believes it is at 50. The
        # `from mpmath import mp` form, where `mp.dps` IS correct, looks
        # almost identical — which is why it survives review.
        #
        # The padding gate cannot see this: at dps=15 str(<mpf>) prints ~15
        # digits and is_f64_padded needs >=20 before it looks at all. Of the
        # seven instances found in this corpus, exactly ONE produced padding.
        # Padding claims MORE precision than a value has; this carries LESS
        # than was asked for.
        #
        # Not a ratchet — no baseline, no backlog. #4677 fixed every instance
        # in gated paths, so this starts green and any regression fails.
        # scratch/ is reported but not gated, so exploratory work cannot put a
        # standing backlog in front of it.
        # bpmn-node: Task_Precision (processes/tools/compute-qa.bpmn); gate `mpf-context-dps`, strict.
        run: python3 scripts/compute-qa.py --gate mpf-context-dps

      - name: module-const precision gate (strict on LOSSY)
        # Third member of the precision family, and it catches what the other
        # two cannot: a single `mpf("…")` built at MODULE scope, before
        # set_compute_dps() runs inside main(). The file is otherwise correct,
        # so the mp.dps gate sees nothing; the constant is frozen at 53 bits
        # and merely inaccurate rather than long, so the padding gate sees
        # nothing either — unless it happens to be serialized, which is how
        # the two m_tau producers were finally caught.
        #
        # Gated on LOSSY only (>15 significant digits — the literal is
        # truncated the moment it is built). PADDING_RISK is reported and not
        # gated: a tolerance like mpf("1e-25") is affected but harmless, and
        # that is a judgement about USE which no static test can make.
        # LOSSY was 11 and is now 0, so this starts green like its siblings.
        # bpmn-node: Task_Precision (processes/tools/compute-qa.bpmn); gate `module-const`, strict.
        run: python3 scripts/compute-qa.py --gate module-const

      - name: raw-float64 ratchet (strict on NEW dirty witnesses)
        # The step above gates FAKE precision — float64 padded past ~17 digits.
        # It does NOT gate the rule AGENTS.md actually states: "NO-FLOAT64
        # means none may enter a witness." A witness storing float64 AT
        # float64 width is honest about being f64 and passes that gate while
        # still breaking the rule.
        #
        # Not hypothetical: jpsi-boundstate-mass.witness.json reached main
        # with 30 raw float64 fields and the padding gate green (13/13,
        # NEW 0). Two of them were wrong about what they WERE — a
        # Chern-Simons value that is exactly -1/12 stored as
        # -0.08333333333333312, and one that is exactly 0 (amphichirality, a
        # structural fact) stored as 8.324194211187791e-16.
        #
        # Ratchet ONLY. Draining the 1585-file backlog at the producer is
        # PR #4677's work; this stops the class GROWING while that runs.
        # Fails on a witness not in the baseline, or a baselined count that
        # goes UP. Fix at the producer (mpmath.mpf from source, serialize
        # with _precision.fmt) — never hand-edit, and never add a file to
        # the baseline to go green.
        # bpmn-node: Task_Precision (processes/tools/compute-qa.bpmn); gate `raw-float64`, strict.
        run: python3 scripts/compute-qa.py --gate raw-float64

      - name: q0-value drift ratchet (strict on NEW staleness)
        # A witness that embeds q_0 freezes whatever value its producer had.
        # When the canonical pinning is re-solved, every frozen copy silently
        # goes stale — and nothing downstream notices, because a q0-derived
        # number has no independent check.
        #
        # RATCHET, not big-bang: the existing backlog (329 stale fields at
        # introduction) is recorded in q0-drift-baseline.json and tolerated,
        # so the gate can turn on TODAY; anything stale that is NOT in the
        # baseline fails the build. Staleness can therefore shrink but never
        # grow.
        #
        # The proton-pinned values (564 of them) are NOT drift — that is the
        # documented physical-observations layer (AGENTS.md §q₀ anchor
        # convention). Do not "fix" them.
        #
        # A failure means a NEW stale anchor landed. Fix it by RE-RUNNING THE
        # PRODUCER, never by hand-editing the number, and never by
        # --rebaseline (that is for draining only — the count must go DOWN).
        # bpmn-node: Task_Staleness (processes/tools/compute-qa.bpmn); gate `q0-value-drift`, strict.
        run: python3 scripts/compute-qa.py --gate q0-value-drift

      - name: No-free-parameter certificate (strict)
        # Every number entering a predicted observable must be traceable to a
        # tagged calibration input, a proved/derived constant, or pure
        # combinatorics. Anything else is a free parameter, and a free
        # parameter is a fit. Baseline is CLEAN across all four prediction
        # entry points, so this goes in STRICT from the start — same posture
        # as the q0-flip gate above, and for the same reason: an untraceable
        # literal in a predictor is a correctness error, not a backlog item.
        #
        # --self-test first: a detector that never fires is worthless, so the
        # run asserts the classifier still separates fitted values from
        # unit/structural ones before its verdict is trusted.
        #
        # A failure means either (a) a genuine new free parameter — fix the
        # code, or (b) a legitimate constant the classifier cannot yet see —
        # add it to VERDICT_LEDGER in the script with a written justification.
        # Never widen the bounds to make a red run green.
        # bpmn-node: Task_Precision (processes/tools/compute-qa.bpmn); gate `no-free-parameter`, warn.
        run: python3 scripts/compute-qa.py --gate no-free-parameter

      - uses: oven-sh/setup-bun@v2
      - name: Author-note Lean-coverage drift gate (strict)
        # The introduction's advertised proved-counts (PR #3490 mechanism:
        # scripts/refresh-authors-note.ts) drift whenever a proof or
        # conjecture lands. Strict: exits 1 when the committed note
        # disagrees with a live recount. Fix: bun run
        # scripts/refresh-authors-note.ts (commit note + lean-coverage.json).
        # The agent-side gate is scripts/check-sidecars.sh; this is the
        # CI backup (dispatch-only, per the 2026-06-30 billing directive).
        # bpmn-node: Task_Staleness (processes/tools/compute-qa.bpmn); gate `authors-note-coverage`, strict.
        run: |
          ./scripts/setup-folio-assistant.sh
          python3 scripts/compute-qa.py --gate authors-note-coverage
