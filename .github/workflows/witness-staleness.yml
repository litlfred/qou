# Witness-staleness — warn-mode CI surface.
#
# Runs the dependency-drift + self-staleness validator and prints the
# report to the job log + step summary. WARN-MODE: never fails the build
# (`|| true`) so it surfaces the backlog without red-walling PRs. Escalate
# to `--self-strict` / `--strict` once the backlog drains (see
# docs/design/2026-06-16-witness-staleness-propagation.md §closure).
#
# NOTE: this branch predates the CI reorg on `main`. At merge, reconcile
# with `main`'s witness-pipeline rather than duplicating this job.
name: witness-staleness

on:
  # CI auto-triggers disabled (owner directive 2026-06-30): Actions billing.
  workflow_dispatch: {}

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Witness staleness report (warn-only)
        run: |
          # stdlib-only validator; no pip install needed.
          python3 computations/witness_dependency_drift.py | tee /tmp/staleness.txt || true
          {
            echo '## Witness staleness (warn-mode)';
            echo '```';
            head -20 /tmp/staleness.txt;
            echo '```';
            echo '_Upstream drift fails the gate once escalated to `--strict`; self-staleness is warn-only until the backlog drains. See `docs/design/2026-06-16-witness-staleness-propagation.md`._';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: q0-anchor flip detector (strict)
        # A witness whose q0Value disagrees with its q0Anchor is the muon/proton
        # flip-flop bug (bean tnjb). Unlike the warn-mode staleness backlog, a
        # flip is a genuine correctness error, so this gate is STRICT: exits 1 on
        # any Q0_FLIP. Missing anchors (pre-backfill) are NOT failures — a witness
        # gains its anchor when next produced via WitnessBuilder (PR #4020).
        run: |
          python3 computations/audits/q0_anchor_consistency_audit.py --strict | tee /tmp/q0flip.txt
          {
            echo '## q0-anchor flip detector (strict)';
            echo '```';
            head -14 /tmp/q0flip.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No-free-parameter certificate (strict)
        # Every number entering a predicted observable must be traceable to a
        # tagged calibration input, a proved/derived constant, or pure
        # combinatorics. Anything else is a free parameter, and a free
        # parameter is a fit. Baseline is CLEAN across all four prediction
        # entry points, so this goes in STRICT from the start — same posture
        # as the q0-flip gate above, and for the same reason: an untraceable
        # literal in a predictor is a correctness error, not a backlog item.
        #
        # --self-test first: a detector that never fires is worthless, so the
        # run asserts the classifier still separates fitted values from
        # unit/structural ones before its verdict is trusted.
        #
        # A failure means either (a) a genuine new free parameter — fix the
        # code, or (b) a legitimate constant the classifier cannot yet see —
        # add it to VERDICT_LEDGER in the script with a written justification.
        # Never widen the bounds to make a red run green.
        run: |
          python3 computations/no_free_parameter_certificate.py --self-test
          python3 computations/no_free_parameter_certificate.py --strict | tee /tmp/nfp.txt
          {
            echo '## No-free-parameter certificate (strict)';
            echo '```';
            head -20 /tmp/nfp.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: oven-sh/setup-bun@v2
      - name: Author-note Lean-coverage drift gate (strict)
        # The introduction's advertised proved-counts (PR #3490 mechanism:
        # scripts/refresh-authors-note.ts) drift whenever a proof or
        # conjecture lands. Strict: exits 1 when the committed note
        # disagrees with a live recount. Fix: bun run
        # scripts/refresh-authors-note.ts (commit note + lean-coverage.json).
        # The agent-side gate is scripts/check-sidecars.sh; this is the
        # CI backup (dispatch-only, per the 2026-06-30 billing directive).
        run: |
          ./scripts/setup-folio-assistant.sh
          bun run scripts/refresh-authors-note.ts --check
