# QA publish — every QA writer qou.json declares, published to qa-reports.
#
# Owner decision 2026-11-24 ("4y"): qou's QA goes to the platform's integrated
# QA page (cat-harness-tools scripts/qa-page.ts: one page per instance, one
# section per QA axis). So this workflow is now a CALLER of the platform's
# reusable layer-qa-publish.yml, which mounts qou in the index, runs the
# knowledge-graph audit, runs the writers qou.json declares under `qa.writers`
# (accuracy, compute gates, Lean vacuity/axiom audit, rendered paper; each
# with its QA axis) and publishes the qa home to this repository's
# cat/cat-harness/qa-reports branch as main/<sha>.
#
# It replaces the old one-job compute-QA publisher; the compute gates now run
# as the `compute-qa` writer (scripts/qa-writer.sh compute). The four gate
# workflows still only judge, never publish ("the first write stands").
#
# Dispatch-only, like every workflow here (owner directive 2026-06-30, Actions
# billing). The same writers and the same qa:publish run from an agent's
# checkout through scripts/qa-publish-local.sh, which publish-main-local.sh
# calls after a merge.
#
# Pinned to cat-harness-tools#2510's head, the first commit whose
# layer-qa-publish.yml runs DECLARED writers; re-pin to its merge commit once
# it lands on main.
name: QA publish (declared writers, to qa-reports)

on:
  workflow_dispatch: {}

permissions:
  contents: write   # qa:publish pushes the qa-reports branch; nothing else is written

jobs:
  publish:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-qa-publish.yml@25cdacffd3bd113fc2c21824a7461ab62d32cff6 # index.lock.json
