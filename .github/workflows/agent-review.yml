name: Agent Review

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: >
          Commit SHA to review. Leave blank to review the latest commit
          on main.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Get commit diff
        id: diff
        run: |
          DIFF=$(git diff HEAD~1 HEAD -- . ':(exclude).github' || git diff --root HEAD -- . ':(exclude).github')
          {
            echo "diff<<DIFF_EOF"
            echo "$DIFF" | head -c 50000
            echo "DIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get commit info
        id: commit
        run: |
          echo "message=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "author=$(git log -1 --pretty=%an)" >> "$GITHUB_OUTPUT"

      - name: Collect skill files
        id: skills
        run: |
          # Cap skills payload to stay well within the GitHub Actions output limit.
          MAX_SKILLS_CHARS=20000

          SKILLS=""
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            REL_PATH="${f#.claude/skills/}"
            SKILLS="${SKILLS}--- ${REL_PATH} ---
          $(cat "$f")

          "
          done < <(find .claude/skills -name '*.md' -type f | sort)
          {
            echo "content<<SKILLS_EOF"
            echo "$SKILLS" | head -c "$MAX_SKILLS_CHARS"
            echo "SKILLS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Derive PDF URL
        id: pdf
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          echo "url=https://${OWNER}.github.io/${REPO_NAME}/quantum-observable-universe.pdf" >> "$GITHUB_OUTPUT"

      - name: Run agent review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_DIFF: ${{ steps.diff.outputs.diff }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          COMMIT_AUTHOR: ${{ steps.commit.outputs.author }}
          REPO_NAME: ${{ github.repository }}
          SKILLS_CONTENT: ${{ steps.skills.outputs.content }}
          PDF_URL: ${{ steps.pdf.outputs.url }}
        run: python .github/scripts/agent_review.py

