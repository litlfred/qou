name: build

on:
  # CI auto-triggers disabled (owner directive 2026-06-30): GitHub Actions
  # billing causes 2-3s setup-phase failures on every push/PR. Manual-only.
  workflow_dispatch:

jobs:
  publish:
    # PINNED, and it MUST move together with `.folio-assistant-pin` (qou-pwp9).
    #
    # This read `@main` until 2026-09-26. That bypassed the pin entirely: the pin
    # file governs what an agent measures in its local `folio-assistant/`
    # checkout, while this line governed what actually PUBLISHES — so the two
    # could disagree with no signal, which is the exact failure the pin exists to
    # prevent one level down. The pin file's own text claims "bumping the platform
    # is now a deliberate, reviewable edit to this one line"; with `@main` here
    # that claim was false, because there were two lines and it named one.
    #
    # Verified input-compatible at this sha before pinning, not assumed: the
    # pinned publish.yml declares `builder_image` under `workflow_call` and has
    # ZERO required inputs, so the single input passed below is accepted and
    # nothing else is owed.
    #
    # Keep this sha byte-identical to `.folio-assistant-pin`. When you bump one,
    # bump both in the same commit.
    uses: litlfred/folio-assistant/.github/workflows/publish.yml@ba3914beca12f29a1f12d0fc2278b813d6b63241
    permissions:
      contents: write
      pull-requests: write
      packages: read
    with:
      # The TeX builder image is a FOLIO asset, not a platform one: its TeX
      # package set is chosen for this paper and it carries this repo's
      # CC-BY-4.0 licence. It is built here by `paper-builder-image.yml` from
      # `.github/docker/Dockerfile.paper-builder`, and passed in so the
      # platform's publish pipeline stays folio-agnostic.
      builder_image: ghcr.io/litlfred/qou-paper-builder:latest
