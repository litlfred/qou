name: build

on:
  # CI auto-triggers disabled (owner directive 2026-06-30): GitHub Actions
  # billing causes 2-3s setup-phase failures on every push/PR. Manual-only.
  workflow_dispatch:

jobs:
  site:
    # Builds and publishes qou's site through the platform's reusable
    # folio-staging.yml: on main it publishes at the root of gh-pages
    # (`publish-main` job), on any other branch as a preview under
    # branches/<slug>/.
    #
    # This called `publish.yml@<pin>` until 2026-11-23. Platform 0c5468ac46
    # (2026-11-10) DELETED publish.yml, so the `uses:` named a file that does
    # not exist and GitHub could not start the workflow at all (owner,
    # 2026-11-23: "i cant seem to kick off from github actions"). Recorded as a
    # KNOWN BREAK in .folio-assistant-pin since 82b389982.
    #
    # PINNED, and it MUST move together with `.folio-assistant-pin` (qou-pwp9):
    # keep this sha and `platform_ref` byte-identical to the pin's last line.
    # `bash scripts/folio-pin-coupling-check.sh` asserts it.
    #
    # The TeX PDF build that publish.yml carried is NOT replaced here; the
    # builder image (paper-builder-image.yml) is kept for when it is.
    #
    # When Actions is not enabled, an agent runs the same steps after a merge
    # to main: scripts/publish-main-local.sh (skill post-merge-rebuild).
    uses: litlfred/folio-assistant/.github/workflows/folio-staging.yml@42bd8d605d8c4416656611be69def69e6e855367
    permissions:
      contents: write
      pull-requests: write
      issues: read
    with:
      build_command: bash scripts/build-site.sh
      site_dir: _site
      folio_dir: folio
      platform_dir: folio-assistant
      platform_ref: 42bd8d605d8c4416656611be69def69e6e855367
