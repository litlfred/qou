name: Lean Build & Proof Status

on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - 'chapters/**'
      - 'proof-objects.json'
      - 'glossary.json'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  preflight:
    name: Verify CI Image
    runs-on: ubuntu-latest
    steps:
      - name: Check CI image availability
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/qou-ci:latest
        run: |
          echo "::group::Image pull diagnostics"
          echo "Image:       $IMAGE"
          echo "Actor:       ${{ github.actor }}"
          echo "Repository:  ${{ github.repository }}"
          echo "Token scope: (GITHUB_TOKEN — packages:read required)"
          echo "::endgroup::"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>&1 || {
            echo "::error::GHCR login failed. Check that the workflow has 'packages: read' permission."
            exit 1
          }

          docker pull "$IMAGE" 2>&1 || {
            echo ""
            echo "::error::Failed to pull $IMAGE"
            echo ""
            echo "=== Troubleshooting ==="
            echo "1. Has the image been built? Run the 'CI Docker Image' workflow manually:"
            echo "   gh workflow run docker-ci-image.yml --ref main"
            echo "2. Is the package visible to this repo? Go to:"
            echo "   https://github.com/users/${{ github.repository_owner }}/packages/container/qou-ci/settings"
            echo "   → Manage Actions access → Add repository '${{ github.repository }}' with Read role"
            echo "3. Check package existence:"
            echo "   gh api users/${{ github.repository_owner }}/packages/container/qou-ci"
            echo "========================"
            exit 1
          }

          echo "✅ Image pulled successfully"
          docker inspect "$IMAGE" --format 'Created: {{.Created}}'

  extract-and-build:
    needs: preflight
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/qou-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 0: Set PYTHONPATH for qou_lib shared library ──────────
      - name: Configure Python path
        run: echo "PYTHONPATH=${{ github.workspace }}/.github/scripts" >> "$GITHUB_ENV"

      # ── Step 1: Run Ontologist — scan LaTeX for glossary terms ─────
      - name: Run Ontologist (glossary scan)
        run: python3 .github/scripts/ontologist.py all

      # ── Step 2: Extract proof objects from LaTeX ───────────────────
      - name: Extract proof objects from LaTeX
        run: python3 .github/scripts/extract_proof_objects.py

      # ── Step 3: Generate Lean stubs for new objects ────────────────
      - name: Generate Lean stubs
        run: python3 .github/scripts/generate_lean_stubs.py

      # Python, elan, and Lean toolchain are pre-installed in the CI image.
      - name: Cache Lean build artifacts
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml') }}
          restore-keys: |
            lean-${{ runner.os }}-

      # ── Step 5: Build Lean project ─────────────────────────────────
      - name: Build Lean project
        working-directory: lean
        run: |
          lake update
          lake build 2>&1 | tee ../build.log
        continue-on-error: true

      # ── Step 6: Update proof status from build log ─────────────────
      # Uses proof-status-tracking skill workflow.
      - name: Update proof status
        run: python3 .github/scripts/update_proof_status.py --build-log build.log

      # ── Step 7: Consistency loop — if build failed, re-scan glossary
      # The Ontologist re-evaluates for type mismatches when lake build
      # reports errors.  This implements the design doc's consistency loop.
      - name: Consistency check (re-scan on build failure)
        if: failure()
        run: |
          echo "⚠️  Build failed — running Ontologist consistency check"
          python3 .github/scripts/ontologist.py scan --output glossary-recheck.json
          echo "Checking for type mismatches in build log..."
          grep -i "type mismatch\|universe\|expected.*got" build.log || echo "No type mismatches found"

      # ── Step 8: Check for sorry and flag for review ────────────────
      # Any sorry in the codebase triggers a note for the agent review
      # pipeline to include Formalizer and Ontologist reviews.
      - name: Check sorry status
        run: |
          SORRY_COUNT=$(grep -rc "sorry" lean/QOU/*.lean 2>/dev/null | awk -F: '{s+=$2} END {print s}')
          echo "Total sorry occurrences: ${SORRY_COUNT}"
          if [ "${SORRY_COUNT}" -gt 0 ]; then
            echo "⚠️  ${SORRY_COUNT} sorry markers remain — Formalizer review recommended"
            echo "SORRY_COUNT=${SORRY_COUNT}" >> "$GITHUB_ENV"
          fi

      # ── Step 9: Commit updated manifests ───────────────────────────
      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proof-objects.json glossary.json mapping.json
          git diff --staged --quiet || git commit -m "chore: update proof-objects.json and glossary from Lean build"
          git push || true
