# Section-title + structure audit (chapter-scoped).
#
# Two reviews, per docs/structural-framework.md:
#   - MACHINE review — qa-section-title-audit.ts flags auto-split
#     " : <tag>" title artifacts, trailing colons, over-long / compound
#     titles, and structure findings (depth/band/balance P1–P6).
#   - AGENT review — story-coherence verdicts live in the `agent` block
#     of each per-paper sidecar (content/<paper>/section-title-audit.qa.json),
#     re-opened as the chapter manifest hash drifts.
#
# This workflow gates the MACHINE side (warn-only on the current
# artifact baseline) and HARD-gates sidecar freshness, so a chapter
# manifest can't change without the committed sidecars being updated.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "content/**/*.ts"
      - "content/pipeline/qa-section-title-audit.ts"
      - "content/*/section-title-audit.qa.json"
      - ".github/workflows/section-title-audit.yml"
  push:
    branches: [main]
    paths:
      - "content/**/*.ts"
      - "content/pipeline/qa-section-title-audit.ts"
      - ".github/workflows/section-title-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.30"

      - name: Install content deps
        run: |
          cd content
          bun install --frozen-lockfile 2>/dev/null || bun install

      # MACHINE review. Warn-only while the chapter-restructure artifact
      # baseline (23 " : <tag>" titles) is still being reorged; flip to a
      # hard gate (drop continue-on-error) once docs/structural-reorg-plan.md
      # lands and the audit exits 0.
      - name: Machine review — titles + structure
        continue-on-error: true
        run: bun run content/pipeline/qa-section-title-audit.ts --report-only

      # HARD GATE: sidecars must be regenerated when a manifest changes.
      - name: Sidecars up to date
        run: |
          bun run content/pipeline/qa-section-title-audit.ts --report-only --write-sidecar
          if ! git diff --exit-code -- content/*/section-title-audit.qa.json; then
            echo "::error::section-title-audit sidecars are stale. Run: bun run content/pipeline/qa-section-title-audit.ts --report-only --write-sidecar"
            exit 1
          fi
