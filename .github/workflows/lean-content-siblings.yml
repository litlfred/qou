name: lean-content-siblings

# Two gates for content-block `.lean` siblings (content/<paper>/<chapter>/*.lean),
# which live OUTSIDE the CI-built `lake build QOU` target. They are never
# compile-checked by the library build and accumulate latent breakage: a
# type-erroring `:= trivial`
# value (trivial : True cannot inhabit a data type), an `import` after a `/-!`
# module docstring (illegal Lean-4 import order), or — the class this gate's
# compile job catches — a sibling that *never compiled standalone at all* (bad
# imports, orphaned bodies, renamed Mathlib modules). None of these is caught by
# the vacuity audit (which keys on a True *conclusion*) nor by the library build.
#
# NOTE (bean qou-orph, 2026-08-08): this header used to explain the exclusion as
# "the qou lakefile globs srcDir='.' = the lean/ tree only", which reads as
# though everything INSIDE lean/ is covered by `lake build`. It is not. `globs`
# is unset, so Lake's default target is the single module `QOU` plus its
# transitive import closure — 47% of the modules under lean/QOU/ are imported by
# nothing and are never compiled either. That is a separate problem with its own
# gate (.github/workflows/lean-orphan-gate.yml); this workflow remains only about
# siblings outside the lean/ tree.
#
# Jobs:
#   gate — bun-only, no Lean toolchain:
#     (a) diff-scoped lean-vacuity-axiom-audit `--fail-on` on the two
#         guaranteed-error (compile-validity) classes for the .lean files a PR
#         changes. Diff-scoping is deliberate: ~40 pre-existing import-order
#         defects exist tree-wide (docs/audits/2026-06-07-conjecture-triage.md
#         §K); a whole-tree gate would block every PR. This blocks NEW drift.
#         The high-recall vacuity categories stay warn-only (agent-adjudicated).
#     (b) agent-inspection ledger gate (`--check-ledger`): fails if a .lean
#         file THIS PR changes carries a vacuity candidate lacking a fresh
#         agent verdict in docs/audits/lean-vacuity-review-ledger.json (a
#         verdict goes stale the moment the .lean changes). Diff-scoped (not
#         whole-corpus) so main's pre-existing inspection backlog never blocks
#         an unrelated PR.
#
#   content-sibling-compile — `lean`-direct type-check of the content-sibling
#     .lean files a PR changes (outside the lean/ library tree). Catches the
#     "never compiled standalone" class at PR time instead of months later.
#     Infra failures (no toolchain / no olean cache) are NEUTRAL-SKIPPED so a
#     cold runner never false-blocks; only a genuine `lean` type error fails.

# SCOPE (bean qou-lsib, 2026-09-07) — why this takes an input.
#
# Both jobs used to compute their file list from `origin/${{ github.base_ref }}`
# unconditionally. `github.base_ref` is EMPTY for `workflow_dispatch`, which is
# this workflow's ONLY trigger, so the diff resolved to `origin/...HEAD` and git
# answered `fatal: bad revision`. Because the assignment was
# `files=$(git diff ... | tr ...)`, the pipeline's status was `tr`'s — zero — so
# `set -e` never fired. Every downstream step was `if: files != ''`, so both
# jobs reported GREEN having compiled NOTHING. Not "diff-scoped so it misses the
# known failures": it checked zero files on every run it could ever have.
#
# `scope` now selects explicitly, and a run that cannot compute a list FAILS
# rather than passing empty — a green no-op is the exact bug being fixed here.
#
#   scope=all      every content sibling in the tree (the default: dispatch has
#                  no PR context, so whole-tree is the only meaningful default)
#   scope=changed  only siblings differing from `base`; requires `base`, or a
#                  `pull_request` trigger if auto-triggers ever return
#
# Auto-triggers stay off (owner directive 2026-06-30, Actions billing). This
# widens what a dispatch covers; it does not re-enable anything.
#
# The STRONGER local check is `scripts/lean-content-sweep.sh` (bean qou-56qy):
# it compiles against the library SOURCE via a shadow tree, catching siblings
# that are green against a stale olean snapshot and broken against main. What
# runs here is the cache-based check, which is what a CI runner can afford.

on:
  # CI auto-triggers disabled (owner directive 2026-06-30): Actions billing.
  workflow_dispatch:
    inputs:
      scope:
        description: "all = every content sibling; changed = only those differing from base"
        type: choice
        options: [all, changed]
        default: all
      base:
        description: "Base ref for scope=changed (e.g. origin/main). Ignored when scope=all."
        type: string
        default: ""

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Compute .lean files in scope
        id: changed
        env:
          SCOPE: ${{ inputs.scope || 'all' }}
          BASE_INPUT: ${{ inputs.base }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          source scripts/lib/ci-lean-scope.sh
          files=$(lean_scope_files "$SCOPE" "$BASE_INPUT" "$PR_BASE" all)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE — $(printf '%s' "$files" | wc -w) .lean file(s)"
      # `--fail-on` only under scope=changed. Whole-tree it is REPORT-ONLY:
      # ~40 pre-existing import-order defects exist tree-wide
      # (docs/audits/2026-06-07-conjecture-triage.md §K), so a whole-tree
      # --fail-on would be red for reasons unrelated to any given run. The
      # report still prints them; it just does not pretend to be a gate.
      - name: Compile-validity gate (scope=changed)
        if: steps.changed.outputs.files != '' && (inputs.scope || 'all') == 'changed'
        run: |
          bun run content/pipeline/lean-vacuity-axiom-audit.ts \
            ${{ steps.changed.outputs.files }} \
            --quiet \
            --fail-on proof-no-trivial-type-mismatch,lean-import-after-content
      - name: Compile-validity report (scope=all, not a gate)
        if: steps.changed.outputs.files != '' && (inputs.scope || 'all') == 'all'
        run: |
          bun run content/pipeline/lean-vacuity-axiom-audit.ts \
            ${{ steps.changed.outputs.files }} || true
      - name: Agent-inspection ledger gate (scope=changed)
        if: steps.changed.outputs.files != '' && (inputs.scope || 'all') == 'changed'
        run: |
          # Diff-scoped (like the compile-validity gate above): fail only if a
          # .lean file THIS PR changes carries a vacuity candidate lacking a
          # fresh agent verdict. A whole-corpus check would couple every PR's
          # CI to the global inspection backlog (main may carry uninspected
          # candidates at any time), blocking unrelated PRs — the same reason
          # the compile-validity gate is diff-scoped.
          bun run content/pipeline/lean-vacuity-axiom-audit.ts \
            ${{ steps.changed.outputs.files }} \
            --quiet \
            --check-ledger docs/audits/lean-vacuity-review-ledger.json

  content-sibling-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute content-sibling .lean files in scope
        id: changed
        env:
          SCOPE: ${{ inputs.scope || 'all' }}
          BASE_INPUT: ${{ inputs.base }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          source scripts/lib/ci-lean-scope.sh
          # siblings only — EXCLUDING the lean/ library tree, which lake owns.
          files=$(lean_scope_files "$SCOPE" "$BASE_INPUT" "$PR_BASE" siblings)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE — $(printf '%s' "$files" | wc -w) content-sibling .lean file(s)"
      - name: Install elan
        if: steps.changed.outputs.files != ''
        run: |
          set -o pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Cache oleans (mathlib + QOU)
        if: steps.changed.outputs.files != ''
        uses: actions/cache@v4
        with:
          path: |
            .lake
            content/quantum-observable-universe/lean/.lake
          key: lean-cache-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            lean-cache-${{ runner.os }}-
      - name: Restore olean cache (GitHub Release → orphan-branch fallback)
        if: steps.changed.outputs.files != ''
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          ./scripts/lean-cache-restore.sh \
            || echo "cache restore unavailable — compile step will neutral-skip if oleans missing"
      - name: lean-direct type-check changed content siblings
        if: steps.changed.outputs.files != ''
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          # Neutral-skip on infra failure (no toolchain / no olean cache) — that
          # is a runner problem, not a PR defect. Only a real `lean` type error
          # from lean-verify.sh (exit 1) fails the gate.
          if ! command -v lean >/dev/null 2>&1; then
            echo "::warning::lean toolchain unavailable — skipping content-sibling compile check"
            exit 0
          fi
          # Root Lake workspace: the restore lands oleans under $REPO_ROOT/.lake
          # (NOT the QOU package subdir), matching lean-cache-restore.sh's own
          # success count.
          mathlib_oleans=$(find .lake/packages/mathlib \
                            -name '*.olean' 2>/dev/null | wc -l | tr -d ' ')
          if [ "${mathlib_oleans:-0}" -lt 2000 ]; then
            echo "::warning::olean cache unavailable (${mathlib_oleans:-0} mathlib oleans) — skipping content-sibling compile check"
            exit 0
          fi
          # lean-verify-siblings.sh fails ONLY on genuine errors (parse /
          # elaboration / type). A file importing a Mathlib or QOU module
          # outside the cached olean cone (the cache ships only QOU's
          # dependency subset, not all of Mathlib) is neutral-skipped with a
          # ::warning so a cache-subset miss never false-blocks the PR.
          scripts/lean-verify-siblings.sh ${{ steps.changed.outputs.files }}
