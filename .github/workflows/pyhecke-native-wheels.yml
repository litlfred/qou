name: pyhecke-native wheels

# Build pyhecke_native wheels for Linux/macOS/Windows × Python 3.10–3.12
# using cibuildwheel.  On push to main, also publish to GitHub Releases
# (PyPI publication is opt-in — flip `publish-pypi: true` and add the
# PYPI_API_TOKEN secret to enable).
#
# Manual trigger: gh workflow run "pyhecke-native wheels"
# Auto-trigger:   push to main that touches tools/pyhecke-native/
#                 or tools/hecke-engine/ (the underlying Rust crate)

on:
  workflow_dispatch:
    inputs:
      publish-pypi:
        description: 'Publish to PyPI (requires PYPI_API_TOKEN secret)'
        required: false
        default: 'false'
  push:
    branches: [main]
    paths:
      - 'tools/pyhecke-native/**'
      - 'tools/hecke-engine/**'
      - '.github/workflows/pyhecke-native-wheels.yml'

concurrency:
  group: pyhecke-native-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      # Linux: GMP/MPFR are pre-installed on ubuntu-24.04 runners.
      # macOS: install via brew.
      # Windows: rug crate has its own GMP build via mpir; cibuildwheel
      #          handles the toolchain.
      - name: Install GMP/MPFR (macOS)
        if: matrix.os == 'macos-14'
        run: brew install gmp mpfr

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: 'cp310-* cp311-* cp312-*'
          # Skip 32-bit and musl (rug needs full GMP).
          CIBW_SKIP: '*-musllinux_* *-win32 *-manylinux_i686'
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y gmp-devel mpfr-devel || \
              apt-get install -y libgmp-dev libmpfr-dev
          CIBW_ARCHS_LINUX: 'x86_64'
          CIBW_ARCHS_MACOS: 'arm64'
          CIBW_ARCHS_WINDOWS: 'AMD64'
          # maturin builds Rust extensions; this sets it as the build
          # backend for cibuildwheel.
          CIBW_BUILD_FRONTEND: 'build'
          # Smoke test: import the module + call mn_chi (cheap).
          CIBW_TEST_COMMAND: >
            python -c "import pyhecke_native;
            assert pyhecke_native.mn_chi([3], [2,1]) == 1, 'mn_chi sanity';
            print('pyhecke_native', pyhecke_native.__version__, 'OK')"
        with:
          package-dir: tools/pyhecke-native
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish_release:
    name: Attach wheels to GitHub Release
    needs: build_wheels
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          merge-multiple: true

      - name: List wheels
        run: ls -la wheelhouse/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pyhecke-native-${{ github.sha }}
          name: pyhecke-native ${{ github.sha }}
          body: |
            Automatic wheel build for `pyhecke_native` from commit
            ${{ github.sha }}.

            Install: `pip install pyhecke_native --find-links <release-url>`

            See `tools/pyhecke-native/README.md` for usage.
          files: wheelhouse/*.whl
          draft: true  # human review before publishing release
          prerelease: true

  publish_pypi:
    name: Publish to PyPI (manual / gated)
    needs: build_wheels
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish-pypi == 'true'
    runs-on: ubuntu-latest
    environment: pypi  # requires PYPI_API_TOKEN secret in `pypi` env
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          # PYPI_API_TOKEN bound from the `pypi` GitHub Environment
          # (configure at Settings → Environments → pypi).
