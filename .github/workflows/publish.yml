# Build the LaTeX paper (PDF + Markdown + HTML) and publish to gh-pages.
#
# Triggers
# ─────────
#   push            – every commit to every branch
#   workflow_dispatch – manual run; optionally override the publish target branch
#
# Published artefacts (deployed to the target branch, default: gh-pages)
# ────────────────────────────────────────────────────────────────────────
#   quantum-observable-universe.pdf        compiled PDF
#   quantum-observable-universe-diff.pdf   latexdiff vs merge-base with main (feature branches only)
#   quantum-observable-universe.md         Pandoc GitHub-Flavoured Markdown
#   index.html                             HTML page with dark/light mode, TOC, definition links
#   qa.html                                QA report from build warnings (feature branches only)
#
# Preview builds
# ──────────────
#   Pushes to the main branch deploy to the root of gh-pages.
#   Pushes to any other branch deploy to  drafts/<branch-name>/  so that
#   every feature branch / PR gets its own preview URL.

name: Build & Publish

on:
  push:                   # every commit on every branch
  workflow_dispatch:
    inputs:
      publish_branch:
        description: >
          Branch to push the built artefacts to.
          Leave blank to use the default (gh-pages).
        required: false
        default: 'gh-pages'
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents:       write   # required to push to the gh-pages branch
  pull-requests:  write   # required to comment on PRs with preview URLs

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # ── 0. Checkout ────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history needed for merge-base diff

      - name: Fetch main branch for diff
        if: github.ref_name != 'main'
        run: git fetch origin main

      # ── 1. Compile LaTeX → PDF ─────────────────────────────────────────────
      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Capture LaTeX build warnings
        if: always()
        run: |
          # Extract warnings from the LaTeX log (if it exists)
          if [ -f main.log ]; then
            grep -iE '^(LaTeX Warning:|Package .* Warning:|Overfull |Underfull |.*Citation .* undefined|.*Reference .* undefined)' main.log \
              > build-warnings.log 2>/dev/null || true
          fi
          # Also capture BibTeX warnings
          if [ -f main.blg ]; then
            grep -iE '^(Warning--|.*error)' main.blg >> build-warnings.log 2>/dev/null || true
          fi
          echo "Captured $(wc -l < build-warnings.log 2>/dev/null || echo 0) warning lines"

      # ── 2. Convert LaTeX → Markdown ────────────────────────────────────────
      - name: Install pandoc, latexpand and latexdiff
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-extra-utils \
            latexdiff

      - name: Flatten \input includes into a single file
        run: latexpand main.tex > main-flat.tex

      - name: Convert flattened LaTeX to GitHub-Flavoured Markdown
        run: |
          pandoc main-flat.tex \
            --from=latex \
            --to=gfm+tex_math_dollars \
            --standalone \
            --wrap=none \
            --output=quantum-observable-universe.md \
            || { echo "::warning::pandoc gfm+tex_math_dollars failed, retrying without math extension"; \
                 pandoc main-flat.tex \
                   --from=latex \
                   --to=gfm \
                   --standalone \
                   --wrap=none \
                   --output=quantum-observable-universe.md \
                   || echo "::warning::pandoc Markdown conversion failed; a stub will be used"; }

          # Safety net: if pandoc produced nothing, create a minimal stub
          if [ ! -s quantum-observable-universe.md ]; then
            printf '# Quantum Observable Universe\n\n> Markdown conversion failed — please see the [PDF](quantum-observable-universe.pdf).\n' \
              > quantum-observable-universe.md
          fi

      # ── 2b. Generate diff against main (feature branches only) ────────────
      - name: Generate latexdiff against main
        if: github.ref_name != 'main'
        run: bash .github/scripts/generate-diff.sh

      - name: Compile diff PDF
        if: github.ref_name != 'main'
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: diff.tex

      # ── 3. Assemble gh-pages site ──────────────────────────────────────────
      - name: Assemble site artefacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site

          cp main.pdf                         _site/quantum-observable-universe.pdf
          cp quantum-observable-universe.md   _site/quantum-observable-universe.md

          # Include diff PDF for feature-branch builds
          if [ -f diff.pdf ]; then
            cp diff.pdf _site/quantum-observable-universe-diff.pdf
          fi

          # ── Generate base HTML with Pandoc ──────────────────────────────────
          pandoc quantum-observable-universe.md \
            --from=gfm+tex_math_dollars \
            --to=html5 \
            --standalone \
            --mathjax \
            --metadata title="Quantum Observable Universe" \
            --output=_site/index-raw.html \
            || echo "::warning::pandoc HTML conversion failed; falling back to static landing page"

          # Fallback landing page if pandoc HTML conversion failed
          if [ ! -s _site/index-raw.html ]; then
            cat > _site/index-raw.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Quantum Observable Universe</title>
          </head>
          <body>
            <h1>Quantum Observable Universe</h1>
            <div class="downloads">
              <a href="quantum-observable-universe.pdf">Download PDF</a>
              <a href="quantum-observable-universe.md">View Markdown</a>
            </div>
          </body>
          </html>
          HTML
          fi

          # ── Enhance HTML with dark mode, TOC, definition links ──────────────
          ENHANCE_ARGS=(
            _site/index-raw.html
            main-flat.tex
            _site/index.html
          )
          if [ "${{ github.ref_name }}" != "main" ]; then
            ENHANCE_ARGS+=(
              --branch "${{ github.ref_name }}"
              --repo   "${{ github.repository }}"
              --sha    "${{ github.sha }}"
              --src-dir "."
            )
          fi
          python3 .github/scripts/generate-html.py "${ENHANCE_ARGS[@]}"

          # Clean up intermediate file
          rm -f _site/index-raw.html

          # ── QA report (feature branches only) ───────────────────────────────
          if [ "${{ github.ref_name }}" != "main" ] && [ -f build-warnings.log ]; then
            python3 .github/scripts/generate-qa.py \
              build-warnings.log \
              _site/qa.html \
              --branch "${{ github.ref_name }}" \
              --repo   "${{ github.repository }}" \
              --sha    "${{ github.sha }}"
          fi

      # ── 4. Deploy to target branch ─────────────────────────────────────────
      # peaceiris/actions-gh-pages automatically creates the publish_branch
      # (default: gh-pages) if it does not already exist, so no manual
      # branch-creation step is required.
      #
      # Feature-branch builds are placed under  drafts/<branch>/  so that
      # every open PR gets its own preview URL without overwriting the main
      # site.  keep_files is enabled so that main deployments preserve the
      # drafts directory and feature-branch deployments preserve each other.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:    ./_site
          publish_branch: ${{ inputs.publish_branch || 'gh-pages' }}
          destination_dir: ${{ github.ref_name != 'main' && format('drafts/{0}', github.ref_name) || '' }}
          keep_files:     true
          commit_message: >
            docs: publish from ${{ github.ref_name }}@${{ github.sha }}

      # ── 5. Comment on PR with preview URL ─────────────────────────────────
      - name: Comment preview link on PR
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Derive the GitHub Pages base URL from the repository metadata
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          pdf_url="${pages_url}/drafts/${{ github.ref_name }}/quantum-observable-universe.pdf"
          diff_url="${pages_url}/drafts/${{ github.ref_name }}/quantum-observable-universe-diff.pdf"
          html_url="${pages_url}/drafts/${{ github.ref_name }}/"
          qa_url="${pages_url}/drafts/${{ github.ref_name }}/qa.html"

          # Repository source links (useful when repo is private)
          repo_url="https://github.com/${{ github.repository }}"
          branch_url="${repo_url}/tree/${{ github.ref_name }}"
          commit_url="${repo_url}/commit/${{ github.sha }}"
          publish_branch="${{ inputs.publish_branch || 'gh-pages' }}"
          source_pdf_url="${repo_url}/tree/${publish_branch}/drafts/${{ github.ref_name }}"

          # Find open PRs whose head branch matches the current ref
          pr_numbers=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ github.ref_name }}" \
            --state open \
            --json number \
            --jq '.[].number')

          for pr in $pr_numbers; do
            # Avoid duplicate comments: skip if we already posted a link
            # for this exact commit
            if gh pr view "$pr" \
                 --repo "${{ github.repository }}" \
                 --json comments \
                 --jq '.comments[].body' \
              | grep -qF "${{ github.sha }}"; then
              echo "PR #${pr} already has a preview comment for this commit – skipping."
              continue
            fi

            gh pr comment "$pr" \
              --repo "${{ github.repository }}" \
              --body "$(cat <<EOF
          📖 **Preview build ready** for commit \`${{ github.sha }}\`

          **Published (gh-pages)**
          | Artefact | Link |
          |----------|------|
          | PDF      | [quantum-observable-universe.pdf](${pdf_url}) |
          | Diff PDF | [quantum-observable-universe-diff.pdf](${diff_url}) |
          | HTML     | [Landing page](${html_url}) |
          | QA Report| [qa.html](${qa_url}) |

          **Source (repo)**
          | Resource | Link |
          |----------|------|
          | Branch   | [${{ github.ref_name }}](${branch_url}) |
          | Commit   | [\`$(echo "${{ github.sha }}" | cut -c1-7)\`](${commit_url}) |
          | Source PDFs | [drafts/${{ github.ref_name }}](${source_pdf_url}) |
          EOF
          )"
            echo "Commented on PR #${pr}."
          done
