name: docs-site

# Builds the qou documentation site (just-the-docs over `docs/`) and publishes it
# to the `gh-pages` branch under `docs/`.
#
# MANUAL-ONLY, AND THAT IS NOT AN OVERSIGHT.
#
# CI auto-triggers are disabled repo-wide under the owner directive of
# 2026-06-30 (GitHub Actions billing causes 2-3 s setup-phase failures on every
# push). `build.yml` carries the same `workflow_dispatch:`-only shape and the
# same note. Do NOT add a `push:` trigger here to "make it automatic" — the
# platform's own docs-site.yml is push-triggered because that repo's billing is
# not in this state, and copying that trigger across is the mistake this comment
# exists to prevent.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to gh-pages (false = build and upload an artifact only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Front matter is injected into a STAGING copy. Jekyll renders a .md only
      # if it has front matter; 3037 of 3038 here do not, and `defaults:` does
      # not help because a file without front matter is not a page. The repo's
      # dated audit records are deliberately left unmodified.
      # 🛑 THE STAGE DIR MUST BE INSIDE THE WORKSPACE. It was `$RUNNER_TEMP`
      # and run 36265455690 FAILED because of it:
      #
      #     Source: /github/workspace//github/runner_temp/docs-stage
      #     Error: No such file or directory @ dir_chdir0
      #            - /github/workspace/github/runner_temp/docs-stage
      #
      # `actions/jekyll-build-pages` runs in a DOCKER CONTAINER with the workspace
      # mounted at `/github/workspace`, and it resolves `source:` RELATIVE to that
      # mount — so an absolute host path outside the workspace is concatenated
      # onto it and cannot exist. Anything handed to that action must be a
      # workspace-relative path.
      #
      # The failure was not confined to the path, which is why it is worth the
      # comment: with the source wrong, Jekyll never read our `_config.yml` and
      # fell back to its default theme ("Theme: jekyll-theme-primer" in the log),
      # so `remote_theme: just-the-docs` silently did not apply either. One
      # mistake, two symptoms, and the second would have been easy to misdiagnose
      # as a `remote_theme` problem.
      - name: Stage docs with injected front matter
        run: |
          python3 scripts/docs-site-frontmatter.py --check
          python3 scripts/docs-site-frontmatter.py --stage ./_docs-stage
          # The generator copies docs/ wholesale, so `_config.yml` is already
          # there; this is belt-and-braces in case the ignore list ever grows.
          cp docs/_config.yml ./_docs-stage/_config.yml
          test -f ./_docs-stage/_config.yml
          test -f ./_docs-stage/index.md

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_docs-stage
          destination: ./_site

      # Fail loudly rather than publishing a site that silently used the wrong
      # theme: run 36265455690 produced `jekyll-theme-primer` output from a
      # mis-resolved source, and only the traceback said so.
      - name: Assert the site built with our config
        run: |
          set -euo pipefail
          test -d ./_site || { echo "no _site"; exit 1; }
          n=$(find ./_site -name '*.html' | wc -l)
          echo "rendered HTML pages: $n"
          # A catastrophe floor only. The REAL check is per-source coverage in the
          # next step: run 36266675464 passed a `>2000` assertion with 3017 pages
          # from 3082 sources, so a page count cannot see a 65-page gap.
          [ "$n" -gt 2500 ] || { echo "catastrophic: only $n pages from 3082 sources"; exit 1; }
          grep -rqi 'just-the-docs\|just_the_docs' ./_site/assets 2>/dev/null \
            || grep -rqi 'just-the-docs' ./_site --include='*.html' -m1 \
            || { echo "just-the-docs theme not detected in output"; exit 1; }
          echo "theme + catastrophe-floor assertions passed"

      # Per-SOURCE coverage: which staged .md produced no page at all?
      # Reporting only on this run — the floor is set from what this measures,
      # rather than guessed, because a floor above the true value fails
      # spuriously and one below it lets pages vanish silently. Bean qou-gkrt.
      - name: Report per-source page coverage
        run: |
          set -euo pipefail
          python3 scripts/docs-site-coverage.py \
            --stage ./_docs-stage --site ./_site --list 60

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ./_site
          retention-days: 7

      # gh-pages currently serves the paper build's output at the root. This
      # writes only under docs/ so the two can coexist; `publish.yml` owns the
      # root and this must not clobber it.
      - name: Publish to gh-pages/docs
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth 1
          git worktree add /tmp/ghp origin/gh-pages
          rm -rf /tmp/ghp/docs
          mkdir -p /tmp/ghp/docs
          cp -r ./_site/. /tmp/ghp/docs/
          touch /tmp/ghp/.nojekyll
          cd /tmp/ghp
          git add -A docs .nojekyll
          git commit -m "docs-site: rebuild from ${GITHUB_SHA::12}" || { echo "no change"; exit 0; }
          git push origin HEAD:gh-pages
