name: pyhecke

on:
  push:
    branches: [main]
    paths:
      - 'tools/pyhecke/**'
      - 'tools/pyhecke-native/**'
      - 'tools/hecke-engine/**'
      - '.github/workflows/pyhecke.yml'
  pull_request:
    paths:
      - 'tools/pyhecke/**'
      - 'tools/pyhecke-native/**'
      - 'tools/hecke-engine/**'
      - '.github/workflows/pyhecke.yml'
  workflow_dispatch: {}

concurrency:
  group: pyhecke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Rust (stable) — for pyhecke-native wheel build
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/hecke-engine
            tools/pyhecke-native

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build + install pyhecke-native wheel
        working-directory: tools/pyhecke-native
        run: |
          maturin build --release --interpreter python${{ matrix.python-version }}
          pip install --force-reinstall target/wheels/pyhecke_native-*.whl

      - name: Install pyhecke (test extras)
        working-directory: tools/pyhecke
        run: pip install -e ".[test]"

      - name: Run pytest (with native wheel — exercises test_native.py)
        working-directory: tools/pyhecke
        run: pytest -v

      - name: Run hecke-engine Rust lib tests (anchor + GB-NF tests)
        working-directory: tools/hecke-engine
        run: cargo test --lib --release

      - name: Validate all certificates against schema
        run: |
          python <<'PY'
          import json, sys
          from pathlib import Path
          from pyhecke import schema as pyhecke_schema
          root = Path("tools/hecke-engine")
          n, failed = 0, []
          for p in sorted(root.glob("certificate-*.json")):
              n += 1
              try:
                  with p.open() as f:
                      pyhecke_schema.validate("certificate", json.load(f))
              except Exception as e:
                  failed.append((p.name, str(e)[:200]))
          print(f"{n - len(failed)}/{n} certificates pass schema")
          for name, err in failed:
              print(f"  FAIL {name}: {err}")
          sys.exit(1 if failed else 0)
          PY
