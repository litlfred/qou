name: word-provenance-gate

# Fails a PR that hardcodes a BRAID WORD instead of obtaining it from the
# producer supposed to emit it.
#
# WHY THIS EXISTS
# Three times in two days, on one bean (`qou-hu1f`), a claim about which word a
# route traces was made by READING that route's source instead of instrumenting
# it, and was wrong every time. The third instance is the one a gate reaches:
#
#     nf_seq = [("s", 0), ("S", 1)] * 3 + [
#         ("s", 0), ("A", 0), ("A", 1), ("s", 0), ("s", 0)]
#
# was carried in `nf_vs_canonical_word_order_probe.py` as "the word
# `build_atom_nf_mp` traces". It omitted the electron crossing `build_atom_nf`
# adds, so the probe asserted "same multiset, different order" against a word
# whose trace it could not reproduce — and it was GREEN IN CI for a day, which
# is what kept the 5.045e-4 A=1 residual mis-attributed to the word ordering
# when it was ordering and electron nearly cancelling.
#
# Writing down *why* a literal is trustworthy is the moment the author looks for
# the electron. That is the whole mechanism.
#
# WHAT IT CATCHES
#   A literal sequence of crossing letters (2- or 3-tuples, including `+`/`*`
#   combinations) assigned to a name, in a file that also references a word
#   producer or a Markov-trace entry point.
#
# WHAT IT DOES NOT CATCH
#   Prose. Two of the three instances were sentences in a bean and a docstring.
#   No static check reaches those; the discipline is still the rule.
#
# DIFF-SCOPED on purpose, exactly as `probe-float64-gate.yml` is. Measured
# 2026-09-05: 20 pre-existing word literals under `computations/`, essentially
# all of them legitimate first-principles constructions that need a one-line
# annotation. Annotating them in bulk would mean asserting provenance nobody has
# checked — which is the very defect this gate exists to prevent — so the
# backlog is left to whoever owns each file. This gate stops the number growing.
#
# Escape hatch: `# word-literal-ok: <reason>` on the assignment, or the line
# above it. It must never read "transcribed from <producer>": that IS the
# defect, and the fix is to call the producer.

on:
  # CI auto-triggers disabled (owner directive 2026-06-30: Actions billing).
  # Runnable on demand, and locally:
  #   python3 scripts/word-provenance-gate.py --diff <changed .py files>
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detector self-test (known positive)
        # Runs on every invocation anyway; called out separately so a detector
        # that has stopped matching is legible in the log rather than buried.
        # Per bean `qou-5pgl`: a detector without a known positive can report
        # the whole class clean.
        run: python3 scripts/word-provenance-gate.py --selftest
      - name: Compute changed .py files
        id: changed
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          files=$(git diff --name-only --diff-filter=d "$base"...HEAD -- '*.py' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "changed .py files: ${files:-<none>}"
      - name: Fail on new hardcoded word literals
        if: steps.changed.outputs.files != ''
        # Paths outside `computations/` are ignored by the script, so passing the
        # PR's whole .py diff is safe.
        run: |
          python3 scripts/word-provenance-gate.py --diff ${{ steps.changed.outputs.files }}
      - name: Survey (informational, never fails)
        run: python3 scripts/word-provenance-gate.py
