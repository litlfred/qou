# Deploy Lean MCP server to remote host after image build.
#
# Triggers:
#   - After build-lean-mcp.yml succeeds (automatic CD)
#   - Manual dispatch (for forced redeployment)
#
# Requires these repository secrets:
#   DEPLOY_HOST:     IP or hostname of the remote server
#   DEPLOY_USER:     SSH user on the remote server
#   DEPLOY_SSH_KEY:  Private SSH key for the remote server
#   DEPLOY_PATH:     Path to the qou repo on the remote server (e.g. /opt/qou)
#
# What it does:
#   1. SSH to the remote host
#   2. Pull latest code (for config changes)
#   3. Regenerate config from lean-mcp.config.json
#   4. Pull new Docker image
#   5. Restart services with zero downtime

name: Deploy Lean MCP

on:
  workflow_run:
    workflows: ["Build Lean MCP Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH || '/opt/qou' }}

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Regenerating config ==="
            # Only regenerate if .env doesn't exist (preserves secrets)
            if [ ! -f deploy/.env ]; then
              ./deploy/generate-config.sh --ci
            else
              # Always regenerate Caddyfile (no secrets in it)
              cd deploy
              if [ -f Caddyfile.template ]; then
                source .env
                LEAN_MCP_DOMAIN="$LEAN_MCP_DOMAIN" \
                LEAN_MCP_INTERNAL_PORT="$LEAN_MCP_INTERNAL_PORT" \
                  envsubst '${LEAN_MCP_DOMAIN} ${LEAN_MCP_INTERNAL_PORT}' \
                  < Caddyfile.template > Caddyfile
              fi
              cd ..
            fi

            echo "=== Pulling new images ==="
            cd deploy
            docker compose pull lean-mcp

            echo "=== Restarting services ==="
            docker compose up -d --remove-orphans

            echo "=== Verifying ==="
            sleep 5
            docker compose ps
            echo ""
            echo "Deploy complete."
