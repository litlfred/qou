# Build and push the Paper Assistant Docker image to GHCR.
#
# This is the UNIFIED image used by:
#   - Folio deployment (folio.litlfred.org) — MCP server + viewer
#   - publish.yml — PDF build, HTML generation, PR previews
#   - lean-build.yml — content pipeline + Lean proof status
#   - blueprint.yml — LeanBlueprint + doc-gen4
#   - Local hooks — render-on-change.sh, render-pre-commit.sh (Docker fallback)
#
# Triggers on:
#   - Push to main touching content, Lean, MCP server, Dockerfile, or CI scripts
#   - Manual dispatch
#   - Weekly (to pick up Mathlib cache + TeX Live security updates)
#
# The self-updater on the folio server polls for new image digests
# and auto-deploys.

name: Build Paper Assistant Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'  # Weekly Sunday 06:00 UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/paper-assistant

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
