# Build and push the Lean MCP server Docker image to GHCR.
#
# Triggers on:
#   - Push to main touching lean/ files or lakefile.toml
#   - Manual dispatch
#   - Weekly (to pick up Mathlib cache updates)
#
# The image is used by the remote MCP server deployment.
# Watchers (docker compose with auto-update) pull new images automatically.

name: Build Lean MCP Image

on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - '.github/docker/Dockerfile.lean-mcp'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'  # Weekly Sunday 06:00 UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/lean-mcp

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.lean-mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
