# Build and publish the QOU CI Docker image to GitHub Container Registry.
#
# Triggers:
#   - Push to main when Dockerfile or lean-toolchain changes
#   - Weekly (Monday 04:00 UTC) to pick up base image security updates
#   - Manual dispatch
#
# The image is published to ghcr.io/<owner>/qou-ci:latest (and :sha-<short>).

name: CI Docker Image

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/Dockerfile'
      - 'lean/lean-toolchain'
  schedule:
    - cron: '0 4 * * 1'   # Weekly Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/qou-ci

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Lean toolchain version
        id: toolchain
        run: |
          TC=$(cat lean/lean-toolchain)
          echo "version=${TC}" >> "$GITHUB_OUTPUT"
          echo "Lean toolchain: ${TC}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          push: true
          build-args: |
            LEAN_TOOLCHAIN=${{ steps.toolchain.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
