<rect x="0" y="0" width="960" height="480" rx="14" fill="#0d1326"/>
<text x="480.0" y="34.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Equation (4): Light, the Two-Ring Electron, and the Three-Ring Proton Core</text>
<text x="480.0" y="56.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Combining two light braids produces a linked two-ring electron and three interlocked proton rings</text>
