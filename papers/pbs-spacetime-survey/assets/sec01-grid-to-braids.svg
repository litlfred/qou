<text x="231.0" y="128.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Assumes an invisible coordinate box (t, x, y, z)</text>
