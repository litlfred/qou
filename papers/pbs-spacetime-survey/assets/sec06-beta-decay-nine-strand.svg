<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
<title>Nine-Strand Neutron Decay and Energy Release</title>
<defs><marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="460" rx="14" fill="#0d1326"/>
<text x="480.0" y="34.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Equation (8a): Neutron Decay Requires All Nine Participating Strands</text>
<text x="480.0" y="56.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Treating the neutron alone misses half the energy (0.33 MeV); coupling the 6 outgoing lepton strands gives 0.764 MeV</text>
<rect x="36.0" y="80.0" width="500.0" height="348.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="286.0" y="108.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">6 Outgoing Lepton Strands + 3 Nucleon Strands</text>
<rect x="64.0" y="126.0" width="208.0" height="28.0" rx="5" fill="#182444" stroke="#38bdf8" stroke-width="1.0"/>
<text x="168.0" y="145.0" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Electron + antineutrino + loop</text>
<rect x="324.0" y="126.0" width="134.0" height="28.0" rx="5" fill="#182444" stroke="#f59e0b" stroke-width="1.0"/>
<text x="391.0" y="145.0" fill="#f59e0b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Neutron → Proton</text>
<line x1="78.0" y1="164.0" x2="78.0" y2="344.0" stroke="#38bdf8" stroke-width="3.0" stroke-linecap="round" opacity="0.75"/>
<line x1="114.0" y1="164.0" x2="114.0" y2="344.0" stroke="#38bdf8" stroke-width="3.0" stroke-linecap="round" opacity="0.75"/>
<line x1="150.0" y1="164.0" x2="150.0" y2="344.0" stroke="#38bdf8" stroke-width="3.0" stroke-linecap="round" opacity="0.75"/>
<line x1="186.0" y1="164.0" x2="186.0" y2="344.0" stroke="#38bdf8" stroke-width="3.0" stroke-linecap="round" opacity="0.75"/>
<line x1="222.0" y1="164.0" x2="222.0" y2="344.0" stroke="#38bdf8" stroke-width="3.0" stroke-linecap="round" opacity="0.75"/>
<line x1="390.0" y1="164.0" x2="390.0" y2="344.0" stroke="#f59e0b" stroke-width="4.0" stroke-linecap="round"/>
<line x1="438.0" y1="164.0" x2="438.0" y2="344.0" stroke="#f59e0b" stroke-width="4.0" stroke-linecap="round"/>
<line x1="258.0" y1="164.0" x2="258.0" y2="218.0" stroke="#38bdf8" stroke-width="4.0" stroke-linecap="round"/>
<line x1="342.0" y1="164.0" x2="342.0" y2="218.0" stroke="#f59e0b" stroke-width="4.0" stroke-linecap="round"/>
<path d="M 258.0 218.0 C 258.0 254.0, 342.0 254.0, 342.0 290.0" fill="none" stroke="#38bdf8" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 342.0 218.0 C 342.0 254.0, 258.0 254.0, 258.0 290.0" fill="none" stroke="#131c36" stroke-width="12.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 342.0 218.0 C 342.0 254.0, 258.0 254.0, 258.0 290.0" fill="none" stroke="#f59e0b" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="258.0" y1="290.0" x2="258.0" y2="344.0" stroke="#f59e0b" stroke-width="4.0" stroke-linecap="round"/>
<line x1="342.0" y1="290.0" x2="342.0" y2="344.0" stroke="#38bdf8" stroke-width="4.0" stroke-linecap="round"/>
<circle cx="300.0" cy="254.0" r="22.0" fill="none" stroke="#fbbf24" stroke-width="2.0" stroke-dasharray="4 3"/>
<text x="286.0" y="376.0" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Only the under-crossing hands charge from quark to electron;</text>
<text x="286.0" y="398.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">taking the logarithm of loop ratios cancels bystander strands.</text>
<rect x="556.0" y="80.0" width="368.0" height="348.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="740.0" y="108.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Decay Energy Q_β Comparison</text>
<text x="580.0" y="148.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">3-strand neutron alone</text>
<text x="900.0" y="148.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end">0.33 MeV (−58%)</text>
<rect x="580.0" y="160.0" width="310.0" height="22.0" rx="5" fill="#182444" stroke="#2a3b68" stroke-width="1.0"/>
<rect x="580.0" y="160.0" width="120.353" height="22.0" rx="5" fill="#fb7185" stroke="none" stroke-width="1.0"/>
<text x="580.0" y="230.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">9-strand coupled interaction</text>
<text x="900.0" y="230.0" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end">0.764 MeV (−2.37%)</text>
<rect x="580.0" y="242.0" width="310.0" height="22.0" rx="5" fill="#182444" stroke="#2a3b68" stroke-width="1.0"/>
<rect x="580.0" y="242.0" width="278.635" height="22.0" rx="5" fill="#38bdf8" stroke="none" stroke-width="1.0"/>
<text x="580.0" y="312.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Measured in laboratory</text>
<text x="900.0" y="312.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end">0.7823 MeV</text>
<rect x="580.0" y="324.0" width="310.0" height="22.0" rx="5" fill="#182444" stroke="#2a3b68" stroke-width="1.0"/>
<rect x="580.0" y="324.0" width="285.2" height="22.0" rx="5" fill="#34d399" stroke="none" stroke-width="1.0"/>
<text x="740.0" y="396.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Keeping the 0.33 MeV miss unpatched revealed</text>
<text x="740.0" y="414.0" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">that all 9 strands must be included together.</text>
</svg>
