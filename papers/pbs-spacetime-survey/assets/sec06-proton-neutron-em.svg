<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
<title>Proton vs Neutron Electric Energy Without Pion Input</title>
<defs><marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="440" rx="14" fill="#0d1326"/>
<text x="480.0" y="34.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Equation (8b): Electric Energy Inside the Proton vs. Neutron (No Pion Needed)</text>
<text x="480.0" y="56.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Quark-pair charges cancel to zero in the proton (uud) and add to −1/3 in the neutron (udd)</text>
<rect x="40.0" y="82.0" width="420.0" height="260.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="250.0" y="110.0" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Proton (u u d) — Total Charge +1</text>
<line x1="250.0" y1="152.0" x2="182.0" y2="262.0" stroke="#fb7185" stroke-width="3.0" stroke-linecap="round"/>
<line x1="250.0" y1="152.0" x2="318.0" y2="262.0" stroke="#34d399" stroke-width="3.0" stroke-linecap="round"/>
<line x1="182.0" y1="262.0" x2="318.0" y2="262.0" stroke="#34d399" stroke-width="3.0" stroke-linecap="round"/>
<circle cx="250.0" cy="152.0" r="28.0" fill="#182444" stroke="#38bdf8" stroke-width="3.0"/>
<text x="250.0" y="157.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">u (+2/3)</text>
<circle cx="182.0" cy="262.0" r="28.0" fill="#182444" stroke="#38bdf8" stroke-width="3.0"/>
<text x="182.0" y="267.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">u (+2/3)</text>
<circle cx="318.0" cy="262.0" r="28.0" fill="#182444" stroke="#f59e0b" stroke-width="3.0"/>
<text x="318.0" y="267.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">d (−1/3)</text>
<text x="250.0" y="320.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Pair products: (+4/9) + (−2/9) + (−2/9) = 0</text>
<rect x="500.0" y="82.0" width="420.0" height="260.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="710.0" y="110.0" fill="#f59e0b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Neutron (u d d) — Total Charge 0</text>
<line x1="710.0" y1="152.0" x2="642.0" y2="262.0" stroke="#34d399" stroke-width="3.0" stroke-linecap="round"/>
<line x1="710.0" y1="152.0" x2="778.0" y2="262.0" stroke="#34d399" stroke-width="3.0" stroke-linecap="round"/>
<line x1="642.0" y1="262.0" x2="778.0" y2="262.0" stroke="#fb7185" stroke-width="3.0" stroke-linecap="round"/>
<circle cx="710.0" cy="152.0" r="28.0" fill="#182444" stroke="#38bdf8" stroke-width="3.0"/>
<text x="710.0" y="157.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">u (+2/3)</text>
<circle cx="642.0" cy="262.0" r="28.0" fill="#182444" stroke="#f59e0b" stroke-width="3.0"/>
<text x="642.0" y="267.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">d (−1/3)</text>
<circle cx="778.0" cy="262.0" r="28.0" fill="#182444" stroke="#f59e0b" stroke-width="3.0"/>
<text x="778.0" y="267.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">d (−1/3)</text>
<text x="710.0" y="320.0" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Pair products: (−2/9) + (−2/9) + (+1/9) = −1/3</text>
<rect x="40.0" y="358.0" width="880.0" height="62.0" rx="10" fill="#182444" stroke="#fbbf24" stroke-width="1.0"/>
<text x="480.0" y="384.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Electric self-energy difference:   ΔE_EM(p − n) = α × m_proton × (1/9) = 0.761 MeV</text>
<text x="480.0" y="406.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Sits inside the observed [0.76, 1.04] MeV range using (mₑ, q₀) alone — the pion input m_π drops out.</text>
</svg>
