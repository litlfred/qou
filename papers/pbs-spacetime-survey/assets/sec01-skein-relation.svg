<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
<title>The Strand-Swapping Rule Controlled by One Number q</title>
<defs><marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="440" rx="14" fill="#0d1326"/>
<text x="480.0" y="34.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Equation (1): One Number q Controls How Crossing Strands Differ</text>
<text x="480.0" y="56.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Flipping an over-crossing into an under-crossing leaves a straight parallel piece weighted by q - 1/q</text>
<rect x="48.0" y="92.0" width="180.0" height="220.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="138.0" y="120.0" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Over-crossing (σᵢ)</text>
<path d="M 178.0 145.0 C 178.0 210.0, 98.0 210.0, 98.0 275.0" fill="none" stroke="#f59e0b" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 98.0 145.0 C 98.0 210.0, 178.0 210.0, 178.0 275.0" fill="none" stroke="#131c36" stroke-width="13.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 98.0 145.0 C 98.0 210.0, 178.0 210.0, 178.0 275.0" fill="none" stroke="#38bdf8" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="138.0" y="298.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Left strand on top</text>
<text x="258.0" y="208.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" text-anchor="middle">−</text>
<rect x="288.0" y="92.0" width="180.0" height="220.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="378.0" y="120.0" fill="#f59e0b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Under-crossing (σᵢ⁻¹)</text>
<path d="M 338.0 145.0 C 338.0 210.0, 418.0 210.0, 418.0 275.0" fill="none" stroke="#38bdf8" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 418.0 145.0 C 418.0 210.0, 338.0 210.0, 338.0 275.0" fill="none" stroke="#131c36" stroke-width="13.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 418.0 145.0 C 418.0 210.0, 338.0 210.0, 338.0 275.0" fill="none" stroke="#f59e0b" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="378.0" y="298.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Left strand underneath</text>
<text x="505.0" y="208.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">=</text>
<rect x="538.0" y="170.0" width="146.0" height="68.0" rx="10" fill="#182444" stroke="#fbbf24" stroke-width="2.0"/>
<text x="611.0" y="198.0" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">q − 1/q</text>
<text x="611.0" y="222.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">(zero if q = 1)</text>
<text x="708.0" y="208.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle">×</text>
<rect x="732.0" y="92.0" width="180.0" height="220.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="822.0" y="120.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Uncrossed strands (1)</text>
<line x1="782.0" y1="145.0" x2="782.0" y2="275.0" stroke="#38bdf8" stroke-width="6.0" stroke-linecap="round"/>
<line x1="862.0" y1="145.0" x2="862.0" y2="275.0" stroke="#f59e0b" stroke-width="6.0" stroke-linecap="round"/>
<text x="822.0" y="298.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Straight ahead</text>
<rect x="48.0" y="336.0" width="864.0" height="74.0" rx="10" fill="#182444" stroke="#2a3b68" stroke-width="1.0"/>
<text x="480.0" y="364.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">What happens if you twist two strands twice in a row:   σᵢ² = (q − 1/q) σᵢ + 1</text>
<text x="480.0" y="390.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">At q = 1, two swaps undo each other completely. When q &gt; 1, a double twist leaves a lasting single-twist echo.</text>
</svg>
