<rect x="0" y="0" width="960" height="460" rx="14" fill="#0d1326"/>
<text x="480.0" y="34.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">The Higgs Boson Mass (125.23 GeV) &amp; Force Strengths at High Energy</text>
<text x="480.0" y="56.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Strong force matches at 0.1185 (+0.41%), while single-step weak-mixing evolution misses 0.2312</text>
