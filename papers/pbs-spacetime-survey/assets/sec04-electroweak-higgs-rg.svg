<text x="253.0" y="108.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Higgs Energy Bowl &amp; Radial Mass</text>
