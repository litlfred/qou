<text x="309.0" y="356.0" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Valley radius = 246.22 GeV</text>
<text x="253.0" y="388.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Model Higgs: 125.23 GeV  |  Measured: 125.20 ± 0.11 GeV</text>
<text x="253.0" y="410.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Difference: +0.024% (bowl steepness λ_H = 0.1293)</text>
<rect x="490.0" y="80.0" width="434.0" height="348.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="707.0" y="108.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Force Strengths at the Z-Boson Energy M_Z</text>
<rect x="514.0" y="132.0" width="386.0" height="118.0" rx="10" fill="#182444" stroke="#34d399" stroke-width="2.0"/>
<text x="707.0" y="156.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Strong Force α_s(M_Z) — Close Agreement</text>
<text x="707.0" y="180.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Base proton scale: mₚ (q₀² − 1) = 217.73 MeV</text>
<text x="707.0" y="206.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Evolved to M_Z:   Model 0.1185   vs.   Measured 0.1180</text>
<text x="707.0" y="228.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Difference: +0.41% (within lab uncertainty)</text>
<rect x="514.0" y="268.0" width="386.0" height="138.0" rx="10" fill="#182444" stroke="#fb7185" stroke-width="2.0"/>
<text x="707.0" y="292.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Weak Mixing Angle sin²θ_W(M_Z) — Unsolved Gap</text>
<text x="707.0" y="316.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">High-symmetry starting ratio:  3 / 8 = 0.375</text>
<text x="707.0" y="342.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Short 4-step evolution stops at 0.342  (measured: 0.2312)</text>
<text x="707.0" y="366.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Long single-step evolution hits 0.2312 but drops α_s to 0.074</text>
<text x="707.0" y="388.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">No extra mass threshold is invented to patch the two.</text>
</svg>
