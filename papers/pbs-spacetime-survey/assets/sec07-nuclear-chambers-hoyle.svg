<text x="707.0" y="274.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⁸Be  ──►  2 helium-4  (splits apart in 10⁻¹⁶ s)</text>
<text x="707.0" y="296.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">3 helium-4  ──►  ¹²C  (three-way fusion locks shut)</text>
