<text x="707.0" y="154.0" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">1. Why No Stable Mass-5 Atom Exists</text>
<text x="707.0" y="178.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">2 protons + 3 neutrons (⁵He)  ──►  ⁴He + loose neutron</text>
