<text x="708.0" y="112.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">2. Invisible Differences Simplify to 5 Patterns</text>
