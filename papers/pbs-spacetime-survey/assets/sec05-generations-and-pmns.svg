<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450">
<title>Three Matter Copies and Neutrino Mixing Angles</title>
<defs><marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="450" rx="14" fill="#0d1326"/>
<text x="480.0" y="34.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Three Matter Families (Conditional Twist) &amp; Neutrino Mixing Angles</text>
<text x="480.0" y="56.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">A 3-fold quark-colour twist gives 3 families (vacuum twist open), while crossing strength h sets mixing</text>
<rect x="36.0" y="80.0" width="440.0" height="338.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="256.0" y="108.0" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Why 3 Matter Families? (Proved Twist vs. Open Vacuum)</text>
<rect x="136.0" y="132.0" width="240.0" height="44.0" rx="10" fill="#182444" stroke="#a78bfa" stroke-width="2.0"/>
<text x="256.0" y="159.0" fill="#a78bfa" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">4 Natural Wave Modes on the 4-Holed Surface</text>
<line x1="206.0" y1="176.0" x2="152.0" y2="220.0" stroke="#34d399" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<line x1="306.0" y1="176.0" x2="356.0" y2="220.0" stroke="#fbbf24" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<rect x="56.0" y="226.0" width="198.0" height="96.0" rx="10" fill="#182444" stroke="#34d399" stroke-width="2.0"/>
<text x="155.0" y="250.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">3-Fold Colour Twist</text>
<text x="155.0" y="276.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">3 Quark + 3 Net Lepton</text>
<text x="155.0" y="300.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">(&amp; 9-crossing splits 3+3+3)</text>
<rect x="266.0" y="226.0" width="194.0" height="96.0" rx="10" fill="#182444" stroke="#fbbf24" stroke-width="2.0"/>
<text x="363.0" y="250.0" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Open Vacuum Step</text>
<text x="363.0" y="276.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Select Twist ≠ 0</text>
<text x="363.0" y="300.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">&amp; 4th lepton-pair mass</text>
<text x="256.0" y="354.0" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Heavy tau (m_τ / mₑ = 3477.23): q = 1 wave balance → 3477.44 (+61.6 ppm)</text>
<text x="256.0" y="378.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">Simple 3-strand knots jump 2907 (−16%) to 4524 (+30%); q → 1 lock open</text>
<rect x="496.0" y="80.0" width="428.0" height="338.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="710.0" y="108.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Neutrino Wave Mixing (Zero Free Knobs)</text>
<text x="710.0" y="128.0" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">sin²θ₁₃ = ½ (q₀ − 1/q₀)² = 0.02185</text>
<text x="520.0" y="158.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Reactor angle sin²θ₁₃</text>
<text x="900.0" y="158.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.02185 vs 0.0220 (−0.67%)</text>
<rect x="520.0" y="168.0" width="262.2" height="16.0" rx="4" fill="#38bdf8" stroke="none" stroke-width="1.0"/>
<rect x="520.0" y="188.0" width="264.0" height="16.0" rx="4" fill="#34d399" stroke="none" stroke-width="1.0"/>
<text x="520.0" y="240.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Solar angle sin²θ₁₂</text>
<text x="900.0" y="240.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.298 vs 0.307 (−3.0%)</text>
<rect x="520.0" y="250.0" width="178.62" height="16.0" rx="4" fill="#38bdf8" stroke="none" stroke-width="1.0"/>
<rect x="520.0" y="270.0" width="184.2" height="16.0" rx="4" fill="#34d399" stroke="none" stroke-width="1.0"/>
<text x="520.0" y="322.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Atmospheric sin²θ₂₃</text>
<text x="900.0" y="322.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end">0.489 vs 0.546 (−10.5%)</text>
<rect x="520.0" y="332.0" width="293.28" height="16.0" rx="4" fill="#38bdf8" stroke="none" stroke-width="1.0"/>
<rect x="520.0" y="352.0" width="327.6" height="16.0" rx="4" fill="#34d399" stroke="none" stroke-width="1.0"/>
<rect x="540.0" y="392.0" width="14.0" height="10.0" rx="2" fill="#38bdf8" stroke="none" stroke-width="1.0"/>
<text x="560.0" y="401.0" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Model</text>
<rect x="630.0" y="392.0" width="14.0" height="10.0" rx="2" fill="#34d399" stroke="none" stroke-width="1.0"/>
<text x="650.0" y="401.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Measured (PDG)</text>
