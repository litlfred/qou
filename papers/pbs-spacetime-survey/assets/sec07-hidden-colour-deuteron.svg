<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
<title>Shared Quark Colour Pairings and Nuclear Binding</title>
<defs><marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="960" height="460" rx="14" fill="#0d1326"/>
<text x="480.0" y="34.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Sharing Colour Strands Between Neighboring Protons and Neutrons</text>
<text x="480.0" y="56.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Re-pairing 6 quarks binds heavy hydrogen at 2.265 MeV (+1.8%), while helium-4 still misses half its binding</text>
<rect x="36.0" y="80.0" width="440.0" height="348.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="256.0" y="108.0" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Ways Quarks Can Form a Balanced White Group</text>
<text x="60.0" y="136.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">3 quarks (1 proton/neutron)  —  1 way</text>
<rect x="60.0" y="146.0" width="28.0" height="18.0" rx="4" fill="#94a3b8" stroke="none" stroke-width="1.0"/>
<text x="60.0" y="179.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start">No extra cross-nucleon pairings</text>
<text x="60.0" y="206.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">6 quarks (²H heavy hydrogen)  —  5 ways</text>
<rect x="60.0" y="216.0" width="95.0" height="18.0" rx="4" fill="#38bdf8" stroke="none" stroke-width="1.0"/>
<text x="60.0" y="249.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start">4 shared cross-nucleon pairings</text>
<text x="60.0" y="276.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">9 quarks (³H / ³He)  —  42 ways</text>
<rect x="60.0" y="286.0" width="195.0" height="18.0" rx="4" fill="#fbbf24" stroke="none" stroke-width="1.0"/>
<text x="60.0" y="319.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start">41 shared cross-nucleon pairings</text>
<text x="60.0" y="346.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">12 quarks (⁴He helium core)  —  462 ways</text>
<rect x="60.0" y="356.0" width="340.0" height="18.0" rx="4" fill="#34d399" stroke="none" stroke-width="1.0"/>
<text x="60.0" y="389.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start">461 shared cross-nucleon pairings</text>
<rect x="496.0" y="80.0" width="428.0" height="348.0" rx="10" fill="#131c36" stroke="#2a3b68" stroke-width="1.0"/>
<text x="710.0" y="108.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Nuclear Binding Energy: Model vs. Lab</text>
<rect x="520.0" y="132.0" width="380.0" height="112.0" rx="10" fill="#182444" stroke="#34d399" stroke-width="2.0"/>
<text x="710.0" y="156.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Deuteron ²H (1 Proton + 1 Neutron)</text>
<text x="710.0" y="182.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">6-quark shared-colour model:  2.265 MeV</text>
<text x="710.0" y="204.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Measured in laboratory:       2.225 MeV  (+1.81%)</text>
<text x="710.0" y="226.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">(Older unshared formula gave 2.86 MeV, +29%)</text>
<rect x="520.0" y="262.0" width="380.0" height="142.0" rx="10" fill="#182444" stroke="#fb7185" stroke-width="2.0"/>
<text x="710.0" y="286.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Helium-4 ⁴He (2 Protons + 2 Neutrons — Unsolved)</text>
<text x="710.0" y="312.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Unshared baseline formula:   8.77 MeV  (−69%)</text>
<text x="710.0" y="334.0" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">12-quark shared colour only: 14.49 MeV (−49%)</text>
<text x="710.0" y="356.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Measured in laboratory:      28.30 MeV</text>
<text x="710.0" y="384.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">Missing: 4-way spin &amp; proton/neutron swap symmetry</text>
</svg>
