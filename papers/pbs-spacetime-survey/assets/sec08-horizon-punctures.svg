<text x="750.0" y="108.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Proved vs. Unsolved at Horizon</text>
<rect x="604.0" y="130.0" width="292.0" height="114.0" rx="10" fill="#182444" stroke="#34d399" stroke-width="1.0"/>
<text x="750.0" y="154.0" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">State-Counting Balance (Proved)</text>
<text x="750.0" y="178.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Unique balance point Z₁(s_⋆) = 1</text>
<text x="750.0" y="200.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">determines entropy per puncture</text>
<text x="750.0" y="222.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">and closed loops balance total flux.</text>
<rect x="604.0" y="262.0" width="292.0" height="122.0" rx="10" fill="#182444" stroke="#fb7185" stroke-width="2.0"/>
<text x="750.0" y="286.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Unsolved Gravitational Step</text>
<text x="750.0" y="310.0" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Converting puncture count to area</text>
<text x="750.0" y="332.0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">currently matches S = A / 4ℓ_P² by hand;</text>
<text x="750.0" y="354.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">deriving the area unit a₀ from</text>
<text x="750.0" y="372.0" fill="#fb7185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">first principles is not yet done.</text>
