# Remote Lean MCP Server Deployment
#
# All config is driven by lean-mcp.config.json at the repo root.
# Run ./deploy/generate-config.sh to produce .env + authorized-emails.txt.
#
# Three services:
#   1. lean-mcp:     Lean LSP MCP server (Streamable HTTP)
#   2. oauth2-proxy: Google OAuth + email whitelist (external-facing)
#   3. auto-update:  Polls GHCR for new images, restarts lean-mcp
#
# Usage:
#   ./deploy/generate-config.sh     # create .env from lean-mcp.config.json
#   cd deploy && docker compose up -d
#
# Auth:
#   Browser:      Google OAuth via oauth2-proxy → lean-mcp
#   API/CLI/CI:   Bearer token (LEAN_LSP_MCP_TOKEN) direct to lean-mcp

services:
  # ── Lean MCP Server ──────────────────────────────────────────────
  lean-mcp:
    image: ${LEAN_MCP_IMAGE:-ghcr.io/litlfred/qou/lean-mcp}:latest
    container_name: lean-mcp
    restart: unless-stopped
    environment:
      - LEAN_LSP_MCP_TOKEN=${LEAN_LSP_MCP_TOKEN}
    expose:
      - "${LEAN_MCP_INTERNAL_PORT:-8080}"
    # Uncomment for direct token-based access (bypasses OAuth):
    # ports:
    #   - "${LEAN_MCP_INTERNAL_PORT:-8080}:${LEAN_MCP_INTERNAL_PORT:-8080}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${LEAN_MCP_INTERNAL_PORT:-8080}/mcp"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── OAuth2 Proxy (Google OAuth + email whitelist) ────────────────
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-4180}:4180"
    environment:
      - OAUTH2_PROXY_PROVIDER=${OAUTH2_PROXY_PROVIDER:-google}
      - OAUTH2_PROXY_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${COOKIE_SECRET}
      - OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE=/etc/oauth2-proxy/authorized-emails.txt
      - OAUTH2_PROXY_UPSTREAMS=http://lean-mcp:${LEAN_MCP_INTERNAL_PORT:-8080}/
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_PASS_HOST_HEADER=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_SKIP_AUTH_ROUTES=^/health$
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_API_ROUTES=^/mcp
    volumes:
      - ./authorized-emails.txt:/etc/oauth2-proxy/authorized-emails.txt:ro
    depends_on:
      lean-mcp:
        condition: service_healthy

  # ── Auto-update: polls GHCR for new lean-mcp images ──────────────
  auto-update:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN:-watchtower}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
