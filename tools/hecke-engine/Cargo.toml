[package]
name = "hecke-engine"
version = "0.8.0"
edition = "2021"
description = "Gröbner reduction engine for H_n(q) — nuclear normal forms"

# Default binary: v8 inductive symbolic chaining (exact in q)
[[bin]]
name = "hecke-engine"
path = "src/bin/v8.rs"

# Float engine for large A where symbolic overflows
[[bin]]
name = "hecke-float"
path = "src/bin/v6.rs"

# BigInt engine for A > 20 (no overflow)
[[bin]]
name = "hecke-bigint"
path = "src/bin/v9.rs"

# Original float engine with Q-value computation
[[bin]]
name = "hecke-qvalues"
path = "src/main.rs"

# CRT multi-prime engine for large A
[[bin]]
name = "hecke-crt"
path = "src/bin/v13_crt.rs"

[dependencies]
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rug = "1.26"  # mpfr bindings for multi-precision float
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
rayon = "1.10"  # parallel iteration for CRT prime computation

[build-dependencies]

[profile.release]
opt-level = 3
lto = true
