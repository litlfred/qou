[package]
name = "qou"
leanOptions = [{ name = "autoImplicit", value = false }]

[[lean_lib]]
name = "QOU"
srcDir = "."
defaultTarget = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

[[require]]
name = "quantumInfo"
git = "https://github.com/Timeroot/Lean-QuantumInfo"
rev = "main"

[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls"
rev = "master"
