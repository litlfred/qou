        font-size="13" fill="#654321" font-style="italic">thin: high energy</text>
  <text x="131" y="294"
        font-size="13" fill="#654321" font-style="italic">capacity</text>

  <text x="546" y="324"
        font-size="13" fill="#5c3a1e" font-style="italic">thick: viscous,</text>
  <text x="546" y="339"
        font-size="13" fill="#5c3a1e" font-style="italic">low energy capacity</text>

