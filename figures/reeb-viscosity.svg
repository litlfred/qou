      <stop offset="60%"  stop-color="#a0704a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5c3a1e" stop-opacity="0.85"/>
    </linearGradient>

    <marker id="arrowhead" markerWidth="8" markerHeight="6"
